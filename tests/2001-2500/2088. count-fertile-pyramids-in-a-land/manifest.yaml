entry:
  id: 2088
  title: "count-fertile-pyramids-in-a-land"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countPyramids({grid})"
    rust: "Solution::count_pyramids({grid})"
    python3: "Solution().countPyramids({grid})"
    python2: "Solution().countPyramids({grid})"
    ruby: "count_pyramids({grid})"
    java: "new Solution().countPyramids({grid})"
    csharp: "new Solution().CountPyramids({grid})"
    kotlin: "Solution().countPyramids({grid})"
    go: "countPyramids({grid})"
    dart: "Solution().countPyramids({grid})"
    swift: "Solution().countPyramids({grid})"
    typescript: "countPyramids({grid})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().countPyramids(grid, {result})"
    checker: |
      class Checker:
          def countPyramids(self, grid, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              m = len(grid)
              n = len(grid[0])
              if m < 1 or n < 1 or any(len(row) != n for row in grid):
                  return False
              def count(rows):
                  dp = [[0] * n for _ in range(m)]
                  total = 0
                  for i in rows:
                      for j in range(n):
                          if grid[i][j] == 1:
                              if i == m - 1 or j == 0 or j == n - 1:
                                  dp[i][j] = 1
                              else:
                                  dp[i][j] = 1 + min(dp[i + 1][j - 1], dp[i + 1][j], dp[i + 1][j + 1])
                              total += max(0, dp[i][j] - 1)
                  return total
              down = count(list(range(m - 1, -1, -1)))
              updp = [[0] * n for _ in range(m)]
              up = 0
              for i in range(m):
                  for j in range(n):
                      if grid[i][j] == 1:
                          if i == 0 or j == 0 or j == n - 1:
                              updp[i][j] = 1
                          else:
                              updp[i][j] = 1 + min(updp[i - 1][j - 1], updp[i - 1][j], updp[i - 1][j + 1])
                          up += max(0, updp[i][j] - 1)
              return result == down + up

