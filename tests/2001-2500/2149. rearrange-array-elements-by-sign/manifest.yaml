entry:
  id: 2149
  title: "rearrange-array-elements-by-sign"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().rearrangeArray({nums})"
    rust: "Solution::rearrange_array({nums})"
    python3: "Solution().rearrangeArray({nums})"
    python2: "Solution().rearrangeArray({nums})"
    ruby: "rearrange_array({nums})"
    java: "new Solution().rearrangeArray({nums})"
    csharp: "new Solution().RearrangeArray({nums})"
    kotlin: "Solution().rearrangeArray({nums})"
    go: "rearrangeArray({nums})"
    dart: "Solution().rearrangeArray({nums})"
    swift: "Solution().rearrangeArray({nums})"
    typescript: "rearrangeArray({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().rearrangeArray(nums, {result})"
    checker: |
      class Checker:
          def rearrangeArray(self, nums, result):
              if not isinstance(result, list) or len(result) != len(nums):
                  return False
              positives = [x for x in nums if x > 0]
              negatives = [x for x in nums if x < 0]
              expected = []
              for p, n in zip(positives, negatives):
                  expected.extend([p, n])
              return result == expected

seed: 2149

tests:
