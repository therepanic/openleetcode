entry:
  id: 2040
  title: "kth-smallest-product-of-two-sorted-arrays"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
    k:
      type: long
  call:
    cpp: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    rust: "Solution::kth_smallest_product({nums1}, {nums2}, {k})"
    python3: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    python2: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    ruby: "kth_smallest_product({nums1}, {nums2}, {k})"
    java: "new Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    csharp: "new Solution().KthSmallestProduct({nums1}, {nums2}, {k})"
    kotlin: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    go: "kthSmallestProduct({nums1}, {nums2}, {k})"
    dart: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    swift: "Solution().kthSmallestProduct({nums1}, {nums2}, {k})"
    typescript: "kthSmallestProduct({nums1}, {nums2}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums1, nums2, k, {result})"
    checker: |
      class Checker:
          def check(self, nums1, nums2, k, result):
              import bisect
              def count(x):
                  total = 0
                  for a in nums1:
                      if a > 0:
                          total += bisect.bisect_right(nums2, x // a)
                      elif a < 0:
                          q, r = divmod(x, a)
                          if r != 0:
                              q += 1
                          total += len(nums2) - bisect.bisect_left(nums2, q)
                      elif x >= 0:
                          total += len(nums2)
                  return total
              lo, hi = -10000000000, 10000000000
              while lo < hi:
                  mid = (lo + hi) // 2
                  if count(mid) < k:
                      lo = mid + 1
                  else:
                      hi = mid
              return result == lo

seed: 2040

