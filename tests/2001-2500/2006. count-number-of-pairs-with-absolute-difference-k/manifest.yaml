entry:
  id: 2006
  title: count-number-of-pairs-with-absolute-difference-k
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().countKDifference({nums}, {k})"
    rust: "Solution::count_k_difference({nums}, {k})"
    python3: "Solution().countKDifference({nums}, {k})"
    python2: "Solution().countKDifference({nums}, {k})"
    ruby: "count_k_difference({nums}, {k})"
    java: "new Solution().countKDifference({nums}, {k})"
    csharp: "new Solution().CountKDifference({nums}, {k})"
    kotlin: "Solution().countKDifference({nums}, {k})"
    go: "countKDifference({nums}, {k})"
    dart: "Solution().countKDifference({nums}, {k})"
    swift: "Solution().countKDifference({nums}, {k})"
    typescript: "countKDifference({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countKDifference(nums, k, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def countKDifference(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = Counter(nums)
              expected = sum(counts[x] * counts.get(x + k, 0) for x in counts)
              return result == expected

seed: 2006

