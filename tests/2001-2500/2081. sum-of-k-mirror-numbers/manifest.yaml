entry:
  id: 2081
  title: "sum-of-k-mirror-numbers"
  params:
    k:
      type: int
    n:
      type: int
  call:
    cpp: "Solution().kMirror({k}, {n})"
    rust: "Solution::k_mirror({k}, {n})"
    python3: "Solution().kMirror({k}, {n})"
    python2: "Solution().kMirror({k}, {n})"
    ruby: "k_mirror({k}, {n})"
    java: "new Solution().kMirror({k}, {n})"
    csharp: "new Solution().KMirror({k}, {n})"
    kotlin: "Solution().kMirror({k}, {n})"
    go: "kMirror({k}, {n})"
    dart: "Solution().kMirror({k}, {n})"
    swift: "Solution().kMirror({k}, {n})"
    typescript: "kMirror({k}, {n})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().kMirror(k, n, {result})"
    checker: |
      class Checker:
          def kMirror(self, k, n, result):
              def make_pal(prefix, odd):
                  x = prefix // 10 if odd else prefix
                  value = prefix
                  while x:
                      value = value * 10 + x % 10
                      x //= 10
                  return value
              def base_pal(x):
                  d = []
                  while x:
                      d.append(x % k)
                      x //= k
                  return d == d[::-1]
              total = 0
              remaining = n
              length = 1
              while remaining:
                  for prefix in range(length, length * 10):
                      value = make_pal(prefix, True)
                      if base_pal(value):
                          total += value
                          remaining -= 1
                          if not remaining:
                              break
                  if not remaining:
                      break
                  for prefix in range(length, length * 10):
                      value = make_pal(prefix, False)
                      if base_pal(value):
                          total += value
                          remaining -= 1
                          if not remaining:
                              break
                  length *= 10
              return result == total

