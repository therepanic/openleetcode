entry:
  id: 2139
  title: "minimum-moves-to-reach-target-score"
  params:
    target:
      type: int
    maxDoubles:
      type: int
  call:
    cpp: "Solution().minMoves({target}, {maxDoubles})"
    rust: "Solution::min_moves({target}, {maxDoubles})"
    python3: "Solution().minMoves({target}, {maxDoubles})"
    python2: "Solution().minMoves({target}, {maxDoubles})"
    ruby: "min_moves({target}, {maxDoubles})"
    java: "new Solution().minMoves({target}, {maxDoubles})"
    csharp: "new Solution().MinMoves({target}, {maxDoubles})"
    kotlin: "Solution().minMoves({target}, {maxDoubles})"
    go: "minMoves({target}, {maxDoubles})"
    dart: "Solution().minMoves({target}, {maxDoubles})"
    swift: "Solution().minMoves({target}, {maxDoubles})"
    typescript: "minMoves({target}, {maxDoubles})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minMoves(target, maxDoubles, {result})"
    checker: |
      class Checker:
          def minMoves(self, target, maxDoubles, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              moves = 0
              while target > 1 and maxDoubles > 0:
                  if target & 1:
                      target -= 1
                  else:
                      target //= 2
                      maxDoubles -= 1
                  moves += 1
              expected = moves + max(0, target - 1)
              return result == expected

