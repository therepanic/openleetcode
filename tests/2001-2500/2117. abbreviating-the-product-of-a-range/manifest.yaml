entry:
  id: 2117
  title: "abbreviating-the-product-of-a-range"
  params:
    left:
      type: int
    right:
      type: int
  call:
    cpp: "Solution().abbreviateProduct({left}, {right})"
    rust: "Solution::abbreviate_product({left}, {right})"
    python3: "Solution().abbreviateProduct({left}, {right})"
    python2: "Solution().abbreviateProduct({left}, {right})"
    ruby: "abbreviate_product({left}, {right})"
    java: "new Solution().abbreviateProduct({left}, {right})"
    csharp: "new Solution().AbbreviateProduct({left}, {right})"
    kotlin: "Solution().abbreviateProduct({left}, {right})"
    go: "abbreviateProduct({left}, {right})"
    dart: "Solution().abbreviateProduct({left}, {right})"
    swift: "Solution().abbreviateProduct({left}, {right})"
    typescript: "abbreviateProduct({left}, {right})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().abbreviateProduct(left, right, {result})"
    checker: |
      class Checker:
          def abbreviateProduct(self, left, right, result):
              if not isinstance(result, str):
                  return False
              product = 1
              for value in range(left, right + 1):
                  product *= value
              zeros = 0
              while product % 10 == 0:
                  product //= 10
                  zeros += 1
              digits = str(product)
              if len(digits) > 10:
                  digits = digits[:5] + '...' + digits[-5:]
              return result == digits + 'e' + str(zeros)

