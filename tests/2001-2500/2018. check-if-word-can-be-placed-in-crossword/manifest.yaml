entry:
  id: 2018
  title: "check-if-word-can-be-placed-in-crossword"
  params:
    board:
      type: array
      items:
        type: array
        items:
          type: char
    word:
      type: string
  call:
    cpp: "Solution().placeWordInCrossword({board}, {word})"
    rust: "Solution::place_word_in_crossword({board}, {word})"
    python3: "Solution().placeWordInCrossword({board}, {word})"
    python2: "Solution().placeWordInCrossword({board}, {word})"
    ruby: "place_word_in_crossword({board}, {word})"
    java: "new Solution().placeWordInCrossword({board}, {word})"
    csharp: "new Solution().PlaceWordInCrossword({board}, {word})"
    kotlin: "Solution().placeWordInCrossword({board}, {word})"
    go: "placeWordInCrossword({board}, {word})"
    dart: "Solution().placeWordInCrossword({board}, {word})"
    swift: "Solution().placeWordInCrossword({board}, {word})"
    typescript: "placeWordInCrossword({board}, {word})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().placeWordInCrossword(board, word, {result})"
    checker: |
      class Checker:
          def placeWordInCrossword(self, board, word, result):
              if not isinstance(result, bool):
                  return False
              m = len(board)
              n = len(board[0]) if m else 0
              def fits(chars):
                  if len(chars) != len(word):
                      return False
                  return all(a == ' ' or a == b for a, b in zip(chars, word))
              possible = False
              for row in board:
                  start = 0
                  for i in range(n + 1):
                      if i == n or row[i] == '#':
                          segment = row[start:i]
                          possible = possible or fits(segment) or fits(segment[::-1])
                          start = i + 1
              for col in range(n):
                  start = 0
                  for i in range(m + 1):
                      if i == m or board[i][col] == '#':
                          segment = [board[j][col] for j in range(start, i)]
                          possible = possible or fits(segment) or fits(segment[::-1])
                          start = i + 1
              return result == possible

seed: 2018

