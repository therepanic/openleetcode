entry:
  id: 2097
  title: "valid-arrangement-of-pairs"
  params:
    pairs:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().validArrangement({pairs})"
    rust: "Solution::valid_arrangement({pairs})"
    python3: "Solution().validArrangement({pairs})"
    python2: "Solution().validArrangement({pairs})"
    ruby: "valid_arrangement({pairs})"
    java: "new Solution().validArrangement({pairs})"
    csharp: "new Solution().ValidArrangement({pairs})"
    kotlin: "Solution().validArrangement({pairs})"
    go: "validArrangement({pairs})"
    dart: "Solution().validArrangement({pairs})"
    swift: "Solution().validArrangement({pairs})"
    typescript: "validArrangement({pairs})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().validArrangement(pairs, {result})"
    checker: |
      class Checker:
          def validArrangement(self, pairs, result):
              if not isinstance(result, list) or len(result) != len(pairs):
                  return False
              counts = {}
              for edge in pairs:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  key = (edge[0], edge[1])
                  counts[key] = counts.get(key, 0) + 1
              for i, edge in enumerate(result):
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  key = (edge[0], edge[1])
                  if counts.get(key, 0) == 0:
                      return False
                  counts[key] -= 1
                  if i and result[i - 1][1] != edge[0]:
                      return False
              return all(value == 0 for value in counts.values())

