entry:
  id: 2063
  title: "vowels-of-all-substrings"
  params:
    word:
      type: string
  call:
    cpp: "Solution().countVowels({word})"
    rust: "Solution::count_vowels({word})"
    python3: "Solution().countVowels({word})"
    python2: "Solution().countVowels({word})"
    ruby: "count_vowels({word})"
    java: "new Solution().countVowels({word})"
    csharp: "new Solution().CountVowels({word})"
    kotlin: "Solution().countVowels({word})"
    go: "countVowels({word})"
    dart: "Solution().countVowels({word})"
    swift: "Solution().countVowels({word})"
    typescript: "countVowels({word})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countVowels(word, {result})"
    checker: |
      class Checker:
          def countVowels(self, word, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              vowels = set("aeiou")
              n = len(word)
              for i, ch in enumerate(word):
                  if ch in vowels:
                      expected += (i + 1) * (n - i)
              return result == expected

