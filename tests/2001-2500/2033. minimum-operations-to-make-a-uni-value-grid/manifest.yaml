entry:
  id: 2033
  title: "minimum-operations-to-make-a-uni-value-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
    x:
      type: int
  call:
    cpp: "Solution().minOperations({grid}, {x})"
    rust: "Solution::min_operations({grid}, {x})"
    python3: "Solution().minOperations({grid}, {x})"
    python2: "Solution().minOperations({grid}, {x})"
    ruby: "min_operations({grid}, {x})"
    java: "new Solution().minOperations({grid}, {x})"
    csharp: "new Solution().MinOperations({grid}, {x})"
    kotlin: "Solution().minOperations({grid}, {x})"
    go: "minOperations({grid}, {x})"
    dart: "Solution().minOperations({grid}, {x})"
    swift: "Solution().minOperations({grid}, {x})"
    typescript: "minOperations({grid}, {x})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minOperations(grid, x, {result})"
    checker: |
      class Checker:
          def minOperations(self, grid, x, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              values = [v for row in grid for v in row]
              base = values[0]
              if any((v - base) % x != 0 for v in values):
                  return result == -1
              values.sort()
              median = values[len(values) // 2]
              expected = sum(abs(v - median) // x for v in values)
              return result == expected

seed: 2033

