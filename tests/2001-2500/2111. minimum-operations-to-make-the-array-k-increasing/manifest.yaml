entry:
  id: 2111
  title: "minimum-operations-to-make-the-array-k-increasing"
  params:
    arr:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().kIncreasing({arr}, {k})"
    rust: "Solution::k_increasing({arr}, {k})"
    python3: "Solution().kIncreasing({arr}, {k})"
    python2: "Solution().kIncreasing({arr}, {k})"
    ruby: "k_increasing({arr}, {k})"
    java: "new Solution().kIncreasing({arr}, {k})"
    csharp: "new Solution().KIncreasing({arr}, {k})"
    kotlin: "Solution().kIncreasing({arr}, {k})"
    go: "kIncreasing({arr}, {k})"
    dart: "Solution().kIncreasing({arr}, {k})"
    swift: "Solution().kIncreasing({arr}, {k})"
    typescript: "kIncreasing({arr}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 300
oracle:
  python3:
    call: "Checker().kIncreasing(arr, k, {result})"
    checker: |
      from bisect import bisect_right
      class Checker:
          def kIncreasing(self, arr, k, result):
              if not isinstance(result, int):
                  return False
              keep = 0
              for start in range(k):
                  lis = []
                  for value in arr[start::k]:
                      pos = bisect_right(lis, value)
                      if pos == len(lis):
                          lis.append(value)
                      else:
                          lis[pos] = value
                  keep += len(lis)
              return result == len(arr) - keep
seed: 2111
