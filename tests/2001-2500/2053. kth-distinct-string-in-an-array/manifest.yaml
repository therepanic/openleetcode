entry:
  id: 2053
  title: "kth-distinct-string-in-an-array"
  params:
    arr:
      type: array
      items:
        type: string
    k:
      type: int
  call:
    cpp: "Solution().kthDistinct({arr}, {k})"
    rust: "Solution::kth_distinct({arr}, {k})"
    python3: "Solution().kthDistinct({arr}, {k})"
    python2: "Solution().kthDistinct({arr}, {k})"
    ruby: "kth_distinct({arr}, {k})"
    java: "new Solution().kthDistinct({arr}, {k})"
    csharp: "new Solution().KthDistinct({arr}, {k})"
    kotlin: "Solution().kthDistinct({arr}, {k})"
    go: "kthDistinct({arr}, {k})"
    dart: "Solution().kthDistinct({arr}, {k})"
    swift: "Solution().kthDistinct({arr}, {k})"
    typescript: "kthDistinct({arr}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().kthDistinct(arr, k, {result})"
    checker: |
      class Checker:
          def kthDistinct(self, arr, k, result):
              counts = {}
              for value in arr:
                  counts[value] = counts.get(value, 0) + 1
              distinct = [value for value in arr if counts[value] == 1]
              expected = distinct[k - 1] if k <= len(distinct) else ""
              return result == expected

seed: 2053

