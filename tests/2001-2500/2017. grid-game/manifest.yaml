entry:
  id: 2017
  title: "grid-game"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().gridGame({grid})"
    rust: "Solution::grid_game({grid})"
    python3: "Solution().gridGame({grid})"
    python2: "Solution().gridGame({grid})"
    ruby: "grid_game({grid})"
    java: "new Solution().gridGame({grid})"
    csharp: "new Solution().GridGame({grid})"
    kotlin: "Solution().gridGame({grid})"
    go: "gridGame({grid})"
    dart: "Solution().gridGame({grid})"
    swift: "Solution().gridGame({grid})"
    typescript: "gridGame({grid})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().gridGame(grid, {result})"
    checker: |
      class Checker:
          def gridGame(self, grid, result):
              if not isinstance(grid, list) or len(grid) != 2:
                  return False
              if not all(isinstance(row, list) for row in grid):
                  return False
              if len(grid[0]) != len(grid[1]) or not grid[0]:
                  return False
              top = sum(grid[0])
              bottom = 0
              expected = float("inf")
              for i, value in enumerate(grid[0]):
                  top -= value
                  expected = min(expected, max(top, bottom))
                  bottom += grid[1][i]
              return result == expected

seed: 2017

