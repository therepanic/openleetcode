entry:
  id: 2054
  title: "two-best-non-overlapping-events"
  params:
    events:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxTwoEvents({events})"
    rust: "Solution::max_two_events({events})"
    python3: "Solution().maxTwoEvents({events})"
    python2: "Solution().maxTwoEvents({events})"
    ruby: "max_two_events({events})"
    java: "new Solution().maxTwoEvents({events})"
    csharp: "new Solution().MaxTwoEvents({events})"
    kotlin: "Solution().maxTwoEvents({events})"
    go: "maxTwoEvents({events})"
    dart: "Solution().maxTwoEvents({events})"
    swift: "Solution().maxTwoEvents({events})"
    typescript: "maxTwoEvents({events})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxTwoEvents(events, {result})"
    checker: |
      class Checker:
          def maxTwoEvents(self, events, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              ordered = sorted(events, key=lambda x: x[1])
              starts = sorted(events, key=lambda x: x[0])
              best = 0
              answer = 0
              j = 0
              for start, end, value in starts:
                  while j < len(ordered) and ordered[j][1] < start:
                      best = max(best, ordered[j][2])
                      j += 1
                  answer = max(answer, value, value + best)
              return result == answer

seed: 20542026

