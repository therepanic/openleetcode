entry:
  id: 2134
  title: "minimum-swaps-to-group-all-1s-together-ii"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minSwaps({nums})"
    rust: "Solution::min_swaps({nums})"
    python3: "Solution().minSwaps({nums})"
    python2: "Solution().minSwaps({nums})"
    ruby: "min_swaps({nums})"
    java: "new Solution().minSwaps({nums})"
    csharp: "new Solution().MinSwaps({nums})"
    kotlin: "Solution().minSwaps({nums})"
    go: "minSwaps({nums})"
    dart: "Solution().minSwaps({nums})"
    swift: "Solution().minSwaps({nums})"
    typescript: "minSwaps({nums})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().check(nums, {result})"
    checker: |
      class Checker:
          def check(self, nums, result):
              n = len(nums)
              ones = sum(nums)
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if ones <= 1 or ones == n:
                  return result == 0
              doubled = nums + nums[:ones - 1]
              inside = sum(doubled[:ones])
              best = ones - inside
              for i in range(ones, len(doubled)):
                  inside += doubled[i] - doubled[i - ones]
                  best = min(best, ones - inside)
              return result == best

seed: 2134

