entry:
  id: 2016
  title: "maximum-difference-between-increasing-elements"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumDifference({nums})"
    rust: "Solution::maximum_difference({nums})"
    python3: "Solution().maximumDifference({nums})"
    python2: "Solution().maximumDifference({nums})"
    ruby: "maximum_difference({nums})"
    java: "new Solution().maximumDifference({nums})"
    csharp: "new Solution().MaximumDifference({nums})"
    kotlin: "Solution().maximumDifference({nums})"
    go: "maximumDifference({nums})"
    dart: "Solution().maximumDifference({nums})"
    swift: "Solution().maximumDifference({nums})"
    typescript: "maximumDifference({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maximumDifference(nums, {result})"
    checker: |
      class Checker:
          def maximumDifference(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = -1
              minimum = nums[0]
              for value in nums[1:]:
                  if value > minimum:
                      best = max(best, value - minimum)
                  else:
                      minimum = value
              return result == best

seed: 2016

