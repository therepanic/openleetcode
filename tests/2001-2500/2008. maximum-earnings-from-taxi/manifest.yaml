    n:
      type: int
    rides:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxTaxiEarnings({n}, {rides})"
    rust: "Solution::max_taxi_earnings({n}, {rides})"
    python3: "Solution().maxTaxiEarnings({n}, {rides})"
    python2: "Solution().maxTaxiEarnings({n}, {rides})"
    ruby: "max_taxi_earnings({n}, {rides})"
    java: "new Solution().maxTaxiEarnings({n}, {rides})"
    csharp: "new Solution().MaxTaxiEarnings({n}, {rides})"
    kotlin: "Solution().maxTaxiEarnings({n}, {rides})"
    go: "maxTaxiEarnings({n}, {rides})"
    dart: "Solution().maxTaxiEarnings({n}, {rides})"
    swift: "Solution().maxTaxiEarnings({n}, {rides})"
    typescript: "maxTaxiEarnings({n}, {rides})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxTaxiEarnings(n, rides, {result})"
    checker: |
      class Checker:
          def maxTaxiEarnings(self, n, rides, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = [0] * (n + 1)
              by_end = [[] for _ in range(n + 1)]
              for start, end, tip in rides:
                  if not (1 <= start < end <= n and tip >= 1):
                      return False
                  by_end[end].append((start, end - start + tip))
              for end in range(1, n + 1):
                  best[end] = best[end - 1]
                  for start, profit in by_end[end]:
                      best[end] = max(best[end], best[start] + profit)
              return result == best[n]

seed: 2008

