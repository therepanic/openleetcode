entry:
  id: 2068
  title: "check-whether-two-strings-are-almost-equivalent"
  params:
    word1:
      type: string
    word2:
      type: string
  call:
    cpp: "Solution().checkAlmostEquivalent({word1}, {word2})"
    rust: "Solution::check_almost_equivalent({word1}, {word2})"
    python3: "Solution().checkAlmostEquivalent({word1}, {word2})"
    python2: "Solution().checkAlmostEquivalent({word1}, {word2})"
    ruby: "check_almost_equivalent({word1}, {word2})"
    java: "new Solution().checkAlmostEquivalent({word1}, {word2})"
    csharp: "new Solution().CheckAlmostEquivalent({word1}, {word2})"
    kotlin: "Solution().checkAlmostEquivalent({word1}, {word2})"
    go: "checkAlmostEquivalent({word1}, {word2})"
    dart: "Solution().checkAlmostEquivalent({word1}, {word2})"
    swift: "Solution().checkAlmostEquivalent({word1}, {word2})"
    typescript: "checkAlmostEquivalent({word1}, {word2})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().checkAlmostEquivalent(word1, word2, {result})"
    checker: |
      class Checker:
          def checkAlmostEquivalent(self, word1, word2, result):
              expected = all(abs(word1.count(ch) - word2.count(ch)) <= 3 for ch in "abcdefghijklmnopqrstuvwxyz")
              return isinstance(result, bool) and result == expected

seed: 2068

