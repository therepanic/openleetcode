entry:
  id: 2019
  title: "the-score-of-students-solving-math-expression"
  params:
    s:
      type: string
    answers:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().scoreOfStudents({s}, {answers})"
    rust: "Solution::score_of_students({s}, {answers})"
    python3: "Solution().scoreOfStudents({s}, {answers})"
    python2: "Solution().scoreOfStudents({s}, {answers})"
    ruby: "score_of_students({s}, {answers})"
    java: "new Solution().scoreOfStudents({s}, {answers})"
    csharp: "new Solution().ScoreOfStudents({s}, {answers})"
    kotlin: "Solution().scoreOfStudents({s}, {answers})"
    go: "scoreOfStudents({s}, {answers})"
    dart: "Solution().scoreOfStudents({s}, {answers})"
    swift: "Solution().scoreOfStudents({s}, {answers})"
    typescript: "scoreOfStudents({s}, {answers})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().scoreOfStudents(s, answers, {result})"
    checker: |
      from functools import lru_cache

      class Checker:
          def scoreOfStudents(self, s, answers, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              values = [int(s[i]) for i in range(0, len(s), 2)]
              ops = [s[i] for i in range(1, len(s), 2)]

              @lru_cache(None)
              def solve(lo, hi):
                  if lo == hi:
                      return {values[lo]}
                  out = set()
                  for mid in range(lo, hi):
                      for left in solve(lo, mid):
                          for right in solve(mid + 1, hi):
                              value = left + right if ops[mid] == "+" else left * right
                              if value <= 1000:
                                  out.add(value)
                  return out

              correct = values[0]
              for i, op in enumerate(ops):
                  if op == "*":
                      correct *= values[i + 1]
                  else:
                      correct += values[i + 1]
              possible = solve(0, len(values) - 1)
              expected = sum(5 if x == correct else 2 if x in possible else 0 for x in answers)
              return result == expected

seed: 2019

