entry:
  id: 2094
  title: "finding-3-digit-even-numbers"
  params:
    digits:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findEvenNumbers({digits})"
    rust: "Solution::find_even_numbers({digits})"
    python3: "Solution().findEvenNumbers({digits})"
    python2: "Solution().findEvenNumbers({digits})"
    ruby: "find_even_numbers({digits})"
    java: "new Solution().findEvenNumbers({digits})"
    csharp: "new Solution().FindEvenNumbers({digits})"
    kotlin: "Solution().findEvenNumbers({digits})"
    go: "findEvenNumbers({digits})"
    dart: "Solution().findEvenNumbers({digits})"
    swift: "Solution().findEvenNumbers({digits})"
    typescript: "findEvenNumbers({digits})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findEvenNumbers(digits, {result})"
    checker: |
      class Checker:
          def findEvenNumbers(self, digits, result):
              if not isinstance(result, list):
                  return False
              counts = [0] * 10
              for digit in digits:
                  if not isinstance(digit, int) or digit < 0 or digit > 9:
                      return False
                  counts[digit] += 1
              expected = []
              for hundreds in range(1, 10):
                  for tens in range(10):
                      for ones in range(0, 10, 2):
                          need = [0] * 10
                          need[hundreds] += 1
                          need[tens] += 1
                          need[ones] += 1
                          if all(need[d] <= counts[d] for d in range(10)):
                              expected.append(100 * hundreds + 10 * tens + ones)
              return result == expected

