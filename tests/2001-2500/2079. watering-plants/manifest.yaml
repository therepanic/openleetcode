entry:
  id: 2079
  title: "watering-plants"
  params:
    plants:
      type: array
      items:
        type: int
    capacity:
      type: int
  call:
    cpp: "Solution().wateringPlants({plants}, {capacity})"
    rust: "Solution::watering_plants({plants}, {capacity})"
    python3: "Solution().wateringPlants({plants}, {capacity})"
    python2: "Solution().wateringPlants({plants}, {capacity})"
    ruby: "watering_plants({plants}, {capacity})"
    java: "new Solution().wateringPlants({plants}, {capacity})"
    csharp: "new Solution().WateringPlants({plants}, {capacity})"
    kotlin: "Solution().wateringPlants({plants}, {capacity})"
    go: "wateringPlants({plants}, {capacity})"
    dart: "Solution().wateringPlants({plants}, {capacity})"
    swift: "Solution().wateringPlants({plants}, {capacity})"
    typescript: "wateringPlants({plants}, {capacity})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().wateringPlants(plants, capacity, {result})"
    checker: |
      class Checker:
          def wateringPlants(self, plants, capacity, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              water = capacity
              steps = 0
              for i, need in enumerate(plants):
                  if need > water:
                      steps += 2 * i
                      water = capacity
                  steps += 1
                  water -= need
              return result == steps

seed: 2079

