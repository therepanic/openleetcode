    python3: "Solution().networkBecomesIdle({edges}, {patience})"
    python2: "Solution().networkBecomesIdle({edges}, {patience})"
    ruby: "network_becomes_idle({edges}, {patience})"
    java: "new Solution().networkBecomesIdle({edges}, {patience})"
    csharp: "new Solution().NetworkBecomesIdle({edges}, {patience})"
    kotlin: "Solution().networkBecomesIdle({edges}, {patience})"
    go: "networkBecomesIdle({edges}, {patience})"
    dart: "Solution().networkBecomesIdle({edges}, {patience})"
    swift: "Solution().networkBecomesIdle({edges}, {patience})"
