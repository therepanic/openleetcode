judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().networkBecomesIdle(edges, patience, {result})"
    checker: |
      class Checker:
          def networkBecomesIdle(self, edges, patience, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(patience)
              graph = [[] for _ in range(n)]
              for u, v in edges:
                  graph[u].append(v)
                  graph[v].append(u)
              dist = [-1] * n
              dist[0] = 0
              queue = [0]
              for u in queue:
                  for v in graph[u]:
                      if dist[v] < 0:
                          dist[v] = dist[u] + 1
                          queue.append(v)
              expected = 1
              for i in range(1, n):
                  rtt = 2 * dist[i]
                  last = rtt if patience[i] >= rtt else ((rtt - 1) // patience[i]) * patience[i] + rtt
                  expected = max(expected, last + 1)
              return result == expected

seed: 2039

