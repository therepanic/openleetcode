entry:
  id: 2056
  title: "number-of-valid-move-combinations-on-chessboard"
  params:
    pieces:
      type: array
      items:
        type: string
    positions:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countCombinations({pieces}, {positions})"
    rust: "Solution::count_combinations({pieces}, {positions})"
    python3: "Solution().countCombinations({pieces}, {positions})"
    python2: "Solution().countCombinations({pieces}, {positions})"
    ruby: "count_combinations({pieces}, {positions})"
    java: "new Solution().countCombinations({pieces}, {positions})"
    csharp: "new Solution().CountCombinations({pieces}, {positions})"
    kotlin: "Solution().countCombinations({pieces}, {positions})"
    go: "countCombinations({pieces}, {positions})"
    dart: "Solution().countCombinations({pieces}, {positions})"
    swift: "Solution().countCombinations({pieces}, {positions})"
    typescript: "countCombinations({pieces}, {positions})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().countCombinations(pieces, positions, {result})"
    checker: |
      class Checker:
          def countCombinations(self, pieces, positions, result):
              return isinstance(result, int) and result >= 0

seed: 2056

