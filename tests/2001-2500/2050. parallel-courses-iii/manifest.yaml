    ruby: "minimum_time({n}, {relations}, {time})"
    java: "new Solution().minimumTime({n}, {relations}, {time})"
    csharp: "new Solution().MinimumTime({n}, {relations}, {time})"
    kotlin: "Solution().minimumTime({n}, {relations}, {time})"
