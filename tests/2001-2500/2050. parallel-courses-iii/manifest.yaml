limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimumTime(n, relations, time, {result})"
    checker: |
      class Checker:
          def minimumTime(self, n, relations, time, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              graph = [[] for _ in range(n)]
              indegree = [0] * n
              for u, v in relations:
                  graph[u - 1].append(v - 1)
                  indegree[v - 1] += 1
              finish = list(time)
              queue = [i for i in range(n) if indegree[i] == 0]
              head = 0
              while head < len(queue):
                  u = queue[head]
                  head += 1
                  for v in graph[u]:
                      finish[v] = max(finish[v], finish[u] + time[v])
                      indegree[v] -= 1
                      if indegree[v] == 0:
                          queue.append(v)
              return result == max(finish)

