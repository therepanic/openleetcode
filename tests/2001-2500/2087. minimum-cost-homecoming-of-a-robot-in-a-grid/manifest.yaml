entry:
  id: 2087
  title: "minimum-cost-homecoming-of-a-robot-in-a-grid"
  params:
    startPos:
      type: array
      items:
        type: int
    homePos:
      type: array
      items:
        type: int
    rowCosts:
      type: array
      items:
        type: int
    colCosts:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    rust: "Solution::min_cost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    python3: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    python2: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    ruby: "min_cost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    java: "new Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    csharp: "new Solution().MinCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    kotlin: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    go: "minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    dart: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    swift: "Solution().minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"
    typescript: "minCost({startPos}, {homePos}, {rowCosts}, {colCosts})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minCost(startPos, homePos, rowCosts, colCosts, {result})"
    checker: |
      class Checker:
          def minCost(self, startPos, homePos, rowCosts, colCosts, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              sr, sc = startPos
              hr, hc = homePos
              expected = sum(rowCosts[min(sr, hr) + 1:max(sr, hr) + 1]) if sr < hr else sum(rowCosts[hr:sr])
              expected += sum(colCosts[min(sc, hc) + 1:max(sc, hc) + 1]) if sc < hc else sum(colCosts[hc:sc])
              return result == expected

seed: 2087

