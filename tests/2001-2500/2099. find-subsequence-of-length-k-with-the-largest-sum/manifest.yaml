entry:
  id: 2099
  title: "find-subsequence-of-length-k-with-the-largest-sum"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().maxSubsequence({nums}, {k})"
    rust: "Solution::max_subsequence({nums}, {k})"
    python3: "Solution().maxSubsequence({nums}, {k})"
    python2: "Solution().maxSubsequence({nums}, {k})"
    ruby: "max_subsequence({nums}, {k})"
    java: "new Solution().maxSubsequence({nums}, {k})"
    csharp: "new Solution().MaxSubsequence({nums}, {k})"
    kotlin: "Solution().maxSubsequence({nums}, {k})"
    go: "maxSubsequence({nums}, {k})"
    dart: "Solution().maxSubsequence({nums}, {k})"
    swift: "Solution().maxSubsequence({nums}, {k})"
    typescript: "maxSubsequence({nums}, {k})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxSubsequence(nums, k, {result})"
    checker: |
      class Checker:
          def maxSubsequence(self, nums, k, result):
              if not isinstance(result, list) or len(result) != k:
                  return False
              need = sorted(nums, reverse=True)[:k]
              if sum(result) != sum(need):
                  return False
              pos = 0
              for value in result:
                  while pos < len(nums) and nums[pos] != value:
                      pos += 1
                  if pos == len(nums):
                      return False
                  pos += 1
              return True

seed: 2099

