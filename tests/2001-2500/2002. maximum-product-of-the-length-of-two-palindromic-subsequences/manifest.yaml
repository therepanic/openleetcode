entry:
  id: 2002
  title: "maximum-product-of-the-length-of-two-palindromic-subsequences"
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxProduct({s})"
    rust: "Solution::max_product({s})"
    python3: "Solution().maxProduct({s})"
    python2: "Solution().maxProduct({s})"
    ruby: "max_product({s})"
    java: "new Solution().maxProduct({s})"
    csharp: "new Solution().MaxProduct({s})"
    kotlin: "Solution().maxProduct({s})"
    go: "maxProduct({s})"
    dart: "Solution().maxProduct({s})"
    swift: "Solution().maxProduct({s})"
    typescript: "maxProduct({s})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxProduct(s, {result})"
    checker: |
      class Checker:
          def maxProduct(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(s)
              best = 0
              pal = []
              for mask in range(1, 1 << n):
                  text = ''.join(s[i] for i in range(n) if mask & (1 << i))
                  if text == text[::-1]:
                      pal.append((mask, mask.bit_count()))
              for i, (left, left_len) in enumerate(pal):
                  for right, right_len in pal[i + 1:]:
                      if not (left & right):
                          best = max(best, left_len * right_len)
              return result == best

