entry:
  id: 2126
  title: "destroying-asteroids"
  params:
    mass:
      type: int
    asteroids:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    rust: "Solution::asteroids_destroyed({mass}, {asteroids})"
    python3: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    python2: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    ruby: "asteroids_destroyed({mass}, {asteroids})"
    java: "new Solution().asteroidsDestroyed({mass}, {asteroids})"
    csharp: "new Solution().AsteroidsDestroyed({mass}, {asteroids})"
    kotlin: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    go: "asteroidsDestroyed({mass}, {asteroids})"
    dart: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    swift: "Solution().asteroidsDestroyed({mass}, {asteroids})"
    typescript: "asteroidsDestroyed({mass}, {asteroids})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().asteroidsDestroyed(mass, asteroids, {result})"
    checker: |
      class Checker:
          def asteroidsDestroyed(self, mass, asteroids, result):
              if not isinstance(result, bool):
                  return False
              current = mass
              for asteroid in sorted(asteroids):
                  if asteroid > current:
                      return result is False
                  current += asteroid
              return result is True
seed: 2126
