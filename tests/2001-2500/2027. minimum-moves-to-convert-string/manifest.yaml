entry:
  id: 2027
  title: "minimum-moves-to-convert-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minimumMoves({s})"
    rust: "Solution::minimum_moves({s})"
    python3: "Solution().minimumMoves({s})"
    python2: "Solution().minimumMoves({s})"
    ruby: "minimum_moves({s})"
    java: "new Solution().minimumMoves({s})"
    csharp: "new Solution().MinimumMoves({s})"
    kotlin: "Solution().minimumMoves({s})"
    go: "minimumMoves({s})"
    dart: "Solution().minimumMoves({s})"
    swift: "Solution().minimumMoves({s})"
    typescript: "minimumMoves({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumMoves(s, {result})"
    checker: |
      class Checker:
          def minimumMoves(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              i = 0
              while i < len(s):
                  if s[i] == 'X':
                      expected += 1
                      i += 3
                  else:
                      i += 1
              return result == expected

seed: 2027

