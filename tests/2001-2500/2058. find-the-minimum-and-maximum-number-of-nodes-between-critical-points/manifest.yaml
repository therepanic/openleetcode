entry:
  id: 2058
  title: "find-the-minimum-and-maximum-number-of-nodes-between-critical-points"
  params:
    head:
      type: list_node
  call:
    cpp: "listNodeToArray(Solution().nodesBetweenCriticalPoints({head}))"
    rust: "ListNode::list_node_to_array(Solution::nodes_between_critical_points({head}))"
    python3: "Solution().nodesBetweenCriticalPoints({head})"
    python2: "Solution().nodesBetweenCriticalPoints({head})"
    ruby: "nodes_between_critical_points({head})"
    java: "new Solution().nodesBetweenCriticalPoints({head})"
    csharp: "new Solution().NodesBetweenCriticalPoints({head})"
    kotlin: "Solution().nodesBetweenCriticalPoints({head})"
    go: "nodesBetweenCriticalPoints({head})"
    dart: "Solution().nodesBetweenCriticalPoints({head})"
    swift: "Solution().nodesBetweenCriticalPoints({head})"
    typescript: "nodesBetweenCriticalPoints({head})"
judge:
  type: exact
limits:
  time_ms: 500
  memory_mb: 256
oracle:
  python3:
    call: "Checker().check(head, {result})"
    checker: |
      class Checker:
          def check(self, head, result):
              if not isinstance(result, list) or len(result) != 2:
                  return False
              if isinstance(head, list):
                  values = head
              else:
                  values = []
                  node = head
                  while node is not None:
                      values.append(node.val)
                      node = node.next
              points = []
              for i in range(1, len(values) - 1):
                  if (values[i] > values[i - 1] and values[i] > values[i + 1]) or (values[i] < values[i - 1] and values[i] < values[i + 1]):
                      points.append(i)
              if len(points) < 2:
                  return result == [-1, -1]
              distances = [points[i] - points[i - 1] for i in range(1, len(points))]
              return result == [min(distances), points[-1] - points[0]]
seed: 2058
