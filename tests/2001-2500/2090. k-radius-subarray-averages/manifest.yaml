entry:
  id: 2090
  title: "k-radius-subarray-averages"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().getAverages({nums}, {k})"
    rust: "Solution::get_averages({nums}, {k})"
    python3: "Solution.getAverages({nums}, {k})"
    python2: "Solution().getAverages({nums}, {k})"
    ruby: "get_averages({nums}, {k})"
    java: "new Solution().getAverages({nums}, {k})"
    csharp: "new Solution().GetAverages({nums}, {k})"
    kotlin: "Solution().getAverages({nums}, {k})"
    go: "getAverages({nums}, {k})"
    dart: "Solution().getAverages({nums}, {k})"
    swift: "Solution().getAverages({nums}, {k})"
    typescript: "getAverages({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().getAverages(nums, k, {result})"
    checker: |
      class Checker:
          def getAverages(self, nums, k, result):
              if not isinstance(result, list) or len(result) != len(nums):
                  return False
              width = 2 * k + 1
              expected = [-1] * len(nums)
              if width <= len(nums):
                  for i in range(k, len(nums) - k):
                      expected[i] = sum(nums[i-k:i+k+1]) // width
              return result == expected

seed: 20902090

