entry:
  id: 2115
  title: "find-all-possible-recipes-from-given-supplies"
  params:
    recipes:
      type: array
      items:
        type: string
    ingredients:
      type: array
      items:
        type: array
        items:
          type: string
    supplies:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    rust: "Solution::find_all_recipes({recipes}, {ingredients}, {supplies})"
    python3: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    python2: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    ruby: "find_all_recipes({recipes}, {ingredients}, {supplies})"
    java: "new Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    csharp: "new Solution().FindAllRecipes({recipes}, {ingredients}, {supplies})"
    kotlin: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    go: "findAllRecipes({recipes}, {ingredients}, {supplies})"
    dart: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    swift: "Solution().findAllRecipes({recipes}, {ingredients}, {supplies})"
    typescript: "findAllRecipes({recipes}, {ingredients}, {supplies})"

judge:
  type: "ignore_order"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findAllRecipes(recipes, ingredients, supplies, {result})"
    checker: |
      class Checker:
          def findAllRecipes(self, recipes, ingredients, supplies, result):
              if not isinstance(result, list) or len(result) != len(set(result)):
                  return False
              recipe_set = set(recipes)
              if any(x not in recipe_set for x in result):
                  return False
              available = set(supplies)
              remaining = {r: set(ingredients[i]) for i, r in enumerate(recipes)}
              changed = True
              expected = set()
              while changed:
                  changed = False
                  for r in recipes:
                      if r not in expected and remaining[r] <= available:
                          expected.add(r)
                          available.add(r)
                          changed = True
              return set(result) == expected

seed: 2115

