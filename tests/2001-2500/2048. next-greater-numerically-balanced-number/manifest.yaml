entry:
  id: 2048
  title: "next-greater-numerically-balanced-number"
  params:
    n:
      type: int
  call:
    cpp: "Solution().nextBeautifulNumber({n})"
    rust: "Solution::next_beautiful_number({n})"
    python3: "Solution().nextBeautifulNumber({n})"
    python2: "Solution().nextBeautifulNumber({n})"
    ruby: "next_beautiful_number({n})"
    java: "new Solution().nextBeautifulNumber({n})"
    csharp: "new Solution().NextBeautifulNumber({n})"
    kotlin: "Solution().nextBeautifulNumber({n})"
    go: "nextBeautifulNumber({n})"
    dart: "Solution().nextBeautifulNumber({n})"
    swift: "Solution().nextBeautifulNumber({n})"
    typescript: "nextBeautifulNumber({n})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().nextBeautifulNumber(n, {result})"
    checker: |
      class Checker:
          def nextBeautifulNumber(self, n, result):
              if not isinstance(result, int) or result <= n:
                  return False
              def balanced(x):
                  text = str(x)
                  return all(text.count(d) == int(d) for d in set(text))
              if not balanced(result):
                  return False
              candidate = n + 1
              while candidate < result:
                  if balanced(candidate):
                      return False
                  candidate += 1
              return True

seed: 2048

