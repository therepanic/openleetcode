entry:
  id: 2011
  title: "final-value-of-variable-after-performing-operations"
  params:
    operations:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().finalValueAfterOperations({operations})"
    rust: "Solution::final_value_after_operations({operations})"
    python3: "Solution().finalValueAfterOperations({operations})"
    python2: "Solution().finalValueAfterOperations({operations})"
    ruby: "final_value_after_operations({operations})"
    java: "new Solution().finalValueAfterOperations({operations})"
    csharp: "new Solution().FinalValueAfterOperations({operations})"
    kotlin: "Solution().finalValueAfterOperations({operations})"
    go: "finalValueAfterOperations({operations})"
    dart: "Solution().finalValueAfterOperations({operations})"
    swift: "Solution().finalValueAfterOperations({operations})"
    typescript: "finalValueAfterOperations({operations})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().finalValueAfterOperations(operations, {result})"
    checker: |
      class Checker:
          def finalValueAfterOperations(self, operations, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(operations, list) or not operations:
                  return False
              if any(op not in ("++X", "X++", "--X", "X--") for op in operations):
                  return False
              expected = sum(1 if op[1] == "+" else -1 for op in operations)
              return result == expected

seed: 2011

