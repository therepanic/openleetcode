entry:
  id: 2125
  title: "number-of-laser-beams-in-a-bank"
  params:
    bank:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().numberOfBeams({bank})"
    rust: "Solution::number_of_beams({bank})"
    python3: "Solution().numberOfBeams({bank})"
    python2: "Solution().numberOfBeams({bank})"
    ruby: "number_of_beams({bank})"
    java: "new Solution().numberOfBeams({bank})"
    csharp: "new Solution().NumberOfBeams({bank})"
    kotlin: "Solution().numberOfBeams({bank})"
    go: "numberOfBeams({bank})"
    dart: "Solution().numberOfBeams({bank})"
    swift: "Solution().numberOfBeams({bank})"
    typescript: "numberOfBeams({bank})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numberOfBeams(bank, result)"
    checker: |
      class Checker:
          def numberOfBeams(self, bank, result):
              previous = 0
              expected = 0
              for row in bank:
                  devices = row.count("1")
                  if devices:
                      expected += previous * devices
                      previous = devices
              return result == expected

seed: 2125

