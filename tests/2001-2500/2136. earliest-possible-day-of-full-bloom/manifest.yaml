entry:
  id: 2136
  title: "earliest-possible-day-of-full-bloom"
  params:
    plantTime:
      type: array
      items:
        type: int
    growTime:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().earliestFullBloom({plantTime}, {growTime})"
    rust: "Solution::earliest_full_bloom({plantTime}, {growTime})"
    python3: "Solution().earliestFullBloom({plantTime}, {growTime})"
    python2: "Solution().earliestFullBloom({plantTime}, {growTime})"
    ruby: "earliest_full_bloom({plantTime}, {growTime})"
    java: "new Solution().earliestFullBloom({plantTime}, {growTime})"
    csharp: "new Solution().EarliestFullBloom({plantTime}, {growTime})"
    kotlin: "Solution().earliestFullBloom({plantTime}, {growTime})"
    go: "earliestFullBloom({plantTime}, {growTime})"
    dart: "Solution().earliestFullBloom({plantTime}, {growTime})"
    swift: "Solution().earliestFullBloom({plantTime}, {growTime})"
    typescript: "earliestFullBloom({plantTime}, {growTime})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().earliestFullBloom(plantTime, growTime, {result})"
    checker: |
      class Checker:
          def earliestFullBloom(self, plantTime, growTime, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(plantTime, list) or not isinstance(growTime, list):
                  return False
              if len(plantTime) != len(growTime) or not (1 <= len(plantTime) <= 100000):
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or not 1 <= x <= 10000 for x in plantTime + growTime):
                  return False
              elapsed = 0
              answer = 0
              for grow, plant in sorted(zip(growTime, plantTime), reverse=True):
                  elapsed += plant
                  answer = max(answer, elapsed + grow)
              return result == answer

seed: 2136

