  title: "minimum-operations-to-convert-number"
  params:
    nums:
      type: array
      items:
        type: int
    start:
      type: int
    goal:
      type: int
  call:
    cpp: "Solution().minimumOperations({nums}, {start}, {goal})"
    rust: "Solution::minimum_operations({nums}, {start}, {goal})"
    python3: "Solution().minimumOperations({nums}, {start}, {goal})"
    python2: "Solution().minimumOperations({nums}, {start}, {goal})"
    ruby: "minimum_operations({nums}, {start}, {goal})"
    java: "new Solution().minimumOperations({nums}, {start}, {goal})"
    csharp: "new Solution().MinimumOperations({nums}, {start}, {goal})"
    kotlin: "Solution().minimumOperations({nums}, {start}, {goal})"
    go: "minimumOperations({nums}, {start}, {goal})"
    dart: "Solution().minimumOperations({nums}, {start}, {goal})"
    swift: "Solution().minimumOperations({nums}, {start}, {goal})"
    typescript: "minimumOperations({nums}, {start}, {goal})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumOperations(nums, start, goal, {result})"
    checker: |
      from collections import deque
      class Checker:
          def minimumOperations(self, nums, start, goal, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              seen = {start}
              q = deque([(start, 0)])
              answer = -1
              while q:
                  x, d = q.popleft()
                  if x == goal:
                      answer = d
                      break
                  if not (0 <= x <= 1000):
                      continue
                  for n in nums:
                      for y in (x + n, x - n, x ^ n):
                          if y == goal:
                              answer = d + 1
                              q.clear()
                              break
                          if 0 <= y <= 1000 and y not in seen:
                              seen.add(y)
                              q.append((y, d + 1))
                      if answer != -1:
                          break
                  if answer != -1:
                      break
              return result == answer

seed: 2059

