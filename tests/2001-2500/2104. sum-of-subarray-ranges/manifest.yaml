entry:
  id: 2104
  title: "sum-of-subarray-ranges"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().subArrayRanges({nums})"
    rust: "Solution::sub_array_ranges({nums})"
    python3: "Solution().subArrayRanges({nums})"
    python2: "Solution().subArrayRanges({nums})"
    ruby: "sub_array_ranges({nums})"
    java: "new Solution().subArrayRanges({nums})"
    csharp: "new Solution().SubArrayRanges({nums})"
    kotlin: "Solution().subArrayRanges({nums})"
    go: "subArrayRanges({nums})"
    dart: "Solution().subArrayRanges({nums})"
    swift: "Solution().subArrayRanges({nums})"
    typescript: "subArrayRanges({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().subArrayRanges(nums, {result})"
    checker: |
      class Checker:
          def subArrayRanges(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              for i in range(len(nums)):
                  lo = hi = nums[i]
                  for j in range(i, len(nums)):
                      lo = min(lo, nums[j])
                      hi = max(hi, nums[j])
                      expected += hi - lo
              return result == expected

seed: 2104

