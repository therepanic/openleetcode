entry:
  id: 2071
  title: "maximum-number-of-tasks-you-can-assign"
  params:
    tasks:
      type: array
      items:
        type: int
    workers:
      type: array
      items:
        type: int
    pills:
      type: int
    strength:
      type: int
  call:
    cpp: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    rust: "Solution::max_task_assign({tasks}, {workers}, {pills}, {strength})"
    python3: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    python2: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    ruby: "max_task_assign({tasks}, {workers}, {pills}, {strength})"
    java: "new Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    csharp: "new Solution().MaxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    kotlin: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    go: "maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    dart: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    swift: "Solution().maxTaskAssign({tasks}, {workers}, {pills}, {strength})"
    typescript: "maxTaskAssign({tasks}, {workers}, {pills}, {strength})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxTaskAssign(tasks, workers, pills, strength, {result})"
    checker: |
      class Checker:
          def maxTaskAssign(self, tasks, workers, pills, strength, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if result < 0 or result > min(len(tasks), len(workers)):
                  return False
              a = sorted(tasks)
              w = sorted(workers)
              def possible(k):
                  pool = w[-k:]
                  used = 0
                  for task in reversed(a[:k]):
                      if pool and pool[-1] >= task:
                          pool.pop()
                      else:
                          i = 0
                          while i < len(pool) and pool[i] + strength < task:
                              i += 1
                          if i == len(pool) or used == pills:
                              return False
                          used += 1
                          pool.pop(i)
                  return True
              lo, hi = 0, min(len(a), len(w))
              while lo < hi:
                  mid = (lo + hi + 1) // 2
                  if possible(mid):
                      lo = mid
                  else:
                      hi = mid - 1
              return result == lo

