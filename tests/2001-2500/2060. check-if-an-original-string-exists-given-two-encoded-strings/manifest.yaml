entry:
  id: 2060
  title: "check-if-an-original-string-exists-given-two-encoded-strings"
  params:
    s1:
      type: string
    s2:
      type: string
  call:
    cpp: "Solution().possiblyEquals({s1}, {s2})"
    rust: "Solution::possibly_equals({s1}, {s2})"
    python3: "Solution().possiblyEquals({s1}, {s2})"
    python2: "Solution().possiblyEquals({s1}, {s2})"
    ruby: "possibly_equals({s1}, {s2})"
    java: "new Solution().possiblyEquals({s1}, {s2})"
    csharp: "new Solution().PossiblyEquals({s1}, {s2})"
    kotlin: "Solution().possiblyEquals({s1}, {s2})"
    go: "possiblyEquals({s1}, {s2})"
    dart: "Solution().possiblyEquals({s1}, {s2})"
    swift: "Solution().possiblyEquals({s1}, {s2})"
    typescript: "possiblyEquals({s1}, {s2})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().possiblyEquals(s1, s2, {result})"
    checker: |
      class Checker:
          def possiblyEquals(self, s1, s2, result):
              if not isinstance(result, bool):
                  return False
              seen = set()
              stack = [(0, 0, 0)]
              while stack:
                  i, j, delta = stack.pop()
                  state = (i, j, delta)
                  if state in seen:
                      continue
                  seen.add(state)
                  if i == len(s1) and j == len(s2) and delta == 0:
                      return result is True
                  if i < len(s1) and s1[i].isdigit():
                      value = 0
                      k = i
                      while k < len(s1) and s1[k].isdigit():
                          value = value * 10 + int(s1[k])
                          k += 1
                          stack.append((k, j, delta - value))
                      continue
                  if j < len(s2) and s2[j].isdigit():
                      value = 0
                      k = j
                      while k < len(s2) and s2[k].isdigit():
                          value = value * 10 + int(s2[k])
                          k += 1
                          stack.append((i, k, delta + value))
                      continue
                  if delta > 0 and i < len(s1) and not s1[i].isdigit():
                      stack.append((i + 1, j, delta - 1))
                      continue
                  if delta < 0 and j < len(s2) and not s2[j].isdigit():
                      stack.append((i, j + 1, delta + 1))
                      continue
                  if delta == 0 and i < len(s1) and j < len(s2) and s1[i] == s2[j]:
                      stack.append((i + 1, j + 1, 0))
              return result is False

seed: 2060

