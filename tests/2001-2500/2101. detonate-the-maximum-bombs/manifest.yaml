entry:
  id: 2101
  title: "detonate-the-maximum-bombs"
  params:
    bombs:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maximumDetonation({bombs})"
    rust: "Solution::maximum_detonation({bombs})"
    python3: "Solution().maximumDetonation({bombs})"
    python2: "Solution().maximumDetonation({bombs})"
    ruby: "maximum_detonation({bombs})"
    java: "new Solution().maximumDetonation({bombs})"
    csharp: "new Solution().MaximumDetonation({bombs})"
    kotlin: "Solution().maximumDetonation({bombs})"
    go: "maximumDetonation({bombs})"
    dart: "Solution().maximumDetonation({bombs})"
    swift: "Solution().maximumDetonation({bombs})"
    typescript: "maximumDetonation({bombs})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maximumDetonation(bombs, {result})"
    checker: |
      class Checker:
          def maximumDetonation(self, bombs, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(bombs)
              if n < 1 or result < 1 or result > n:
                  return False
              graph = [[] for _ in range(n)]
              for i, (x1, y1, r1) in enumerate(bombs):
                  for j, (x2, y2, r2) in enumerate(bombs):
                      if i != j and (x2 - x1) ** 2 + (y2 - y1) ** 2 <= r1 ** 2:
                          graph[i].append(j)
              best = 0
              for start in range(n):
                  seen = {start}
                  stack = [start]
                  while stack:
                      for nxt in graph[stack.pop()]:
                          if nxt not in seen:
                              seen.add(nxt)
                              stack.append(nxt)
                  best = max(best, len(seen))
              return result == best

seed: 2101

