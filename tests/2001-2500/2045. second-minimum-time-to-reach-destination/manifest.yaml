judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().secondMinimum(n, edges, time, change, {result})"
    checker: |
      class Checker:
          def secondMinimum(self, n, edges, time, change, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              graph = [[] for _ in range(n + 1)]
              for a, b in edges:
                  graph[a].append(b)
                  graph[b].append(a)
              best = [[None, None] for _ in range(n + 1)]
              best[1][0] = 0
              queue = [(0, 1)]
              import heapq
              while queue:
                  elapsed, node = heapq.heappop(queue)
                  if elapsed not in best[node]:
                      continue
                  for nxt in graph[node]:
                      depart = elapsed
                      if (depart // change) % 2:
                          depart = (depart // change + 1) * change
                      arrival = depart + time
                      if best[nxt][0] is None or arrival < best[nxt][0]:
                          best[nxt][1] = best[nxt][0]
                          best[nxt][0] = arrival
                          heapq.heappush(queue, (arrival, nxt))
                      elif best[nxt][0] < arrival and (best[nxt][1] is None or arrival < best[nxt][1]):
                          best[nxt][1] = arrival
                          heapq.heappush(queue, (arrival, nxt))
              return result == best[n][1]

