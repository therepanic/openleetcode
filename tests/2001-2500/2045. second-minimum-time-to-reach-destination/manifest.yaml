    python3: "Solution().secondMinimum({n}, {edges}, {time}, {change})"
    python2: "Solution().secondMinimum({n}, {edges}, {time}, {change})"
    ruby: "second_minimum({n}, {edges}, {time}, {change})"
    java: "new Solution().secondMinimum({n}, {edges}, {time}, {change})"
    csharp: "new Solution().SecondMinimum({n}, {edges}, {time}, {change})"
    kotlin: "Solution().secondMinimum({n}, {edges}, {time}, {change})"
    go: "secondMinimum({n}, {edges}, {time}, {change})"
    dart: "Solution().secondMinimum({n}, {edges}, {time}, {change})"
    swift: "Solution().secondMinimum({n}, {edges}, {time}, {change})"
