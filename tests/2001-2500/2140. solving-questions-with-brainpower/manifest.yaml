entry:
  id: 2140
  title: "solving-questions-with-brainpower"
  params:
    questions:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().mostPoints({questions})"
    rust: "Solution::most_points({questions})"
    python3: "Solution().mostPoints({questions})"
    python2: "Solution().mostPoints({questions})"
    ruby: "most_points({questions})"
    java: "new Solution().mostPoints({questions})"
    csharp: "new Solution().MostPoints({questions})"
    kotlin: "Solution().mostPoints({questions})"
    go: "mostPoints({questions})"
    dart: "Solution().mostPoints({questions})"
    swift: "Solution().mostPoints({questions})"
    typescript: "mostPoints({questions})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().mostPoints(questions, {result})"
    checker: |
      class Checker:
          def mostPoints(self, questions, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(questions)
              dp = [0] * (n + 1)
              for i in range(n - 1, -1, -1):
                  points, brainpower = questions[i]
                  nxt = i + brainpower + 1
                  take = points + (dp[nxt] if nxt < n else 0)
                  dp[i] = max(dp[i + 1], take)
              return result == dp[0]

