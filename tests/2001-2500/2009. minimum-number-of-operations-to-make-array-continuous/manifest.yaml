entry:
  id: 2009
  title: "minimum-number-of-operations-to-make-array-continuous"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minOperations({nums})"
    rust: "Solution::min_operations({nums})"
    python3: "Solution().minOperations({nums})"
    python2: "Solution().minOperations({nums})"
    ruby: "min_operations({nums})"
    java: "new Solution().minOperations({nums})"
    csharp: "new Solution().MinOperations({nums})"
    kotlin: "Solution().minOperations({nums})"
    go: "minOperations({nums})"
    dart: "Solution().minOperations({nums})"
    swift: "Solution().minOperations({nums})"
    typescript: "minOperations({nums})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minOperations(nums, {result})"
    checker: |
      class Checker:
          def minOperations(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              values = sorted(set(nums))
              best = 0
              right = 0
              for left, value in enumerate(values):
                  while right < len(values) and values[right] < value + n:
                      right += 1
                  best = max(best, right - left)
              return result == n - best
seed: 2009
