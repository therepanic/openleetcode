entry:
  id: 2065
  title: "maximum-path-quality-of-a-graph"
  params:
    values:
      type: array
      items:
        type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
    maxTime:
      type: int
  call:
    cpp: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    rust: "Solution::maximal_path_quality({values}, {edges}, {maxTime})"
    python3: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    python2: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    ruby: "maximal_path_quality({values}, {edges}, {maxTime})"
    java: "new Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    csharp: "new Solution().MaximalPathQuality({values}, {edges}, {maxTime})"
    kotlin: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    go: "maximalPathQuality({values}, {edges}, {maxTime})"
    dart: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    swift: "Solution().maximalPathQuality({values}, {edges}, {maxTime})"
    typescript: "maximalPathQuality({values}, {edges}, {maxTime})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maximalPathQuality(values, edges, maxTime, {result})"
    checker: |
      class Checker:
          def maximalPathQuality(self, values, edges, maxTime, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              graph = [[] for _ in values]
              for u, v, t in edges:
                  graph[u].append((v, t))
                  graph[v].append((u, t))
              best = 0
              def dfs(node, remaining, score, mask):
                  nonlocal best
                  if node == 0:
                      best = max(best, score)
                  for nxt, cost in graph[node]:
                      if cost <= remaining:
                          dfs(nxt, remaining - cost, score if mask & (1 << nxt) else score + values[nxt], mask | (1 << nxt))
              dfs(0, maxTime, values[0], 1)
              return result == best

seed: 2065

