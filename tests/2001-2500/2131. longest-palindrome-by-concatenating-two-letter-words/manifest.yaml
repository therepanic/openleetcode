entry:
  id: 2131
  title: "longest-palindrome-by-concatenating-two-letter-words"
  params:
    words:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().longestPalindrome({words})"
    rust: "Solution::longest_palindrome({words})"
    python3: "Solution().longestPalindrome({words})"
    python2: "Solution().longestPalindrome({words})"
    ruby: "longest_palindrome({words})"
    java: "new Solution().longestPalindrome({words})"
    csharp: "new Solution().LongestPalindrome({words})"
    kotlin: "Solution().longestPalindrome({words})"
    go: "longestPalindrome({words})"
    dart: "Solution().longestPalindrome({words})"
    swift: "Solution().longestPalindrome({words})"
    typescript: "longestPalindrome({words})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().longestPalindrome(words, {result})"
    checker: |
      class Checker:
          def longestPalindrome(self, words, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = {}
              for word in words:
                  if not isinstance(word, str) or len(word) != 2:
                      return False
                  counts[word] = counts.get(word, 0) + 1
              total = 0
              middle = False
              for word, count in counts.items():
                  reverse = word[::-1]
                  if word == reverse:
                      total += (count // 2) * 4
                      middle = middle or (count % 2 == 1)
                  elif word < reverse:
                      total += min(count, counts.get(reverse, 0)) * 4
              if middle:
                  total += 2
              return result == total

seed: 2131

