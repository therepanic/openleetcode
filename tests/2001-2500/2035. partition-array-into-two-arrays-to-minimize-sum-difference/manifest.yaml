entry:
  id: 2035
  title: "partition-array-into-two-arrays-to-minimize-sum-difference"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumDifference({nums})"
    rust: "Solution::minimum_difference({nums})"
    python3: "Solution().minimumDifference({nums})"
    python2: "Solution().minimumDifference({nums})"
    ruby: "minimum_difference({nums})"
    java: "new Solution().minimumDifference({nums})"
    csharp: "new Solution().MinimumDifference({nums})"
    kotlin: "Solution().minimumDifference({nums})"
    go: "minimumDifference({nums})"
    dart: "Solution().minimumDifference({nums})"
    swift: "Solution().minimumDifference({nums})"
    typescript: "minimumDifference({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimumDifference(nums, {result})"
    checker: |
      class Checker:
          def minimumDifference(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              m = len(nums)
              if m < 2 or m % 2 != 0 or m > 30:
                  return False
              n = m // 2
              total = sum(nums)
              left = [[] for _ in range(n + 1)]
              right = [[] for _ in range(n + 1)]
              for mask in range(1 << n):
                  k = mask.bit_count()
                  a = 0
                  b = 0
                  for i in range(n):
                      if mask & (1 << i):
                          a += nums[i]
                          b += nums[n + i]
                  left[k].append(a)
                  right[k].append(b)
              for values in left:
                  values.sort()
              import bisect
              best = None
              for k in range(n + 1):
                  candidates = left[k]
                  for s in right[n - k]:
                      target = (total // 2) - s
                      pos = bisect.bisect_left(candidates, target)
                      for j in (pos - 1, pos):
                          if 0 <= j < len(candidates):
                              diff = abs(total - 2 * (candidates[j] + s))
                              best = diff if best is None else min(best, diff)
              return result == best

