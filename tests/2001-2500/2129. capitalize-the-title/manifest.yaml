entry:
  id: 2129
  title: "capitalize-the-title"
  params:
    title:
      type: string
  call:
    cpp: "Solution().capitalizeTitle({title})"
    rust: "Solution::capitalize_title({title})"
    python3: "Solution().capitalizeTitle({title})"
    python2: "Solution().capitalizeTitle({title})"
    ruby: "capitalize_title({title})"
    java: "new Solution().capitalizeTitle({title})"
    csharp: "new Solution().CapitalizeTitle({title})"
    kotlin: "Solution().capitalizeTitle({title})"
    go: "capitalizeTitle({title})"
    dart: "Solution().capitalizeTitle({title})"
    swift: "Solution().capitalizeTitle({title})"
    typescript: "capitalizeTitle({title})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 128
oracle:
  python3:
    call: "Checker().capitalizeTitle(title, {result})"
    checker: |
      class Checker:
          def capitalizeTitle(self, title, result):
              expected = ' '.join(w.lower() if len(w) <= 2 else w[0].upper() + w[1:].lower() for w in title.split(' '))
              return isinstance(result, str) and result == expected
seed: 2129
