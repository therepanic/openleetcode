entry:
  id: 2049
  title: "count-nodes-with-the-highest-score"
  params:
    parents:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countHighestScoreNodes({parents})"
    rust: "Solution::count_highest_score_nodes({parents})"
    python3: "Solution().countHighestScoreNodes({parents})"
    python2: "Solution().countHighestScoreNodes({parents})"
    ruby: "count_highest_score_nodes({parents})"
    java: "new Solution().countHighestScoreNodes({parents})"
    csharp: "new Solution().CountHighestScoreNodes({parents})"
    kotlin: "Solution().countHighestScoreNodes({parents})"
    go: "countHighestScoreNodes({parents})"
    dart: "Solution().countHighestScoreNodes({parents})"
    swift: "Solution().countHighestScoreNodes({parents})"
    typescript: "countHighestScoreNodes({parents})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countHighestScoreNodes(parents, {result})"
    checker: |
      class Checker:
          def countHighestScoreNodes(self, parents, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(parents)
              children = [[] for _ in range(n)]
              for i in range(1, n):
                  if not isinstance(parents[i], int) or parents[i] < 0 or parents[i] >= n:
                      return False
                  children[parents[i]].append(i)
              if n < 3 or parents[0] != -1 or any(len(x) > 2 for x in children):
                  return False
              sizes = [0] * n
              scores = [0] * n
              def dfs(node):
                  size = 1
                  score = 1
                  for child in children[node]:
                      child_size = dfs(child)
                      size += child_size
                      score *= child_size
                  if node != 0:
                      score *= n - size
                  sizes[node] = size
                  scores[node] = score
                  return size
              dfs(0)
              return result == sum(score == max(scores) for score in scores)

