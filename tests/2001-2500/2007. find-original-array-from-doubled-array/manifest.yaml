entry:
  id: 2007
  title: "find-original-array-from-doubled-array"
  params:
    changed:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findOriginalArray({changed})"
    rust: "Solution::find_original_array({changed})"
    python3: "Solution().findOriginalArray({changed})"
    python2: "Solution().findOriginalArray({changed})"
    ruby: "find_original_array({changed})"
    java: "new Solution().findOriginalArray({changed})"
    csharp: "new Solution().FindOriginalArray({changed})"
    kotlin: "Solution().findOriginalArray({changed})"
    go: "findOriginalArray({changed})"
    dart: "Solution().findOriginalArray({changed})"
    swift: "Solution().findOriginalArray({changed})"
    typescript: "findOriginalArray({changed})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findOriginalArray(changed, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def findOriginalArray(self, changed, result):
              if not isinstance(result, list):
                  return False
              if len(changed) % 2 == 1:
                  return result == []
              remaining = Counter(changed)
              for value in result:
                  if not isinstance(value, int) or value < 0:
                      return False
                  if remaining[value] <= 0:
                      return False
                  remaining[value] -= 1
                  doubled = value * 2
                  if remaining[doubled] <= 0:
                      return False
                  remaining[doubled] -= 1
              if len(result) != len(changed) // 2:
                  return False
              return not any(remaining.values())

