entry:
  id: 2064
  title: "minimized-maximum-of-products-distributed-to-any-store"
  params:
    n:
      type: int
    quantities:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimizedMaximum({n}, {quantities})"
    rust: "Solution::minimized_maximum({n}, {quantities})"
    python3: "Solution().minimizedMaximum({n}, {quantities})"
    python2: "Solution().minimizedMaximum({n}, {quantities})"
    ruby: "minimized_maximum({n}, {quantities})"
    java: "new Solution().minimizedMaximum({n}, {quantities})"
    csharp: "new Solution().MinimizedMaximum({n}, {quantities})"
    kotlin: "Solution().minimizedMaximum({n}, {quantities})"
    go: "minimizedMaximum({n}, {quantities})"
    dart: "Solution().minimizedMaximum({n}, {quantities})"
    swift: "Solution().minimizedMaximum({n}, {quantities})"
    typescript: "minimizedMaximum({n}, {quantities})"

judge:
  type: "exact"

limits:
  time_ms: 300
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimizedMaximum(n, quantities, {result})"
    checker: |
      class Checker:
          def minimizedMaximum(self, n, quantities, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if result < 1:
                  return False
              if sum((q + result - 1) // result for q in quantities) > n:
                  return False
              if result == 1:
                  return all(q == 1 for q in quantities)
              return sum((q + result - 2) // (result - 1) for q in quantities) > n

seed: 2064

