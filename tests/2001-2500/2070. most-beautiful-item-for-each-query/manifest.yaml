entry:
  id: 2070
  title: "most-beautiful-item-for-each-query"
  params:
    items:
      type: array
      items:
        type: array
        items:
          type: int
    queries:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumBeauty({items}, {queries})"
    rust: "Solution::maximum_beauty({items}, {queries})"
    python3: "Solution().maximumBeauty({items}, {queries})"
    python2: "Solution().maximumBeauty({items}, {queries})"
    ruby: "maximum_beauty({items}, {queries})"
    java: "new Solution().maximumBeauty({items}, {queries})"
    csharp: "new Solution().MaximumBeauty({items}, {queries})"
    kotlin: "Solution().maximumBeauty({items}, {queries})"
    go: "maximumBeauty({items}, {queries})"
    dart: "Solution().maximumBeauty({items}, {queries})"
    swift: "Solution().maximumBeauty({items}, {queries})"
    typescript: "maximumBeauty({items}, {queries})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maximumBeauty(items, queries, {result})"
    checker: |
      from bisect import bisect_right

      class Checker:
          def maximumBeauty(self, items, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              ordered = sorted(items)
              prices = []
              prefix = []
              for price, beauty in ordered:
                  prices.append(price)
                  prefix.append(max(beauty, prefix[-1] if prefix else 0))
              expected = [prefix[bisect_right(prices, query) - 1]
                          if bisect_right(prices, query) else 0
                          for query in queries]
              return result == expected

seed: 207000

tests:
