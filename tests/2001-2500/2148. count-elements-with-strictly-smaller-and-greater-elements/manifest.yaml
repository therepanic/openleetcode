entry:
  id: 2148
  title: "count-elements-with-strictly-smaller-and-greater-elements"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countElements({nums})"
    rust: "Solution::count_elements({nums})"
    python3: "Solution().countElements({nums})"
    python2: "Solution().countElements({nums})"
    ruby: "count_elements({nums})"
    java: "new Solution().countElements({nums})"
    csharp: "new Solution().CountElements({nums})"
    kotlin: "Solution().countElements({nums})"
    go: "countElements({nums})"
    dart: "Solution().countElements({nums})"
    swift: "Solution().countElements({nums})"
    typescript: "countElements({nums})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 128
oracle:
  python3:
    call: "Checker().countElements(nums, {result})"
    checker: |
      class Checker:
          def countElements(self, nums, result):
              return isinstance(result, int) and result == sum(min(nums) < x < max(nums) for x in nums)
seed: 2148
tests:
  - name: "example-one"
    in:
      nums: [11, 7, 2, 15]
    out: 2
  - name: "example-two"
    in:
      nums: [-3, 3, 3, 90]
    out: 2
