entry:
  id: 2144
  title: "minimum-cost-of-buying-candies-with-discount"
  params:
    cost:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumCost({cost})"
    rust: "Solution::minimum_cost({cost})"
    python3: "Solution().minimumCost({cost})"
    python2: "Solution().minimumCost({cost})"
    ruby: "minimum_cost({cost})"
    java: "new Solution().minimumCost({cost})"
    csharp: "new Solution().MinimumCost({cost})"
    kotlin: "Solution().minimumCost({cost})"
    go: "minimumCost({cost})"
    dart: "Solution().minimumCost({cost})"
    swift: "Solution().minimumCost({cost})"
    typescript: "minimumCost({cost})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumCost(cost, {result})"
    checker: |
      class Checker:
          def minimumCost(self, cost, result):
              if not isinstance(cost, list) or not 1 <= len(cost) <= 100:
                  return False
              if any(isinstance(x, bool) or not isinstance(x, int) or not 1 <= x <= 100 for x in cost):
                  return False
              if isinstance(result, bool) or not isinstance(result, int):
                  return False
              ordered = sorted(cost, reverse=True)
              expected = sum(x for i, x in enumerate(ordered) if i % 3 != 2)
              return result == expected

seed: 2144

