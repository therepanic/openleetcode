judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().reverseEvenLengthGroups(head, {result})"
    checker: |
      class Checker:
          def reverseEvenLengthGroups(self, head, result):
              if not isinstance(head, list) or not isinstance(result, list):
                  return False
              if len(head) != len(result):
                  return False
              expected = []
              start = 0
              size = 1
              while start < len(head):
                  end = min(start + size, len(head))
                  group = head[start:end]
                  if len(group) % 2 == 0:
                      group.reverse()
                  expected.extend(group)
                  start = end
                  size += 1
              return result == expected

