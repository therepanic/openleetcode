    ruby: "list_node_to_array(reverse_even_length_groups({head}))"
    java: "ListNode.listNodeToArray(new Solution().reverseEvenLengthGroups({head}))"
    csharp: "ListNode.ListNodeToArray(new Solution().ReverseEvenLengthGroups({head}))"
    kotlin: "listNodeToArray(Solution().reverseEvenLengthGroups({head}))"
    go: "listNodeToArray(reverseEvenLengthGroups({head}))"
    dart: "list_node_to_array(Solution().reverseEvenLengthGroups({head}))"
