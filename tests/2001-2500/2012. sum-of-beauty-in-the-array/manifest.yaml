entry:
  id: 2012
  title: "sum-of-beauty-in-the-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().sumOfBeauties({nums})"
    rust: "Solution::sum_of_beauties({nums})"
    python3: "Solution().sumOfBeauties({nums})"
    python2: "Solution().sumOfBeauties({nums})"
    ruby: "sum_of_beauties({nums})"
    java: "new Solution().sumOfBeauties({nums})"
    csharp: "new Solution().SumOfBeauties({nums})"
    kotlin: "Solution().sumOfBeauties({nums})"
    go: "sumOfBeauties({nums})"
    dart: "Solution().sumOfBeauties({nums})"
    swift: "Solution().sumOfBeauties({nums})"
    typescript: "sumOfBeauties({nums})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 300
oracle:
  python3:
    call: "Checker().sumOfBeauties(nums, {result})"
    checker: |
      class Checker:
          def sumOfBeauties(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              prefix = [0] * n
              suffix = [0] * n
              prefix[0] = nums[0]
              suffix[n - 1] = nums[n - 1]
              for i in range(1, n):
                  prefix[i] = max(prefix[i - 1], nums[i - 1])
              for i in range(n - 2, -1, -1):
                  suffix[i] = min(suffix[i + 1], nums[i + 1])
              total = 0
              for i in range(1, len(nums) - 1):
                  if prefix[i] < nums[i] < suffix[i]:
                      total += 2
                  elif nums[i - 1] < nums[i] < nums[i + 1]:
                      total += 1
              return result == total
seed: 2012
