entry:
  id: 2106
  title: "maximum-fruits-harvested-after-at-most-k-steps"
  params:
    fruits:
      type: array
      items:
        type: array
        items:
          type: int
    startPos:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    rust: "Solution::max_total_fruits({fruits}, {startPos}, {k})"
    python3: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    python2: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    ruby: "max_total_fruits({fruits}, {startPos}, {k})"
    java: "new Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    csharp: "new Solution().MaxTotalFruits({fruits}, {startPos}, {k})"
    kotlin: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    go: "maxTotalFruits({fruits}, {startPos}, {k})"
    dart: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    swift: "Solution().maxTotalFruits({fruits}, {startPos}, {k})"
    typescript: "maxTotalFruits({fruits}, {startPos}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxTotalFruits(fruits, startPos, k, {result})"
    checker: |
      class Checker:
          def maxTotalFruits(self, fruits, startPos, k, result):
              if not isinstance(result, int):
                  return False
              best = 0
              for i, (left, _) in enumerate(fruits):
                  for j in range(i, len(fruits)):
                      right = fruits[j][0]
                      cost = min(abs(startPos - left) + right - left,
                                 abs(startPos - right) + right - left)
                      if cost <= k:
                          best = max(best, sum(amount for _, amount in fruits[i:j + 1]))
              return result == best

seed: 2106

