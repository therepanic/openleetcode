entry:
  id: 2103
  title: "rings-and-rods"
  params:
    rings:
      type: string
  call:
    cpp: "Solution().countPoints({rings})"
    rust: "Solution::count_points({rings})"
    python3: "Solution().countPoints({rings})"
    python2: "Solution().countPoints({rings})"
    ruby: "count_points({rings})"
    java: "new Solution().countPoints({rings})"
    csharp: "new Solution().CountPoints({rings})"
    kotlin: "Solution().countPoints({rings})"
    go: "countPoints({rings})"
    dart: "Solution().countPoints({rings})"
    swift: "Solution().countPoints({rings})"
    typescript: "countPoints({rings})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 128
oracle:
  python3:
    call: "Checker().countPoints(rings, {result})"
    checker: |
      class Checker:
          def countPoints(self, rings, result):
              if not isinstance(result, int):
                  return False
              colors = [set() for _ in range(10)]
              for i in range(0, len(rings), 2):
                  colors[ord(rings[i + 1]) - ord('0')].add(rings[i])
              return result == sum(len(s) == 3 for s in colors)
seed: 2103
