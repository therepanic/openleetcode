entry:
  id: 2032
  title: "two-out-of-three"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
    nums3:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    rust: "Solution::two_out_of_three({nums1}, {nums2}, {nums3})"
    python3: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    python2: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    ruby: "two_out_of_three({nums1}, {nums2}, {nums3})"
    java: "new Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    csharp: "new Solution().TwoOutOfThree({nums1}, {nums2}, {nums3})"
    kotlin: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    go: "twoOutOfThree({nums1}, {nums2}, {nums3})"
    dart: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    swift: "Solution().twoOutOfThree({nums1}, {nums2}, {nums3})"
    typescript: "twoOutOfThree({nums1}, {nums2}, {nums3})"

judge:
  type: "ignore_order"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().twoOutOfThree(nums1, nums2, nums3, {result})"
    checker: |
      class Checker:
          def twoOutOfThree(self, nums1, nums2, nums3, result):
              if not isinstance(result, list):
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) for x in result):
                  return False
              if len(result) != len(set(result)):
                  return False
              expected = {x for x in set(nums1 + nums2 + nums3)
                          if sum(x in nums for nums in (nums1, nums2, nums3)) >= 2}
              return set(result) == expected

seed: 2032

tests:
