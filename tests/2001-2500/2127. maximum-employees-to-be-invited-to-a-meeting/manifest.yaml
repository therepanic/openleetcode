entry:
  id: 2127
  title: "maximum-employees-to-be-invited-to-a-meeting"
  params:
    favorite:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumInvitations({favorite})"
    rust: "Solution::maximum_invitations({favorite})"
    python3: "Solution().maximumInvitations({favorite})"
    python2: "Solution().maximumInvitations({favorite})"
    ruby: "maximum_invitations({favorite})"
    java: "new Solution().maximumInvitations({favorite})"
    csharp: "new Solution().MaximumInvitations({favorite})"
    kotlin: "Solution().maximumInvitations({favorite})"
    go: "maximumInvitations({favorite})"
    dart: "Solution().maximumInvitations({favorite})"
    swift: "Solution().maximumInvitations({favorite})"
    typescript: "maximumInvitations({favorite})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maximumInvitations(favorite, {result})"
    checker: |
      class Checker:
          def maximumInvitations(self, favorite, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(favorite)
              indeg = [0] * n
              depth = [0] * n
              for v in favorite:
                  if not isinstance(v, int) or v < 0 or v >= n:
                      return False
                  indeg[v] += 1
              q = [i for i, d in enumerate(indeg) if d == 0]
              head = 0
              while head < len(q):
                  u = q[head]
                  head += 1
                  v = favorite[u]
                  depth[v] = max(depth[v], depth[u] + 1)
                  indeg[v] -= 1
                  if indeg[v] == 0:
                      q.append(v)
              best_cycle = 0
              pairs = 0
              seen = [False] * n
              for i in range(n):
                  if indeg[i] == 0 or seen[i]:
                      continue
                  cur = i
                  size = 0
                  while not seen[cur]:
                      seen[cur] = True
                      cur = favorite[cur]
                      size += 1
                  if size == 2:
                      pairs += 2 + depth[i] + depth[favorite[i]]
                  else:
                      best_cycle = max(best_cycle, size)
              return result == max(best_cycle, pairs)

seed: 2127

