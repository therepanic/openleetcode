entry:
  id: 2147
  title: "number-of-ways-to-divide-a-long-corridor"
  params:
    corridor:
      type: string
  call:
    cpp: "Solution().numberOfWays({corridor})"
    rust: "Solution::number_of_ways({corridor})"
    python3: "Solution().numberOfWays({corridor})"
    python2: "Solution().numberOfWays({corridor})"
    ruby: "number_of_ways({corridor})"
    java: "new Solution().numberOfWays({corridor})"
    csharp: "new Solution().NumberOfWays({corridor})"
    kotlin: "Solution().numberOfWays({corridor})"
    go: "numberOfWays({corridor})"
    dart: "Solution().numberOfWays({corridor})"
    swift: "Solution().numberOfWays({corridor})"
    typescript: "numberOfWays({corridor})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numberOfWays(corridor, {result})"
    checker: |
      class Checker:
          def numberOfWays(self, corridor, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              seats = [i for i, c in enumerate(corridor) if c == 'S']
              if len(seats) == 0 or len(seats) % 2:
                  expected = 0
              else:
                  expected = 1
                  for i in range(1, len(seats) - 1, 2):
                      expected = expected * (seats[i + 1] - seats[i]) % mod
              return result == expected

seed: 2147

