entry:
  id: 2120
  title: "execution-of-all-suffix-instructions-staying-in-a-grid"
  params:
    n:
      type: int
    startPos:
      type: array
      items:
        type: int
    s:
      type: string
  call:
    cpp: "Solution().executeInstructions({n}, {startPos}, {s})"
    rust: "Solution::execute_instructions({n}, {startPos}, {s})"
    python3: "Solution().executeInstructions({n}, {startPos}, {s})"
    python2: "Solution().executeInstructions({n}, {startPos}, {s})"
    ruby: "execute_instructions({n}, {startPos}, {s})"
    java: "new Solution().executeInstructions({n}, {startPos}, {s})"
    csharp: "new Solution().ExecuteInstructions({n}, {startPos}, {s})"
    kotlin: "Solution().executeInstructions({n}, {startPos}, {s})"
    go: "executeInstructions({n}, {startPos}, {s})"
    dart: "Solution().executeInstructions({n}, {startPos}, {s})"
    swift: "Solution().executeInstructions({n}, {startPos}, {s})"
    typescript: "executeInstructions({n}, {startPos}, {s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().executeInstructions(n, startPos, s, {result})"
    checker: |
      class Checker:
          def executeInstructions(self, n, startPos, s, result):
              if not isinstance(result, list) or len(result) != len(s):
                  return False
              expected = []
              for i in range(len(s)):
                  row, col = startPos
                  count = 0
                  for ch in s[i:]:
                      if ch == 'L': col -= 1
                      elif ch == 'R': col += 1
                      elif ch == 'U': row -= 1
                      else: row += 1
                      if not (0 <= row < n and 0 <= col < n): break
                      count += 1
                  expected.append(count)
              return result == expected

seed: 212012

