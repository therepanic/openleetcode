entry:
  id: 2038
  title: "remove-colored-pieces-if-both-neighbors-are-the-same-color"
  params:
    colors:
      type: string
  call:
    cpp: "Solution().winnerOfGame({colors})"
    rust: "Solution::winner_of_game({colors})"
    python3: "Solution().winnerOfGame({colors})"
    python2: "Solution().winnerOfGame({colors})"
    ruby: "winner_of_game({colors})"
    java: "new Solution().winnerOfGame({colors})"
    csharp: "new Solution().WinnerOfGame({colors})"
    kotlin: "Solution().winnerOfGame({colors})"
    go: "winnerOfGame({colors})"
    dart: "Solution().winnerOfGame({colors})"
    swift: "Solution().winnerOfGame({colors})"
    typescript: "winnerOfGame({colors})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().winnerOfGame(colors, {result})"
    checker: |
      class Checker:
          def winnerOfGame(self, colors, result):
              if not isinstance(result, bool):
                  return False
              a = 0
              b = 0
              i = 0
              while i < len(colors):
                  j = i
                  while j < len(colors) and colors[j] == colors[i]:
                      j += 1
                  if j - i >= 3:
                      if colors[i] == 'A':
                          a += j - i - 2
                      else:
                          b += j - i - 2
                  i = j
              return result == (a > b)

