entry:
  id: 2028
  title: "find-missing-observations"
  params:
    rolls:
      type: array
      items:
        type: int
    mean:
      type: int
    n:
      type: int
  call:
    cpp: "Solution().missingRolls({rolls}, {mean}, {n})"
    rust: "Solution::missing_rolls({rolls}, {mean}, {n})"
    python3: "Solution().missingRolls({rolls}, {mean}, {n})"
    python2: "Solution().missingRolls({rolls}, {mean}, {n})"
    ruby: "missing_rolls({rolls}, {mean}, {n})"
    java: "new Solution().missingRolls({rolls}, {mean}, {n})"
    csharp: "new Solution().MissingRolls({rolls}, {mean}, {n})"
    kotlin: "Solution().missingRolls({rolls}, {mean}, {n})"
    go: "missingRolls({rolls}, {mean}, {n})"
    dart: "Solution().missingRolls({rolls}, {mean}, {n})"
    swift: "Solution().missingRolls({rolls}, {mean}, {n})"
    typescript: "missingRolls({rolls}, {mean}, {n})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().missingRolls(rolls, mean, n, {result})"
    checker: |
      class Checker:
          def missingRolls(self, rolls, mean, n, result):
              if not isinstance(result, list):
                  return False
              target = mean * (len(rolls) + n) - sum(rolls)
              if target < n or target > 6 * n:
                  return result == []
              return (len(result) == n and
                      all(isinstance(x, int) and 1 <= x <= 6 for x in result) and
                      sum(result) == target)

seed: 2028

