  title: "count-number-of-maximum-bitwise-or-subsets"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countMaxOrSubsets({nums})"
    rust: "Solution::count_max_or_subsets({nums})"
    python3: "Solution().countMaxOrSubsets({nums})"
    python2: "Solution().countMaxOrSubsets({nums})"
    ruby: "count_max_or_subsets({nums})"
    java: "new Solution().countMaxOrSubsets({nums})"
    csharp: "new Solution().CountMaxOrSubsets({nums})"
    kotlin: "Solution().countMaxOrSubsets({nums})"
    go: "countMaxOrSubsets({nums})"
    dart: "Solution().countMaxOrSubsets({nums})"
    swift: "Solution().countMaxOrSubsets({nums})"
    typescript: "countMaxOrSubsets({nums})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countMaxOrSubsets(nums, {result})"
    checker: |
      class Checker:
          def countMaxOrSubsets(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              target = 0
              for value in nums:
                  target |= value
              count = 0
              for mask in range(1, 1 << len(nums)):
                  current = 0
                  for index, value in enumerate(nums):
                      if mask & (1 << index):
                          current |= value
                  if current == target:
                      count += 1
              return result == count

