entry:
  id: 2042
  title: "check-if-numbers-are-ascending-in-a-sentence"
  params:
    s:
      type: string
  call:
    cpp: "Solution().areNumbersAscending({s})"
    rust: "Solution::are_numbers_ascending({s})"
    python3: "Solution().areNumbersAscending({s})"
    python2: "Solution().areNumbersAscending({s})"
    ruby: "are_numbers_ascending({s})"
    java: "new Solution().areNumbersAscending({s})"
    csharp: "new Solution().AreNumbersAscending({s})"
    kotlin: "Solution().areNumbersAscending({s})"
    go: "areNumbersAscending({s})"
    dart: "Solution().areNumbersAscending({s})"
    swift: "Solution().areNumbersAscending({s})"
    typescript: "areNumbersAscending({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().areNumbersAscending(s, {result})"
    checker: |
      class Checker:
          def areNumbersAscending(self, s, result):
              numbers = [int(token) for token in s.split(" ") if token.isdigit()]
              expected = all(left < right for left, right in zip(numbers, numbers[1:]))
              return result is expected

seed: 2042

tests:
