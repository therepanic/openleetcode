entry:
  id: 2024
  title: "maximize-the-confusion-of-an-exam"
  params:
    answerKey:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    rust: "Solution::max_consecutive_answers({answerKey}, {k})"
    python3: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    python2: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    ruby: "max_consecutive_answers({answerKey}, {k})"
    java: "new Solution().maxConsecutiveAnswers({answerKey}, {k})"
    csharp: "new Solution().MaxConsecutiveAnswers({answerKey}, {k})"
    kotlin: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    go: "maxConsecutiveAnswers({answerKey}, {k})"
    dart: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    swift: "Solution().maxConsecutiveAnswers({answerKey}, {k})"
    typescript: "maxConsecutiveAnswers({answerKey}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxConsecutiveAnswers(answerKey, k, {result})"
    checker: |
      class Checker:
          def maxConsecutiveAnswers(self, answerKey, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              for target in ("T", "F"):
                  left = 0
                  changes = 0
                  for right, ch in enumerate(answerKey):
                      if ch != target:
                          changes += 1
                      while changes > k:
                          if answerKey[left] != target:
                              changes -= 1
                          left += 1
                      best = max(best, right - left + 1)
              return result == best

seed: 2024

