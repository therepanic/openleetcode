entry:
  id: 2130
  title: "maximum-twin-sum-of-a-linked-list"
  params:
    head:
      type: list_node
  call:
    cpp: "Solution().pairSum({head})"
    rust: "Solution::pair_sum({head})"
    python3: "Solution().pairSum({head})"
    python2: "Solution().pairSum({head})"
    ruby: "pair_sum({head})"
    java: "new Solution().pairSum({head})"
    csharp: "new Solution().PairSum({head})"
    kotlin: "Solution().pairSum({head})"
    go: "pairSum({head})"
    dart: "Solution().pairSum({head})"
    swift: "Solution().pairSum({head})"
    typescript: "pairSum({head})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().pairSum(head, {result})"
    checker: |
      class Checker:
          def pairSum(self, head, result):
              if not isinstance(head, list) or len(head) < 2 or len(head) % 2:
                  return False
              if any(not isinstance(value, int) or isinstance(value, bool) or value < 1 or value > 100000 for value in head):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              return result == max(head[i] + head[-1 - i] for i in range(len(head) // 2))

seed: 2130

