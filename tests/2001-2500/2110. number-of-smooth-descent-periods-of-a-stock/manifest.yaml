entry:
  id: 2110
  title: "number-of-smooth-descent-periods-of-a-stock"
  params:
    prices:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getDescentPeriods({prices})"
    rust: "Solution::get_descent_periods({prices})"
    python3: "Solution().getDescentPeriods({prices})"
    python2: "Solution().getDescentPeriods({prices})"
    ruby: "get_descent_periods({prices})"
    java: "new Solution().getDescentPeriods({prices})"
    csharp: "new Solution().GetDescentPeriods({prices})"
    kotlin: "Solution().getDescentPeriods({prices})"
    go: "getDescentPeriods({prices})"
    dart: "Solution().getDescentPeriods({prices})"
    swift: "Solution().getDescentPeriods({prices})"
    typescript: "getDescentPeriods({prices})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getDescentPeriods(prices, {result})"
    checker: |
      class Checker:
          def getDescentPeriods(self, prices, result):
              expected = 0
              run = 0
              for i, value in enumerate(prices):
                  if i > 0 and prices[i - 1] - value == 1:
                      run += 1
                  else:
                      run = 1
                  expected += run
              return result == expected

seed: 2110

