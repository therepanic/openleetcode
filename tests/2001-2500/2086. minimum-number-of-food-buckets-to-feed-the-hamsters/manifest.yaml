entry:
  id: 2086
  title: "minimum-number-of-food-buckets-to-feed-the-hamsters"
  params:
    hamsters:
      type: string
  call:
    cpp: "Solution().minimumBuckets({hamsters})"
    rust: "Solution::minimum_buckets({hamsters})"
    python3: "Solution().minimumBuckets({hamsters})"
    python2: "Solution().minimumBuckets({hamsters})"
    ruby: "minimum_buckets({hamsters})"
    java: "new Solution().minimumBuckets({hamsters})"
    csharp: "new Solution().MinimumBuckets({hamsters})"
    kotlin: "Solution().minimumBuckets({hamsters})"
    go: "minimumBuckets({hamsters})"
    dart: "Solution().minimumBuckets({hamsters})"
    swift: "Solution().minimumBuckets({hamsters})"
    typescript: "minimumBuckets({hamsters})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumBuckets(hamsters, {result})"
    checker: |
      class Checker:
          def minimumBuckets(self, hamsters, result):
              buckets = 0
              s = list(hamsters)
              for i, ch in enumerate(s):
                  if ch != "H":
                      continue
                  if i > 0 and s[i - 1] == "B":
                      continue
                  if i + 1 < len(s) and s[i + 1] == ".":
                      s[i + 1] = "B"
                      buckets += 1
                  elif i > 0 and s[i - 1] == ".":
                      s[i - 1] = "B"
                      buckets += 1
                  else:
                      return result == -1
              return result == buckets

