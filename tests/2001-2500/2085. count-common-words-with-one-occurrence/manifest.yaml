entry:
  id: 2085
  title: "count-common-words-with-one-occurrence"
  params:
    words1:
      type: array
      items:
        type: string
    words2:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().countWords({words1}, {words2})"
    rust: "Solution::count_words({words1}, {words2})"
    python3: "Solution().countWords({words1}, {words2})"
    python2: "Solution().countWords({words1}, {words2})"
    ruby: "count_words({words1}, {words2})"
    java: "new Solution().countWords({words1}, {words2})"
    csharp: "new Solution().CountWords({words1}, {words2})"
    kotlin: "Solution().countWords({words1}, {words2})"
    go: "countWords({words1}, {words2})"
    dart: "Solution().countWords({words1}, {words2})"
    swift: "Solution().countWords({words1}, {words2})"
    typescript: "countWords({words1}, {words2})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countWords(words1, words2, {result})"
    checker: |
      class Checker:
          def countWords(self, words1, words2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              from collections import Counter
              expected = sum(1 for word, count in Counter(words1).items()
                             if count == 1 and Counter(words2)[word] == 1)
              return result == expected

seed: 2085001

tests:
  - name: "example_1"
    in:
      words1: ["leetcode", "is", "amazing", "as", "is"]
      words2: ["amazing", "leetcode", "is"]
    out: 2
  - name: "example_2_disjoint"
    in:
      words1: ["b", "bb", "bbb"]
      words2: ["a", "aa", "aaa"]
    out: 0
  - name: "example_3_duplicate_other_side"
    in:
      words1: ["a", "ab"]
      words2: ["a", "a", "a", "ab"]
    out: 1
  - name: "single_equal"
    in:
      words1: ["a"]
      words2: ["a"]
    out: 1
  - name: "single_different"
    in:
      words1: ["a"]
      words2: ["b"]
    out: 0
  - name: "all_duplicates_both"
