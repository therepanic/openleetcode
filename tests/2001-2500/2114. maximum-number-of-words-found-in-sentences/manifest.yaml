entry:
  id: 2114
  title: "maximum-number-of-words-found-in-sentences"
  params:
    sentences:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().mostWordsFound({sentences})"
    rust: "Solution::most_words_found({sentences})"
    python3: "Solution().mostWordsFound({sentences})"
    python2: "Solution().mostWordsFound({sentences})"
    ruby: "most_words_found({sentences})"
    java: "new Solution().mostWordsFound({sentences})"
    csharp: "new Solution().MostWordsFound({sentences})"
    kotlin: "Solution().mostWordsFound({sentences})"
    go: "mostWordsFound({sentences})"
    dart: "Solution().mostWordsFound({sentences})"
    swift: "Solution().mostWordsFound({sentences})"
    typescript: "mostWordsFound({sentences})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 128
oracle:
  python3:
    call: "Checker().mostWordsFound(sentences, {result})"
    checker: |
      class Checker:
          def mostWordsFound(self, sentences, result):
              return isinstance(result, int) and result == max(s.count(' ') + 1 for s in sentences)
seed: 2114
tests:
  - name: "example-one"
    in:
      sentences: ["alice and bob love leetcode", "i think so too", "this is great thanks very much"]
    out: 6
