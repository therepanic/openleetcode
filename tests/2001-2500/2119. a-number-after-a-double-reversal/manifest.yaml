entry:
  id: 2119
  title: "a-number-after-a-double-reversal"
  params:
    num:
      type: int
  call:
    cpp: "Solution().isSameAfterReversals({num})"
    rust: "Solution::is_same_after_reversals({num})"
    python3: "Solution().isSameAfterReversals({num})"
    python2: "Solution().isSameAfterReversals({num})"
    ruby: "is_same_after_reversals({num})"
    java: "new Solution().isSameAfterReversals({num})"
    csharp: "new Solution().IsSameAfterReversals({num})"
    kotlin: "Solution().isSameAfterReversals({num})"
    go: "isSameAfterReversals({num})"
    dart: "Solution().isSameAfterReversals({num})"
    swift: "Solution().isSameAfterReversals({num})"
    typescript: "isSameAfterReversals({num})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().isSameAfterReversals(num, {result})"
    checker: |
      class Checker:
          def isSameAfterReversals(self, num, result):
              expected = (num == 0 or num % 10 != 0)
              return result is expected

seed: 2119

