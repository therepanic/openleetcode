entry:
  id: 2062
  title: "count-vowel-substrings-of-a-string"
  params:
    word:
      type: string
  call:
    cpp: "Solution().countVowelSubstrings({word})"
    rust: "Solution::count_vowel_substrings({word})"
    python3: "Solution().countVowelSubstrings({word})"
    python2: "Solution().countVowelSubstrings({word})"
    ruby: "count_vowel_substrings({word})"
    java: "new Solution().countVowelSubstrings({word})"
    csharp: "new Solution().CountVowelSubstrings({word})"
    kotlin: "Solution().countVowelSubstrings({word})"
    go: "countVowelSubstrings({word})"
    dart: "Solution().countVowelSubstrings({word})"
    swift: "Solution().countVowelSubstrings({word})"
    typescript: "countVowelSubstrings({word})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countVowelSubstrings(word, {result})"
    checker: |
      class Checker:
          def countVowelSubstrings(self, word, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              vowels = set("aeiou")
              expected = 0
              for start in range(len(word)):
                  seen = set()
                  for end in range(start, len(word)):
                      if word[end] not in vowels:
                          break
                      seen.add(word[end])
                      if len(seen) == 5:
                          expected += 1
              return result == expected

