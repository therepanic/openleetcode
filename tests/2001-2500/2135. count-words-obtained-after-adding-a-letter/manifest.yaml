entry:
  id: 2135
  title: "count-words-obtained-after-adding-a-letter"
  params:
    startWords:
      type: array
      items:
        type: string
    targetWords:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().wordCount({startWords}, {targetWords})"
    rust: "Solution::word_count({startWords}, {targetWords})"
    python3: "Solution().wordCount({startWords}, {targetWords})"
    python2: "Solution().wordCount({startWords}, {targetWords})"
    ruby: "word_count({startWords}, {targetWords})"
    java: "new Solution().wordCount({startWords}, {targetWords})"
    csharp: "new Solution().WordCount({startWords}, {targetWords})"
    kotlin: "Solution().wordCount({startWords}, {targetWords})"
    go: "wordCount({startWords}, {targetWords})"
    dart: "Solution().wordCount({startWords}, {targetWords})"
    swift: "Solution().wordCount({startWords}, {targetWords})"
    typescript: "wordCount({startWords}, {targetWords})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().wordCount(startWords, targetWords, {result})"
    checker: |
      class Checker:
          def wordCount(self, startWords, targetWords, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              available = {''.join(sorted(word)) for word in startWords}
              expected = 0
              for target in targetWords:
                  for index, letter in enumerate(target):
                      if target.count(letter) == 1 and target[:index] + target[index + 1:] in available:
                          expected += 1
                          break
              return result == expected

seed: 2135

