entry:
  id: 2145
  title: "count-the-hidden-sequences"
  params:
    differences:
      type: array
      items:
        type: int
    lower:
      type: int
    upper:
      type: int
  call:
    cpp: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    rust: "Solution::number_of_arrays({differences}, {lower}, {upper})"
    python3: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    python2: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    ruby: "number_of_arrays({differences}, {lower}, {upper})"
    java: "new Solution().numberOfArrays({differences}, {lower}, {upper})"
    csharp: "new Solution().NumberOfArrays({differences}, {lower}, {upper})"
    kotlin: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    go: "numberOfArrays({differences}, {lower}, {upper})"
    dart: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    swift: "Solution().numberOfArrays({differences}, {lower}, {upper})"
    typescript: "numberOfArrays({differences}, {lower}, {upper})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numberOfArrays(differences, lower, upper, {result})"
    checker: |
      class Checker:
          def numberOfArrays(self, differences, lower, upper, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              lo = hi = 0
              current = 0
              for delta in differences:
                  current += delta
                  lo = min(lo, current)
                  hi = max(hi, current)
              expected = max(0, (upper - lower + 1) - (hi - lo))
              return result == expected

seed: 2145

