entry:
  id: 2078
  title: "two-furthest-houses-with-different-colors"
  params:
    colors:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxDistance({colors})"
    rust: "Solution::max_distance({colors})"
    python3: "Solution().maxDistance({colors})"
    python2: "Solution().maxDistance({colors})"
    ruby: "max_distance({colors})"
    java: "new Solution().maxDistance({colors})"
    csharp: "new Solution().MaxDistance({colors})"
    kotlin: "Solution().maxDistance({colors})"
    go: "maxDistance({colors})"
    dart: "Solution().maxDistance({colors})"
    swift: "Solution().maxDistance({colors})"
    typescript: "maxDistance({colors})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxDistance(colors, {result})"
    checker: |
      class Checker:
          def maxDistance(self, colors, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              for i in range(len(colors)):
                  for j in range(i + 1, len(colors)):
                      if colors[i] != colors[j]:
                          best = max(best, j - i)
              return result == best

seed: 20782026

