entry:
  id: 2030
  title: "smallest-k-length-subsequence-with-occurrences-of-a-letter"
  params:
    s:
      type: string
    k:
      type: int
    letter:
      type: string
    repetition:
      type: int
  call:
    cpp: "Solution().smallestSubsequence({s}, {k}, {letter}[0], {repetition})"
    rust: "Solution::smallest_subsequence({s}, {k}, {letter}[0], {repetition})"
    python3: "Solution().smallestSubsequence({s}, {k}, {letter}, {repetition})"
    python2: "Solution().smallestSubsequence({s}, {k}, {letter}, {repetition})"
    ruby: "smallest_subsequence({s}, {k}, {letter}, {repetition})"
    java: "new Solution().smallestSubsequence({s}, {k}, {letter}.charAt(0), {repetition})"
    csharp: "new Solution().SmallestSubsequence({s}, {k}, {letter}[0], {repetition})"
    kotlin: "Solution().smallestSubsequence({s}, {k}, {letter}[0], {repetition})"
    go: "smallestSubsequence({s}, {k}, {letter}[0], {repetition})"
    dart: "Solution().smallestSubsequence({s}, {k}, {letter}, {repetition})"
    swift: "Solution().smallestSubsequence({s}, {k}, {letter}.first!, {repetition})"
    typescript: "smallestSubsequence({s}, {k}, {letter}, {repetition})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().check(s, k, letter, repetition, {result})"
    checker: |
      class Checker:
          def check(self, s, k, letter, repetition, result):
              stack = []
              need = repetition
              remaining = s.count(letter)
              for i, ch in enumerate(s):
                  if ch == letter:
                      remaining -= 1
                  while stack and stack[-1] > ch and len(stack) + len(s) - i - 1 >= k:
                      if stack[-1] == letter and remaining < need:
                          break
                      if stack.pop() == letter:
                          need += 1
                  if len(stack) < k:
                      if ch == letter:
                          stack.append(ch)
                          need -= 1
                      elif k - len(stack) > need:
                          stack.append(ch)
              return isinstance(result, str) and result == ''.join(stack)

