entry:
  id: 2109
  title: "adding-spaces-to-a-string"
  params:
    s:
      type: string
    spaces:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().addSpaces({s}, {spaces})"
    rust: "Solution::add_spaces({s}, {spaces})"
    python3: "Solution().addSpaces({s}, {spaces})"
    python2: "Solution().addSpaces({s}, {spaces})"
    ruby: "add_spaces({s}, {spaces})"
    java: "new Solution().addSpaces({s}, {spaces})"
    csharp: "new Solution().AddSpaces({s}, {spaces})"
    kotlin: "Solution().addSpaces({s}, {spaces})"
    go: "addSpaces({s}, {spaces})"
    dart: "Solution().addSpaces({s}, {spaces})"
    swift: "Solution().addSpaces({s}, {spaces})"
    typescript: "addSpaces({s}, {spaces})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 300
oracle:
  python3:
    call: "Checker().addSpaces(s, spaces, {result})"
    checker: |
      class Checker:
          def addSpaces(self, s, spaces, result):
              parts = []
              previous = 0
              for index in spaces:
                  parts.append(s[previous:index])
                  parts.append(" ")
                  previous = index
              parts.append(s[previous:])
              return result == "".join(parts)
seed: 2109
tests:
  - name: "example_1"
    in:
      s: "LeetcodeHelpsMeLearn"
      spaces: [8, 13, 15]
    out: "Leetcode Helps Me Learn"
  - name: "example_2"
    in:
      s: "icodeinpython"
      spaces: [1, 5, 7, 9]
    out: "i code in py thon"
  - name: "example_3"
    in:
      s: "spacing"
      spaces: [0, 1, 2, 3, 4, 5, 6]
    out: " s p a c i n g"
  - name: "single_lower"
