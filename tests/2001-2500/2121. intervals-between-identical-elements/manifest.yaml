entry:
  id: 2121
  title: "intervals-between-identical-elements"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getDistances({arr})"
    rust: "Solution::get_distances({arr})"
    python3: "Solution().getDistances({arr})"
    python2: "Solution().getDistances({arr})"
    ruby: "get_distances({arr})"
    java: "new Solution().getDistances({arr})"
    csharp: "new Solution().GetDistances({arr})"
    kotlin: "Solution().getDistances({arr})"
    go: "getDistances({arr})"
    dart: "Solution().getDistances({arr})"
    swift: "Solution().getDistances({arr})"
    typescript: "getDistances({arr})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().getDistances(arr, {result})"
    checker: |
      class Checker:
          def getDistances(self, arr, result):
              if not isinstance(result, list) or len(result) != len(arr):
                  return False
              positions = {}
              for i, value in enumerate(arr):
                  positions.setdefault(value, []).append(i)
              expected = [0] * len(arr)
              for indices in positions.values():
                  for i in indices:
                      expected[i] = sum(abs(i - j) for j in indices)
              return result == expected

seed: 2121

