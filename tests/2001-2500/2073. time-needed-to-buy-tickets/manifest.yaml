entry:
  id: 2073
  title: "time-needed-to-buy-tickets"
  params:
    tickets:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().timeRequiredToBuy({tickets}, {k})"
    rust: "Solution::time_required_to_buy({tickets}, {k})"
    python3: "Solution().timeRequiredToBuy({tickets}, {k})"
    python2: "Solution().timeRequiredToBuy({tickets}, {k})"
    ruby: "time_required_to_buy({tickets}, {k})"
    java: "new Solution().timeRequiredToBuy({tickets}, {k})"
    csharp: "new Solution().TimeRequiredToBuy({tickets}, {k})"
    kotlin: "Solution().timeRequiredToBuy({tickets}, {k})"
    go: "timeRequiredToBuy({tickets}, {k})"
    dart: "Solution().timeRequiredToBuy({tickets}, {k})"
    swift: "Solution().timeRequiredToBuy({tickets}, {k})"
    typescript: "timeRequiredToBuy({tickets}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().timeRequiredToBuy(tickets, k, {result})"
    checker: |
      class Checker:
          def timeRequiredToBuy(self, tickets, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              target = tickets[k]
              expected = 0
              for i, count in enumerate(tickets):
                  expected += min(count, target if i <= k else target - 1)
              return result == expected

seed: 2073

