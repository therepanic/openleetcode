entry:
  id: 2075
  title: "decode-the-slanted-ciphertext"
  params:
    encodedText:
      type: string
    rows:
      type: int
  call:
    cpp: "Solution().decodeCiphertext({encodedText}, {rows})"
    rust: "Solution::decode_ciphertext({encodedText}, {rows})"
    python3: "Solution().decodeCiphertext({encodedText}, {rows})"
    python2: "Solution().decodeCiphertext({encodedText}, {rows})"
    ruby: "decode_ciphertext({encodedText}, {rows})"
    java: "new Solution().decodeCiphertext({encodedText}, {rows})"
    csharp: "new Solution().DecodeCiphertext({encodedText}, {rows})"
    kotlin: "Solution().decodeCiphertext({encodedText}, {rows})"
    go: "decodeCiphertext({encodedText}, {rows})"
    dart: "Solution().decodeCiphertext({encodedText}, {rows})"
    swift: "Solution().decodeCiphertext({encodedText}, {rows})"
    typescript: "decodeCiphertext({encodedText}, {rows})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().decodeCiphertext(encodedText, rows, {result})"
    checker: |
      class Checker:
          def decodeCiphertext(self, encodedText, rows, result):
              if not isinstance(result, str) or rows < 1:
                  return False
              cols = len(encodedText) // rows
              expected = []
              for c in range(cols):
                  r = 0
                  j = c
                  while r < rows and j < cols:
                      expected.append(encodedText[r * cols + j])
                      r += 1
                      j += 1
              return ''.join(expected).rstrip(' ') == result

