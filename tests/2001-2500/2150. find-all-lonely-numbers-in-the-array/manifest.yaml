entry:
  id: 2150
  title: "find-all-lonely-numbers-in-the-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findLonely({nums})"
    rust: "Solution::find_lonely({nums})"
    python3: "Solution().findLonely({nums})"
    python2: "Solution().findLonely({nums})"
    ruby: "find_lonely({nums})"
    java: "new Solution().findLonely({nums})"
    csharp: "new Solution().FindLonely({nums})"
    kotlin: "Solution().findLonely({nums})"
    go: "findLonely({nums})"
    dart: "Solution().findLonely({nums})"
    swift: "Solution().findLonely({nums})"
    typescript: "findLonely({nums})"
judge:
  type: "ignore_order"
limits:
  time_ms: 1000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().findLonely(nums, {result})"
    checker: |
      from collections import Counter
      class Checker:
          def findLonely(self, nums, result):
              if not isinstance(result, list) or any(not isinstance(x, int) for x in result):
                  return False
              counts = Counter(nums)
              expected = {x for x, count in counts.items() if count == 1 and x - 1 not in counts and x + 1 not in counts}
              return len(result) == len(set(result)) and set(result) == expected
seed: 2150
