entry:
  id: 2047
  title: "number-of-valid-words-in-a-sentence"
  params:
    sentence:
      type: string
  call:
    cpp: "Solution().countValidWords({sentence})"
    rust: "Solution::count_valid_words({sentence})"
    python3: "Solution().countValidWords({sentence})"
    python2: "Solution().countValidWords({sentence})"
    ruby: "count_valid_words({sentence})"
    java: "new Solution().countValidWords({sentence})"
    csharp: "new Solution().CountValidWords({sentence})"
    kotlin: "Solution().countValidWords({sentence})"
    go: "countValidWords({sentence})"
    dart: "Solution().countValidWords({sentence})"
    swift: "Solution().countValidWords({sentence})"
    typescript: "countValidWords({sentence})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countValidWords(sentence, {result})"
    checker: |
      class Checker:
          def countValidWords(self, sentence, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = 0
              for token in sentence.split(' '):
                  if not token:
                      continue
                  hyphens = 0
                  punctuation = 0
                  valid = True
                  for i, ch in enumerate(token):
                      if not ('a' <= ch <= 'z' or ch in '-!.,'):
                          valid = False
                          break
                      if ch == '-':
                          hyphens += 1
                          if hyphens > 1 or i == 0 or i == len(token) - 1:
                              valid = False
                              break
                          if not ('a' <= token[i - 1] <= 'z' and 'a' <= token[i + 1] <= 'z'):
                              valid = False
                              break
                      elif ch in '!.,':
                          punctuation += 1
                          if punctuation > 1 or i != len(token) - 1:
                              valid = False
                              break
                  if valid:
                      total += 1
              return result == total

