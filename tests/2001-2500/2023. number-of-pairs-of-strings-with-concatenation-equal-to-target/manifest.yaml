entry:
  id: 2023
  title: "number-of-pairs-of-strings-with-concatenation-equal-to-target"
  params:
    nums:
      type: array
      items:
        type: string
    target:
      type: string
  call:
    cpp: "Solution().numOfPairs({nums}, {target})"
    rust: "Solution::num_of_pairs({nums}, {target})"
    python3: "Solution().numOfPairs({nums}, {target})"
    python2: "Solution().numOfPairs({nums}, {target})"
    ruby: "num_of_pairs({nums}, {target})"
    java: "new Solution().numOfPairs({nums}, {target})"
    csharp: "new Solution().NumOfPairs({nums}, {target})"
    kotlin: "Solution().numOfPairs({nums}, {target})"
    go: "numOfPairs({nums}, {target})"
    dart: "Solution().numOfPairs({nums}, {target})"
    swift: "Solution().numOfPairs({nums}, {target})"
    typescript: "numOfPairs({nums}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numOfPairs(nums, target, {result})"
    checker: |
      class Checker:
          def numOfPairs(self, nums, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              for i in range(len(nums)):
                  for j in range(len(nums)):
                      if i != j and nums[i] + nums[j] == target:
                          expected += 1
              return result == expected

seed: 2023

tests:
