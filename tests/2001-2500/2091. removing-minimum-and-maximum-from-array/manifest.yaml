entry:
  id: 2091
  title: "removing-minimum-and-maximum-from-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumDeletions({nums})"
    rust: "Solution::minimum_deletions({nums})"
    python3: "Solution().minimumDeletions({nums})"
    python2: "Solution().minimumDeletions({nums})"
    ruby: "minimum_deletions({nums})"
    java: "new Solution().minimumDeletions({nums})"
    csharp: "new Solution().MinimumDeletions({nums})"
    kotlin: "Solution().minimumDeletions({nums})"
    go: "minimumDeletions({nums})"
    dart: "Solution().minimumDeletions({nums})"
    swift: "Solution().minimumDeletions({nums})"
    typescript: "minimumDeletions({nums})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumDeletions(nums, {result})"
    checker: |
      class Checker:
          def minimumDeletions(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              lo = nums.index(min(nums))
              hi = nums.index(max(nums))
              i, j = sorted((lo, hi))
              expected = min(j + 1, n - i, i + 1 + n - j)
              return result == expected

seed: 2091

