entry:
  id: 2124
  title: "check-if-all-as-appears-before-all-bs"
  params:
    s:
      type: string
  call:
    cpp: "Solution().checkString({s})"
    rust: "Solution::check_string({s})"
    python3: "Solution().checkString({s})"
    python2: "Solution().checkString({s})"
    ruby: "check_string({s})"
    java: "new Solution().checkString({s})"
    csharp: "new Solution().CheckString({s})"
    kotlin: "Solution().checkString({s})"
    go: "checkString({s})"
    dart: "Solution().checkString({s})"
    swift: "Solution().checkString({s})"
    typescript: "checkString({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().checkString(s, {result})"
    checker: |
      class Checker:
          def checkString(self, s, result):
              return isinstance(result, bool) and result == ("ba" not in s)

seed: 2124

