judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().friendRequests(n, restrictions, requests, {result})"
    checker: |
      class Checker:
          def friendRequests(self, n, restrictions, requests, result):
              parent = list(range(n))
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              expected = []
              for u, v in requests:
                  ru, rv = find(u), find(v)
                  ok = ru == rv
                  if not ok:
                      for a, b in restrictions:
                          ra, rb = find(a), find(b)
                          if (ra == ru and rb == rv) or (ra == rv and rb == ru):
                              ok = False
                              break
                      else:
                          ok = True
                  expected.append(ok)
                  if ok and ru != rv:
                      parent[ru] = rv
              return result == expected

seed: 20762076

