    cpp: "Solution().friendRequests({n}, {restrictions}, {requests})"
    rust: "Solution::friend_requests({n}, {restrictions}, {requests})"
    python3: "Solution().friendRequests({n}, {restrictions}, {requests})"
    python2: "Solution().friendRequests({n}, {restrictions}, {requests})"
    ruby: "friend_requests({n}, {restrictions}, {requests})"
    java: "new Solution().friendRequests({n}, {restrictions}, {requests})"
    csharp: "new Solution().FriendRequests({n}, {restrictions}, {requests})"
    kotlin: "Solution().friendRequests({n}, {restrictions}, {requests})"
    go: "friendRequests({n}, {restrictions}, {requests})"
    dart: "Solution().friendRequests({n}, {restrictions}, {requests})"
    swift: "Solution().friendRequests({n}, {restrictions}, {requests})"
