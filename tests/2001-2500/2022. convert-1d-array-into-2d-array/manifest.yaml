entry:
  id: 2022
  title: "convert-1d-array-into-2d-array"
  params:
    original:
      type: array
      items:
        type: int
    m:
      type: int
    n:
      type: int
  call:
    cpp: "Solution().construct2DArray({original}, {m}, {n})"
    rust: "Solution::construct2_d_array({original}, {m}, {n})"
    python3: "Solution().construct2DArray({original}, {m}, {n})"
    python2: "Solution().construct2DArray({original}, {m}, {n})"
    ruby: "construct2_d_array({original}, {m}, {n})"
    java: "new Solution().construct2DArray({original}, {m}, {n})"
    csharp: "new Solution().Construct2DArray({original}, {m}, {n})"
    kotlin: "Solution().construct2DArray({original}, {m}, {n})"
    go: "construct2DArray({original}, {m}, {n})"
    dart: "Solution().construct2DArray({original}, {m}, {n})"
    swift: "Solution().construct2DArray({original}, {m}, {n})"
    typescript: "construct2DArray({original}, {m}, {n})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().construct2DArray(original, m, n, {result})"
    checker: |
      class Checker:
          def construct2DArray(self, original, m, n, result):
              if not isinstance(result, list):
                  return False
              if m * n != len(original):
                  return result == []
              if len(result) != m:
                  return False
              return all(isinstance(row, list) and len(row) == n and
                         row == original[i * n:(i + 1) * n]
                         for i, row in enumerate(result))

seed: 2022

