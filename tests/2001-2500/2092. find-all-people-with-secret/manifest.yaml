entry:
  id: 2092
  title: "find-all-people-with-secret"
  params:
    n:
      type: int
    meetings:
      type: array
      items:
        type: array
        items:
          type: int
    firstPerson:
      type: int
  call:
    cpp: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    rust: "Solution::find_all_people({n}, {meetings}, {firstPerson})"
    python3: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    python2: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    ruby: "find_all_people({n}, {meetings}, {firstPerson})"
    java: "new Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    csharp: "new Solution().FindAllPeople({n}, {meetings}, {firstPerson})"
    kotlin: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    go: "findAllPeople({n}, {meetings}, {firstPerson})"
    dart: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    swift: "Solution().findAllPeople({n}, {meetings}, {firstPerson})"
    typescript: "findAllPeople({n}, {meetings}, {firstPerson})"

judge:
  type: "ignore_order"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().findAllPeople(n, meetings, firstPerson, {result})"
    checker: |
      class Checker:
          def findAllPeople(self, n, meetings, firstPerson, result):
              if not isinstance(result, list):
                  return False
              known = {0, firstPerson}
              by_time = {}
              for x, y, t in meetings:
                  by_time.setdefault(t, []).append((x, y))
              for t in sorted(by_time):
                  graph = {}
                  for x, y in by_time[t]:
                      graph.setdefault(x, []).append(y)
                      graph.setdefault(y, []).append(x)
                  queue = [p for x, y in by_time[t] for p in (x, y) if p in known]
                  seen = set(queue)
                  for p in queue:
                      for q in graph.get(p, []):
                          if q not in seen:
                              seen.add(q)
                              queue.append(q)
                  known.update(seen)
              return set(result) == known and len(result) == len(known)

seed: 2092

tests:
