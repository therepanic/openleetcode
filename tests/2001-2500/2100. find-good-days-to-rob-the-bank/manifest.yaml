entry:
  id: 2100
  title: "find-good-days-to-rob-the-bank"
  params:
    security:
      type: array
      items:
        type: int
    time:
      type: int
  call:
    cpp: "Solution().goodDaysToRobBank({security}, {time})"
    rust: "Solution::good_days_to_rob_bank({security}, {time})"
    python3: "Solution().goodDaysToRobBank({security}, {time})"
    python2: "Solution().goodDaysToRobBank({security}, {time})"
    ruby: "good_days_to_rob_bank({security}, {time})"
    java: "new Solution().goodDaysToRobBank({security}, {time})"
    csharp: "new Solution().GoodDaysToRobBank({security}, {time})"
    kotlin: "Solution().goodDaysToRobBank({security}, {time})"
    go: "goodDaysToRobBank({security}, {time})"
    dart: "Solution().goodDaysToRobBank({security}, {time})"
    swift: "Solution().goodDaysToRobBank({security}, {time})"
    typescript: "goodDaysToRobBank({security}, {time})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().goodDaysToRobBank(security, time, {result})"
    checker: |
      class Checker:
          def goodDaysToRobBank(self, security, time, result):
              if not isinstance(result, list) or any(not isinstance(x, int) for x in result):
                  return False
              if len(result) != len(set(result)):
                  return False
              expected = []
              n = len(security)
              for i in range(n):
                  if i < time or i + time >= n:
                      continue
                  if all(security[j] >= security[j + 1] for j in range(i - time, i)) and all(security[j] <= security[j + 1] for j in range(i, i + time)):
                      expected.append(i)
              return sorted(result) == expected

seed: 2100

