entry:
  id: 2132
  title: "stamping-the-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
    stampHeight:
      type: int
    stampWidth:
      type: int
  call:
    python3: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    python2: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    cpp: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    rust: "Solution::possible_to_stamp({grid}, {stampHeight}, {stampWidth})"
    ruby: "possible_to_stamp({grid}, {stampHeight}, {stampWidth})"
    java: "new Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    csharp: "new Solution().PossibleToStamp({grid}, {stampHeight}, {stampWidth})"
    kotlin: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    go: "possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    dart: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    swift: "Solution().possibleToStamp({grid}, {stampHeight}, {stampWidth})"
    typescript: "possibleToStamp({grid}, {stampHeight}, {stampWidth})"

judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().possibleToStamp(grid, stampHeight, stampWidth, {result})"
    checker: |
      class Checker:
          def possibleToStamp(self, grid, H, W, result):
              if not isinstance(result, bool) or not grid or not grid[0]:
                  return False
              m, n = len(grid), len(grid[0])
              if any(not isinstance(row, list) or len(row) != n for row in grid):
                  return False
              ps = [[0] * (n + 1) for _ in range(m + 1)]
              for i in range(m):
                  for j in range(n):
                      ps[i + 1][j + 1] = grid[i][j] + ps[i][j + 1] + ps[i + 1][j] - ps[i][j]
              diff = [[0] * (n + 1) for _ in range(m + 1)]
              for i in range(m - H + 1):
                  for j in range(n - W + 1):
                      total = ps[i + H][j + W] - ps[i][j + W] - ps[i + H][j] + ps[i][j]
                      if total == 0:
                          diff[i][j] += 1
                          diff[i + H][j] -= 1
                          diff[i][j + W] -= 1
                          diff[i + H][j + W] += 1
              expected = True
              for i in range(m):
                  for j in range(n):
                      if i:
                          diff[i][j] += diff[i - 1][j]
                      if j:
                          diff[i][j] += diff[i][j - 1]
                      if i and j:
                          diff[i][j] -= diff[i - 1][j - 1]
                      if grid[i][j] == 0 and diff[i][j] <= 0:
                          expected = False
              
              return result == expected
seed: 2132
