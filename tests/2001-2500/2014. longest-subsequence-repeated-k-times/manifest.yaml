entry:
  id: 2014
  title: "longest-subsequence-repeated-k-times"
  params:
    s:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    rust: "Solution::longest_subsequence_repeated_k({s}, {k})"
    python3: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    python2: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    ruby: "longest_subsequence_repeated_k({s}, {k})"
    java: "new Solution().longestSubsequenceRepeatedK({s}, {k})"
    csharp: "new Solution().LongestSubsequenceRepeatedK({s}, {k})"
    kotlin: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    go: "longestSubsequenceRepeatedK({s}, {k})"
    dart: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    swift: "Solution().longestSubsequenceRepeatedK({s}, {k})"
    typescript: "longestSubsequenceRepeatedK({s}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().longestSubsequenceRepeatedK(s, k, {result})"
    checker: |
      class Checker:
          def longestSubsequenceRepeatedK(self, s, k, result):
              if not isinstance(result, str):
                  return False
              def repeated(candidate):
                  if not candidate:
                      return True
                  pos = 0
                  completed = 0
                  for ch in s:
                      if ch == candidate[pos]:
                          pos += 1
                          if pos == len(candidate):
                              pos = 0
                              completed += 1
                              if completed == k:
                                  return True
                  return False
              if not repeated(result):
                  return False
              best = result
              counts = {ch: s.count(ch) // k for ch in set(s)}
              limit = min(len(s) // k, 8)
              candidates = [""]
              best_candidate = ""
              for _ in range(limit):
                  candidates = [prefix + ch for prefix in candidates for ch in "abcdefghijklmnopqrstuvwxyz" if repeated(prefix + ch)]
                  if not candidates:
                      break
                  best_candidate = max(candidates, key=lambda x: (len(x), x))
              expected = best_candidate
              return result == expected

seed: 2014

