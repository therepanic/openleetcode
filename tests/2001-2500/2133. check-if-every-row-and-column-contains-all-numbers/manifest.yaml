entry:
  id: 2133
  title: "check-if-every-row-and-column-contains-all-numbers"
  params:
    matrix:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().checkValid({matrix})"
    rust: "Solution::check_valid({matrix})"
    python3: "Solution().checkValid({matrix})"
    python2: "Solution().checkValid({matrix})"
    ruby: "check_valid({matrix})"
    java: "new Solution().checkValid({matrix})"
    csharp: "new Solution().CheckValid({matrix})"
    kotlin: "Solution().checkValid({matrix})"
    go: "checkValid({matrix})"
    dart: "Solution().checkValid({matrix})"
    swift: "Solution().checkValid({matrix})"
    typescript: "checkValid({matrix})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().checkValid(matrix, {result})"
    checker: |
      class Checker:
          def checkValid(self, matrix, result):
              if not isinstance(result, bool):
                  return False
              n = len(matrix)
              expected = set(range(1, n + 1))
              valid = all(set(row) == expected for row in matrix)
              valid = valid and all(set(matrix[i][j] for i in range(n)) == expected for j in range(n))
              return result == valid

seed: 2133

tests:
