  title: "smallest-missing-genetic-value-in-each-subtree"
  params:
    parents:
      type: array
      items:
        type: int
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    rust: "Solution::smallest_missing_value_subtree({parents}, {nums})"
    python3: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    python2: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    ruby: "smallest_missing_value_subtree({parents}, {nums})"
    java: "new Solution().smallestMissingValueSubtree({parents}, {nums})"
    csharp: "new Solution().SmallestMissingValueSubtree({parents}, {nums})"
    kotlin: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    go: "smallestMissingValueSubtree({parents}, {nums})"
    dart: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    swift: "Solution().smallestMissingValueSubtree({parents}, {nums})"
    typescript: "smallestMissingValueSubtree({parents}, {nums})"
judge:
  type: exact
limits:
  time_ms: 2000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().check(parents, nums, {result})"
    checker: |
      class Checker:
          def check(self, parents, nums, result):
              n = len(parents)
              if not isinstance(result, list) or len(result) != n:
                  return False
              children = [[] for _ in range(n)]
              for i in range(1, n):
                  if not isinstance(parents[i], int) or parents[i] < 0 or parents[i] >= n:
                      return False
                  children[parents[i]].append(i)
              expected = [1] * n
              def visit(v):
                  values = {nums[v]}
                  for child in children[v]:
                      values.update(visit(child))
                  missing = 1
                  while missing in values:
                      missing += 1
                  expected[v] = missing
                  return values
              visit(0)
              return result == expected
seed: 2003
