entry:
  id: 2029
  title: "stone-game-ix"
  params:
    stones:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().stoneGameIX({stones})"
    rust: "Solution::stone_game_ix({stones})"
    python3: "Solution().stoneGameIX({stones})"
    python2: "Solution().stoneGameIX({stones})"
    ruby: "stone_game_ix({stones})"
    java: "new Solution().stoneGameIX({stones})"
    csharp: "new Solution().StoneGameIX({stones})"
    kotlin: "Solution().stoneGameIX({stones})"
    go: "stoneGameIX({stones})"
    dart: "Solution().stoneGameIX({stones})"
    swift: "Solution().stoneGameIX({stones})"
    typescript: "stoneGameIX({stones})"

judge:
  type: "exact"

limits:
  time_ms: 300
  memory_mb: 300

oracle:
  python3:
    call: "Checker().stoneGameIX(stones, {result})"
    checker: |
      class Checker:
          def stoneGameIX(self, stones, result):
              if not isinstance(result, bool) or not isinstance(stones, list):
                  return False
              counts = [0, 0, 0]
              for value in stones:
                  if not isinstance(value, int) or isinstance(value, bool) or value < 1 or value > 10000:
                      return False
                  counts[value % 3] += 1
              expected = (abs(counts[1] - counts[2]) >= 3
                          if counts[0] % 2
                          else min(counts[1], counts[2]) >= 1)
              return result is expected

seed: 20292029

