entry:
  id: 2105
  title: "watering-plants-ii"
  params:
    plants:
      type: array
      items:
        type: int
    capacityA:
      type: int
    capacityB:
      type: int
  call:
    cpp: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    rust: "Solution::minimum_refill({plants}, {capacityA}, {capacityB})"
    python3: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    python2: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    ruby: "minimum_refill({plants}, {capacityA}, {capacityB})"
    java: "new Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    csharp: "new Solution().MinimumRefill({plants}, {capacityA}, {capacityB})"
    kotlin: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    go: "minimumRefill({plants}, {capacityA}, {capacityB})"
    dart: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    swift: "Solution().minimumRefill({plants}, {capacityA}, {capacityB})"
    typescript: "minimumRefill({plants}, {capacityA}, {capacityB})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumRefill(plants, capacityA, capacityB, {result})"
    checker: |
      class Checker:
          def minimumRefill(self, plants, capacityA, capacityB, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              left, right = 0, len(plants) - 1
              water_a, water_b = capacityA, capacityB
              expected = 0
              while left < right:
                  if water_a < plants[left]:
                      expected += 1
                      water_a = capacityA
                  water_a -= plants[left]
                  if water_b < plants[right]:
                      expected += 1
                      water_b = capacityB
                  water_b -= plants[right]
                  left += 1
                  right -= 1
              if left == right and max(water_a, water_b) < plants[left]:
                  expected += 1
              return result == expected

