entry:
  id: 2138
  title: "divide-a-string-into-groups-of-size-k"
  params:
    s:
      type: string
    k:
      type: int
    fill:
      type: char
  call:
    cpp: "Solution().divideString({s}, {k}, {fill})"
    rust: "Solution::divide_string({s}, {k}, {fill})"
    python3: "Solution().divideString({s}, {k}, {fill})"
    python2: "Solution().divideString({s}, {k}, {fill})"
    ruby: "divide_string({s}, {k}, {fill})"
    java: "new Solution().divideString({s}, {k}, {fill})"
    csharp: "new Solution().DivideString({s}, {k}, {fill})"
    kotlin: "Solution().divideString({s}, {k}, {fill})"
    go: "divideString({s}, {k}, {fill})"
    dart: "Solution().divideString({s}, {k}, {fill})"
    swift: "Solution().divideString({s}, {k}, {fill})"
    typescript: "divideString({s}, {k}, {fill})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().divideString(s, k, fill, {result})"
    checker: |
      class Checker:
          def divideString(self, s, k, fill, result):
              if not isinstance(result, list) or not result:
                  return False
              expected_count = (len(s) + k - 1) // k
              if len(result) != expected_count:
                  return False
              for i, group in enumerate(result):
                  if not isinstance(group, str) or len(group) != k:
                      return False
                  start = i * k
                  expected = s[start:start + k]
                  if len(expected) < k:
                      expected += fill * (k - len(expected))
                  if group != expected:
                      return False
              return ''.join(result)[:len(s)] == s

seed: 2138

