entry:
  id: 2089
  title: "find-target-indices-after-sorting-array"
  params:
    nums:
      type: array
      items:
        type: int
    target:
      type: int
  call:
    cpp: "Solution().targetIndices({nums}, {target})"
    rust: "Solution::target_indices({nums}, {target})"
    python3: "Solution().targetIndices({nums}, {target})"
    python2: "Solution().targetIndices({nums}, {target})"
    ruby: "target_indices({nums}, {target})"
    java: "new Solution().targetIndices({nums}, {target})"
    csharp: "new Solution().TargetIndices({nums}, {target})"
    kotlin: "Solution().targetIndices({nums}, {target})"
    go: "targetIndices({nums}, {target})"
    dart: "Solution().targetIndices({nums}, {target})"
    swift: "Solution().targetIndices({nums}, {target})"
    typescript: "targetIndices({nums}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().targetIndices(nums, target, {result})"
    checker: |
      class Checker:
          def targetIndices(self, nums, target, result):
              if not isinstance(result, list) or any(isinstance(x, bool) or not isinstance(x, int) for x in result):
                  return False
              start = sum(x < target for x in nums)
              count = sum(x == target for x in nums)
              return result == list(range(start, start + count))

seed: 2089

