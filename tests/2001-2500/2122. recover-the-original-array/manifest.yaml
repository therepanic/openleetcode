entry:
  id: 2122
  title: "recover-the-original-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().recoverArray({nums})"
    rust: "Solution::recover_array({nums})"
    python3: "Solution().recoverArray({nums})"
    python2: "Solution().recoverArray({nums})"
    ruby: "recover_array({nums})"
    java: "new Solution().recoverArray({nums})"
    csharp: "new Solution().RecoverArray({nums})"
    kotlin: "Solution().recoverArray({nums})"
    go: "recoverArray({nums})"
    dart: "Solution().recoverArray({nums})"
    swift: "Solution().recoverArray({nums})"
    typescript: "recoverArray({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().recoverArray(nums, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def recoverArray(self, nums, result):
              if not isinstance(result, list) or len(result) * 2 != len(nums):
                  return False
              if any(not isinstance(x, int) or x <= 0 for x in result):
                  return False
              source = Counter(nums)
              minimum = min(nums)
              candidates = {(value - minimum) // 2 for value in nums
                            if value > minimum and (value - minimum) % 2 == 0}
              for k in candidates:
                  if k <= 0:
                      continue
                  produced = Counter()
                  for value in result:
                      if value - k < 1:
                          break
                      produced[value - k] += 1
                      produced[value + k] += 1
                  else:
                      if produced == source:
                          return True
              return False

