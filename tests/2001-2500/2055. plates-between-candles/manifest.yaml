entry:
  id: 2055
  title: "plates-between-candles"
  params:
    s:
      type: string
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().platesBetweenCandles({s}, {queries})"
    rust: "Solution::plates_between_candles({s}, {queries})"
    python3: "Solution().platesBetweenCandles({s}, {queries})"
    python2: "Solution().platesBetweenCandles({s}, {queries})"
    ruby: "plates_between_candles({s}, {queries})"
    java: "new Solution().platesBetweenCandles({s}, {queries})"
    csharp: "new Solution().PlatesBetweenCandles({s}, {queries})"
    kotlin: "Solution().platesBetweenCandles({s}, {queries})"
    go: "platesBetweenCandles({s}, {queries})"
    dart: "Solution().platesBetweenCandles({s}, {queries})"
    swift: "Solution().platesBetweenCandles({s}, {queries})"
    typescript: "platesBetweenCandles({s}, {queries})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 512

oracle:
  python3:
    call: "Checker().platesBetweenCandles(s, queries, {result})"
    checker: |
      class Checker:
          def platesBetweenCandles(self, s, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              expected = []
              for left, right in queries:
                  candles = [i for i in range(left, right + 1) if s[i] == '|']
                  if len(candles) < 2:
                      expected.append(0)
                  else:
                      expected.append(sum(1 for ch in s[candles[0] + 1:candles[-1]] if ch == '*'))
              return result == expected

seed: 2055

tests:
  - name: "example_one"
    in:
      s: "**|**|***|"
      queries: [[2, 5], [5, 9]]
    out: [2, 3]
  - name: "example_two"
