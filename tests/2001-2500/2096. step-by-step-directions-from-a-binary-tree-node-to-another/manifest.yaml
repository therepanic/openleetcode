entry:
  id: 2096
  title: "step-by-step-directions-from-a-binary-tree-node-to-another"
  params:
    root:
      type: tree_node
    start:
      type: int
    dest:
      type: int
  call:
    cpp: "Solution().getDirections({root}, {start}, {dest})"
    rust: "Solution::get_directions({root}, {start}, {dest})"
    python3: "Solution().getDirections({root}, {start}, {dest})"
    python2: "Solution().getDirections({root}, {start}, {dest})"
    ruby: "get_directions({root}, {start}, {dest})"
    java: "new Solution().getDirections({root}, {start}, {dest})"
    csharp: "new Solution().GetDirections({root}, {start}, {dest})"
    kotlin: "Solution().getDirections({root}, {start}, {dest})"
    go: "getDirections({root}, {start}, {dest})"
    dart: "Solution().getDirections({root}, {start}, {dest})"
    swift: "Solution().getDirections({root}, {start}, {dest})"
    typescript: "getDirections({root}, {start}, {dest})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().getDirections(root, start, dest, {result})"
    checker: |
      class Checker:
          def getDirections(self, root, start, dest, result):
              if not isinstance(result, str) or any(ch not in 'LRU' for ch in result):
                  return False
              parent = {}
              move = {}
              stack = [root]
              while stack:
                  node = stack.pop()
                  if node is None:
                      continue
                  if node.left is not None:
                      parent[node.left.val] = node.val
                      move[node.left.val] = 'L'
                      stack.append(node.left)
                  if node.right is not None:
                      parent[node.right.val] = node.val
                      move[node.right.val] = 'R'
                      stack.append(node.right)
              paths = {}
              node = start
              paths[node] = ''
              while node in parent:
                  paths[parent[node]] = paths[node] + 'U'
                  node = parent[node]
              node = dest
              down = ''
              while node not in paths:
                  down = move[node] + down
                  node = parent[node]
              return result == paths[node] + down

seed: 2096001

