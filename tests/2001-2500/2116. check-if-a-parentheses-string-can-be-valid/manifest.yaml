entry:
  id: 2116
  title: "check-if-a-parentheses-string-can-be-valid"
  params:
    s:
      type: string
    locked:
      type: string
  call:
    cpp: "Solution().canBeValid({s}, {locked})"
    rust: "Solution::can_be_valid({s}, {locked})"
    python3: "Solution().canBeValid({s}, {locked})"
    python2: "Solution().canBeValid({s}, {locked})"
    ruby: "can_be_valid({s}, {locked})"
    java: "new Solution().canBeValid({s}, {locked})"
    csharp: "new Solution().CanBeValid({s}, {locked})"
    kotlin: "Solution().canBeValid({s}, {locked})"
    go: "canBeValid({s}, {locked})"
    dart: "Solution().canBeValid({s}, {locked})"
    swift: "Solution().canBeValid({s}, {locked})"
    typescript: "canBeValid({s}, {locked})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().canBeValid(s, locked, {result})"
    checker: |
      class Checker:
          def canBeValid(self, s, locked, result):
              if not isinstance(result, bool) or len(s) != len(locked) or len(s) % 2:
                  return False
              lo = hi = 0
              for ch, flag in zip(s, locked):
                  if flag == '0':
                      lo -= 1
                      hi += 1
                  elif ch == '(':
                      lo += 1
                      hi += 1
                  else:
                      lo -= 1
                      hi -= 1
                  if hi < 0:
                      return False
                  lo = max(lo, 0)
              return result == (lo == 0)

