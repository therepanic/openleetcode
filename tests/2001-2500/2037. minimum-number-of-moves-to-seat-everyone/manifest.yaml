entry:
  id: 2037
  title: "minimum-number-of-moves-to-seat-everyone"
  params:
    seats:
      type: array
      items:
        type: int
    students:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minMovesToSeat({seats}, {students})"
    rust: "Solution::min_moves_to_seat({seats}, {students})"
    python3: "Solution().minMovesToSeat({seats}, {students})"
    python2: "Solution().minMovesToSeat({seats}, {students})"
    ruby: "min_moves_to_seat({seats}, {students})"
    java: "new Solution().minMovesToSeat({seats}, {students})"
    csharp: "new Solution().MinMovesToSeat({seats}, {students})"
    kotlin: "Solution().minMovesToSeat({seats}, {students})"
    go: "minMovesToSeat({seats}, {students})"
    dart: "Solution().minMovesToSeat({seats}, {students})"
    swift: "Solution().minMovesToSeat({seats}, {students})"
    typescript: "minMovesToSeat({seats}, {students})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minMovesToSeat(seats, students, {result})"
    checker: |
      class Checker:
          def minMovesToSeat(self, seats, students, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              return result == sum(abs(a - b) for a, b in zip(sorted(seats), sorted(students)))

seed: 2037

