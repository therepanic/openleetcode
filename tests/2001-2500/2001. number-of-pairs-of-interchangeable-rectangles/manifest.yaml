entry:
  id: 2001
  title: "number-of-pairs-of-interchangeable-rectangles"
  params:
    rectangles:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().interchangeableRectangles({rectangles})"
    rust: "Solution::interchangeable_rectangles({rectangles})"
    python3: "Solution().interchangeableRectangles({rectangles})"
    python2: "Solution().interchangeableRectangles({rectangles})"
    ruby: "interchangeable_rectangles({rectangles})"
    java: "new Solution().interchangeableRectangles({rectangles})"
    csharp: "new Solution().InterchangeableRectangles({rectangles})"
    kotlin: "Solution().interchangeableRectangles({rectangles})"
    go: "interchangeableRectangles({rectangles})"
    dart: "Solution().interchangeableRectangles({rectangles})"
    swift: "Solution().interchangeableRectangles({rectangles})"
    typescript: "interchangeableRectangles({rectangles})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().interchangeableRectangles(rectangles, {result})"
    checker: |
      from collections import defaultdict
      from math import gcd

      class Checker:
          def interchangeableRectangles(self, rectangles, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = defaultdict(int)
              expected = 0
              for pair in rectangles:
                  if not isinstance(pair, list) or len(pair) != 2:
                      return False
                  w, h = pair
                  if not isinstance(w, int) or not isinstance(h, int) or w <= 0 or h <= 0:
                      return False
                  g = gcd(w, h)
                  key = (w // g, h // g)
                  expected += counts[key]
                  counts[key] += 1
              return result == expected

seed: 2001

