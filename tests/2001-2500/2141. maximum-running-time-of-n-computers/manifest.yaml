entry:
  id: 2141
  title: "maximum-running-time-of-n-computers"
  params:
    n:
      type: int
    batteries:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxRunTime({n}, {batteries})"
    rust: "Solution::max_run_time({n}, {batteries})"
    python3: "Solution().maxRunTime({n}, {batteries})"
    python2: "Solution().maxRunTime({n}, {batteries})"
    ruby: "max_run_time({n}, {batteries})"
    java: "new Solution().maxRunTime({n}, {batteries})"
    csharp: "new Solution().MaxRunTime({n}, {batteries})"
    kotlin: "Solution().maxRunTime({n}, {batteries})"
    go: "maxRunTime({n}, {batteries})"
    dart: "Solution().maxRunTime({n}, {batteries})"
    swift: "Solution().maxRunTime({n}, {batteries})"
    typescript: "maxRunTime({n}, {batteries})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxRunTime(n, batteries, {result})"
    checker: |
      class Checker:
          def maxRunTime(self, n, batteries, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if n < 1 or len(batteries) < n or any(x < 1 for x in batteries):
                  return False
              total = sum(batteries)
              lo, hi = 0, total // n
              while lo < hi:
                  mid = (lo + hi + 1) // 2
                  usable = sum(x if x < mid else mid for x in batteries)
                  if usable // n >= mid:
                      lo = mid
                  else:
                      hi = mid - 1
              return result == lo

