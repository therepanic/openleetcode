entry:
  id: 2095
  title: "delete-the-middle-node-of-a-linked-list"
  params:
    head:
      type: list_node
  call:
    cpp: "listNodeToArray(Solution().deleteMiddle({head}))"
    rust: "ListNode::list_node_to_array(Solution::delete_middle({head}))"
    python3: "list_node_to_array(Solution().deleteMiddle({head}))"
    python2: "list_node_to_array(Solution().deleteMiddle({head}))"
    ruby: "list_node_to_array(delete_middle({head}))"
    java: "ListNode.listNodeToArray(new Solution().deleteMiddle({head}))"
    csharp: "ListNode.ListNodeToArray(new Solution().DeleteMiddle({head}))"
    kotlin: "listNodeToArray(Solution().deleteMiddle({head}))"
    go: "listNodeToArray(deleteMiddle({head}))"
    dart: "list_node_to_array(Solution().deleteMiddle({head}))"
    swift: "list_node_to_array(Solution().deleteMiddle({head}))"
    typescript: "listNodeToArray(deleteMiddle({head}))"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().deleteMiddle(head, {result})"
    checker: |
      class Checker:
          def deleteMiddle(self, head, result):
              if not isinstance(head, list) or not isinstance(result, list):
                  return False
              if len(head) < 1 or len(result) != len(head) - 1:
                  return False
              middle = len(head) // 2
              return result == head[:middle] + head[middle + 1:]

seed: 2095

