entry:
  id: 2057
  title: "smallest-index-with-equal-value"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().smallestEqual({nums})"
    rust: "Solution::smallest_equal({nums})"
    python3: "Solution().smallestEqual({nums})"
    python2: "Solution().smallestEqual({nums})"
    ruby: "smallest_equal({nums})"
    java: "new Solution().smallestEqual({nums})"
    csharp: "new Solution().SmallestEqual({nums})"
    kotlin: "Solution().smallestEqual({nums})"
    go: "smallestEqual({nums})"
    dart: "Solution().smallestEqual({nums})"
    swift: "Solution().smallestEqual({nums})"
    typescript: "smallestEqual({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().smallestEqual(nums, {result})"
    checker: |
      class Checker:
          def smallestEqual(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = -1
              for i, value in enumerate(nums):
                  if i % 10 == value:
                      expected = i
                      break
              return result == expected

seed: 2057

