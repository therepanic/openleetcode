entry:
  id: 2146
  title: "k-highest-ranked-items-within-a-price-range"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
    pricing:
      type: array
      items:
        type: int
    start:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    rust: "Solution::highest_ranked_k_items({grid}, {pricing}, {start}, {k})"
    python3: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    python2: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    ruby: "highest_ranked_k_items({grid}, {pricing}, {start}, {k})"
    java: "new Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    csharp: "new Solution().HighestRankedKItems({grid}, {pricing}, {start}, {k})"
    kotlin: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    go: "highestRankedKItems({grid}, {pricing}, {start}, {k})"
    dart: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    swift: "Solution().highestRankedKItems({grid}, {pricing}, {start}, {k})"
    typescript: "highestRankedKItems({grid}, {pricing}, {start}, {k})"
judge:
  type: exact
limits:
  time_ms: 1000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().highestRankedKItems(grid, pricing, start, k, {result})"
    checker: |
      from collections import deque
      class Checker:
          def highestRankedKItems(self, grid, pricing, start, k, result):
              m, n = len(grid), len(grid[0])
              low, high = pricing
              sr, sc = start
              q = deque([(sr, sc, 0)])
              seen = {(sr, sc)}
              ranked = []
              while q:
                  r, c, d = q.popleft()
                  v = grid[r][c]
                  if low <= v <= high:
                      ranked.append((d, v, r, c))
                  for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                      nr, nc = r + dr, c + dc
                      if 0 <= nr < m and 0 <= nc < n and (nr, nc) not in seen and grid[nr][nc] != 0:
                          seen.add((nr, nc))
                          q.append((nr, nc, d + 1))
              expected = [[r, c] for _, _, r, c in sorted(ranked)[:k]]
              return result == expected
seed: 2146
