entry:
  id: 2108
  title: "find-first-palindromic-string-in-the-array"
  params:
    words:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().firstPalindrome({words})"
    rust: "Solution::first_palindrome({words})"
    python3: "Solution().firstPalindrome({words})"
    python2: "Solution().firstPalindrome({words})"
    ruby: "first_palindrome({words})"
    java: "new Solution().firstPalindrome({words})"
    csharp: "new Solution().FirstPalindrome({words})"
    kotlin: "Solution().firstPalindrome({words})"
    go: "firstPalindrome({words})"
    dart: "Solution().firstPalindrome({words})"
    swift: "Solution().firstPalindrome({words})"
    typescript: "firstPalindrome({words})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().firstPalindrome(words, {result})"
    checker: |
      class Checker:
          def firstPalindrome(self, words, result):
              expected = ""
              for word in words:
                  if word == word[::-1]:
                      expected = word
                      break
              return isinstance(result, str) and result == expected

seed: 2108

tests:
  - name: "example_first_middle"
    in:
      words: ["abc", "car", "ada", "racecar", "cool"]
    out: "ada"
  - name: "example_only_palindrome"
    in:
      words: ["notapalindrome", "racecar"]
    out: "racecar"
  - name: "example_none"
    in:
      words: ["def", "ghi"]
    out: ""
  - name: "single_character"
    in:
      words: ["a"]
    out: "a"
  - name: "single_nonpalindrome"
