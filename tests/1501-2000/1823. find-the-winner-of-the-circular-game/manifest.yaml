judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findTheWinner(n, k, {result})"
    checker: |
      class Checker:
          def findTheWinner(self, n, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              winner = 0
              for size in range(2, n + 1):
                  winner = (winner + k) % size
              return result == winner + 1

