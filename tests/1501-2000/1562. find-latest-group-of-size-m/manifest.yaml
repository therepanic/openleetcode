entry:
  id: 1562
  title: "find-latest-group-of-size-m"
  params:
    arr:
      type: array
      items:
        type: int
    m:
      type: int
  call:
    cpp: "Solution().findLatestStep({arr}, {m})"
    rust: "Solution::find_latest_step({arr}, {m})"
    python3: "Solution().findLatestStep({arr}, {m})"
    python2: "Solution().findLatestStep({arr}, {m})"
    ruby: "find_latest_step({arr}, {m})"
    java: "new Solution().findLatestStep({arr}, {m})"
    csharp: "new Solution().FindLatestStep({arr}, {m})"
    kotlin: "Solution().findLatestStep({arr}, {m})"
    go: "findLatestStep({arr}, {m})"
    dart: "Solution().findLatestStep({arr}, {m})"
    swift: "Solution().findLatestStep({arr}, {m})"
    typescript: "findLatestStep({arr}, {m})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findLatestStep(arr, m, {result})"
    checker: |
      class Checker:
          def findLatestStep(self, arr, m, result):
              n = len(arr)
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if m == n:
                  return result == n
              lengths = [0] * (n + 2)
              latest = -1
              for step, position in enumerate(arr):
                  left = lengths[position - 1]
                  right = lengths[position + 1]
                  if left == m or right == m:
                      latest = step
                  length = left + right + 1
                  lengths[position - left] = length
                  lengths[position + right] = length
              return result == latest

seed: 1562

