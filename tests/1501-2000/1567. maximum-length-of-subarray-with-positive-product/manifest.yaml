entry:
  id: 1567
  title: "maximum-length-of-subarray-with-positive-product"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getMaxLen({nums})"
    rust: "Solution::get_max_len({nums})"
    python3: "Solution().getMaxLen({nums})"
    python2: "Solution().getMaxLen({nums})"
    ruby: "get_max_len({nums})"
    java: "new Solution().getMaxLen({nums})"
    csharp: "new Solution().GetMaxLen({nums})"
    kotlin: "Solution().getMaxLen({nums})"
    go: "getMaxLen({nums})"
    dart: "Solution().getMaxLen({nums})"
    swift: "Solution().getMaxLen({nums})"
    typescript: "getMaxLen({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getMaxLen(nums, {result})"
    checker: |
      class Checker:
          def getMaxLen(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              pos = neg = best = 0
              for value in nums:
                  if value == 0:
                      pos = neg = 0
                  elif value > 0:
                      pos += 1
                      neg = neg + 1 if neg else 0
                  else:
                      old_pos = pos
                      pos = neg + 1 if neg else 0
                      neg = old_pos + 1
                  best = max(best, pos)
              return result == best

seed: 1567

