entry:
  id: 1979
  title: "find-greatest-common-divisor-of-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findGCD({nums})"
    rust: "Solution::find_gcd({nums})"
    python3: "Solution().findGCD({nums})"
    python2: "Solution().findGCD({nums})"
    ruby: "find_gcd({nums})"
    java: "new Solution().findGCD({nums})"
    csharp: "new Solution().FindGCD({nums})"
    kotlin: "Solution().findGCD({nums})"
    go: "findGCD({nums})"
    dart: "Solution().findGCD({nums})"
    swift: "Solution().findGCD({nums})"
    typescript: "findGCD({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findGCD(nums, {result})"
    checker: |
      from math import gcd

      class Checker:
          def findGCD(self, nums, result):
              if not isinstance(nums, list) or len(nums) < 2:
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or x < 1 or x > 1000 for x in nums):
                  return False
              return isinstance(result, int) and not isinstance(result, bool) and result == gcd(min(nums), max(nums))

seed: 1979

