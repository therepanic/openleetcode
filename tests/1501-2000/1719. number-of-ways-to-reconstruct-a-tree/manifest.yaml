entry:
  id: 1719
  title: "number-of-ways-to-reconstruct-a-tree"
  params:
    pairs:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().checkWays({pairs})"
    rust: "Solution::check_ways({pairs})"
    python3: "Solution().checkWays({pairs})"
    python2: "Solution().checkWays({pairs})"
    ruby: "check_ways({pairs})"
    java: "new Solution().checkWays({pairs})"
    csharp: "new Solution().CheckWays({pairs})"
    kotlin: "Solution().checkWays({pairs})"
    go: "checkWays({pairs})"
    dart: "Solution().checkWays({pairs})"
    swift: "Solution().checkWays({pairs})"
    typescript: "checkWays({pairs})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().checkWays(pairs, {result})"
    checker: |
      class Checker:
          def checkWays(self, pairs, result):
              if not isinstance(result, int) or result not in (0, 1, 2):
                  return False
              graph = {}
              for edge in pairs:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  x, y = edge
                  if not isinstance(x, int) or not isinstance(y, int) or x == y:
                      return False
                  graph.setdefault(x, set()).add(y)
                  graph.setdefault(y, set()).add(x)
              if not graph:
                  return result == 0
              root = max(graph, key=lambda node: len(graph[node]))
              if len(graph[root]) != len(graph) - 1:
                  return result == 0
              answer = 1
              for node, neighbors in graph.items():
                  if node == root:
                      continue
                  candidates = [candidate for candidate in neighbors
                                if len(graph[candidate]) >= len(neighbors)]
                  if not candidates:
                      return result == 0
                  parent = min(candidates, key=lambda candidate: len(graph[candidate]))
                  if neighbors - (graph[parent] | {parent}):
                      return result == 0
                  if len(neighbors) == len(graph[parent]):
                      answer = 2
              return result == answer

seed: 1719

