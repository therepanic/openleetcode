entry:
  id: 1736
  title: "latest-time-by-replacing-hidden-digits"
  params:
    time:
      type: string
  call:
    cpp: "Solution().maximumTime({time})"
    rust: "Solution::maximum_time({time})"
    python3: "Solution().maximumTime({time})"
    python2: "Solution().maximumTime({time})"
    ruby: "maximum_time({time})"
    java: "new Solution().maximumTime({time})"
    csharp: "new Solution().MaximumTime({time})"
    kotlin: "Solution().maximumTime({time})"
    go: "maximumTime({time})"
    dart: "Solution().maximumTime({time})"
    swift: "Solution().maximumTime({time})"
    typescript: "maximumTime({time})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(time, {result})"
    checker: |
      class Checker:
          def check(self, time, result):
              best = None
              for hour in range(24):
                  for minute in range(60):
                      candidate = f"{hour:02d}:{minute:02d}"
                      if all(a == '?' or a == b for a, b in zip(time, candidate)):
                          best = candidate
              return result == best

seed: 1736

