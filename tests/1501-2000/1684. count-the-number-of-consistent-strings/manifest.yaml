entry:
  id: 1684
  title: count-the-number-of-consistent-strings
  params:
    allowed:
      type: string
    words:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().countConsistentStrings({allowed}, {words})"
    rust: "Solution::count_consistent_strings({allowed}, {words})"
    python3: "Solution().countConsistentStrings({allowed}, {words})"
    python2: "Solution().countConsistentStrings({allowed}, {words})"
    ruby: "count_consistent_strings({allowed}, {words})"
    java: "new Solution().countConsistentStrings({allowed}, {words})"
    csharp: "new Solution().CountConsistentStrings({allowed}, {words})"
    kotlin: "Solution().countConsistentStrings({allowed}, {words})"
    go: "countConsistentStrings({allowed}, {words})"
    dart: "Solution().countConsistentStrings({allowed}, {words})"
    swift: "Solution().countConsistentStrings({allowed}, {words})"
    typescript: "countConsistentStrings({allowed}, {words})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countConsistentStrings(allowed, words, {result})"
    checker: |
      class Checker:
          def countConsistentStrings(self, allowed, words, result):
              if not isinstance(allowed, str) or not isinstance(words, list):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if len(allowed) < 1 or len(allowed) > 26 or len(set(allowed)) != len(allowed):
                  return False
              if any(c < 'a' or c > 'z' for c in allowed):
                  return False
              if len(words) < 1 or len(words) > 10000:
                  return False
              if any(not isinstance(word, str) or len(word) < 1 or len(word) > 10 for word in words):
                  return False
              if any(any(c < 'a' or c > 'z' for c in word) for word in words):
                  return False
              expected = sum(1 for word in words if all(c in allowed for c in word))
              return result == expected

seed: 1684

tests:
  - name: example-one
    in:
      allowed: "ab"
      words: ["ad", "bd", "aaab", "baa", "badab"]
    out: 2
  - name: example-two-all-consistent
    in:
      allowed: "abc"
      words: ["a", "b", "c", "ab", "ac", "bc", "abc"]
    out: 7
  - name: example-three
    in:
      allowed: "cad"
      words: ["cc", "acd", "b", "ba", "bac", "bad", "ac", "d"]
    out: 4
  - name: one-letter-allowed
    in:
      allowed: "a"
      words: ["a", "aa", "b", "ab", "aaa"]
    out: 3
  - name: all-letters-allowed
    in:
      allowed: "abcdefghijklmnopqrstuvwxyz"
      words: ["a", "z", "hello", "leetcode", "abcxyz"]
    out: 5
  - name: no-word-consistent
    in:
      allowed: "xyz"
      words: ["a", "ab", "hello", "world"]
    out: 0
  - name: all-words-identical
    in:
      allowed: "abc"
      words: ["abc", "abc", "abc", "abc"]
    out: 4
  - name: repeated-characters
