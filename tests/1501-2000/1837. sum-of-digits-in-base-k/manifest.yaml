entry:
  id: 1837
  title: "sum-of-digits-in-base-k"
  params:
    n:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().sumBase({n}, {k})"
    rust: "Solution::sum_base({n}, {k})"
    python3: "Solution().sumBase({n}, {k})"
    python2: "Solution().sumBase({n}, {k})"
    ruby: "sum_base({n}, {k})"
    java: "new Solution().sumBase({n}, {k})"
    csharp: "new Solution().SumBase({n}, {k})"
    kotlin: "Solution().sumBase({n}, {k})"
    go: "sumBase({n}, {k})"
    dart: "Solution().sumBase({n}, {k})"
    swift: "Solution().sumBase({n}, {k})"
    typescript: "sumBase({n}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().sumBase(n, k, {result})"
    checker: |
      class Checker:
          def sumBase(self, n, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = 0
              value = n
              while value > 0:
                  total += value % k
                  value //= k
              return result == total

