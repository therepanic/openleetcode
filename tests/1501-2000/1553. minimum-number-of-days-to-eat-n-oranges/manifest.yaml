entry:
  id: 1553
  title: "minimum-number-of-days-to-eat-n-oranges"
  params:
    n:
      type: int
  call:
    cpp: "Solution().minDays({n})"
    rust: "Solution::min_days({n})"
    python3: "Solution().minDays({n})"
    python2: "Solution().minDays({n})"
    ruby: "min_days({n})"
    java: "new Solution().minDays({n})"
    csharp: "new Solution().MinDays({n})"
    kotlin: "Solution().minDays({n})"
    go: "minDays({n})"
    dart: "Solution().minDays({n})"
    swift: "Solution().minDays({n})"
    typescript: "minDays({n})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minDays(n, {result})"
    checker: |
      from functools import lru_cache

      class Checker:
          def minDays(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False

              @lru_cache(None)
              def best(x):
                  if x <= 1:
                      return x
                  return 1 + min(x % 2 + best(x // 2), x % 3 + best(x // 3))

              return result == best(n)

seed: 1553

