entry:
  id: 1743
  title: "restore-the-array-from-adjacent-pairs"
  params:
    adjacentPairs:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().restoreArray({adjacentPairs})"
    rust: "Solution::restore_array({adjacentPairs})"
    python3: "Solution().restoreArray({adjacentPairs})"
    python2: "Solution().restoreArray({adjacentPairs})"
    ruby: "restore_array({adjacentPairs})"
    java: "new Solution().restoreArray({adjacentPairs})"
    csharp: "new Solution().RestoreArray({adjacentPairs})"
    kotlin: "Solution().restoreArray({adjacentPairs})"
    go: "restoreArray({adjacentPairs})"
    dart: "Solution().restoreArray({adjacentPairs})"
    swift: "Solution().restoreArray({adjacentPairs})"
    typescript: "restoreArray({adjacentPairs})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(adjacentPairs, {result})"
    checker: |
      class Checker:
          def check(self, adjacentPairs, result):
              if not isinstance(result, list):
                  return False
              if len(result) != len(adjacentPairs) + 1:
                  return False
              if len(set(result)) != len(result):
                  return False
              expected = {}
              for pair in adjacentPairs:
                  if not isinstance(pair, list) or len(pair) != 2:
                      return False
                  a, b = pair
                  expected.setdefault(frozenset((a, b)), 0)
                  expected[frozenset((a, b))] += 1
              actual = {}
              for i in range(1, len(result)):
                  key = frozenset((result[i - 1], result[i]))
                  actual[key] = actual.get(key, 0) + 1
              return actual == expected

