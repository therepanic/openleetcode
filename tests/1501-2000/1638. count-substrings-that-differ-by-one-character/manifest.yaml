entry:
  id: 1638
  title: "count-substrings-that-differ-by-one-character"
  params:
    s:
      type: string
    t:
      type: string
  call:
    cpp: "Solution().countSubstrings({s}, {t})"
    rust: "Solution::count_substrings({s}, {t})"
    python3: "Solution().countSubstrings({s}, {t})"
    python2: "Solution().countSubstrings({s}, {t})"
    ruby: "count_substrings({s}, {t})"
    java: "new Solution().countSubstrings({s}, {t})"
    csharp: "new Solution().CountSubstrings({s}, {t})"
    kotlin: "Solution().countSubstrings({s}, {t})"
    go: "countSubstrings({s}, {t})"
    dart: "Solution().countSubstrings({s}, {t})"
    swift: "Solution().countSubstrings({s}, {t})"
    typescript: "countSubstrings({s}, {t})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countSubstrings(s, t, {result})"
    checker: |
      class Checker:
          def countSubstrings(self, s, t, result):
              expected = 0
              for i in range(len(s)):
                  for j in range(len(t)):
                      differences = 0
                      k = 0
                      while i + k < len(s) and j + k < len(t):
                          if s[i + k] != t[j + k]:
                              differences += 1
                          if differences > 1:
                              break
                          if differences == 1:
                              expected += 1
                          k += 1
              return isinstance(result, int) and not isinstance(result, bool) and result == expected

