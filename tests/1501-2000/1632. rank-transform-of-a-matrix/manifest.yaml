entry:
  id: 1632
  title: "rank-transform-of-a-matrix"
  params:
    matrix:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().matrixRankTransform({matrix})"
    rust: "Solution::matrix_rank_transform({matrix})"
    python3: "Solution().matrixRankTransform({matrix})"
    python2: "Solution().matrixRankTransform({matrix})"
    ruby: "matrix_rank_transform({matrix})"
    java: "new Solution().matrixRankTransform({matrix})"
    csharp: "new Solution().MatrixRankTransform({matrix})"
    kotlin: "Solution().matrixRankTransform({matrix})"
    go: "matrixRankTransform({matrix})"
    dart: "Solution().matrixRankTransform({matrix})"
    swift: "Solution().matrixRankTransform({matrix})"
    typescript: "matrixRankTransform({matrix})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().matrixRankTransform(matrix, {result})"
    checker: |
      class Checker:
          def matrixRankTransform(self, matrix, result):
              if not isinstance(result, list) or len(result) != len(matrix):
                  return False
              if not matrix or not isinstance(result[0], list):
                  return False
              m, n = len(matrix), len(matrix[0])
              if n == 0 or any(not isinstance(row, list) or len(row) != n for row in matrix):
                  return False
              if any(not isinstance(row, list) or len(row) != n for row in result):
                  return False
              expected = [[0] * n for _ in range(m)]
              best_row = [0] * m
              best_col = [0] * n
              groups = {}
              for i in range(m):
                  for j in range(n):
                      groups.setdefault(matrix[i][j], []).append((i, j))
              for value in sorted(groups):
                  cells = groups[value]
                  parent = list(range(m + n))
                  def find(x):
                      while parent[x] != x:
                          parent[x] = parent[parent[x]]
                          x = parent[x]
                      return x
                  for i, j in cells:
                      a, b = find(i), find(m + j)
                      if a != b:
                          parent[a] = b
                  comp_max = {}
                  for i, j in cells:
                      root = find(i)
                      comp_max[root] = max(comp_max.get(root, 0), best_row[i], best_col[j])
                  assigned = {}
                  for i, j in cells:
                      root = find(i)
                      assigned[root] = comp_max[root] + 1
                  for i, j in cells:
                      rank = assigned[find(i)]
                      expected[i][j] = rank
                      best_row[i] = max(best_row[i], rank)
                      best_col[j] = max(best_col[j], rank)
              return result == expected

seed: 1632

