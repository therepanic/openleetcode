entry:
  id: 1955
  title: "count-number-of-special-subsequences"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countSpecialSubsequences({nums})"
    rust: "Solution::count_special_subsequences({nums})"
    python3: "Solution().countSpecialSubsequences({nums})"
    python2: "Solution().countSpecialSubsequences({nums})"
    ruby: "count_special_subsequences({nums})"
    java: "new Solution().countSpecialSubsequences({nums})"
    csharp: "new Solution().CountSpecialSubsequences({nums})"
    kotlin: "Solution().countSpecialSubsequences({nums})"
    go: "countSpecialSubsequences({nums})"
    dart: "Solution().countSpecialSubsequences({nums})"
    swift: "Solution().countSpecialSubsequences({nums})"
    typescript: "countSpecialSubsequences({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countSpecialSubsequences(nums, {result})"
    checker: |
      class Checker:
          def countSpecialSubsequences(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              dp0 = 0
              dp1 = 0
              dp2 = 0
              for value in nums:
                  if value == 0:
                      dp0 = (2 * dp0 + 1) % mod
                  elif value == 1:
                      dp1 = (2 * dp1 + dp0) % mod
                  elif value == 2:
                      dp2 = (2 * dp2 + dp1) % mod
                  else:
                      return False
              return result == dp2

seed: 1955

