entry:
  id: 1848
  title: "minimum-distance-to-the-target-element"
  params:
    nums:
      type: array
      items:
        type: int
    target:
      type: int
    start:
      type: int
  call:
    cpp: "Solution().getMinDistance({nums}, {target}, {start})"
    rust: "Solution::get_min_distance({nums}, {target}, {start})"
    python3: "Solution().getMinDistance({nums}, {target}, {start})"
    python2: "Solution().getMinDistance({nums}, {target}, {start})"
    ruby: "get_min_distance({nums}, {target}, {start})"
    java: "new Solution().getMinDistance({nums}, {target}, {start})"
    csharp: "new Solution().GetMinDistance({nums}, {target}, {start})"
    kotlin: "Solution().getMinDistance({nums}, {target}, {start})"
    go: "getMinDistance({nums}, {target}, {start})"
    dart: "Solution().getMinDistance({nums}, {target}, {start})"
    swift: "Solution().getMinDistance({nums}, {target}, {start})"
    typescript: "getMinDistance({nums}, {target}, {start})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getMinDistance(nums, target, start, {result})"
    checker: |
      class Checker:
          def getMinDistance(self, nums, target, start, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = min(abs(i - start) for i, value in enumerate(nums) if value == target)
              return result == expected

seed: 1848

