judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().getCoprimes(nums, edges, {result})"
    checker: |
      import math

      class Checker:
          def getCoprimes(self, nums, edges, result):
              n = len(nums)
              if not isinstance(result, list) or len(result) != n:
                  return False
              adj = [[] for _ in range(n)]
              if len(edges) != n - 1:
                  return False
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  if not (0 <= u < n and 0 <= v < n and u != v):
                      return False
                  adj[u].append(v)
                  adj[v].append(u)
              expected = [-1] * n
              stack = [(0, -1, [])]
              while stack:
                  node, parent, path = stack.pop()
                  for ancestor in reversed(path):
                      if math.gcd(nums[node], nums[ancestor]) == 1:
                          expected[node] = ancestor
                          break
                  next_path = path + [node]
                  for child in reversed(adj[node]):
                      if child != parent:
                          stack.append((child, node, next_path))
              return result == expected

