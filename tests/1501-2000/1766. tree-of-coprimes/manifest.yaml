    rust: "Solution::get_coprimes({nums}, {edges})"
    python3: "Solution().getCoprimes({nums}, {edges})"
    python2: "Solution().getCoprimes({nums}, {edges})"
    ruby: "get_coprimes({nums}, {edges})"
    java: "new Solution().getCoprimes({nums}, {edges})"
    csharp: "new Solution().GetCoprimes({nums}, {edges})"
    kotlin: "Solution().getCoprimes({nums}, {edges})"
    go: "getCoprimes({nums}, {edges})"
    dart: "Solution().getCoprimes({nums}, {edges})"
    swift: "Solution().getCoprimes({nums}, {edges})"
