entry:
  id: 1920
  title: "build-array-from-permutation"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().buildArray({nums})"
    rust: "Solution::build_array({nums})"
    python3: "Solution().buildArray({nums})"
    python2: "Solution().buildArray({nums})"
    ruby: "build_array({nums})"
    java: "new Solution().buildArray({nums})"
    csharp: "new Solution().BuildArray({nums})"
    kotlin: "Solution().buildArray({nums})"
    go: "buildArray({nums})"
    dart: "Solution().buildArray({nums})"
    swift: "Solution().buildArray({nums})"
    typescript: "buildArray({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().buildArray(nums, {result})"
    checker: |
      class Checker:
          def buildArray(self, nums, result):
              return isinstance(result, list) and result == [nums[nums[i]] for i in range(len(nums))]

seed: 1920

