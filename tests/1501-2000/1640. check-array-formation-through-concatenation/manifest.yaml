entry:
  id: 1640
  title: "check-array-formation-through-concatenation"
  params:
    arr:
      type: array
      items:
        type: int
    pieces:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().canFormArray({arr}, {pieces})"
    rust: "Solution::can_form_array({arr}, {pieces})"
    python3: "Solution().canFormArray({arr}, {pieces})"
    python2: "Solution().canFormArray({arr}, {pieces})"
    ruby: "can_form_array({arr}, {pieces})"
    java: "new Solution().canFormArray({arr}, {pieces})"
    csharp: "new Solution().CanFormArray({arr}, {pieces})"
    kotlin: "Solution().canFormArray({arr}, {pieces})"
    go: "canFormArray({arr}, {pieces})"
    dart: "Solution().canFormArray({arr}, {pieces})"
    swift: "Solution().canFormArray({arr}, {pieces})"
    typescript: "canFormArray({arr}, {pieces})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().canFormArray(arr, pieces, {result})"
    checker: |
      class Checker:
          def canFormArray(self, arr, pieces, result):
              if not isinstance(result, bool):
                  return False
              by_first = {piece[0]: piece for piece in pieces if piece}
              i = 0
              used = set()
              while i < len(arr):
                  piece = by_first.get(arr[i])
                  if piece is None or id(piece) in used:
                      return result is False
                  end = i + len(piece)
                  if end > len(arr) or arr[i:end] != piece:
                      return result is False
                  used.add(id(piece))
                  i = end
              return result is (i == len(arr) and len(used) == len(pieces))

seed: 1640

