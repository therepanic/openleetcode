entry:
  id: 1984
  title: "minimum-difference-between-highest-and-lowest-of-k-scores"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minimumDifference({nums}, {k})"
    rust: "Solution::minimum_difference({nums}, {k})"
    python3: "Solution().minimumDifference({nums}, {k})"
    python2: "Solution().minimumDifference({nums}, {k})"
    ruby: "minimum_difference({nums}, {k})"
    java: "new Solution().minimumDifference({nums}, {k})"
    csharp: "new Solution().MinimumDifference({nums}, {k})"
    kotlin: "Solution().minimumDifference({nums}, {k})"
    go: "minimumDifference({nums}, {k})"
    dart: "Solution().minimumDifference({nums}, {k})"
    swift: "Solution().minimumDifference({nums}, {k})"
    typescript: "minimumDifference({nums}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minimumDifference(nums, k, {result})"
    checker: |
      class Checker:
          def minimumDifference(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              a = sorted(nums)
              expected = min(a[i + k - 1] - a[i] for i in range(len(a) - k + 1))
              return result == expected
seed: 1984
