  memory_mb: 512

oracle:
  python3:
    call: "Checker().latestDayToCross(row, col, cells, {result})"
    checker: |
      from collections import deque

      class Checker:
          def latestDayToCross(self, row, col, cells, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if len(cells) != row * col:
                  return False

              def can(day):
                  blocked = [[False] * col for _ in range(row)]
                  for r, c in cells[:day]:
                      blocked[r - 1][c - 1] = True
                  q = deque()
                  seen = [[False] * col for _ in range(row)]
                  for c in range(col):
                      if not blocked[0][c]:
                          q.append((0, c))
                          seen[0][c] = True
                  while q:
                      r, c = q.popleft()
                      if r == row - 1:
                          return True
                      for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                          nr, nc = r + dr, c + dc
                          if 0 <= nr < row and 0 <= nc < col and not seen[nr][nc] and not blocked[nr][nc]:
                              seen[nr][nc] = True
                              q.append((nr, nc))
                  return False

              expected = 0
              for day in range(1, len(cells) + 1):
                  if can(day):
                      expected = day
                  else:
                      break
              return result == expected

