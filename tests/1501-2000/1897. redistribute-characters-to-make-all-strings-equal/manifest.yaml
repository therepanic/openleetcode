entry:
  id: 1897
  title: "redistribute-characters-to-make-all-strings-equal"
  params:
    words:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().makeEqual({words})"
    rust: "Solution::make_equal({words})"
    python3: "Solution().makeEqual({words})"
    python2: "Solution().makeEqual({words})"
    ruby: "make_equal({words})"
    java: "new Solution().makeEqual({words})"
    csharp: "new Solution().MakeEqual({words})"
    kotlin: "Solution().makeEqual({words})"
    go: "makeEqual({words})"
    dart: "Solution().makeEqual({words})"
    swift: "Solution().makeEqual({words})"
    typescript: "makeEqual({words})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().makeEqual(words, {result})"
    checker: |
      class Checker:
          def makeEqual(self, words, result):
              if not isinstance(result, bool):
                  return False
              total = [0] * 26
              for word in words:
                  for ch in word:
                      total[ord(ch) - 97] += 1
              n = len(words)
              expected = all(count % n == 0 for count in total)
              return result == expected

seed: 1897

