entry:
  id: 1959
  title: "minimum-total-space-wasted-with-k-resizing-operations"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minSpaceWastedKResizing({nums}, {k})"
    rust: "Solution::min_space_wasted_k_resizing({nums}, {k})"
    python3: "Solution().minSpaceWastedKResizing({nums}, {k})"
    python2: "Solution().minSpaceWastedKResizing({nums}, {k})"
    ruby: "min_space_wasted_k_resizing({nums}, {k})"
    java: "new Solution().minSpaceWastedKResizing({nums}, {k})"
    csharp: "new Solution().MinSpaceWastedKResizing({nums}, {k})"
    kotlin: "Solution().minSpaceWastedKResizing({nums}, {k})"
    go: "minSpaceWastedKResizing({nums}, {k})"
    dart: "Solution().minSpaceWastedKResizing({nums}, {k})"
    swift: "Solution().minSpaceWastedKResizing({nums}, {k})"
    typescript: "minSpaceWastedKResizing({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minSpaceWastedKResizing(nums, k, {result})"
    checker: |
      class Checker:
          def minSpaceWastedKResizing(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              if n < 1 or not (0 <= k < n):
                  return False
              prefix = [0]
              for value in nums:
                  prefix.append(prefix[-1] + value)
              inf = 10 ** 30
              dp = [inf] * (n + 1)
              current_max = 0
              for i in range(1, n + 1):
                  current_max = max(current_max, nums[i - 1])
                  dp[i] = current_max * i - prefix[i]
              for _ in range(k):
                  nxt = [inf] * (n + 1)
                  for end in range(1, n + 1):
                      segment_max = 0
                      for start in range(end - 1, -1, -1):
                          segment_max = max(segment_max, nums[start])
                          cost = segment_max * (end - start) - (prefix[end] - prefix[start])
                          nxt[end] = min(nxt[end], dp[start] + cost)
                  dp = nxt
              return result == dp[n]

seed: 1959

