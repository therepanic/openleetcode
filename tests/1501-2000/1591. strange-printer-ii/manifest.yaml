entry:
  id: 1591
  title: "strange-printer-ii"
  params:
    targetGrid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().isPrintable({targetGrid})"
    rust: "Solution::is_printable({targetGrid})"
    python3: "Solution().isPrintable({targetGrid})"
    python2: "Solution().isPrintable({targetGrid})"
    ruby: "is_printable({targetGrid})"
    java: "new Solution().isPrintable({targetGrid})"
    csharp: "new Solution().IsPrintable({targetGrid})"
    kotlin: "Solution().isPrintable({targetGrid})"
    go: "isPrintable({targetGrid})"
    dart: "Solution().isPrintable({targetGrid})"
    swift: "Solution().isPrintable({targetGrid})"
    typescript: "isPrintable({targetGrid})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isPrintable(targetGrid, {result})"
    checker: |
      class Checker:
          def isPrintable(self, targetGrid, result):
              if not isinstance(result, bool):
                  return False
              m, n = len(targetGrid), len(targetGrid[0])
              boxes = {}
              for r in range(m):
                  for c in range(n):
                      color = targetGrid[r][c]
                      if color not in boxes:
                          boxes[color] = [r, r, c, c]
                      else:
                          box = boxes[color]
                          box[0] = min(box[0], r)
                          box[1] = max(box[1], r)
                          box[2] = min(box[2], c)
                          box[3] = max(box[3], c)
              remaining = set(boxes)
              while remaining:
                  removable = set()
                  for color in remaining:
                      r0, r1, c0, c1 = boxes[color]
                      ok = True
                      for r in range(r0, r1 + 1):
                          for c in range(c0, c1 + 1):
                              if targetGrid[r][c] not in (0, color):
                                  ok = False
                      if ok:
                          removable.add(color)
                  if not removable:
                      expected = False
                      return result == expected
                  for color in removable:
                      r0, r1, c0, c1 = boxes[color]
                      for r in range(r0, r1 + 1):
                          for c in range(c0, c1 + 1):
                              targetGrid[r][c] = 0
                  remaining -= removable
              return result is True

seed: 1591

