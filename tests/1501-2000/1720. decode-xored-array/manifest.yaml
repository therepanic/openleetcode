entry:
  id: 1720
  title: "decode-xored-array"
  params:
    encoded:
      type: array
      items:
        type: int
    first:
      type: int
  call:
    cpp: "Solution().decode({encoded}, {first})"
    rust: "Solution::decode({encoded}, {first})"
    python3: "Solution().decode({encoded}, {first})"
    python2: "Solution().decode({encoded}, {first})"
    ruby: "decode({encoded}, {first})"
    java: "new Solution().decode({encoded}, {first})"
    csharp: "new Solution().Decode({encoded}, {first})"
    kotlin: "Solution().decode({encoded}, {first})"
    go: "decode({encoded}, {first})"
    dart: "Solution().decode({encoded}, {first})"
    swift: "Solution().decode({encoded}, {first})"
    typescript: "decode({encoded}, {first})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().decode(encoded, first, {result})"
    checker: |
      class Checker:
          def decode(self, encoded, first, result):
              if not isinstance(result, list) or len(result) != len(encoded) + 1:
                  return False
              if not result or result[0] != first:
                  return False
              return all(result[i] ^ result[i + 1] == encoded[i] for i in range(len(encoded)))

seed: 1720

