entry:
  id: 1887
  title: "reduction-operations-to-make-the-array-elements-equal"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().reductionOperations({nums})"
    rust: "Solution::reduction_operations({nums})"
    python3: "Solution().reductionOperations({nums})"
    python2: "Solution().reductionOperations({nums})"
    ruby: "reduction_operations({nums})"
    java: "new Solution().reductionOperations({nums})"
    csharp: "new Solution().ReductionOperations({nums})"
    kotlin: "Solution().reductionOperations({nums})"
    go: "reductionOperations({nums})"
    dart: "Solution().reductionOperations({nums})"
    swift: "Solution().reductionOperations({nums})"
    typescript: "reductionOperations({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().reductionOperations(nums, {result})"
    checker: |
      class Checker:
          def reductionOperations(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = {}
              for x in nums:
                  if not isinstance(x, int) or x < 1 or x > 50000:
                      return False
                  counts[x] = counts.get(x, 0) + 1
              lowest = min(counts)
              seen = 0
              expected = 0
              for value in range(50000, lowest - 1, -1):
                  count = counts.get(value, 0)
                  if count:
                      seen += count
                      if value != lowest:
                          expected += seen
              return result == expected

seed: 1887

