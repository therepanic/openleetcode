entry:
  id: 1621
  title: number-of-sets-of-k-non-overlapping-line-segments
  params:
    n:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().numberOfSets({n}, {k})"
    rust: "Solution::number_of_sets({n}, {k})"
    python3: "Solution().numberOfSets({n}, {k})"
    python2: "Solution().numberOfSets({n}, {k})"
    ruby: "number_of_sets({n}, {k})"
    java: "new Solution().numberOfSets({n}, {k})"
    csharp: "new Solution().NumberOfSets({n}, {k})"
    kotlin: "Solution().numberOfSets({n}, {k})"
    go: "numberOfSets({n}, {k})"
    dart: "Solution().numberOfSets({n}, {k})"
    swift: "Solution().numberOfSets({n}, {k})"
    typescript: "numberOfSets({n}, {k})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numberOfSets(n, k, {result})"
    checker: |
      import math

      class Checker:
          def numberOfSets(self, n, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = math.comb(n + k - 1, 2 * k) % (10 ** 9 + 7)
              return result == expected

