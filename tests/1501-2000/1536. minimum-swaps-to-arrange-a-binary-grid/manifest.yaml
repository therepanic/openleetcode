entry:
  id: 1536
  title: "minimum-swaps-to-arrange-a-binary-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minSwaps({grid})"
    rust: "Solution::min_swaps({grid})"
    python3: "Solution().minSwaps({grid})"
    python2: "Solution().minSwaps({grid})"
    ruby: "min_swaps({grid})"
    java: "new Solution().minSwaps({grid})"
    csharp: "new Solution().MinSwaps({grid})"
    kotlin: "Solution().minSwaps({grid})"
    go: "minSwaps({grid})"
    dart: "Solution().minSwaps({grid})"
    swift: "Solution().minSwaps({grid})"
    typescript: "minSwaps({grid})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minSwaps(grid, {result})"
    checker: |
      class Checker:
          def minSwaps(self, grid, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(grid)
              zeros = []
              for row in grid:
                  count = 0
                  for value in reversed(row):
                      if value == 0:
                          count += 1
                      else:
                          break
                  zeros.append(count)
              swaps = 0
              for i in range(n):
                  needed = n - i - 1
                  j = i
                  while j < n and zeros[j] < needed:
                      j += 1
                  if j == n:
                      return result == -1
                  swaps += j - i
                  value = zeros.pop(j)
                  zeros.insert(i, value)
              return result == swaps

seed: 1536

