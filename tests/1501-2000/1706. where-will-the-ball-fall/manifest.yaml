entry:
  id: 1706
  title: "where-will-the-ball-fall"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findBall({grid})"
    rust: "Solution::find_ball({grid})"
    python3: "Solution().findBall({grid})"
    python2: "Solution().findBall({grid})"
    ruby: "find_ball({grid})"
    java: "new Solution().findBall({grid})"
    csharp: "new Solution().FindBall({grid})"
    kotlin: "Solution().findBall({grid})"
    go: "findBall({grid})"
    dart: "Solution().findBall({grid})"
    swift: "Solution().findBall({grid})"
    typescript: "findBall({grid})"

judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(grid, {result})"
    checker: |
      class Checker:
          def check(self, grid, result):
              if not isinstance(grid, list) or not grid or not isinstance(result, list):
                  return False
              n = len(grid[0])
              if n < 1 or any(not isinstance(row, list) or len(row) != n for row in grid):
                  return False
              if any(cell not in (-1, 1) for row in grid for cell in row):
                  return False
              if len(result) != n or any(type(x) is not int for x in result):
                  return False
              expected = []
              for start in range(n):
                  col = start
                  for row in grid:
                      nxt = col + row[col]
                      if nxt < 0 or nxt >= n or row[nxt] != row[col]:
                          col = -1
                          break
                      col = nxt
                  expected.append(col)
              return result == expected

seed: 1706

