entry:
  id: 1883
  title: minimum-skips-to-arrive-at-meeting-on-time
  params:
    dist:
      type: array
      items:
        type: int
    speed:
      type: int
    hoursBefore:
      type: int
  call:
    cpp: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    rust: "Solution::min_skips({dist}, {speed}, {hoursBefore})"
    python3: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    python2: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    ruby: "min_skips({dist}, {speed}, {hoursBefore})"
    java: "new Solution().minSkips({dist}, {speed}, {hoursBefore})"
    csharp: "new Solution().MinSkips({dist}, {speed}, {hoursBefore})"
    kotlin: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    go: "minSkips({dist}, {speed}, {hoursBefore})"
    dart: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    swift: "Solution().minSkips({dist}, {speed}, {hoursBefore})"
    typescript: "minSkips({dist}, {speed}, {hoursBefore})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().minSkips(dist, speed, hoursBefore, {result})"
    checker: |
      class Checker:
          def minSkips(self, dist, speed, hoursBefore, result):
              n = len(dist)
              inf = 10**30
              dp = [inf] * (n + 1)
              dp[0] = 0
              for i, d in enumerate(dist):
                  ndp = [inf] * (n + 1)
                  for k in range(i + 2):
                      if dp[k] >= inf:
                          continue
                      skip = dp[k] + d
                      if skip < ndp[k + 1]:
                          ndp[k + 1] = skip
                      if i == n - 1:
                          noskip = dp[k] + d
                      else:
                          noskip = ((dp[k] + d + speed - 1) // speed) * speed
                      if noskip < ndp[k]:
                          ndp[k] = noskip
                  dp = ndp
              want = -1
              for k, value in enumerate(dp):
                  if value <= hoursBefore * speed:
                      want = k
                      break
              return result == want
seed: 1883
