entry:
  id: 1779
  title: "find-nearest-point-that-has-the-same-x-or-y-coordinate"
  params:
    x:
      type: int
    y:
      type: int
    points:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().nearestValidPoint({x}, {y}, {points})"
    rust: "Solution::nearest_valid_point({x}, {y}, {points})"
    python3: "Solution().nearestValidPoint({x}, {y}, {points})"
    python2: "Solution().nearestValidPoint({x}, {y}, {points})"
    ruby: "nearest_valid_point({x}, {y}, {points})"
    java: "new Solution().nearestValidPoint({x}, {y}, {points})"
    csharp: "new Solution().NearestValidPoint({x}, {y}, {points})"
    kotlin: "Solution().nearestValidPoint({x}, {y}, {points})"
    go: "nearestValidPoint({x}, {y}, {points})"
    dart: "Solution().nearestValidPoint({x}, {y}, {points})"
    swift: "Solution().nearestValidPoint({x}, {y}, {points})"
    typescript: "nearestValidPoint({x}, {y}, {points})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(x, y, points, {result})"
    checker: |
      class Checker:
          def check(self, x, y, points, result):
              best = -1
              best_distance = None
              for i, point in enumerate(points):
                  a, b = point
                  if a == x or b == y:
                      distance = abs(x - a) + abs(y - b)
                      if best_distance is None or distance < best_distance:
                          best_distance = distance
                          best = i
              return result == best

seed: 1779
