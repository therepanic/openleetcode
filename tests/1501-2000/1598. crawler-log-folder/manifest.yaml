entry:
  id: 1598
  title: "crawler-log-folder"
  params:
    logs:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().minOperations({logs})"
    rust: "Solution::min_operations({logs})"
    python3: "Solution().minOperations({logs})"
    python2: "Solution().minOperations({logs})"
    ruby: "min_operations({logs})"
    java: "new Solution().minOperations({logs})"
    csharp: "new Solution().MinOperations({logs})"
    kotlin: "Solution().minOperations({logs})"
    go: "minOperations({logs})"
    dart: "Solution().minOperations({logs})"
    swift: "Solution().minOperations({logs})"
    typescript: "minOperations({logs})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minOperations(logs, {result})"
    checker: |
      class Checker:
          def minOperations(self, logs, result):
              depth = 0
              for operation in logs:
                  if operation == "../":
                      depth = max(0, depth - 1)
                  elif operation == "./":
                      continue
                  else:
                      if not isinstance(operation, str) or not operation.endswith("/"):
                          return False
                      name = operation[:-1]
                      if not name or any(ch not in "abcdefghijklmnopqrstuvwxyz0123456789" for ch in name):
                          return False
                      depth += 1
              return isinstance(result, int) and not isinstance(result, bool) and result == depth

seed: 1598

