entry:
  id: 1925
  title: "count-square-sum-triples"
  params:
    n:
      type: int
  call:
    cpp: "Solution().countTriples({n})"
    rust: "Solution::count_triples({n})"
    python3: "Solution().countTriples({n})"
    python2: "Solution().countTriples({n})"
    ruby: "count_triples({n})"
    java: "new Solution().countTriples({n})"
    csharp: "new Solution().CountTriples({n})"
    kotlin: "Solution().countTriples({n})"
    go: "countTriples({n})"
    dart: "Solution().countTriples({n})"
    swift: "Solution().countTriples({n})"
    typescript: "countTriples({n})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countTriples(n, {result})"
    checker: |
      from math import gcd, isqrt

      class Checker:
          def countTriples(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              for a in range(1, n + 1):
                  for b in range(1, n + 1):
                      c = isqrt(a * a + b * b)
                      if c <= n and c * c == a * a + b * b:
                          expected += 1
              return result == expected

