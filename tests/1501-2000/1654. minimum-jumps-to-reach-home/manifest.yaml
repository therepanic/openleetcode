    python3: "Solution().minimumJumps({forbidden}, {a}, {b}, {x})"
    python2: "Solution().minimumJumps({forbidden}, {a}, {b}, {x})"
    ruby: "minimum_jumps({forbidden}, {a}, {b}, {x})"
    java: "new Solution().minimumJumps({forbidden}, {a}, {b}, {x})"
    csharp: "new Solution().MinimumJumps({forbidden}, {a}, {b}, {x})"
    kotlin: "Solution().minimumJumps({forbidden}, {a}, {b}, {x})"
