judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumJumps(forbidden, a, b, x, {result})"
    checker: |
      from collections import deque
      class Checker:
          def minimumJumps(self, forbidden, a, b, x, result):
              blocked = set(forbidden)
              if x in blocked or 0 in blocked:
                  return False
              bound = max(max(blocked) if blocked else 0, x) + a + b
              q = deque([(0, False, 0)])
              seen = {(0, False)}
              answer = -1
              while q:
                  pos, last_back, dist = q.popleft()
                  if pos == x:
                      answer = dist
                      break
                  nxt = pos + a
                  state = (nxt, False)
                  if nxt <= bound and nxt not in blocked and state not in seen:
                      seen.add(state)
                      q.append((nxt, False, dist + 1))
                  if not last_back:
                      nxt = pos - b
                      state = (nxt, True)
                      if nxt >= 0 and nxt not in blocked and state not in seen:
                          seen.add(state)
                          q.append((nxt, True, dist + 1))
              return isinstance(result, int) and result == answer

