entry:
  id: 1946
  title: "largest-number-after-mutating-substring"
  params:
    num:
      type: string
    change:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumNumber({num}, {change})"
    rust: "Solution::maximum_number({num}, {change})"
    python3: "Solution().maximumNumber({num}, {change})"
    python2: "Solution().maximumNumber({num}, {change})"
    ruby: "maximum_number({num}, {change})"
    java: "new Solution().maximumNumber({num}, {change})"
    csharp: "new Solution().MaximumNumber({num}, {change})"
    kotlin: "Solution().maximumNumber({num}, {change})"
    go: "maximumNumber({num}, {change})"
    dart: "Solution().maximumNumber({num}, {change})"
    swift: "Solution().maximumNumber({num}, {change})"
    typescript: "maximumNumber({num}, {change})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maximumNumber(num, change, {result})"
    checker: |
      class Checker:
          def maximumNumber(self, num, change, result):
              if not isinstance(result, str) or len(result) != len(num):
                  return False
              expected = list(num)
              active = False
              for i, ch in enumerate(num):
                  d = ord(ch) - 48
                  mapped = str(change[d])
                  if change[d] > d:
                      expected[i] = mapped
                      active = True
                  elif change[d] == d or not active:
                      continue
                  else:
                      break
              return result == ''.join(expected)

seed: 1946

