entry:
  id: 1664
  title: "ways-to-make-a-fair-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().waysToMakeFair({nums})"
    rust: "Solution::ways_to_make_fair({nums})"
    python3: "Solution().waysToMakeFair({nums})"
    python2: "Solution().waysToMakeFair({nums})"
    ruby: "ways_to_make_fair({nums})"
    java: "new Solution().waysToMakeFair({nums})"
    csharp: "new Solution().WaysToMakeFair({nums})"
    kotlin: "Solution().waysToMakeFair({nums})"
    go: "waysToMakeFair({nums})"
    dart: "Solution().waysToMakeFair({nums})"
    swift: "Solution().waysToMakeFair({nums})"
    typescript: "waysToMakeFair({nums})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().waysToMakeFair(nums, {result})"
    checker: |
      class Checker:
          def waysToMakeFair(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total_even = sum(nums[::2])
              total_odd = sum(nums[1::2])
              left_even = 0
              left_odd = 0
              expected = 0
              for index, value in enumerate(nums):
                  if index % 2 == 0:
                      total_even -= value
                  else:
                      total_odd -= value
                  if total_even + left_odd == total_odd + left_even:
                      expected += 1
                  if index % 2 == 0:
                      left_even += value
                  else:
                      left_odd += value
              return result == expected

seed: 1664

