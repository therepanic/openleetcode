entry:
  id: 1573
  title: "number-of-ways-to-split-a-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().numWays({s})"
    rust: "Solution::num_ways({s})"
    python3: "Solution().numWays({s})"
    python2: "Solution().numWays({s})"
    ruby: "num_ways({s})"
    java: "new Solution().numWays({s})"
    csharp: "new Solution().NumWays({s})"
    kotlin: "Solution().numWays({s})"
    go: "numWays({s})"
    dart: "Solution().numWays({s})"
    swift: "Solution().numWays({s})"
    typescript: "numWays({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().numWays(s, {result})"
    checker: |
      class Checker:
          def numWays(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              ones = [i for i, ch in enumerate(s) if ch == '1']
              n = len(s)
              if len(ones) == 0:
                  expected = ((n - 1) * (n - 2) // 2) % mod
              elif len(ones) % 3 != 0:
                  expected = 0
              else:
                  k = len(ones) // 3
                  expected = ((ones[k] - ones[k - 1]) * (ones[2 * k] - ones[2 * k - 1])) % mod
              return result == expected

