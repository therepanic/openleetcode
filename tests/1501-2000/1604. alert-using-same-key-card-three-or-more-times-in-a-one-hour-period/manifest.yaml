entry:
  id: 1604
  title: "Alert Using Same Key-Card Three or More Times in a One Hour Period"
  params:
    keyName:
      type: array
      items:
        type: string
    keyTime:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().alertNames({keyName}, {keyTime})"
    rust: "Solution::alert_names({keyName}, {keyTime})"
    python3: "Solution().alertNames({keyName}, {keyTime})"
    python2: "Solution().alertNames({keyName}, {keyTime})"
    ruby: "alert_names({keyName}, {keyTime})"
    java: "new Solution().alertNames({keyName}, {keyTime})"
    csharp: "new Solution().AlertNames({keyName}, {keyTime})"
    kotlin: "Solution().alertNames({keyName}, {keyTime})"
    go: "alertNames({keyName}, {keyTime})"
    dart: "Solution().alertNames({keyName}, {keyTime})"
    swift: "Solution().alertNames({keyName}, {keyTime})"
    typescript: "alertNames({keyName}, {keyTime})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().alertNames(keyName, keyTime, {result})"
    checker: |
      class Checker:
          def alertNames(self, keyName, keyTime, result):
              expected = []
              grouped = {}
              for name, stamp in zip(keyName, keyTime):
                  h, m = map(int, stamp.split(':'))
                  grouped.setdefault(name, []).append(h * 60 + m)
              for name, times in grouped.items():
                  times.sort()
                  if any(times[i + 2] - times[i] <= 60 for i in range(len(times) - 2)):
                      expected.append(name)
              return result == sorted(expected)

seed: 1604

tests:
  - name: empty
    in:
      keyName: [a]
      keyTime: ["00:00"]
    out: []
  - name: two-uses-not-alert
    in:
      keyName: [alice, alice]
      keyTime: ["09:00", "09:30"]
    out: []
  - name: exact-sixty-minutes
    in:
      keyName: [alice, alice, alice]
      keyTime: ["09:00", "09:30", "10:00"]
    out: [alice]
  - name: just-over-hour
