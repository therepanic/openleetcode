entry:
  id: 1898
  title: "maximum-number-of-removable-characters"
  params:
    s:
      type: string
    p:
      type: string
    removable:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumRemovals({s}, {p}, {removable})"
    rust: "Solution::maximum_removals({s}, {p}, {removable})"
    python3: "Solution().maximumRemovals({s}, {p}, {removable})"
    python2: "Solution().maximumRemovals({s}, {p}, {removable})"
    ruby: "maximum_removals({s}, {p}, {removable})"
    java: "new Solution().maximumRemovals({s}, {p}, {removable})"
    csharp: "new Solution().MaximumRemovals({s}, {p}, {removable})"
    kotlin: "Solution().maximumRemovals({s}, {p}, {removable})"
    go: "maximumRemovals({s}, {p}, {removable})"
    dart: "Solution().maximumRemovals({s}, {p}, {removable})"
    swift: "Solution().maximumRemovals({s}, {p}, {removable})"
    typescript: "maximumRemovals({s}, {p}, {removable})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumRemovals(s, p, removable, {result})"
    checker: |
      class Checker:
          def maximumRemovals(self, s, p, removable, result):
              def ok(k):
                  removed = set(removable[:k])
                  j = 0
                  for i, ch in enumerate(s):
                      if i not in removed and j < len(p) and ch == p[j]:
                          j += 1
                  return j == len(p)
              expected = 0
              lo, hi = 0, len(removable)
              while lo <= hi:
                  mid = (lo + hi) // 2
                  if ok(mid):
                      expected = mid
                      lo = mid + 1
                  else:
                      hi = mid - 1
              return result == expected

seed: 1898

tests:
  - name: example-one
    in:
      s: "abcacb"
      p: "ab"
      removable: [3, 1, 0]
    out: 2
    judge:
      type: "exact"
