entry:
  id: 1914
  title: "cyclically-rotating-a-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
    k:
      type: int
  call:
    cpp: "Solution().rotateGrid({grid}, {k})"
    rust: "Solution::rotate_grid({grid}, {k})"
    python3: "Solution().rotateGrid({grid}, {k})"
    python2: "Solution().rotateGrid({grid}, {k})"
    ruby: "rotate_grid({grid}, {k})"
    java: "new Solution().rotateGrid({grid}, {k})"
    csharp: "new Solution().RotateGrid({grid}, {k})"
    kotlin: "Solution().rotateGrid({grid}, {k})"
    go: "rotateGrid({grid}, {k})"
    dart: "Solution().rotateGrid({grid}, {k})"
    swift: "Solution().rotateGrid({grid}, {k})"
    typescript: "rotateGrid({grid}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().rotateGrid(grid, k, {result})"
    checker: |
      class Checker:
          def rotateGrid(self, grid, k, result):
              if not isinstance(result, list) or len(result) != len(grid):
                  return False
              if not grid or any(not isinstance(row, list) or len(row) != len(grid[0]) for row in result):
                  return False
              expected = [row[:] for row in grid]
              m, n = len(expected), len(expected[0])
              top = left = 0
              bottom, right = m - 1, n - 1
              while top < bottom and left < right:
                  ring = []
                  for c in range(left, right + 1):
                      ring.append(expected[top][c])
                  for r in range(top + 1, bottom + 1):
                      ring.append(expected[r][right])
                  for c in range(right - 1, left - 1, -1):
                      ring.append(expected[bottom][c])
                  for r in range(bottom - 1, top, -1):
                      ring.append(expected[r][left])
                  shift = k % len(ring)
                  rotated = ring[shift:] + ring[:shift]
                  p = 0
                  for c in range(left, right + 1):
                      expected[top][c] = rotated[p]
                      p += 1
                  for r in range(top + 1, bottom + 1):
                      expected[r][right] = rotated[p]
                      p += 1
                  for c in range(right - 1, left - 1, -1):
                      expected[bottom][c] = rotated[p]
                      p += 1
                  for r in range(bottom - 1, top, -1):
                      expected[r][left] = rotated[p]
                      p += 1
                  top += 1
                  left += 1
                  bottom -= 1
                  right -= 1
              return result == expected

