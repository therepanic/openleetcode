entry:
  id: 1646
  title: "get-maximum-in-generated-array"
  params:
    n:
      type: int
  call:
    cpp: "Solution().getMaximumGenerated({n})"
    rust: "Solution::get_maximum_generated({n})"
    python3: "Solution().getMaximumGenerated({n})"
    python2: "Solution().getMaximumGenerated({n})"
    ruby: "get_maximum_generated({n})"
    java: "new Solution().getMaximumGenerated({n})"
    csharp: "new Solution().GetMaximumGenerated({n})"
    kotlin: "Solution().getMaximumGenerated({n})"
    go: "getMaximumGenerated({n})"
    dart: "Solution().getMaximumGenerated({n})"
    swift: "Solution().getMaximumGenerated({n})"
    typescript: "getMaximumGenerated({n})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(n, {result})"
    checker: |
      class Checker:
          def check(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if n == 0:
                  return result == 0
              nums = [0] * (n + 1)
              nums[1] = 1
              for i in range(2, n + 1):
                  if i % 2 == 0:
                      nums[i] = nums[i // 2]
                  else:
                      nums[i] = nums[i // 2] + nums[i // 2 + 1]
              return result == max(nums)

