judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().maxSumRangeQuery(nums, requests, {result})"
    checker: |
      class Checker:
          def maxSumRangeQuery(self, nums, requests, result):
              mod = 1000000007
              n = len(nums)
              freq = [0] * (n + 1)
              for left, right in requests:
                  freq[left] += 1
                  freq[right + 1] -= 1
              cur = 0
              counts = []
              for i in range(n):
                  cur += freq[i]
                  counts.append(cur)
              expected = sum(a * b for a, b in zip(sorted(nums), sorted(counts))) % mod
              return isinstance(result, int) and result == expected
seed: 1589
