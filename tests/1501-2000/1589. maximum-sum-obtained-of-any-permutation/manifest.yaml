  call:
    cpp: "Solution().maxSumRangeQuery({nums}, {requests})"
    rust: "Solution::max_sum_range_query({nums}, {requests})"
    python3: "Solution().maxSumRangeQuery({nums}, {requests})"
    python2: "Solution().maxSumRangeQuery({nums}, {requests})"
    ruby: "max_sum_range_query({nums}, {requests})"
    java: "new Solution().maxSumRangeQuery({nums}, {requests})"
    csharp: "new Solution().MaxSumRangeQuery({nums}, {requests})"
    kotlin: "Solution().maxSumRangeQuery({nums}, {requests})"
    go: "maxSumRangeQuery({nums}, {requests})"
    dart: "Solution().maxSumRangeQuery({nums}, {requests})"
    swift: "Solution().maxSumRangeQuery({nums}, {requests})"
