entry:
  id: 1803
  title: "count-pairs-with-xor-in-a-range"
  params:
    nums:
      type: array
      items:
        type: int
    low:
      type: int
    high:
      type: int
  call:
    cpp: "Solution().countPairs({nums}, {low}, {high})"
    rust: "Solution::count_pairs({nums}, {low}, {high})"
    python3: "Solution().countPairs({nums}, {low}, {high})"
    python2: "Solution().countPairs({nums}, {low}, {high})"
    ruby: "count_pairs({nums}, {low}, {high})"
    java: "new Solution().countPairs({nums}, {low}, {high})"
    csharp: "new Solution().CountPairs({nums}, {low}, {high})"
    kotlin: "Solution().countPairs({nums}, {low}, {high})"
    go: "countPairs({nums}, {low}, {high})"
    dart: "Solution().countPairs({nums}, {low}, {high})"
    swift: "Solution().countPairs({nums}, {low}, {high})"
    typescript: "countPairs({nums}, {low}, {high})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().countPairs(nums, low, high, {result})"
    checker: |
      class Checker:
          def countPairs(self, nums, low, high, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              bits = max(1, max(max(nums).bit_length(), (high + 1).bit_length()))
              def count_less(bound):
                  if bound <= 0:
                      return 0
                  child = [[-1, -1]]
                  counts = [0]
                  total = 0
                  for value in nums:
                      node = 0
                      for bit in range(bits - 1, -1, -1):
                          v = (value >> bit) & 1
                          b = (bound >> bit) & 1
                          if b:
                              same = child[node][v]
                              if same != -1:
                                  total += counts[same]
                              node = child[node][1 - v]
                          else:
                              node = child[node][v]
                          if node == -1:
                              break
                      node = 0
                      for bit in range(bits - 1, -1, -1):
                          v = (value >> bit) & 1
                          nxt = child[node][v]
                          if nxt == -1:
                              nxt = len(child)
                              child[node][v] = nxt
                              child.append([-1, -1])
                              counts.append(0)
                          node = nxt
                          counts[node] += 1
                  return total
              return result == count_less(high + 1) - count_less(low)

