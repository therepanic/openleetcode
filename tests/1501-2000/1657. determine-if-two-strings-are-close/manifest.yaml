entry:
  id: 1657
  title: "determine-if-two-strings-are-close"
  params:
    word1:
      type: string
    word2:
      type: string
  call:
    cpp: "Solution().closeStrings({word1}, {word2})"
    rust: "Solution::close_strings({word1}, {word2})"
    python3: "Solution().closeStrings({word1}, {word2})"
    python2: "Solution().closeStrings({word1}, {word2})"
    ruby: "close_strings({word1}, {word2})"
    java: "new Solution().closeStrings({word1}, {word2})"
    csharp: "new Solution().CloseStrings({word1}, {word2})"
    kotlin: "Solution().closeStrings({word1}, {word2})"
    go: "closeStrings({word1}, {word2})"
    dart: "Solution().closeStrings({word1}, {word2})"
    swift: "Solution().closeStrings({word1}, {word2})"
    typescript: "closeStrings({word1}, {word2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().closeStrings(word1, word2, {result})"
    checker: |
      class Checker:
          def closeStrings(self, word1, word2, result):
              if not isinstance(result, bool):
                  return False
              if len(word1) != len(word2):
                  expected = False
              else:
                  counts1 = {}
                  counts2 = {}
                  for ch in word1:
                      counts1[ch] = counts1.get(ch, 0) + 1
                  for ch in word2:
                      counts2[ch] = counts2.get(ch, 0) + 1
                  expected = set(counts1) == set(counts2) and sorted(counts1.values()) == sorted(counts2.values())
              return result == expected

seed: 1657

