entry:
  id: 1792
  title: "maximum-average-pass-ratio"
  params:
    classes:
      type: array
      items:
        type: array
        items:
          type: int
    extraStudents:
      type: int
  call:
    cpp: "Solution().maxAverageRatio({classes}, {extraStudents})"
    rust: "Solution::max_average_ratio({classes}, {extraStudents})"
    python3: "Solution().maxAverageRatio({classes}, {extraStudents})"
    python2: "Solution().maxAverageRatio({classes}, {extraStudents})"
    ruby: "max_average_ratio({classes}, {extraStudents})"
    java: "new Solution().maxAverageRatio({classes}, {extraStudents})"
    csharp: "new Solution().MaxAverageRatio({classes}, {extraStudents})"
    kotlin: "Solution().maxAverageRatio({classes}, {extraStudents})"
    go: "maxAverageRatio({classes}, {extraStudents})"
    dart: "Solution().maxAverageRatio({classes}, {extraStudents})"
    swift: "Solution().maxAverageRatio({classes}, {extraStudents})"
    typescript: "maxAverageRatio({classes}, {extraStudents})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxAverageRatio(classes, extraStudents, {result})"
    checker: |
      import heapq
      import math

      class Checker:
          def maxAverageRatio(self, classes, extraStudents, result):
              def gain(p, t):
                  return (p + 1) / float(t + 1) - p / float(t)
              heap = [(-gain(p, t), p, t) for p, t in classes]
              heapq.heapify(heap)
              for _ in range(extraStudents):
                  _, p, t = heapq.heappop(heap)
                  p += 1
                  t += 1
                  heapq.heappush(heap, (-gain(p, t), p, t))
              expected = sum(p / float(t) for _, p, t in heap) / len(classes)
              try:
                  actual = float(result)
              except (TypeError, ValueError):
                  return False
              return math.isfinite(actual) and abs(actual - expected) <= 1e-5

seed: 1792

