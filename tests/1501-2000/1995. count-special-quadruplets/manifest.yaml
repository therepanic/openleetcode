entry:
  id: 1995
  title: "count-special-quadruplets"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countQuadruplets({nums})"
    rust: "Solution::count_quadruplets({nums})"
    python3: "Solution().countQuadruplets({nums})"
    python2: "Solution().countQuadruplets({nums})"
    ruby: "count_quadruplets({nums})"
    java: "new Solution().countQuadruplets({nums})"
    csharp: "new Solution().CountQuadruplets({nums})"
    kotlin: "Solution().countQuadruplets({nums})"
    go: "countQuadruplets({nums})"
    dart: "Solution().countQuadruplets({nums})"
    swift: "Solution().countQuadruplets({nums})"
    typescript: "countQuadruplets({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countQuadruplets(nums, {result})"
    checker: |
      class Checker:
          def countQuadruplets(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(nums, list) or not (4 <= len(nums) <= 50):
                  return False
              expected = 0
              for a in range(len(nums)):
                  for b in range(a + 1, len(nums)):
                      for c in range(b + 1, len(nums)):
                          for d in range(c + 1, len(nums)):
                              if nums[a] + nums[b] + nums[c] == nums[d]:
                                  expected += 1
              return result == expected

