entry:
  id: 1639
  title: "number-of-ways-to-form-a-target-string-given-a-dictionary"
  params:
    words:
      type: array
      items:
        type: string
    target:
      type: string
  call:
    cpp: "Solution().numWays({words}, {target})"
    rust: "Solution::num_ways({words}, {target})"
    python3: "Solution().numWays({words}, {target})"
    python2: "Solution().numWays({words}, {target})"
    ruby: "num_ways({words}, {target})"
    java: "new Solution().numWays({words}, {target})"
    csharp: "new Solution().NumWays({words}, {target})"
    kotlin: "Solution().numWays({words}, {target})"
    go: "numWays({words}, {target})"
    dart: "Solution().numWays({words}, {target})"
    swift: "Solution().numWays({words}, {target})"
    typescript: "numWays({words}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().numWays(words, target, {result})"
    checker: |
      class Checker:
          def numWays(self, words, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              if not words or not target or any(len(w) != len(words[0]) for w in words):
                  return False
              counts = [[0] * 26 for _ in range(len(words[0]))]
              for word in words:
                  for i, ch in enumerate(word):
                      counts[i][ord(ch) - 97] += 1
              dp = [0] * (len(target) + 1)
              dp[0] = 1
              for column in counts:
                  for j in range(len(target) - 1, -1, -1):
                      dp[j + 1] = (dp[j + 1] + dp[j] * column[ord(target[j]) - 97]) % mod
              return result == dp[len(target)]

seed: 1639

