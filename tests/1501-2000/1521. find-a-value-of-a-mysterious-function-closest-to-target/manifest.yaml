entry:
  id: 1521
  title: "find-a-value-of-a-mysterious-function-closest-to-target"
  params:
    arr:
      type: array
      items:
        type: int
    target:
      type: int
  call:
    cpp: "Solution().closestToTarget({arr}, {target})"
    rust: "Solution::closest_to_target({arr}, {target})"
    python3: "Solution().closestToTarget({arr}, {target})"
    python2: "Solution().closestToTarget({arr}, {target})"
    ruby: "closest_to_target({arr}, {target})"
    java: "new Solution().closestToTarget({arr}, {target})"
    csharp: "new Solution().ClosestToTarget({arr}, {target})"
    kotlin: "Solution().closestToTarget({arr}, {target})"
    go: "closestToTarget({arr}, {target})"
    dart: "Solution().closestToTarget({arr}, {target})"
    swift: "Solution().closestToTarget({arr}, {target})"
    typescript: "closestToTarget({arr}, {target})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().closestToTarget(arr, target, {result})"
    checker: |
      class Checker:
          def closestToTarget(self, arr, target, result):
              if not isinstance(result, int) or isinstance(result, bool) or result < 0:
                  return False
              best = 10**18
              active = set()
              for value in arr:
                  current = {value}
                  for old in active:
                      current.add(old & value)
                  active = current
                  for value2 in active:
                      best = min(best, abs(value2 - target))
              return result == best
seed: 15211521
