entry:
  id: 1977
  title: "number-of-ways-to-separate-numbers"
  params:
    num:
      type: string
  call:
    cpp: "Solution().numberOfCombinations({num})"
    rust: "Solution::number_of_combinations({num})"
    python3: "Solution().numberOfCombinations({num})"
    python2: "Solution().numberOfCombinations({num})"
    ruby: "number_of_combinations({num})"
    java: "new Solution().numberOfCombinations({num})"
    csharp: "new Solution().NumberOfCombinations({num})"
    kotlin: "Solution().numberOfCombinations({num})"
    go: "numberOfCombinations({num})"
    dart: "Solution().numberOfCombinations({num})"
    swift: "Solution().numberOfCombinations({num})"
    typescript: "numberOfCombinations({num})"

judge:
  type: "exact"

limits:
  time_ms: 10000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(num, {result})"
    checker: |
      class Checker:
          def check(self, num, result):
              mod = 1000000007
              n = len(num)
              dp = [[0] * (n + 1) for _ in range(n)]
              for i in range(n):
                  if num[i] == "0":
                      continue
                  for j in range(i + 1, n + 1):
                      if i == 0:
                          dp[i][j] = 1
                          continue
                      length = j - i
                      value = dp[i][j - 1]
                      if i - length >= 0 and num[i - length:i] <= num[i:j]:
                          value += dp[i - length][i]
                      if i - length + 1 >= 0 and num[i - length + 1:i] > num[i:j - 1]:
                          value += dp[i - length + 1][i]
                      dp[i][j] = value % mod
              expected = sum(dp[i][n] for i in range(n)) % mod
              return result == expected

seed: 1977

