    mentors:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxCompatibilitySum({students}, {mentors})"
    rust: "Solution::max_compatibility_sum({students}, {mentors})"
    python3: "Solution().maxCompatibilitySum({students}, {mentors})"
    python2: "Solution().maxCompatibilitySum({students}, {mentors})"
    ruby: "max_compatibility_sum({students}, {mentors})"
    java: "new Solution().maxCompatibilitySum({students}, {mentors})"
    csharp: "new Solution().MaxCompatibilitySum({students}, {mentors})"
    kotlin: "Solution().maxCompatibilitySum({students}, {mentors})"
    go: "maxCompatibilitySum({students}, {mentors})"
    dart: "Solution().maxCompatibilitySum({students}, {mentors})"
    swift: "Solution().maxCompatibilitySum({students}, {mentors})"
    typescript: "maxCompatibilitySum({students}, {mentors})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(students, mentors, {result})"
    checker: |
      from itertools import permutations

      class Checker:
          def check(self, students, mentors, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              for perm in permutations(range(len(students))):
                  total = 0
                  for i, j in enumerate(perm):
                      total += sum(a == b for a, b in zip(students[i], mentors[j]))
                  best = max(best, total)
              return result == best

seed: 1947

