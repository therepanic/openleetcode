entry:
  id: 1996
  title: "the-number-of-weak-characters-in-the-game"
  params:
    properties:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().numberOfWeakCharacters({properties})"
    rust: "Solution::number_of_weak_characters({properties})"
    python3: "Solution().numberOfWeakCharacters({properties})"
    python2: "Solution().numberOfWeakCharacters({properties})"
    ruby: "number_of_weak_characters({properties})"
    java: "new Solution().numberOfWeakCharacters({properties})"
    csharp: "new Solution().NumberOfWeakCharacters({properties})"
    kotlin: "Solution().numberOfWeakCharacters({properties})"
    go: "numberOfWeakCharacters({properties})"
    dart: "Solution().numberOfWeakCharacters({properties})"
    swift: "Solution().numberOfWeakCharacters({properties})"
    typescript: "numberOfWeakCharacters({properties})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(properties, {result})"
    checker: |
      class Checker:
          def check(self, properties, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              weak = 0
              for attack, defense in properties:
                  if any(a > attack and d > defense for a, d in properties):
                      weak += 1
              return result == weak

seed: 1996

