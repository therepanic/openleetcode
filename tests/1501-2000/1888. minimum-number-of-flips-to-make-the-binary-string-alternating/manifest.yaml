entry:
  id: 1888
  title: "minimum-number-of-flips-to-make-the-binary-string-alternating"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minFlips({s})"
    rust: "Solution::min_flips({s})"
    python3: "Solution().minFlips({s})"
    python2: "Solution().minFlips({s})"
    ruby: "min_flips({s})"
    java: "new Solution().minFlips({s})"
    csharp: "new Solution().MinFlips({s})"
    kotlin: "Solution().minFlips({s})"
    go: "minFlips({s})"
    dart: "Solution().minFlips({s})"
    swift: "Solution().minFlips({s})"
    typescript: "minFlips({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(s, {result})"
    checker: |
      class Checker:
          def check(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(s)
              doubled = s + s
              mismatches0 = 0
              best = n
              for i, ch in enumerate(doubled):
                  if ch != ('0' if i % 2 == 0 else '1'):
                      mismatches0 += 1
                  if i >= n:
                      left = i - n
                      if doubled[left] != ('0' if left % 2 == 0 else '1'):
                          mismatches0 -= 1
                  if i >= n - 1:
                      best = min(best, mismatches0, n - mismatches0)
              return result == best

seed: 1888

