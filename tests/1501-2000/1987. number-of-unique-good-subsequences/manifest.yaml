entry:
  id: 1987
  title: "number-of-unique-good-subsequences"
  params:
    binary:
      type: string
  call:
    cpp: "Solution().numberOfUniqueGoodSubsequences({binary})"
    rust: "Solution::number_of_unique_good_subsequences({binary})"
    python3: "Solution().numberOfUniqueGoodSubsequences({binary})"
    python2: "Solution().numberOfUniqueGoodSubsequences({binary})"
    ruby: "number_of_unique_good_subsequences({binary})"
    java: "new Solution().numberOfUniqueGoodSubsequences({binary})"
    csharp: "new Solution().NumberOfUniqueGoodSubsequences({binary})"
    kotlin: "Solution().numberOfUniqueGoodSubsequences({binary})"
    go: "numberOfUniqueGoodSubsequences({binary})"
    dart: "Solution().numberOfUniqueGoodSubsequences({binary})"
    swift: "Solution().numberOfUniqueGoodSubsequences({binary})"
    typescript: "numberOfUniqueGoodSubsequences({binary})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(binary, {result})"
    checker: |
      class Checker:
          def check(self, binary, result):
              mod = 1000000007
              end0 = 0
              end1 = 0
              has_zero = False
              for ch in binary:
                  if ch == "0":
                      end0 = (end0 + end1) % mod
                      has_zero = True
                  else:
                      end1 = (end0 + end1 + 1) % mod
              expected = (end0 + end1 + (1 if has_zero else 0)) % mod
              return result == expected

seed: 1987

