entry:
  id: 1653
  title: "minimum-deletions-to-make-string-balanced"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minimumDeletions({s})"
    rust: "Solution::minimum_deletions({s})"
    python3: "Solution().minimumDeletions({s})"
    python2: "Solution().minimumDeletions({s})"
    ruby: "minimum_deletions({s})"
    java: "new Solution().minimumDeletions({s})"
    csharp: "new Solution().MinimumDeletions({s})"
    kotlin: "Solution().minimumDeletions({s})"
    go: "minimumDeletions({s})"
    dart: "Solution().minimumDeletions({s})"
    swift: "Solution().minimumDeletions({s})"
    typescript: "minimumDeletions({s})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minimumDeletions(s, {result})"
    checker: |
      class Checker:
          def minimumDeletions(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              b = 0
              suffix_a = s.count('a')
              best = suffix_a
              for ch in s:
                  if ch == 'a':
                      suffix_a -= 1
                  else:
                      b += 1
                  best = min(best, b + suffix_a)
              return result == best
seed: 1653
