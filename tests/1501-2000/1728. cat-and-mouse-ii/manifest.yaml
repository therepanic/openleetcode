entry:
  id: 1728
  title: cat-and-mouse-ii
  params:
    grid:
      type: array
      items:
        type: string
    catJump:
      type: int
    mouseJump:
      type: int
  call:
    cpp: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    rust: "Solution::can_mouse_win({grid}, {catJump}, {mouseJump})"
    python3: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    python2: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    ruby: "can_mouse_win({grid}, {catJump}, {mouseJump})"
    java: "new Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    csharp: "new Solution().CanMouseWin({grid}, {catJump}, {mouseJump})"
    kotlin: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    go: "canMouseWin({grid}, {catJump}, {mouseJump})"
    dart: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    swift: "Solution().canMouseWin({grid}, {catJump}, {mouseJump})"
    typescript: "canMouseWin({grid}, {catJump}, {mouseJump})"

judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().canMouseWin(grid, catJump, mouseJump, {result})"
    checker: |
      from functools import lru_cache
      class Checker:
          def canMouseWin(self, grid, catJump, mouseJump, result):
              if not isinstance(result, bool):
                  return False
              h, w = len(grid), len(grid[0])
              walls = set()
              cat = mouse = food = None
              for r, row in enumerate(grid):
                  if not isinstance(row, str) or len(row) != w:
                      return False
                  for c, ch in enumerate(row):
                      if ch == '#':
                          walls.add((r, c))
                      elif ch == 'C':
                          cat = (r, c)
                      elif ch == 'M':
                          mouse = (r, c)
                      elif ch == 'F':
                          food = (r, c)
              if cat is None or mouse is None or food is None:
                  return False
              dirs = ((1, 0), (-1, 0), (0, 1), (0, -1))
              def moves(pos, jump):
                  r, c = pos
                  yield pos
                  for dr, dc in dirs:
                      for step in range(1, jump + 1):
                          nr, nc = r + dr * step, c + dc * step
                          if not (0 <= nr < h and 0 <= nc < w) or (nr, nc) in walls:
                              break
                          yield (nr, nc)
              @lru_cache(None)
              def win(cp, mp, turn):
                  if cp == food or cp == mp or turn >= 2 * h * w:
                      return False
                  if mp == food:
                      return True
                  if turn % 2 == 0:
                      return any(win(cp, np, turn + 1) for np in moves(mp, mouseJump))
                  return all(win(np, mp, turn + 1) for np in moves(cp, catJump))
              return result == win(cat, mouse, 0)

seed: 1728

