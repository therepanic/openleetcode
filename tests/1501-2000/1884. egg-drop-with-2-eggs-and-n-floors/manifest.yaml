judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().twoEggDrop(n, {result})"
    checker: |
      class Checker:
          def twoEggDrop(self, n, result):
              moves = 0
              covered = 0
              while covered < n:
                  moves += 1
                  covered += moves
              return result == moves

