      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().averageWaitingTime({customers})"
    rust: "Solution::average_waiting_time({customers})"
    python3: "Solution().averageWaitingTime({customers})"
    python2: "Solution().averageWaitingTime({customers})"
    ruby: "average_waiting_time({customers})"
    java: "new Solution().averageWaitingTime({customers})"
    csharp: "new Solution().AverageWaitingTime({customers})"
    kotlin: "Solution().averageWaitingTime({customers})"
    go: "averageWaitingTime({customers})"
    dart: "Solution().averageWaitingTime({customers})"
    swift: "Solution().averageWaitingTime({customers})"
    typescript: "averageWaitingTime({customers})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().averageWaitingTime(customers, {result})"
    checker: |
      import math

      class Checker:
          def averageWaitingTime(self, customers, result):
              if not isinstance(customers, list) or not customers:
                  return False
              previous = 0
              total = 0
              last_arrival = 0
              for customer in customers:
                  if not isinstance(customer, list) or len(customer) != 2:
                      return False
                  arrival, duration = customer
                  if not isinstance(arrival, int) or not isinstance(duration, int):
                      return False
                  if arrival < 1 or arrival > 10000 or duration < 1 or duration > 10000:
                      return False
                  if arrival < last_arrival:
                      return False
                  last_arrival = arrival
                  previous = max(previous, arrival) + duration
                  total += previous - arrival
              expected = total / float(len(customers))
              return isinstance(result, (int, float)) and math.isfinite(result) and abs(result - expected) <= 1e-5

