entry:
  id: 1863
  title: "sum-of-all-subset-xor-totals"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().subsetXORSum({nums})"
    rust: "Solution::subset_xor_sum({nums})"
    python3: "Solution().subsetXORSum({nums})"
    python2: "Solution().subsetXORSum({nums})"
    ruby: "subset_xor_sum({nums})"
    java: "new Solution().subsetXORSum({nums})"
    csharp: "new Solution().SubsetXORSum({nums})"
    kotlin: "Solution().subsetXORSum({nums})"
    go: "subsetXORSum({nums})"
    dart: "Solution().subsetXORSum({nums})"
    swift: "Solution().subsetXORSum({nums})"
    typescript: "subsetXORSum({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().subsetXORSum(nums, {result})"
    checker: |
      class Checker:
          def subsetXORSum(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = 0
              for value in nums:
                  total |= value
              return result == total * (1 << (len(nums) - 1))

seed: 1863

