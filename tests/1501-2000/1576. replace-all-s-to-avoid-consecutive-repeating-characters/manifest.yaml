entry:
  id: 1576
  title: "replace-all-s-to-avoid-consecutive-repeating-characters"
  params:
    s:
      type: string
  call:
    cpp: "Solution().modifyString({s})"
    rust: "Solution::modify_string({s})"
    python3: "Solution().modifyString({s})"
    python2: "Solution().modifyString({s})"
    ruby: "modify_string({s})"
    java: "new Solution().modifyString({s})"
    csharp: "new Solution().ModifyString({s})"
    kotlin: "Solution().modifyString({s})"
    go: "modifyString({s})"
    dart: "Solution().modifyString({s})"
    swift: "Solution().modifyString({s})"
    typescript: "modifyString({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().modifyString(s, {result})"
    checker: |
      class Checker:
          def modifyString(self, s, result):
              if not isinstance(result, str) or len(result) != len(s):
                  return False
              for original, actual in zip(s, result):
                  if original != '?' and actual != original:
                      return False
                  if original == '?' and not ('a' <= actual <= 'z'):
                      return False
              return all(result[i] != result[i - 1] for i in range(1, len(result)))

