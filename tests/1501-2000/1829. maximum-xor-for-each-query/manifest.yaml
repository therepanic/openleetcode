entry:
  id: 1829
  title: "maximum-xor-for-each-query"
  params:
    nums:
      type: array
      items:
        type: int
    maximumBit:
      type: int
  call:
    cpp: "Solution().getMaximumXor({nums}, {maximumBit})"
    rust: "Solution::get_maximum_xor({nums}, {maximumBit})"
    python3: "Solution().getMaximumXor({nums}, {maximumBit})"
    python2: "Solution().getMaximumXor({nums}, {maximumBit})"
    ruby: "get_maximum_xor({nums}, {maximumBit})"
    java: "new Solution().getMaximumXor({nums}, {maximumBit})"
    csharp: "new Solution().GetMaximumXor({nums}, {maximumBit})"
    kotlin: "Solution().getMaximumXor({nums}, {maximumBit})"
    go: "getMaximumXor({nums}, {maximumBit})"
    dart: "Solution().getMaximumXor({nums}, {maximumBit})"
    swift: "Solution().getMaximumXor({nums}, {maximumBit})"
    typescript: "getMaximumXor({nums}, {maximumBit})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getMaximumXor(nums, maximumBit, {result})"
    checker: |
      class Checker:
          def getMaximumXor(self, nums, maximumBit, result):
              if not isinstance(result, list) or len(result) != len(nums):
                  return False
              mask = (1 << maximumBit) - 1
              prefix = 0
              expected = []
              for value in nums:
                  prefix ^= value
                  expected.append(prefix)
              expected = [mask ^ value for value in reversed(expected)]
              return result == expected

seed: 1829

