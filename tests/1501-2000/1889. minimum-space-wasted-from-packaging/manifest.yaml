entry:
  id: 1889
  title: minimum-space-wasted-from-packaging
  params:
    packages:
      type: array
      items:
        type: int
    boxes:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minWastedSpace({packages}, {boxes})"
    rust: "Solution::min_wasted_space({packages}, {boxes})"
    python3: "Solution().minWastedSpace({packages}, {boxes})"
    python2: "Solution().minWastedSpace({packages}, {boxes})"
    ruby: "min_wasted_space({packages}, {boxes})"
    java: "new Solution().minWastedSpace({packages}, {boxes})"
    csharp: "new Solution().MinWastedSpace({packages}, {boxes})"
    kotlin: "Solution().minWastedSpace({packages}, {boxes})"
    go: "minWastedSpace({packages}, {boxes})"
    dart: "Solution().minWastedSpace({packages}, {boxes})"
    swift: "Solution().minWastedSpace({packages}, {boxes})"
    typescript: "minWastedSpace({packages}, {boxes})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(packages, boxes, {result})"
    checker: |
      from bisect import bisect_right
      class Checker:
          def check(self, packages, boxes, result):
              if not isinstance(result, int):
                  return False
              p = sorted(packages)
              total = sum(p)
              best = None
              for supplier in boxes:
                  b = sorted(supplier)
                  i = 0
                  gross = 0
                  for size in b:
                      j = bisect_right(p, size, i)
                      gross += size * (j - i)
                      i = j
                      if i == len(p):
                          break
                  if i == len(p):
                      best = gross if best is None else min(best, gross)
              expected = -1 if best is None else (best - total) % (10 ** 9 + 7)
              return result == expected

seed: 1889

