entry:
  id: 1935
  title: "maximum-number-of-words-you-can-type"
  params:
    broken:
      type: string
    text:
      type: string
  call:
    cpp: "Solution().canBeTypedWords({text}, {broken})"
    rust: "Solution::can_be_typed_words({text}, {broken})"
    python3: "Solution().canBeTypedWords({text}, {broken})"
    python2: "Solution().canBeTypedWords({text}, {broken})"
    ruby: "can_be_typed_words({text}, {broken})"
    java: "new Solution().canBeTypedWords({text}, {broken})"
    csharp: "new Solution().CanBeTypedWords({text}, {broken})"
    kotlin: "Solution().canBeTypedWords({text}, {broken})"
    go: "canBeTypedWords({text}, {broken})"
    dart: "Solution().canBeTypedWords({text}, {broken})"
    swift: "Solution().canBeTypedWords({text}, {broken})"
    typescript: "canBeTypedWords({text}, {broken})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().canBeTypedWords(text, broken, {result})"
    checker: |
      class Checker:
          def canBeTypedWords(self, text, broken, result):
              if not isinstance(text, str) or not isinstance(broken, str):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              broken = set(broken)
              expected = sum(1 for word in text.split(" ") if all(ch not in broken for ch in word))
              return result == expected

seed: 1935

