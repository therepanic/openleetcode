entry:
  id: 1864
  title: "minimum-number-of-swaps-to-make-the-binary-string-alternating"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minSwaps({s})"
    rust: "Solution::min_swaps({s})"
    python3: "Solution().minSwaps({s})"
    python2: "Solution().minSwaps({s})"
    ruby: "min_swaps({s})"
    java: "new Solution().minSwaps({s})"
    csharp: "new Solution().MinSwaps({s})"
    kotlin: "Solution().minSwaps({s})"
    go: "minSwaps({s})"
    dart: "Solution().minSwaps({s})"
    swift: "Solution().minSwaps({s})"
    typescript: "minSwaps({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minSwaps(s, {result})"
    checker: |
      class Checker:
          def minSwaps(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              zeros = s.count("0")
              ones = len(s) - zeros
              if abs(zeros - ones) > 1:
                  return result == -1

              def mismatches(start):
                  other = "1" if start == "0" else "0"
                  bad = sum(ch != (start if i % 2 == 0 else other)
                            for i, ch in enumerate(s))
                  return bad // 2

              if zeros == ones:
                  expected = min(mismatches("0"), mismatches("1"))
              elif zeros > ones:
                  expected = mismatches("0")
              else:
                  expected = mismatches("1")
              return result == expected

seed: 1864

