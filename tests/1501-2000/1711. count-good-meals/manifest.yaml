entry:
  id: 1711
  title: "count-good-meals"
  params:
    deliciousness:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countPairs({deliciousness})"
    rust: "Solution::count_pairs({deliciousness})"
    python3: "Solution().countPairs({deliciousness})"
    python2: "Solution().countPairs({deliciousness})"
    ruby: "count_pairs({deliciousness})"
    java: "new Solution().countPairs({deliciousness})"
    csharp: "new Solution().CountPairs({deliciousness})"
    kotlin: "Solution().countPairs({deliciousness})"
    go: "countPairs({deliciousness})"
    dart: "Solution().countPairs({deliciousness})"
    swift: "Solution().countPairs({deliciousness})"
    typescript: "countPairs({deliciousness})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countPairs(deliciousness, {result})"
    checker: |
      class Checker:
          def countPairs(self, deliciousness, result):
              mod = 1000000007
              counts = {}
              expected = 0
              for value in deliciousness:
                  for power in (1, 2, 4, 8, 16, 32, 64, 128, 256, 512,
                                1024, 2048, 4096, 8192, 16384, 32768,
                                65536, 131072, 262144, 524288, 1048576,
                                2097152):
                      expected += counts.get(power - value, 0)
                  counts[value] = counts.get(value, 0) + 1
              return isinstance(result, int) and result == expected % mod

seed: 1711

