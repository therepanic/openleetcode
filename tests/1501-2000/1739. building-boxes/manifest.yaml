limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimumBoxes(n, {result})"
    checker: |
      class Checker:
          def minimumBoxes(self, n, result):
              if not isinstance(n, int) or isinstance(n, bool) or n < 1 or n > 1000000000:
                  return False
              if not isinstance(result, int) or isinstance(result, bool) or result < 1:
                  return False
              x = 0
              while (x + 1) * (x + 2) * (x + 3) // 6 <= n:
                  x += 1
              full = x * (x + 1) * (x + 2) // 6
              base = x * (x + 1) // 2
              remainder = n - full
              extra = 0
              layer = 1
              while remainder > 0:
                  extra += 1
                  remainder -= layer
                  layer += 1
              return result == base + extra

