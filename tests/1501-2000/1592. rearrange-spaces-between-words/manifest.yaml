entry:
  id: 1592
  title: "rearrange-spaces-between-words"
  params:
    text:
      type: string
  call:
    cpp: "Solution().reorderSpaces({text})"
    rust: "Solution::reorder_spaces({text})"
    python3: "Solution().reorderSpaces({text})"
    python2: "Solution().reorderSpaces({text})"
    ruby: "reorder_spaces({text})"
    java: "new Solution().reorderSpaces({text})"
    csharp: "new Solution().ReorderSpaces({text})"
    kotlin: "Solution().reorderSpaces({text})"
    go: "reorderSpaces({text})"
    dart: "Solution().reorderSpaces({text})"
    swift: "Solution().reorderSpaces({text})"
    typescript: "reorderSpaces({text})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().reorderSpaces(text, {result})"
    checker: |
      class Checker:
          def reorderSpaces(self, text, result):
              words = text.split()
              spaces = text.count(" ")
              if len(words) == 1:
                  expected = words[0] + " " * spaces
              else:
                  gap, extra = divmod(spaces, len(words) - 1)
                  expected = (" " * gap).join(words) + " " * extra
              return result == expected

seed: 1592

