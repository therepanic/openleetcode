  memory_mb: 512
oracle:
  python3:
    call: "Checker().check(n, edges, {result})"
    checker: |
      class Checker:
          def check(self, n, edges, result):
              if not isinstance(result, list) or len(result) != n - 1:
                  return False
              graph = [[] for _ in range(n)]
              for edge in edges:
                  if len(edge) != 2:
                      return False
                  u, v = edge[0] - 1, edge[1] - 1
                  graph[u].append(v)
                  graph[v].append(u)
              expected = [0] * (n - 1)
              for mask in range(1, 1 << n):
                  if mask & (mask - 1) == 0:
                      continue
                  start = (mask & -mask).bit_length() - 1
                  seen = {start}
                  queue = [start]
                  for u in queue:
                      for v in graph[u]:
                          if (mask >> v) & 1 and v not in seen:
                              seen.add(v)
                              queue.append(v)
                  if len(seen) != mask.bit_count():
                      continue
                  diameter = 0
                  for source in seen:
                      distance = {source: 0}
                      queue = [source]
                      for u in queue:
                          for v in graph[u]:
                              if (mask >> v) & 1 and v not in distance:
                                  distance[v] = distance[u] + 1
                                  queue.append(v)
                      diameter = max(diameter, max(distance.values()))
                  expected[diameter - 1] += 1
              return result == expected
