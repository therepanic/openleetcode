entry:
  id: 1860
  title: "incremental-memory-leak"
  params:
    memory1:
      type: int
    memory2:
      type: int
  call:
    cpp: "Solution().memLeak({memory1}, {memory2})"
    rust: "Solution::mem_leak({memory1}, {memory2})"
    python3: "Solution().memLeak({memory1}, {memory2})"
    python2: "Solution().memLeak({memory1}, {memory2})"
    ruby: "mem_leak({memory1}, {memory2})"
    java: "new Solution().memLeak({memory1}, {memory2})"
    csharp: "new Solution().MemLeak({memory1}, {memory2})"
    kotlin: "Solution().memLeak({memory1}, {memory2})"
    go: "memLeak({memory1}, {memory2})"
    dart: "Solution().memLeak({memory1}, {memory2})"
    swift: "Solution().memLeak({memory1}, {memory2})"
    typescript: "memLeak({memory1}, {memory2})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().memLeak(memory1, memory2, {result})"
    checker: |
      class Checker:
          def memLeak(self, memory1, memory2, result):
              if not isinstance(result, list) or len(result) != 3:
                  return False
              time = 1
              a, b = memory1, memory2
              while True:
                  if a >= b:
                      if a < time:
                          break
                      a -= time
                  else:
                      if b < time:
                          break
                      b -= time
                  time += 1
              return result == [time, a, b]

seed: 1860001

