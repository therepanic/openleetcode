entry:
  id: 1953
  title: "maximum-number-of-weeks-for-which-you-can-work"
  params:
    milestones:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().numberOfWeeks({milestones})"
    rust: "Solution::number_of_weeks({milestones})"
    python3: "Solution().numberOfWeeks({milestones})"
    python2: "Solution().numberOfWeeks({milestones})"
    ruby: "number_of_weeks({milestones})"
    java: "new Solution().numberOfWeeks({milestones})"
    csharp: "new Solution().NumberOfWeeks({milestones})"
    kotlin: "Solution().numberOfWeeks({milestones})"
    go: "numberOfWeeks({milestones})"
    dart: "Solution().numberOfWeeks({milestones})"
    swift: "Solution().numberOfWeeks({milestones})"
    typescript: "numberOfWeeks({milestones})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numberOfWeeks(milestones, {result})"
    checker: |
      class Checker:
          def numberOfWeeks(self, milestones, result):
              if not isinstance(milestones, list) or not milestones:
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or x < 1 or x > 1000000000 for x in milestones):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = sum(milestones)
              largest = max(milestones)
              expected = total if largest <= total - largest else 2 * (total - largest) + 1
              return result == expected

seed: 1953001

