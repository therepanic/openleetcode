entry:
  id: 1915
  title: "number-of-wonderful-substrings"
  params:
    word:
      type: string
  call:
    cpp: "Solution().wonderfulSubstrings({word})"
    rust: "Solution::wonderful_substrings({word})"
    python3: "Solution().wonderfulSubstrings({word})"
    python2: "Solution().wonderfulSubstrings({word})"
    ruby: "wonderful_substrings({word})"
    java: "new Solution().wonderfulSubstrings({word})"
    csharp: "new Solution().WonderfulSubstrings({word})"
    kotlin: "Solution().wonderfulSubstrings({word})"
    go: "wonderfulSubstrings({word})"
    dart: "Solution().wonderfulSubstrings({word})"
    swift: "Solution().wonderfulSubstrings({word})"
    typescript: "wonderfulSubstrings({word})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().wonderfulSubstrings(word, {result})"
    checker: |
      class Checker:
          def wonderfulSubstrings(self, word, result):
              if not isinstance(word, str) or not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not (1 <= len(word) <= 100000) or any(ch < 'a' or ch > 'j' for ch in word):
                  return False
              counts = [0] * 1024
              counts[0] = 1
              mask = 0
              expected = 0
              for ch in word:
                  mask ^= 1 << (ord(ch) - ord('a'))
                  expected += counts[mask]
                  for bit in range(10):
                      expected += counts[mask ^ (1 << bit)]
                  counts[mask] += 1
              return result == expected

seed: 1915

