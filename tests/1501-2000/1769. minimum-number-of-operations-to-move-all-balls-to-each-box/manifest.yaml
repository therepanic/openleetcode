entry:
  id: 1769
  title: "minimum-number-of-operations-to-move-all-balls-to-each-box"
  params:
    boxes:
      type: string
  call:
    cpp: "Solution().minOperations({boxes})"
    rust: "Solution::min_operations({boxes})"
    python3: "Solution().minOperations({boxes})"
    python2: "Solution().minOperations({boxes})"
    ruby: "min_operations({boxes})"
    java: "new Solution().minOperations({boxes})"
    csharp: "new Solution().MinOperations({boxes})"
    kotlin: "Solution().minOperations({boxes})"
    go: "minOperations({boxes})"
    dart: "Solution().minOperations({boxes})"
    swift: "Solution().minOperations({boxes})"
    typescript: "minOperations({boxes})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minOperations(boxes, {result})"
    checker: |
      class Checker:
          def minOperations(self, boxes, result):
              if not isinstance(boxes, str) or any(c not in '01' for c in boxes):
                  return False
              expected = []
              for target in range(len(boxes)):
                  expected.append(sum(abs(i - target) for i, c in enumerate(boxes) if c == '1'))
              return result == expected

seed: 1769

