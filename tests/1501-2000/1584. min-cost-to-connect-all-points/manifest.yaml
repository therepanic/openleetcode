  title: "min-cost-to-connect-all-points"
  params:
    points:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minCostConnectPoints({points})"
    rust: "Solution::min_cost_connect_points({points})"
    python3: "Solution().minCostConnectPoints({points})"
    python2: "Solution().minCostConnectPoints({points})"
    ruby: "min_cost_connect_points({points})"
    java: "new Solution().minCostConnectPoints({points})"
    csharp: "new Solution().MinCostConnectPoints({points})"
    kotlin: "Solution().minCostConnectPoints({points})"
    go: "minCostConnectPoints({points})"
    dart: "Solution().minCostConnectPoints({points})"
    swift: "Solution().minCostConnectPoints({points})"
    typescript: "minCostConnectPoints({points})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minCostConnectPoints(points, {result})"
    checker: |
      class Checker:
          def minCostConnectPoints(self, points, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(points)
              if n <= 0:
                  return False
              best = [10**30] * n
              used = [False] * n
              best[0] = 0
              total = 0
              for _ in range(n):
                  u = -1
                  for i in range(n):
                      if not used[i] and (u == -1 or best[i] < best[u]):
                          u = i
                  used[u] = True
                  total += best[u]
                  for v in range(n):
                      if not used[v]:
                          d = abs(points[u][0] - points[v][0]) + abs(points[u][1] - points[v][1])
                          if d < best[v]:
                              best[v] = d
              return result == total
seed: 1584
