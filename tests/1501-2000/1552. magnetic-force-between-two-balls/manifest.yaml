entry:
  id: 1552
  title: "magnetic-force-between-two-balls"
  params:
    position:
      type: array
      items:
        type: int
    m:
      type: int
  call:
    cpp: "Solution().maxDistance({position}, {m})"
    rust: "Solution::max_distance({position}, {m})"
    python3: "Solution().maxDistance({position}, {m})"
    python2: "Solution().maxDistance({position}, {m})"
    ruby: "max_distance({position}, {m})"
    java: "new Solution().maxDistance({position}, {m})"
    csharp: "new Solution().MaxDistance({position}, {m})"
    kotlin: "Solution().maxDistance({position}, {m})"
    go: "maxDistance({position}, {m})"
    dart: "Solution().maxDistance({position}, {m})"
    swift: "Solution().maxDistance({position}, {m})"
    typescript: "maxDistance({position}, {m})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxDistance(position, m, {result})"
    checker: |
      class Checker:
          def maxDistance(self, position, m, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              a = sorted(position)
              lo, hi = 1, a[-1] - a[0]
              best = 0
              while lo <= hi:
                  mid = (lo + hi) // 2
                  count = 1
                  last = a[0]
                  for value in a[1:]:
                      if value - last >= mid:
                          count += 1
                          last = value
                  if count >= m:
                      best = mid
                      lo = mid + 1
                  else:
                      hi = mid - 1
              return result == best

