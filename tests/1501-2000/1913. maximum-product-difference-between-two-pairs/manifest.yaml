entry:
  id: 1913
  title: "maximum-product-difference-between-two-pairs"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxProductDifference({nums})"
    rust: "Solution::max_product_difference({nums})"
    python3: "Solution().maxProductDifference({nums})"
    python2: "Solution().maxProductDifference({nums})"
    ruby: "max_product_difference({nums})"
    java: "new Solution().maxProductDifference({nums})"
    csharp: "new Solution().MaxProductDifference({nums})"
    kotlin: "Solution().maxProductDifference({nums})"
    go: "maxProductDifference({nums})"
    dart: "Solution().maxProductDifference({nums})"
    swift: "Solution().maxProductDifference({nums})"
    typescript: "maxProductDifference({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxProductDifference(nums, {result})"
    checker: |
      class Checker:
          def maxProductDifference(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(nums, list) or len(nums) < 4:
                  return False
              values = sorted(nums)
              expected = values[-1] * values[-2] - values[0] * values[1]
              return result == expected

seed: 1913

