  id: 1954
  title: "minimum-garden-perimeter-to-collect-enough-apples"
  params:
    neededApples:
      type: long
  call:
    cpp: "Solution().minimumPerimeter({neededApples})"
    rust: "Solution::minimum_perimeter({neededApples})"
    python3: "Solution().minimumPerimeter({neededApples})"
    python2: "Solution().minimumPerimeter({neededApples})"
    ruby: "minimum_perimeter({neededApples})"
    java: "new Solution().minimumPerimeter({neededApples})"
    csharp: "new Solution().MinimumPerimeter({neededApples})"
    kotlin: "Solution().minimumPerimeter({neededApples})"
    go: "minimumPerimeter({neededApples})"
    dart: "Solution().minimumPerimeter({neededApples})"
    swift: "Solution().minimumPerimeter({neededApples})"
    typescript: "minimumPerimeter({neededApples})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minimumPerimeter(neededApples, {result})"
    checker: |
      class Checker:
          def minimumPerimeter(self, neededApples, result):
              if not isinstance(neededApples, int) or not isinstance(result, int):
                  return False
              if neededApples < 1 or result < 8 or result % 8 != 0:
                  return False
              k = result // 8
              apples = 2 * k * (k + 1) * (2 * k + 1)
              if apples < neededApples:
                  return False
              previous = k - 1
              return previous == 0 or 2 * previous * (previous + 1) * (2 * previous + 1) < neededApples

