      items:
        type: array
        items:
          type: int
    grid2:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countSubIslands({grid1}, {grid2})"
    rust: "Solution::count_sub_islands({grid1}, {grid2})"
    python3: "Solution().countSubIslands({grid1}, {grid2})"
    python2: "Solution().countSubIslands({grid1}, {grid2})"
    ruby: "count_sub_islands({grid1}, {grid2})"
    java: "new Solution().countSubIslands({grid1}, {grid2})"
    csharp: "new Solution().CountSubIslands({grid1}, {grid2})"
    kotlin: "Solution().countSubIslands({grid1}, {grid2})"
    go: "countSubIslands({grid1}, {grid2})"
    dart: "Solution().countSubIslands({grid1}, {grid2})"
