judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countSubIslands(grid1, grid2, {result})"
    checker: |
      class Checker:
          def countSubIslands(self, grid1, grid2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              m, n = len(grid1), len(grid1[0])
              seen = [[False] * n for _ in range(m)]
              expected = 0
              for i in range(m):
                  for j in range(n):
                      if grid2[i][j] != 1 or seen[i][j]:
                          continue
                      stack = [(i, j)]
                      seen[i][j] = True
                      valid = True
                      while stack:
                          r, c = stack.pop()
                          if grid1[r][c] != 1:
                              valid = False
                          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                              nr, nc = r + dr, c + dc
                              if 0 <= nr < m and 0 <= nc < n and grid2[nr][nc] == 1 and not seen[nr][nc]:
                                  seen[nr][nc] = True
                                  stack.append((nr, nc))
                      expected += int(valid)
              return result == expected

seed: 1905

