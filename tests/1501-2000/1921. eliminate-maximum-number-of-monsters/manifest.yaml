entry:
  id: 1921
  title: eliminate-maximum-number-of-monsters
  params:
    dist:
      type: array
      items:
        type: int
    speed:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().eliminateMaximum({dist}, {speed})"
    rust: "Solution::eliminate_maximum({dist}, {speed})"
    python3: "Solution().eliminateMaximum({dist}, {speed})"
    python2: "Solution().eliminateMaximum({dist}, {speed})"
    ruby: "eliminate_maximum({dist}, {speed})"
    java: "new Solution().eliminateMaximum({dist}, {speed})"
    csharp: "new Solution().EliminateMaximum({dist}, {speed})"
    kotlin: "Solution().eliminateMaximum({dist}, {speed})"
    go: "eliminateMaximum({dist}, {speed})"
    dart: "Solution().eliminateMaximum({dist}, {speed})"
    swift: "Solution().eliminateMaximum({dist}, {speed})"
    typescript: "eliminateMaximum({dist}, {speed})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(dist, speed, {result})"
    checker: |
      class Checker:
          def check(self, dist, speed, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if len(dist) != len(speed) or not dist:
                  return False
              arrival = sorted((d + s - 1) // s for d, s in zip(dist, speed))
              expected = len(arrival)
              for minute, time in enumerate(arrival):
                  if time <= minute:
                      expected = minute
                      break
              return result == expected

seed: 1921

