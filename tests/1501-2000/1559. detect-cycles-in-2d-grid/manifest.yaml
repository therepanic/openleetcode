entry:
  id: 1559
  title: "detect-cycles-in-2d-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: char
  call:
    cpp: "Solution().containsCycle({grid})"
    rust: "Solution::contains_cycle({grid})"
    python3: "Solution().containsCycle({grid})"
    python2: "Solution().containsCycle({grid})"
    ruby: "contains_cycle({grid})"
    java: "new Solution().containsCycle({grid})"
    csharp: "new Solution().ContainsCycle({grid})"
    kotlin: "Solution().containsCycle({grid})"
    go: "containsCycle({grid})"
    dart: "Solution().containsCycle({grid})"
    swift: "Solution().containsCycle({grid})"
    typescript: "containsCycle({grid})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().containsCycle(grid, {result})"
    checker: |
      from collections import deque
      class Checker:
          def containsCycle(self, grid, result):
              if not isinstance(result, bool):
                  return False
              rows = len(grid)
              cols = len(grid[0]) if rows else 0
              seen = [[False] * cols for _ in range(rows)]
              for sr in range(rows):
                  for sc in range(cols):
                      if seen[sr][sc]:
                          continue
                      seen[sr][sc] = True
                      queue = deque([(sr, sc, -1, -1)])
                      while queue:
                          r, c, pr, pc = queue.popleft()
                          for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                              nr, nc = r + dr, c + dc
                              if nr < 0 or nr >= rows or nc < 0 or nc >= cols:
                                  continue
                              if grid[nr][nc] != grid[r][c] or (nr == pr and nc == pc):
                                  continue
                              if seen[nr][nc]:
                                  return result is True
                              seen[nr][nc] = True
                              queue.append((nr, nc, r, c))
              return result is False

