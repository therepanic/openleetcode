entry:
  id: 1869
  title: "longer-contiguous-segments-of-ones-than-zeros"
  params:
    s:
      type: string
  call:
    cpp: "Solution().checkZeroOnes({s})"
    rust: "Solution::check_zero_ones({s})"
    python3: "Solution().checkZeroOnes({s})"
    python2: "Solution().checkZeroOnes({s})"
    ruby: "check_zero_ones({s})"
    java: "new Solution().checkZeroOnes({s})"
    csharp: "new Solution().CheckZeroOnes({s})"
    kotlin: "Solution().checkZeroOnes({s})"
    go: "checkZeroOnes({s})"
    dart: "Solution().checkZeroOnes({s})"
    swift: "Solution().checkZeroOnes({s})"
    typescript: "checkZeroOnes({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().checkZeroOnes(s, {result})"
    checker: |
      class Checker:
          def checkZeroOnes(self, s, result):
              if not isinstance(result, bool):
                  return False
              best = {'0': 0, '1': 0}
              current = {'0': 0, '1': 0}
              previous = None
              for ch in s:
                  if ch not in ('0', '1'):
                      return False
                  if ch == previous:
                      current[ch] += 1
                  else:
                      current[ch] = 1
                      previous = ch
                  if current[ch] > best[ch]:
                      best[ch] = current[ch]
              return result == (best['1'] > best['0'])

