entry:
  id: 1815
  title: "maximum-number-of-groups-getting-fresh-donuts"
  params:
    batchSize:
      type: int
    groups:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxHappyGroups({batchSize}, {groups})"
    rust: "Solution::max_happy_groups({batchSize}, {groups})"
    python3: "Solution().maxHappyGroups({batchSize}, {groups})"
    python2: "Solution().maxHappyGroups({batchSize}, {groups})"
    ruby: "max_happy_groups({batchSize}, {groups})"
    java: "new Solution().maxHappyGroups({batchSize}, {groups})"
    csharp: "new Solution().MaxHappyGroups({batchSize}, {groups})"
    kotlin: "Solution().maxHappyGroups({batchSize}, {groups})"
    go: "maxHappyGroups({batchSize}, {groups})"
    dart: "Solution().maxHappyGroups({batchSize}, {groups})"
    swift: "Solution().maxHappyGroups({batchSize}, {groups})"
    typescript: "maxHappyGroups({batchSize}, {groups})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxHappyGroups(batchSize, groups, {result})"
    checker: |
      class Checker:
          def maxHappyGroups(self, batchSize, groups, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not (1 <= batchSize <= 9) or not (1 <= len(groups) <= 30):
                  return False
              counts = [0] * batchSize
              base = 0
              for value in groups:
                  remainder = value % batchSize
                  if remainder == 0:
                      base += 1
                  else:
                      counts[remainder] += 1

              memo = {}
              def search(state, remainder):
                  key = (state, remainder)
                  if key in memo:
                      return memo[key]
                  if not any(state):
                      return 0
                  best = 0
                  for index, count in enumerate(state):
                      if count == 0:
                          continue
                      next_state = list(state)
                      next_state[index] -= 1
                      gained = 1 if remainder == 0 else 0
                      next_remainder = (remainder + index + 1) % batchSize
                      best = max(best, gained + search(tuple(next_state), next_remainder))
                  memo[key] = best
                  return best

              expected = base + search(tuple(counts[1:]), 0)
              return result == expected

