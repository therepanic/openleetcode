entry:
  id: 1812
  title: "determine-color-of-a-chessboard-square"
  params:
    coordinates:
      type: string
  call:
    cpp: "Solution().squareIsWhite({coordinates})"
    rust: "Solution::square_is_white({coordinates})"
    python3: "Solution().squareIsWhite({coordinates})"
    python2: "Solution().squareIsWhite({coordinates})"
    ruby: "square_is_white({coordinates})"
    java: "new Solution().squareIsWhite({coordinates})"
    csharp: "new Solution().SquareIsWhite({coordinates})"
    kotlin: "Solution().squareIsWhite({coordinates})"
    go: "squareIsWhite({coordinates})"
    dart: "Solution().squareIsWhite({coordinates})"
    swift: "Solution().squareIsWhite({coordinates})"
    typescript: "squareIsWhite({coordinates})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().squareIsWhite(coordinates, {result})"
    checker: |
      class Checker:
          def squareIsWhite(self, coordinates, result):
              expected = (ord(coordinates[0]) - int(coordinates[1])) % 2 != 0
              return result is expected

seed: 1812

