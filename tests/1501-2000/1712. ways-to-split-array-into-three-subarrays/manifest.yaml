entry:
  id: 1712
  title: "ways-to-split-array-into-three-subarrays"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().waysToSplit({nums})"
    rust: "Solution::ways_to_split({nums})"
    python3: "Solution().waysToSplit({nums})"
    python2: "Solution().waysToSplit({nums})"
    ruby: "ways_to_split({nums})"
    java: "new Solution().waysToSplit({nums})"
    csharp: "new Solution().WaysToSplit({nums})"
    kotlin: "Solution().waysToSplit({nums})"
    go: "waysToSplit({nums})"
    dart: "Solution().waysToSplit({nums})"
    swift: "Solution().waysToSplit({nums})"
    typescript: "waysToSplit({nums})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().waysToSplit(nums, {result})"
    checker: |
      from bisect import bisect_left, bisect_right

      class Checker:
          def waysToSplit(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if len(nums) < 3 or any(not isinstance(x, int) or x < 0 for x in nums):
                  return False
              prefix = []
              total = 0
              for value in nums:
                  total += value
                  prefix.append(total)
              expected = 0
              end = len(nums) - 1
              for left_end in range(len(nums) - 2):
                  left = prefix[left_end]
                  first = bisect_left(prefix, 2 * left, left_end + 1, end)
                  last = bisect_right(prefix, (total + left) // 2, first, end)
                  expected = (expected + max(0, last - first)) % 1000000007
              return result == expected
