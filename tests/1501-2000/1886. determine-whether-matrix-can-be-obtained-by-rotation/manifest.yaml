entry:
  id: 1886
  title: "determine-whether-matrix-can-be-obtained-by-rotation"
  params:
    mat:
      type: array
      items:
        type: array
        items:
          type: int
    target:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findRotation({mat}, {target})"
    rust: "Solution::find_rotation({mat}, {target})"
    python3: "Solution().findRotation({mat}, {target})"
    python2: "Solution().findRotation({mat}, {target})"
    ruby: "find_rotation({mat}, {target})"
    java: "new Solution().findRotation({mat}, {target})"
    csharp: "new Solution().FindRotation({mat}, {target})"
    kotlin: "Solution().findRotation({mat}, {target})"
    go: "findRotation({mat}, {target})"
    dart: "Solution().findRotation({mat}, {target})"
    swift: "Solution().findRotation({mat}, {target})"
    typescript: "findRotation({mat}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findRotation(mat, target, {result})"
    checker: |
      class Checker:
          def findRotation(self, mat, target, result):
              if not isinstance(result, bool):
                  return False
              current = mat
              for _ in range(4):
                  if current == target:
                      return result is True
                  current = [list(row) for row in zip(*current[::-1])]
              return result is False

seed: 1886

