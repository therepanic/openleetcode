entry:
  id: 1735
  title: "count-ways-to-make-array-with-product"
  params:
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().waysToFillArray({queries})"
    rust: "Solution::ways_to_fill_array({queries})"
    python3: "Solution().waysToFillArray({queries})"
    python2: "Solution().waysToFillArray({queries})"
    ruby: "ways_to_fill_array({queries})"
    java: "new Solution().waysToFillArray({queries})"
    csharp: "new Solution().WaysToFillArray({queries})"
    kotlin: "Solution().waysToFillArray({queries})"
    go: "waysToFillArray({queries})"
    dart: "Solution().waysToFillArray({queries})"
    swift: "Solution().waysToFillArray({queries})"
    typescript: "waysToFillArray({queries})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().waysToFillArray(queries, {result})"
    checker: |
      class Checker:
          def waysToFillArray(self, queries, result):
              mod = 1000000007
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              expected = []
              for query in queries:
                  n, value = query
                  counts = {}
                  p = 2
                  while p * p <= value:
                      while value % p == 0:
                          counts[p] = counts.get(p, 0) + 1
                          value //= p
                      p += 1
                  if value > 1:
                      counts[value] = counts.get(value, 0) + 1
                  ways = 1
                  for exponent in counts.values():
                      ways = ways * __import__('math').comb(n + exponent - 1, exponent) % mod
                  expected.append(ways)
              return result == expected

seed: 1735

