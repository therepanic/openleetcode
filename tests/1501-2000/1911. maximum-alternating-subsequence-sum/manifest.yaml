entry:
  id: 1911
  title: "maximum-alternating-subsequence-sum"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxAlternatingSum({nums})"
    rust: "Solution::max_alternating_sum({nums})"
    python3: "Solution().maxAlternatingSum({nums})"
    python2: "Solution().maxAlternatingSum({nums})"
    ruby: "max_alternating_sum({nums})"
    java: "new Solution().maxAlternatingSum({nums})"
    csharp: "new Solution().MaxAlternatingSum({nums})"
    kotlin: "Solution().maxAlternatingSum({nums})"
    go: "maxAlternatingSum({nums})"
    dart: "Solution().maxAlternatingSum({nums})"
    swift: "Solution().maxAlternatingSum({nums})"
    typescript: "maxAlternatingSum({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxAlternatingSum(nums, {result})"
    checker: |
      class Checker:
          def maxAlternatingSum(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              add = 0
              subtract = 0
              for value in nums:
                  add, subtract = max(add, subtract + value), max(subtract, add - value)
              return result == add

seed: 1911

