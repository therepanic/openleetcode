entry:
  id: 1759
  title: "count-number-of-homogenous-substrings"
  params:
    s:
      type: string
  call:
    cpp: "Solution().countHomogenous({s})"
    rust: "Solution::count_homogenous({s})"
    python3: "Solution().countHomogenous({s})"
    python2: "Solution().countHomogenous({s})"
    ruby: "count_homogenous({s})"
    java: "new Solution().countHomogenous({s})"
    csharp: "new Solution().CountHomogenous({s})"
    kotlin: "Solution().countHomogenous({s})"
    go: "countHomogenous({s})"
    dart: "Solution().countHomogenous({s})"
    swift: "Solution().countHomogenous({s})"
    typescript: "countHomogenous({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countHomogenous(s, {result})"
    checker: |
      class Checker:
          def countHomogenous(self, s, result):
              mod = 1000000007
              total = 0
              run = 0
              previous = None
              for ch in s:
                  if ch == previous:
                      run += 1
                  else:
                      run = 1
                      previous = ch
                  total = (total + run) % mod
              return result == total

