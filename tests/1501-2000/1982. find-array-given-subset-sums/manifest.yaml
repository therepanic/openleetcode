entry:
  id: 1982
  title: "find-array-given-subset-sums"
  params:
    n:
      type: int
    sums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().recoverArray({n}, {sums})"
    rust: "Solution::recover_array({n}, {sums})"
    python3: "Solution().recoverArray({n}, {sums})"
    python2: "Solution().recoverArray({n}, {sums})"
    ruby: "recover_array({n}, {sums})"
    java: "new Solution().recoverArray({n}, {sums})"
    csharp: "new Solution().RecoverArray({n}, {sums})"
    kotlin: "Solution().recoverArray({n}, {sums})"
    go: "recoverArray({n}, {sums})"
    dart: "Solution().recoverArray({n}, {sums})"
    swift: "Solution().recoverArray({n}, {sums})"
    typescript: "recoverArray({n}, {sums})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().recover(n, sums, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def recover(self, n, sums, result):
              if not isinstance(result, list) or len(result) != n:
                  return False
              if any(not isinstance(x, int) for x in result):
                  return False
              values = [0]
              for x in result:
                  values += [v + x for v in values]
              return Counter(values) == Counter(sums)
seed: 1982
