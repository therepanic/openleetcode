entry:
  id: 1572
  title: "matrix-diagonal-sum"
  params:
    mat:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().diagonalSum({mat})"
    rust: "Solution::diagonal_sum({mat})"
    python3: "Solution().diagonalSum({mat})"
    python2: "Solution().diagonalSum({mat})"
    ruby: "diagonal_sum({mat})"
    java: "new Solution().diagonalSum({mat})"
    csharp: "new Solution().DiagonalSum({mat})"
    kotlin: "Solution().diagonalSum({mat})"
    go: "diagonalSum({mat})"
    dart: "Solution().diagonalSum({mat})"
    swift: "Solution().diagonalSum({mat})"
    typescript: "diagonalSum({mat})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().diagonalSum(mat, {result})"
    checker: |
      class Checker:
          def diagonalSum(self, mat, result):
              n = len(mat)
              expected = sum(mat[i][i] + mat[i][n - 1 - i] for i in range(n))
              if n % 2 == 1:
                  expected -= mat[n // 2][n // 2]
              return result == expected

seed: 1572

