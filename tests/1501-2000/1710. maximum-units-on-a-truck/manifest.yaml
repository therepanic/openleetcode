entry:
  id: 1710
  title: "maximum-units-on-a-truck"
  params:
    boxTypes:
      type: array
      items:
        type: array
        items:
          type: int
    truckSize:
      type: int
  call:
    cpp: "Solution().maximumUnits({boxTypes}, {truckSize})"
    rust: "Solution::maximum_units({boxTypes}, {truckSize})"
    python3: "Solution().maximumUnits({boxTypes}, {truckSize})"
    python2: "Solution().maximumUnits({boxTypes}, {truckSize})"
    ruby: "maximum_units({boxTypes}, {truckSize})"
    java: "new Solution().maximumUnits({boxTypes}, {truckSize})"
    csharp: "new Solution().MaximumUnits({boxTypes}, {truckSize})"
    kotlin: "Solution().maximumUnits({boxTypes}, {truckSize})"
    go: "maximumUnits({boxTypes}, {truckSize})"
    dart: "Solution().maximumUnits({boxTypes}, {truckSize})"
    swift: "Solution().maximumUnits({boxTypes}, {truckSize})"
    typescript: "maximumUnits({boxTypes}, {truckSize})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumUnits(boxTypes, truckSize, {result})"
    checker: |
      class Checker:
          def maximumUnits(self, boxTypes, truckSize, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              remaining = truckSize
              expected = 0
              for count, units in sorted(boxTypes, key=lambda pair: pair[1], reverse=True):
                  take = min(remaining, count)
                  expected += take * units
                  remaining -= take
                  if remaining == 0:
                      break
              return result == expected

seed: 1710

