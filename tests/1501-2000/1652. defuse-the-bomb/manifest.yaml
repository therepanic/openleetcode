entry:
  id: 1652
  title: "defuse-the-bomb"
  params:
    code:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().decrypt({code}, {k})"
    rust: "Solution::decrypt({code}, {k})"
    python3: "Solution().decrypt({code}, {k})"
    python2: "Solution().decrypt({code}, {k})"
    ruby: "decrypt({code}, {k})"
    java: "new Solution().decrypt({code}, {k})"
    csharp: "new Solution().Decrypt({code}, {k})"
    kotlin: "Solution().decrypt({code}, {k})"
    go: "decrypt({code}, {k})"
    dart: "Solution().decrypt({code}, {k})"
    swift: "Solution().decrypt({code}, {k})"
    typescript: "decrypt({code}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().decrypt(code, k, {result})"
    checker: |
      class Checker:
          def decrypt(self, code, k, result):
              if not isinstance(result, list) or len(result) != len(code):
                  return False
              n = len(code)
              expected = []
              for i in range(n):
                  if k == 0:
                      expected.append(0)
                  elif k > 0:
                      expected.append(sum(code[(i + j) % n] for j in range(1, k + 1)))
                  else:
                      expected.append(sum(code[(i - j) % n] for j in range(1, -k + 1)))
              return result == expected

seed: 1652

