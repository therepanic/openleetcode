  id: 1846
  title: "maximum-element-after-decreasing-and-rearranging"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    rust: "Solution::maximum_element_after_decrementing_and_rearranging({arr})"
    python3: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    python2: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    ruby: "maximum_element_after_decrementing_and_rearranging({arr})"
    java: "new Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    csharp: "new Solution().MaximumElementAfterDecrementingAndRearranging({arr})"
    kotlin: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    go: "maximumElementAfterDecrementingAndRearranging({arr})"
    dart: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    swift: "Solution().maximumElementAfterDecrementingAndRearranging({arr})"
    typescript: "maximumElementAfterDecrementingAndRearranging({arr})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(arr, {result})"
    checker: |
      class Checker:
          def check(self, arr, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              values = sorted(arr)
              best = 0
              for value in values:
                  best = min(value, best + 1) if best else 1
              return result == best

seed: 1846

