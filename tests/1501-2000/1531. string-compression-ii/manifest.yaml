entry:
  id: 1531
  title: "string-compression-ii"
  params:
    s:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().getLengthOfOptimalCompression({s}, {k})"
    rust: "Solution::get_length_of_optimal_compression({s}, {k})"
    python3: "Solution().getLengthOfOptimalCompression({s}, {k})"
    python2: "Solution().getLengthOfOptimalCompression({s}, {k})"
    ruby: "get_length_of_optimal_compression({s}, {k})"
    java: "new Solution().getLengthOfOptimalCompression({s}, {k})"
    csharp: "new Solution().GetLengthOfOptimalCompression({s}, {k})"
    kotlin: "Solution().getLengthOfOptimalCompression({s}, {k})"
    go: "getLengthOfOptimalCompression({s}, {k})"
    dart: "Solution().getLengthOfOptimalCompression({s}, {k})"
    swift: "Solution().getLengthOfOptimalCompression({s}, {k})"
    typescript: "getLengthOfOptimalCompression({s}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getLengthOfOptimalCompression(s, k, {result})"
    checker: |
      class Checker:
          def getLengthOfOptimalCompression(self, s, k, result):
              if not isinstance(s, str) or not isinstance(k, int):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(s)
              if n < 1 or n > 100 or k < 0 or k > n:
                  return False
              if any(ch < 'a' or ch > 'z' for ch in s):
                  return False
              dp = [[10**9] * (k + 1) for _ in range(n + 1)]
              dp[0][0] = 0
              for i in range(1, n + 1):
                  for deleted in range(k + 1):
                      same = 0
                      removed = 0
                      for left in range(i, 0, -1):
                          if s[left - 1] == s[i - 1]:
                              same += 1
                          else:
                              removed += 1
                          if deleted >= removed:
                              digits = 0 if same == 1 else 1 if same < 10 else 2 if same < 100 else 3
                              dp[i][deleted] = min(dp[i][deleted], dp[left - 1][deleted - removed] + 1 + digits)
                      if deleted:
                          dp[i][deleted] = min(dp[i][deleted], dp[i - 1][deleted - 1])
              return result == dp[n][k]

