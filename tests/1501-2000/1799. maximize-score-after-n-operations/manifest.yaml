entry:
  id: 1799
  title: "maximize-score-after-n-operations"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxScore({nums})"
    rust: "Solution::max_score({nums})"
    python3: "Solution().maxScore({nums})"
    python2: "Solution().maxScore({nums})"
    ruby: "max_score({nums})"
    java: "new Solution().maxScore({nums})"
    csharp: "new Solution().MaxScore({nums})"
    kotlin: "Solution().maxScore({nums})"
    go: "maxScore({nums})"
    dart: "Solution().maxScore({nums})"
    swift: "Solution().maxScore({nums})"
    typescript: "maxScore({nums})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxScore(nums, {result})"
    checker: |
      from functools import lru_cache
      from math import gcd

      class Checker:
          def maxScore(self, nums, result):
              n = len(nums)
              if n == 0 or n % 2 or n > 14:
                  return False
              @lru_cache(None)
              def dp(op, mask):
                  if mask == (1 << n) - 1:
                      return 0
                  best = 0
                  for i in range(n):
                      if mask & (1 << i):
                          continue
                      for j in range(i + 1, n):
                          if mask & (1 << j):
                              continue
                          best = max(best, op * gcd(nums[i], nums[j]) + dp(op + 1, mask | (1 << i) | (1 << j)))
                  return best
              return isinstance(result, int) and result == dp(1, 0)

seed: 1799

