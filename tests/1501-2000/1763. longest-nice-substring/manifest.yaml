entry:
  id: 1763
  title: "longest-nice-substring"
  params:
    s:
      type: string
  call:
    cpp: "Solution().longestNiceSubstring({s})"
    rust: "Solution::longest_nice_substring({s})"
    python3: "Solution().longestNiceSubstring({s})"
    python2: "Solution().longestNiceSubstring({s})"
    ruby: "longest_nice_substring({s})"
    java: "new Solution().longestNiceSubstring({s})"
    csharp: "new Solution().LongestNiceSubstring({s})"
    kotlin: "Solution().longestNiceSubstring({s})"
    go: "longestNiceSubstring({s})"
    dart: "Solution().longestNiceSubstring({s})"
    swift: "Solution().longestNiceSubstring({s})"
    typescript: "longestNiceSubstring({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(s, {result})"
    checker: |
      class Checker:
          def check(self, s, result):
              best = ''
              for i in range(len(s)):
                  present = set()
                  for j in range(i, len(s)):
                      present.add(s[j])
                      ok = True
                      for ch in present:
                          if ch.swapcase() not in present:
                              ok = False
                              break
                      if ok and j - i + 1 > len(best):
                          best = s[i:j + 1]
              return result == best

seed: 1763

