entry:
  id: 1963
  title: "minimum-number-of-swaps-to-make-the-string-balanced"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minSwaps({s})"
    rust: "Solution::min_swaps({s})"
    python3: "Solution().minSwaps({s})"
    python2: "Solution().minSwaps({s})"
    ruby: "min_swaps({s})"
    java: "new Solution().minSwaps({s})"
    csharp: "new Solution().MinSwaps({s})"
    kotlin: "Solution().minSwaps({s})"
    go: "minSwaps({s})"
    dart: "Solution().minSwaps({s})"
    swift: "Solution().minSwaps({s})"
    typescript: "minSwaps({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minSwaps(s, {result})"
    checker: |
      class Checker:
          def minSwaps(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              balance = 0
              for ch in s:
                  if ch == '[':
                      balance += 1
                  else:
                      balance = max(0, balance - 1)
              return result == (balance + 1) // 2

seed: 1963

