        type: int
  call:
    cpp: "Solution().tupleSameProduct({nums})"
    rust: "Solution::tuple_same_product({nums})"
    python3: "Solution().tupleSameProduct({nums})"
    python2: "Solution().tupleSameProduct({nums})"
    ruby: "tuple_same_product({nums})"
    java: "new Solution().tupleSameProduct({nums})"
    csharp: "new Solution().TupleSameProduct({nums})"
    kotlin: "Solution().tupleSameProduct({nums})"
    go: "tupleSameProduct({nums})"
    dart: "Solution().tupleSameProduct({nums})"
    swift: "Solution().tupleSameProduct({nums})"
    typescript: "tupleSameProduct({nums})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().tupleSameProduct(nums, {result})"
    checker: |
      from collections import defaultdict

      class Checker:
          def tupleSameProduct(self, nums, result):
              counts = defaultdict(int)
              pairs = 0
              for i in range(len(nums)):
                  for j in range(i + 1, len(nums)):
                      product = nums[i] * nums[j]
                      pairs += counts[product]
                      counts[product] += 1
              return result == 8 * pairs

