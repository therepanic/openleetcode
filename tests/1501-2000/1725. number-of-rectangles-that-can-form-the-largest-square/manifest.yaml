entry:
  id: 1725
  title: "number-of-rectangles-that-can-form-the-largest-square"
  params:
    rectangles:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countGoodRectangles({rectangles})"
    rust: "Solution::count_good_rectangles({rectangles})"
    python3: "Solution().countGoodRectangles({rectangles})"
    python2: "Solution().countGoodRectangles({rectangles})"
    ruby: "count_good_rectangles({rectangles})"
    java: "new Solution().countGoodRectangles({rectangles})"
    csharp: "new Solution().CountGoodRectangles({rectangles})"
    kotlin: "Solution().countGoodRectangles({rectangles})"
    go: "countGoodRectangles({rectangles})"
    dart: "Solution().countGoodRectangles({rectangles})"
    swift: "Solution().countGoodRectangles({rectangles})"
    typescript: "countGoodRectangles({rectangles})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countGoodRectangles(rectangles, {result})"
    checker: |
      class Checker:
          def countGoodRectangles(self, rectangles, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not rectangles or any(not isinstance(r, list) or len(r) != 2 for r in rectangles):
                  return False
              best = max(min(r[0], r[1]) for r in rectangles)
              expected = sum(1 for r in rectangles if min(r[0], r[1]) == best)
              return result == expected

seed: 1725

