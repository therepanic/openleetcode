entry:
  id: 1849
  title: splitting-a-string-into-descending-consecutive-values
  params:
    s:
      type: string
  call:
    cpp: "Solution().splitString({s})"
    rust: "Solution::split_string({s})"
    python3: "Solution().splitString({s})"
    python2: "Solution().splitString({s})"
    ruby: "split_string({s})"
    java: "new Solution().splitString({s})"
    csharp: "new Solution().SplitString({s})"
    kotlin: "Solution().splitString({s})"
    go: "splitString({s})"
    dart: "Solution().splitString({s})"
    swift: "Solution().splitString({s})"
    typescript: "splitString({s})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().splitString(s, {result})"
    checker: |
      class Checker:
          def splitString(self, s, result):
              if not isinstance(result, bool):
                  return False
              n = len(s)
              def dfs(pos, prev):
                  if pos == n:
                      return True
                  value = 0
                  for end in range(pos, n):
                      value = value * 10 + int(s[end])
                      if prev - value == 1 and dfs(end + 1, value):
                          return True
                      if value >= prev:
                          break
                  return False
              expected = False
              for end in range(1, n):
                  if dfs(end, int(s[:end])):
                      expected = True
                      break
              return result == expected

seed: 1849

