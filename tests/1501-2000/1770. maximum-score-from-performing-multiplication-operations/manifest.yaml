entry:
  id: 1770
  title: "maximum-score-from-performing-multiplication-operations"
  params:
    nums:
      type: array
      items:
        type: int
    multipliers:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumScore({nums}, {multipliers})"
    rust: "Solution::maximum_score({nums}, {multipliers})"
    python3: "Solution().maximumScore({nums}, {multipliers})"
    python2: "Solution().maximumScore({nums}, {multipliers})"
    ruby: "maximum_score({nums}, {multipliers})"
    java: "new Solution().maximumScore({nums}, {multipliers})"
    csharp: "new Solution().MaximumScore({nums}, {multipliers})"
    kotlin: "Solution().maximumScore({nums}, {multipliers})"
    go: "maximumScore({nums}, {multipliers})"
    dart: "Solution().maximumScore({nums}, {multipliers})"
    swift: "Solution().maximumScore({nums}, {multipliers})"
    typescript: "maximumScore({nums}, {multipliers})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumScore(nums, multipliers, {result})"
    checker: |
      class Checker:
          def maximumScore(self, nums, multipliers, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              m = len(multipliers)
              if m < 1 or m > n:
                  return False
              dp = [0] * (m + 1)
              for i in range(m - 1, -1, -1):
                  nxt = [0] * (m + 1)
                  for left in range(i, -1, -1):
                      right = i - left
                      front = multipliers[i] * nums[left] + dp[right]
                      back = multipliers[i] * nums[n - 1 - right] + dp[right + 1]
                      nxt[right] = max(front, back)
                  dp = nxt
              return result == dp[0]

seed: 1770

