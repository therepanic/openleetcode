entry:
  id: 1964
  title: "find-the-longest-valid-obstacle-course-at-each-position"
  params:
    obstacles:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    rust: "Solution::longest_obstacle_course_at_each_position({obstacles})"
    python3: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    python2: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    ruby: "longest_obstacle_course_at_each_position({obstacles})"
    java: "new Solution().longestObstacleCourseAtEachPosition({obstacles})"
    csharp: "new Solution().LongestObstacleCourseAtEachPosition({obstacles})"
    kotlin: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    go: "longestObstacleCourseAtEachPosition({obstacles})"
    dart: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    swift: "Solution().longestObstacleCourseAtEachPosition({obstacles})"
    typescript: "longestObstacleCourseAtEachPosition({obstacles})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(obstacles, {result})"
    checker: |
      from bisect import bisect_right
      class Checker:
          def check(self, obstacles, result):
              if not isinstance(result, list) or len(result) != len(obstacles):
                  return False
              tails = []
              expected = []
              for value in obstacles:
                  pos = bisect_right(tails, value)
                  if pos == len(tails):
                      tails.append(value)
                  else:
                      tails[pos] = value
                  expected.append(pos + 1)
              return result == expected

seed: 1964

