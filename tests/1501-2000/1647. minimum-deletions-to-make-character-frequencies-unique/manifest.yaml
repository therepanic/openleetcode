entry:
  id: 1647
  title: "minimum-deletions-to-make-character-frequencies-unique"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minDeletions({s})"
    rust: "Solution::min_deletions({s})"
    python3: "Solution().minDeletions({s})"
    python2: "Solution().minDeletions({s})"
    ruby: "min_deletions({s})"
    java: "new Solution().minDeletions({s})"
    csharp: "new Solution().MinDeletions({s})"
    kotlin: "Solution().minDeletions({s})"
    go: "minDeletions({s})"
    dart: "Solution().minDeletions({s})"
    swift: "Solution().minDeletions({s})"
    typescript: "minDeletions({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(s, {result})"
    checker: |
      from collections import Counter
      class Checker:
          def check(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool) or result < 0:
                  return False
              freqs = sorted(Counter(s).values(), reverse=True)
              expected = 0
              for i in range(1, len(freqs)):
                  if freqs[i] >= freqs[i - 1]:
                      target = max(0, freqs[i - 1] - 1)
                      expected += freqs[i] - target
                      freqs[i] = target
              return result == expected

seed: 1647

