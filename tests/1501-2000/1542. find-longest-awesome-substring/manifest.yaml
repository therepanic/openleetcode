entry:
  id: 1542
  title: "find-longest-awesome-substring"
  params:
    s:
      type: string
  call:
    cpp: "Solution().longestAwesome({s})"
    rust: "Solution::longest_awesome({s})"
    python3: "Solution().longestAwesome({s})"
    python2: "Solution().longestAwesome({s})"
    ruby: "longest_awesome({s})"
    java: "new Solution().longestAwesome({s})"
    csharp: "new Solution().LongestAwesome({s})"
    kotlin: "Solution().longestAwesome({s})"
    go: "longestAwesome({s})"
    dart: "Solution().longestAwesome({s})"
    swift: "Solution().longestAwesome({s})"
    typescript: "longestAwesome({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().longestAwesome(s, {result})"
    checker: |
      class Checker:
          def longestAwesome(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              first = {0: -1}
              mask = 0
              best = 0
              for i, ch in enumerate(s):
                  mask ^= 1 << (ord(ch) - 48)
                  if mask in first:
                      best = max(best, i - first[mask])
                  for bit in range(10):
                      other = mask ^ (1 << bit)
                      if other in first:
                          best = max(best, i - first[other])
                  if mask not in first:
                      first[mask] = i
              return result == best

seed: 1542

