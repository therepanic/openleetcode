entry:
  id: 1922
  title: "count-good-numbers"
  params:
    n:
      type: long
  call:
    cpp: "Solution().countGoodNumbers({n})"
    rust: "Solution::count_good_numbers({n})"
    python3: "Solution().countGoodNumbers({n})"
    python2: "Solution().countGoodNumbers({n})"
    ruby: "count_good_numbers({n})"
    java: "new Solution().countGoodNumbers({n})"
    csharp: "new Solution().CountGoodNumbers({n})"
    kotlin: "Solution().countGoodNumbers({n})"
    go: "countGoodNumbers({n})"
    dart: "Solution().countGoodNumbers({n})"
    swift: "Solution().countGoodNumbers({n})"
    typescript: "countGoodNumbers({n})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countGoodNumbers(n, {result})"
    checker: |
      class Checker:
          def countGoodNumbers(self, n, result):
              if not isinstance(n, int) or not (1 <= n <= 10**15):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 10**9 + 7
              expected = (pow(5, (n + 1) // 2, mod) * pow(4, n // 2, mod)) % mod
              return result == expected

seed: 1922

