    python3: "Solution().maxBuilding({n}, {restrictions})"
    python2: "Solution().maxBuilding({n}, {restrictions})"
    ruby: "max_building({n}, {restrictions})"
    java: "new Solution().maxBuilding({n}, {restrictions})"
    csharp: "new Solution().MaxBuilding({n}, {restrictions})"
