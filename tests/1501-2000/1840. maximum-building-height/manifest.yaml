judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().maxBuilding(n, restrictions, {result})"
    checker: |
      class Checker:
          def maxBuilding(self, n, restrictions, result):
              points = [[1, 0]] + [list(x) for x in restrictions]
              points.sort()
              for i in range(1, len(points)):
                  points[i][1] = min(points[i][1], points[i - 1][1] + points[i][0] - points[i - 1][0])
              for i in range(len(points) - 2, -1, -1):
                  points[i][1] = min(points[i][1], points[i + 1][1] + points[i + 1][0] - points[i][0])
              best = 0
              for left, right in zip(points, points[1:]):
                  best = max(best, (left[1] + right[1] + right[0] - left[0]) // 2)
              best = max(best, points[-1][1] + n - points[-1][0])
              return isinstance(result, int) and result == best
