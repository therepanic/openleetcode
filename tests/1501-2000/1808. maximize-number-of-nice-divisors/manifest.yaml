entry:
  id: 1808
  title: "maximize-number-of-nice-divisors"
  params:
    primeFactors:
      type: int
  call:
    cpp: "Solution().maxNiceDivisors({primeFactors})"
    rust: "Solution::max_nice_divisors({primeFactors})"
    python3: "Solution().maxNiceDivisors({primeFactors})"
    python2: "Solution().maxNiceDivisors({primeFactors})"
    ruby: "max_nice_divisors({primeFactors})"
    java: "new Solution().maxNiceDivisors({primeFactors})"
    csharp: "new Solution().MaxNiceDivisors({primeFactors})"
    kotlin: "Solution().maxNiceDivisors({primeFactors})"
    go: "maxNiceDivisors({primeFactors})"
    dart: "Solution().maxNiceDivisors({primeFactors})"
    swift: "Solution().maxNiceDivisors({primeFactors})"
    typescript: "maxNiceDivisors({primeFactors})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(primeFactors, {result})"
    checker: |
      class Checker:
          def check(self, primeFactors, result):
              mod = 1000000007
              if primeFactors == 1:
                  expected = 1
              else:
                  remainder = primeFactors % 3
                  if remainder == 0:
                      expected = pow(3, primeFactors // 3, mod)
                  elif remainder == 1:
                      expected = 4 * pow(3, primeFactors // 3 - 1, mod) % mod
                  else:
                      expected = 2 * pow(3, primeFactors // 3, mod) % mod
              return result == expected

