entry:
  id: 1579
  title: "remove-max-number-of-edges-to-keep-graph-fully-traversable"
  params:
    n:
      type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxNumEdgesToRemove({n}, {edges})"
    rust: "Solution::max_num_edges_to_remove({n}, {edges})"
    python3: "Solution().maxNumEdgesToRemove({n}, {edges})"
    python2: "Solution().maxNumEdgesToRemove({n}, {edges})"
    ruby: "max_num_edges_to_remove({n}, {edges})"
    java: "new Solution().maxNumEdgesToRemove({n}, {edges})"
    csharp: "new Solution().MaxNumEdgesToRemove({n}, {edges})"
    kotlin: "Solution().maxNumEdgesToRemove({n}, {edges})"
    go: "maxNumEdgesToRemove({n}, {edges})"
    dart: "Solution().maxNumEdgesToRemove({n}, {edges})"
    swift: "Solution().maxNumEdgesToRemove({n}, {edges})"
    typescript: "maxNumEdgesToRemove({n}, {edges})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxNumEdgesToRemove(n, edges, {result})"
    checker: |
      class Checker:
          def maxNumEdgesToRemove(self, n, edges, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              def run(kind):
                  parent = list(range(n + 1))
                  size = [1] * (n + 1)
                  used = 0
                  def find(x):
                      while parent[x] != x:
                          parent[x] = parent[parent[x]]
                          x = parent[x]
                      return x
                  for typ, a, b in edges:
                      if typ != kind and typ != 3:
                          continue
                      ra, rb = find(a), find(b)
                      if ra != rb:
                          if size[ra] < size[rb]:
                              ra, rb = rb, ra
                          parent[rb] = ra
                          size[ra] += size[rb]
                          used += 1
                  return used
              alice = run(1)
              bob = run(2)
              expected = len(edges) - (alice + bob - sum(1 for e in edges if e[0] == 3 and e[1] != e[2]))
              # Recompute the minimum retained edges using the standard two-DSU pass.
              pa = list(range(n + 1))
              pb = list(range(n + 1))
              def root(p, x):
                  while p[x] != x:
                      p[x] = p[p[x]]
                      x = p[x]
                  return x
              ca = cb = kept = 0
              for typ, a, b in sorted(edges, reverse=True):
                  if typ == 3:
                      ra, rb = root(pa, a), root(pa, b)
                      if ra != rb:
                          pa[rb] = ra
                          pb[root(pb, b)] = root(pb, a)
                          ca += 1
                          cb += 1
                          kept += 1
                  elif typ == 1:
                      ra, rb = root(pa, a), root(pa, b)
                      if ra != rb:
                          pa[rb] = ra
                          ca += 1
                          kept += 1
                  else:
                      ra, rb = root(pb, a), root(pb, b)
                      if ra != rb:
                          pb[rb] = ra
                          cb += 1
                          kept += 1
              expected = len(edges) - kept if ca == n - 1 and cb == n - 1 else -1
              return result == expected

seed: 1579001

