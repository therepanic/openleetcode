entry:
  id: 1717
  title: maximum-score-from-removing-substrings
  params:
    s:
      type: string
    x:
      type: int
    y:
      type: int
  call:
    cpp: "Solution().maximumGain({s}, {x}, {y})"
    rust: "Solution::maximum_gain({s}, {x}, {y})"
    python3: "Solution().maximumGain({s}, {x}, {y})"
    python2: "Solution().maximumGain({s}, {x}, {y})"
    ruby: "maximum_gain({s}, {x}, {y})"
    java: "new Solution().maximumGain({s}, {x}, {y})"
    csharp: "new Solution().MaximumGain({s}, {x}, {y})"
    kotlin: "Solution().maximumGain({s}, {x}, {y})"
    go: "maximumGain({s}, {x}, {y})"
    dart: "Solution().maximumGain({s}, {x}, {y})"
    swift: "Solution().maximumGain({s}, {x}, {y})"
    typescript: "maximumGain({s}, {x}, {y})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumGain(s, x, y, {result})"
    checker: |
      class Checker:
          def maximumGain(self, s, x, y, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if x >= y:
                  first, second = 'a', 'b'
                  high, low = x, y
              else:
                  first, second = 'b', 'a'
                  high, low = y, x
              pending_first = 0
              pending_second = 0
              expected = 0
              for ch in s:
                  if ch == first:
                      pending_first += 1
                  elif ch == second:
                      if pending_first:
                          pending_first -= 1
                          expected += high
                      else:
                          pending_second += 1
                  else:
                      expected += min(pending_first, pending_second) * low
                      pending_first = 0
                      pending_second = 0
              expected += min(pending_first, pending_second) * low
              return result == expected

