  call:
    cpp: "Solution().largestSubmatrix({matrix})"
    rust: "Solution::largest_submatrix({matrix})"
    python3: "Solution().largestSubmatrix({matrix})"
    python2: "Solution().largestSubmatrix({matrix})"
    ruby: "largest_submatrix({matrix})"
    java: "new Solution().largestSubmatrix({matrix})"
    csharp: "new Solution().LargestSubmatrix({matrix})"
    kotlin: "Solution().largestSubmatrix({matrix})"
    go: "largestSubmatrix({matrix})"
    dart: "Solution().largestSubmatrix({matrix})"
    swift: "Solution().largestSubmatrix({matrix})"
