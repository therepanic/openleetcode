judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().largestSubmatrix(matrix, {result})"
    checker: |
      class Checker:
          def largestSubmatrix(self, matrix, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not matrix or not matrix[0]:
                  return result == 0
              n = len(matrix[0])
              heights = [0] * n
              expected = 0
              for row in matrix:
                  if len(row) != n or any(value not in (0, 1) for value in row):
                      return False
                  for j, value in enumerate(row):
                      heights[j] = heights[j] + 1 if value == 1 else 0
                  ordered = sorted(heights, reverse=True)
                  for width, height in enumerate(ordered, 1):
                      expected = max(expected, width * height)
              return result == expected

seed: 1727

