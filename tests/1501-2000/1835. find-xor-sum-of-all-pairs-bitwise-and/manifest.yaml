entry:
  id: 1835
  title: "find-xor-sum-of-all-pairs-bitwise-and"
  params:
    arr1:
      type: array
      items:
        type: int
    arr2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getXORSum({arr1}, {arr2})"
    rust: "Solution::get_xor_sum({arr1}, {arr2})"
    python3: "Solution().getXORSum({arr1}, {arr2})"
    python2: "Solution().getXORSum({arr1}, {arr2})"
    ruby: "get_xor_sum({arr1}, {arr2})"
    java: "new Solution().getXORSum({arr1}, {arr2})"
    csharp: "new Solution().GetXORSum({arr1}, {arr2})"
    kotlin: "Solution().getXORSum({arr1}, {arr2})"
    go: "getXORSum({arr1}, {arr2})"
    dart: "Solution().getXORSum({arr1}, {arr2})"
    swift: "Solution().getXORSum({arr1}, {arr2})"
    typescript: "getXORSum({arr1}, {arr2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getXORSum(arr1, arr2, {result})"
    checker: |
      class Checker:
          def getXORSum(self, arr1, arr2, result):
              x = 0
              for value in arr1:
                  x ^= value
              y = 0
              for value in arr2:
                  y ^= value
              return result == (x & y)

seed: 1835

