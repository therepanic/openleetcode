entry:
  id: 1871
  title: "jump-game-vii"
  params:
    s:
      type: string
    minJump:
      type: int
    maxJump:
      type: int
  call:
    cpp: "Solution().canReach({s}, {minJump}, {maxJump})"
    rust: "Solution::can_reach({s}, {minJump}, {maxJump})"
    python3: "Solution().canReach({s}, {minJump}, {maxJump})"
    python2: "Solution().canReach({s}, {minJump}, {maxJump})"
    ruby: "can_reach({s}, {minJump}, {maxJump})"
    java: "new Solution().canReach({s}, {minJump}, {maxJump})"
    csharp: "new Solution().CanReach({s}, {minJump}, {maxJump})"
    kotlin: "Solution().canReach({s}, {minJump}, {maxJump})"
    go: "canReach({s}, {minJump}, {maxJump})"
    dart: "Solution().canReach({s}, {minJump}, {maxJump})"
    swift: "Solution().canReach({s}, {minJump}, {maxJump})"
    typescript: "canReach({s}, {minJump}, {maxJump})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().canReach(s, minJump, maxJump, {result})"
    checker: |
      class Checker:
          def canReach(self, s, minJump, maxJump, result):
              n = len(s)
              reachable = [False] * n
              reachable[0] = True
              window = 0
              for i in range(1, n):
                  if i >= minJump and reachable[i - minJump]:
                      window += 1
                  if i > maxJump and reachable[i - maxJump - 1]:
                      window -= 1
                  reachable[i] = s[i] == '0' and window > 0
              return result is reachable[-1]

seed: 1871

