    cpp: "Solution().getCollisionTimes({cars})"
    rust: "Solution::get_collision_times({cars})"
    python3: "Solution().getCollisionTimes({cars})"
    python2: "Solution().getCollisionTimes({cars})"
    ruby: "get_collision_times({cars})"
    java: "new Solution().getCollisionTimes({cars})"
    csharp: "new Solution().GetCollisionTimes({cars})"
    kotlin: "Solution().getCollisionTimes({cars})"
    go: "getCollisionTimes({cars})"
    dart: "Solution().getCollisionTimes({cars})"
    swift: "Solution().getCollisionTimes({cars})"
    typescript: "getCollisionTimes({cars})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getCollisionTimes(cars, {result})"
    checker: |
      class Checker:
          def getCollisionTimes(self, cars, result):
              if not isinstance(result, list) or len(result) != len(cars):
                  return False
              n = len(cars)
              expected = [-1.0] * n
              stack = []
              for i in range(n - 1, -1, -1):
                  p, s = cars[i]
                  while stack:
                      j = stack[-1]
                      q, t = cars[j]
                      if s <= t:
                          stack.pop()
                          continue
                      hit = (q - p) / float(s - t)
                      if expected[j] < 0 or hit <= expected[j] + 1e-12:
                          break
                      stack.pop()
                  if stack:
                      j = stack[-1]
                      q, t = cars[j]
                      expected[i] = (q - p) / float(s - t)
                  stack.append(i)
              for got, want in zip(result, expected):
                  if not isinstance(got, (int, float)) or isinstance(got, bool):
                      return False
                  if want < 0:
                      if got != -1 and got != -1.0:
                          return False
                  elif abs(float(got) - want) > 1e-5:
                      return False
              return True

