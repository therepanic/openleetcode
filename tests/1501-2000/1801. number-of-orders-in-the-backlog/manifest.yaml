entry:
  id: 1801
  title: "number-of-orders-in-the-backlog"
  params:
    orders:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().getNumberOfBacklogOrders({orders})"
    rust: "Solution::get_number_of_backlog_orders({orders})"
    python3: "Solution().getNumberOfBacklogOrders({orders})"
    python2: "Solution().getNumberOfBacklogOrders({orders})"
    ruby: "get_number_of_backlog_orders({orders})"
    java: "new Solution().getNumberOfBacklogOrders({orders})"
    csharp: "new Solution().GetNumberOfBacklogOrders({orders})"
    kotlin: "Solution().getNumberOfBacklogOrders({orders})"
    go: "getNumberOfBacklogOrders({orders})"
    dart: "Solution().getNumberOfBacklogOrders({orders})"
    swift: "Solution().getNumberOfBacklogOrders({orders})"
    typescript: "getNumberOfBacklogOrders({orders})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getNumberOfBacklogOrders(orders, {result})"
    checker: |
      import heapq

      class Checker:
          def getNumberOfBacklogOrders(self, orders, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              buy = []
              sell = []
              for order in orders:
                  price, amount, order_type = order
                  if order_type == 0:
                      while amount and sell and sell[0][0] <= price:
                          sell_price, sell_amount = heapq.heappop(sell)
                          used = min(amount, sell_amount)
                          amount -= used
                          sell_amount -= used
                          if sell_amount:
                              heapq.heappush(sell, (sell_price, sell_amount))
                      if amount:
                          heapq.heappush(buy, (-price, amount))
                  else:
                      while amount and buy and -buy[0][0] >= price:
                          buy_price, buy_amount = heapq.heappop(buy)
                          used = min(amount, buy_amount)
                          amount -= used
                          buy_amount -= used
                          if buy_amount:
                              heapq.heappush(buy, (buy_price, buy_amount))
                      if amount:
                          heapq.heappush(sell, (price, amount))
              expected = (sum(amount for _, amount in buy) + sum(amount for _, amount in sell)) % (10 ** 9 + 7)
              return result == expected

