entry:
  id: 1957
  title: "delete-characters-to-make-fancy-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().makeFancyString({s})"
    rust: "Solution::make_fancy_string({s})"
    python3: "Solution().makeFancyString({s})"
    python2: "Solution().makeFancyString({s})"
    ruby: "make_fancy_string({s})"
    java: "new Solution().makeFancyString({s})"
    csharp: "new Solution().MakeFancyString({s})"
    kotlin: "Solution().makeFancyString({s})"
    go: "makeFancyString({s})"
    dart: "Solution().makeFancyString({s})"
    swift: "Solution().makeFancyString({s})"
    typescript: "makeFancyString({s})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().makeFancyString(s, {result})"
    checker: |
      class Checker:
          def makeFancyString(self, s, result):
              if not isinstance(result, str):
                  return False
              expected = []
              for ch in s:
                  if len(expected) >= 2 and expected[-1] == ch and expected[-2] == ch:
                      continue
                  expected.append(ch)
              return result == ''.join(expected)

seed: 1957

