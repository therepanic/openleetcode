entry:
  id: 1931
  title: "painting-a-grid-with-three-different-colors"
  params:
    m:
      type: int
    n:
      type: int
  call:
    cpp: "Solution().colorTheGrid({m}, {n})"
    rust: "Solution::color_the_grid({m}, {n})"
    python3: "Solution().colorTheGrid({m}, {n})"
    python2: "Solution().colorTheGrid({m}, {n})"
    ruby: "color_the_grid({m}, {n})"
    java: "new Solution().colorTheGrid({m}, {n})"
    csharp: "new Solution().ColorTheGrid({m}, {n})"
    kotlin: "Solution().colorTheGrid({m}, {n})"
    go: "colorTheGrid({m}, {n})"
    dart: "Solution().colorTheGrid({m}, {n})"
    swift: "Solution().colorTheGrid({m}, {n})"
    typescript: "colorTheGrid({m}, {n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().colorTheGrid(m, n, {result})"
    checker: |
      class Checker:
          MOD = 1000000007

          def colorTheGrid(self, m, n, result):
              if not isinstance(m, int) or not isinstance(n, int):
                  return False
              if not (1 <= m <= 5 and 1 <= n <= 1000):
                  return False
              if not isinstance(result, int) or not (0 <= result < self.MOD):
                  return False
              rows = []
              for mask in range(3 ** m):
                  x = mask
                  row = []
                  ok = True
                  for i in range(m):
                      row.append(x % 3)
                      x //= 3
                      if i and row[i] == row[i - 1]:
                          ok = False
                  if ok:
                      rows.append(tuple(row))
              ways = [1] * len(rows)
              for _ in range(1, n):
                  nxt = []
                  for current in rows:
                      total = 0
                      for previous, count in zip(rows, ways):
                          if all(a != b for a, b in zip(previous, current)):
                              total += count
                      nxt.append(total % self.MOD)
                  ways = nxt
              return sum(ways) % self.MOD == result

