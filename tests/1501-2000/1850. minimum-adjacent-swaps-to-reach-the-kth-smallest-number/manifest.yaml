entry:
  id: 1850
  title: minimum-adjacent-swaps-to-reach-the-kth-smallest-number
  params:
    num:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().getMinSwaps({num}, {k})"
    rust: "Solution::get_min_swaps({num}, {k})"
    python3: "Solution().getMinSwaps({num}, {k})"
    python2: "Solution().getMinSwaps({num}, {k})"
    ruby: "get_min_swaps({num}, {k})"
    java: "new Solution().getMinSwaps({num}, {k})"
    csharp: "new Solution().GetMinSwaps({num}, {k})"
    kotlin: "Solution().getMinSwaps({num}, {k})"
    go: "getMinSwaps({num}, {k})"
    dart: "Solution().getMinSwaps({num}, {k})"
    swift: "Solution().getMinSwaps({num}, {k})"
    typescript: "getMinSwaps({num}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(num, k, {result})"
    checker: |
      class Checker:
          def check(self, num, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              target = list(num)
              for _ in range(k):
                  i = len(target) - 2
                  while i >= 0 and target[i] >= target[i + 1]:
                      i -= 1
                  if i < 0:
                      return False
                  j = len(target) - 1
                  while target[j] <= target[i]:
                      j -= 1
                  target[i], target[j] = target[j], target[i]
                  target[i + 1:] = reversed(target[i + 1:])
              current = list(num)
              swaps = 0
              for i in range(len(current)):
                  if current[i] == target[i]:
                      continue
                  j = i
                  while j < len(current) and current[j] != target[i]:
                      j += 1
                  if j == len(current):
                      return False
                  while j > i:
                      current[j], current[j - 1] = current[j - 1], current[j]
                      j -= 1
                      swaps += 1
              return result == swaps

