entry:
  id: 1790
  title: "check-if-one-string-swap-can-make-strings-equal"
  params:
    s1:
      type: string
    s2:
      type: string
  call:
    cpp: "Solution().areAlmostEqual({s1}, {s2})"
    rust: "Solution::are_almost_equal({s1}, {s2})"
    python3: "Solution().areAlmostEqual({s1}, {s2})"
    python2: "Solution().areAlmostEqual({s1}, {s2})"
    ruby: "are_almost_equal({s1}, {s2})"
    java: "new Solution().areAlmostEqual({s1}, {s2})"
    csharp: "new Solution().AreAlmostEqual({s1}, {s2})"
    kotlin: "Solution().areAlmostEqual({s1}, {s2})"
    go: "areAlmostEqual({s1}, {s2})"
    dart: "Solution().areAlmostEqual({s1}, {s2})"
    swift: "Solution().areAlmostEqual({s1}, {s2})"
    typescript: "areAlmostEqual({s1}, {s2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().areAlmostEqual(s1, s2, {result})"
    checker: |
      class Checker:
          def areAlmostEqual(self, s1, s2, result):
              if not isinstance(result, bool) or len(s1) != len(s2):
                  return False
              mismatches = [i for i, (a, b) in enumerate(zip(s1, s2)) if a != b]
              expected = False
              if len(mismatches) == 0:
                  expected = True
              elif len(mismatches) == 2:
                  i, j = mismatches
                  expected = s1[i] == s2[j] and s1[j] == s2[i]
              return result == expected

seed: 1790

