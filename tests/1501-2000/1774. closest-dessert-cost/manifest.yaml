entry:
  id: 1774
  title: "closest-dessert-cost"
  params:
    baseCosts:
      type: array
      items:
        type: int
    toppingCosts:
      type: array
      items:
        type: int
    target:
      type: int
  call:
    cpp: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    rust: "Solution::closest_cost({baseCosts}, {toppingCosts}, {target})"
    python3: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    python2: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    ruby: "closest_cost({baseCosts}, {toppingCosts}, {target})"
    java: "new Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    csharp: "new Solution().ClosestCost({baseCosts}, {toppingCosts}, {target})"
    kotlin: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    go: "closestCost({baseCosts}, {toppingCosts}, {target})"
    dart: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    swift: "Solution().closestCost({baseCosts}, {toppingCosts}, {target})"
    typescript: "closestCost({baseCosts}, {toppingCosts}, {target})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().closestCost(baseCosts, toppingCosts, target, {result})"
    checker: |
      class Checker:
          def closestCost(self, baseCosts, toppingCosts, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              sums = [0]
              for topping in toppingCosts:
                  sums = [old + add for old in sums for add in (0, topping, 2 * topping)]
              best = min((abs(base + extra - target), base + extra)
                         for base in baseCosts for extra in sums)
              return result == best[1]
