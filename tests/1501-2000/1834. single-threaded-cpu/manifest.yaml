entry:
  id: 1834
  title: "single-threaded-cpu"
  params:
    tasks:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().getOrder({tasks})"
    rust: "Solution::get_order({tasks})"
    python3: "Solution().getOrder({tasks})"
    python2: "Solution().getOrder({tasks})"
    ruby: "get_order({tasks})"
    java: "new Solution().getOrder({tasks})"
    csharp: "new Solution().GetOrder({tasks})"
    kotlin: "Solution().getOrder({tasks})"
    go: "getOrder({tasks})"
    dart: "Solution().getOrder({tasks})"
    swift: "Solution().getOrder({tasks})"
    typescript: "getOrder({tasks})"

judge:
  type: "exact"

limits:
  time_ms: 10000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().getOrder(tasks, {result})"
    checker: |
      import heapq

      class Checker:
          def getOrder(self, tasks, result):
              indexed = sorted((t[0], t[1], i) for i, t in enumerate(tasks))
              heap = []
              expected = []
              now = 0
              i = 0
              while i < len(indexed) or heap:
                  if not heap and now < indexed[i][0]:
                      now = indexed[i][0]
                  while i < len(indexed) and indexed[i][0] <= now:
                      _, duration, index = indexed[i]
                      heapq.heappush(heap, (duration, index))
                      i += 1
                  duration, index = heapq.heappop(heap)
                  expected.append(index)
                  now += duration
              return result == expected

seed: 1834

