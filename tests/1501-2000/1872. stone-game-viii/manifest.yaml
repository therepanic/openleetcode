entry:
  id: 1872
  title: "stone-game-viii"
  params:
    stones:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().stoneGameVIII({stones})"
    rust: "Solution::stone_game_viii({stones})"
    python3: "Solution().stoneGameVIII({stones})"
    python2: "Solution().stoneGameVIII({stones})"
    ruby: "stone_game_viii({stones})"
    java: "new Solution().stoneGameVIII({stones})"
    csharp: "new Solution().StoneGameVIII({stones})"
    kotlin: "Solution().stoneGameVIII({stones})"
    go: "stoneGameVIII({stones})"
    dart: "Solution().stoneGameVIII({stones})"
    swift: "Solution().stoneGameVIII({stones})"
    typescript: "stoneGameVIII({stones})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(stones, {result})"
    checker: |
      class Checker:
          def check(self, stones, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = 0
              prefix = []
              for value in stones:
                  total += value
                  prefix.append(total)
              best = prefix[-1]
              for index in range(len(stones) - 2, 0, -1):
                  best = max(best, prefix[index] - best)
              return result == best

seed: 1872

