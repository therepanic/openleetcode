entry:
  id: 1655
  title: distribute-repeating-integers
  params:
    nums:
      type: array
      items:
        type: int
    quantity:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().canDistribute({nums}, {quantity})"
    rust: "Solution::can_distribute({nums}, {quantity})"
    python3: "Solution().canDistribute({nums}, {quantity})"
    python2: "Solution().canDistribute({nums}, {quantity})"
    ruby: "can_distribute({nums}, {quantity})"
    java: "new Solution().canDistribute({nums}, {quantity})"
    csharp: "new Solution().CanDistribute({nums}, {quantity})"
    kotlin: "Solution().canDistribute({nums}, {quantity})"
    go: "canDistribute({nums}, {quantity})"
    dart: "Solution().canDistribute({nums}, {quantity})"
    swift: "Solution().canDistribute({nums}, {quantity})"
    typescript: "canDistribute({nums}, {quantity})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().canDistribute(nums, quantity, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def canDistribute(self, nums, quantity, result):
              if not isinstance(result, bool):
                  return False
              capacities = list(Counter(nums).values())
              orders = sorted(quantity, reverse=True)
              memo = {}

              def feasible(i, caps):
                  if i == len(orders):
                      return True
                  key = (i, tuple(sorted(caps, reverse=True)))
                  if key in memo:
                      return memo[key]
                  need = orders[i]
                  seen = set()
                  for j, cap in enumerate(caps):
                      if cap >= need and cap not in seen:
                          seen.add(cap)
                          nxt = list(caps)
                          nxt[j] -= need
                          if feasible(i + 1, nxt):
                              memo[key] = True
                              return True
                  memo[key] = False
                  return False

              return result == feasible(0, capacities)

seed: 1655

