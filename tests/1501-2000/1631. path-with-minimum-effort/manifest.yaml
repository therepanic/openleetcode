entry:
  id: 1631
  title: path-with-minimum-effort
  params:
    heights:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minimumEffortPath({heights})"
    rust: "Solution::minimum_effort_path({heights})"
    python3: "Solution().minimumEffortPath({heights})"
    python2: "Solution().minimumEffortPath({heights})"
    ruby: "minimum_effort_path({heights})"
    java: "new Solution().minimumEffortPath({heights})"
    csharp: "new Solution().MinimumEffortPath({heights})"
    kotlin: "Solution().minimumEffortPath({heights})"
    go: "minimumEffortPath({heights})"
    dart: "Solution().minimumEffortPath({heights})"
    swift: "Solution().minimumEffortPath({heights})"
    typescript: "minimumEffortPath({heights})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumEffortPath(heights, {result})"
    checker: |
      import heapq

      class Checker:
          def minimumEffortPath(self, heights, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              rows = len(heights)
              cols = len(heights[0])
              best = [[10**18] * cols for _ in range(rows)]
              best[0][0] = 0
              heap = [(0, 0, 0)]
              while heap:
                  effort, r, c = heapq.heappop(heap)
                  if effort != best[r][c]:
                      continue
                  if r == rows - 1 and c == cols - 1:
                      return effort == result
                  for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                      nr, nc = r + dr, c + dc
                      if 0 <= nr < rows and 0 <= nc < cols:
                          candidate = max(effort, abs(heights[r][c] - heights[nr][nc]))
                          if candidate < best[nr][nc]:
                              best[nr][nc] = candidate
                              heapq.heappush(heap, (candidate, nr, nc))
              return False

seed: 1631

