entry:
  id: 1546
  title: "maximum-number-of-non-overlapping-subarrays-with-sum-equals-target"
  params:
    nums:
      type: array
      items:
        type: int
    target:
      type: int
  call:
    cpp: "Solution().maxNonOverlapping({nums}, {target})"
    rust: "Solution::max_non_overlapping({nums}, {target})"
    python3: "Solution().maxNonOverlapping({nums}, {target})"
    python2: "Solution().maxNonOverlapping({nums}, {target})"
    ruby: "max_non_overlapping({nums}, {target})"
    java: "new Solution().maxNonOverlapping({nums}, {target})"
    csharp: "new Solution().MaxNonOverlapping({nums}, {target})"
    kotlin: "Solution().maxNonOverlapping({nums}, {target})"
    go: "maxNonOverlapping({nums}, {target})"
    dart: "Solution().maxNonOverlapping({nums}, {target})"
    swift: "Solution().maxNonOverlapping({nums}, {target})"
    typescript: "maxNonOverlapping({nums}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxNonOverlapping(nums, target, {result})"
    checker: |
      class Checker:
          def maxNonOverlapping(self, nums, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best_by_prefix = {0: 0}
              prefix = 0
              best = 0
              for value in nums:
                  prefix += value
                  candidate = best_by_prefix.get(prefix - target)
                  if candidate is not None:
                      best = max(best, candidate + 1)
                  best_by_prefix[prefix] = max(best_by_prefix.get(prefix, 0), best)
              return result == best

seed: 1546

