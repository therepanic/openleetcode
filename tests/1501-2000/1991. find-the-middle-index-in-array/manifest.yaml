entry:
  id: 1991
  title: "find-the-middle-index-in-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findMiddleIndex({nums})"
    rust: "Solution::find_middle_index({nums})"
    python3: "Solution().findMiddleIndex({nums})"
    python2: "Solution().findMiddleIndex({nums})"
    ruby: "find_middle_index({nums})"
    java: "new Solution().findMiddleIndex({nums})"
    csharp: "new Solution().FindMiddleIndex({nums})"
    kotlin: "Solution().findMiddleIndex({nums})"
    go: "findMiddleIndex({nums})"
    dart: "Solution().findMiddleIndex({nums})"
    swift: "Solution().findMiddleIndex({nums})"
    typescript: "findMiddleIndex({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findMiddleIndex(nums, {result})"
    checker: |
      class Checker:
          def findMiddleIndex(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = sum(nums)
              left = 0
              expected = -1
              for i, value in enumerate(nums):
                  if left == total - left - value:
                      expected = i
                      break
                  left += value
              return result == expected

seed: 1991

