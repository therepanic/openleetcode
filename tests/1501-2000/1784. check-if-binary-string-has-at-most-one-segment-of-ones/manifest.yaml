entry:
  id: 1784
  title: "check-if-binary-string-has-at-most-one-segment-of-ones"
  params:
    s:
      type: string
  call:
    cpp: "Solution().checkOnesSegment({s})"
    rust: "Solution::check_ones_segment({s})"
    python3: "Solution().checkOnesSegment({s})"
    python2: "Solution().checkOnesSegment({s})"
    ruby: "check_ones_segment({s})"
    java: "new Solution().checkOnesSegment({s})"
    csharp: "new Solution().CheckOnesSegment({s})"
    kotlin: "Solution().checkOnesSegment({s})"
    go: "checkOnesSegment({s})"
    dart: "Solution().checkOnesSegment({s})"
    swift: "Solution().checkOnesSegment({s})"
    typescript: "checkOnesSegment({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().checkOnesSegment(s, {result})"
    checker: |
      class Checker:
          def checkOnesSegment(self, s, result):
              expected = "01" not in s
              return result is expected

seed: 1784

