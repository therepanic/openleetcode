entry:
  id: 1737
  title: "change-minimum-characters-to-satisfy-one-of-three-conditions"
  params:
    a:
      type: string
    b:
      type: string
  call:
    cpp: "Solution().minCharacters({a}, {b})"
    rust: "Solution::min_characters({a}, {b})"
    python3: "Solution().minCharacters({a}, {b})"
    python2: "Solution().minCharacters({a}, {b})"
    ruby: "min_characters({a}, {b})"
    java: "new Solution().minCharacters({a}, {b})"
    csharp: "new Solution().MinCharacters({a}, {b})"
    kotlin: "Solution().minCharacters({a}, {b})"
    go: "minCharacters({a}, {b})"
    dart: "Solution().minCharacters({a}, {b})"
    swift: "Solution().minCharacters({a}, {b})"
    typescript: "minCharacters({a}, {b})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minCharacters(a, b, {result})"
    checker: |
      class Checker:
          def minCharacters(self, a, b, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              fa = [0] * 26
              fb = [0] * 26
              for ch in a:
                  fa[ord(ch) - 97] += 1
              for ch in b:
                  fb[ord(ch) - 97] += 1
              expected = len(a) + len(b)
              pa = pb = 0
              for i in range(25):
                  pa += fa[i]
                  pb += fb[i]
                  expected = min(expected, len(a) - pa + pb, len(b) - pb + pa)
              for i in range(26):
                  expected = min(expected, len(a) - fa[i] + len(b) - fb[i])
              return result == expected
seed: 1737
