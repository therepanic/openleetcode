entry:
  id: 1758
  title: "minimum-changes-to-make-alternating-binary-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minOperations({s})"
    rust: "Solution::min_operations({s})"
    python3: "Solution().minOperations({s})"
    python2: "Solution().minOperations({s})"
    ruby: "min_operations({s})"
    java: "new Solution().minOperations({s})"
    csharp: "new Solution().MinOperations({s})"
    kotlin: "Solution().minOperations({s})"
    go: "minOperations({s})"
    dart: "Solution().minOperations({s})"
    swift: "Solution().minOperations({s})"
    typescript: "minOperations({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minOperations(s, {result})"
    checker: |
      class Checker:
          def minOperations(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(s, str) or not (1 <= len(s) <= 10000):
                  return False
              mismatches = 0
              for i, ch in enumerate(s):
                  if ch == str(i % 2):
                      mismatches += 1
              return result == min(mismatches, len(s) - mismatches)

seed: 1758

