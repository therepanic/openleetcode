entry:
  id: 1624
  title: largest-substring-between-two-equal-characters
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxLengthBetweenEqualCharacters({s})"
    rust: "Solution::max_length_between_equal_characters({s})"
    python3: "Solution().maxLengthBetweenEqualCharacters({s})"
    python2: "Solution().maxLengthBetweenEqualCharacters({s})"
    ruby: "max_length_between_equal_characters({s})"
    java: "new Solution().maxLengthBetweenEqualCharacters({s})"
    csharp: "new Solution().MaxLengthBetweenEqualCharacters({s})"
    kotlin: "Solution().maxLengthBetweenEqualCharacters({s})"
    go: "maxLengthBetweenEqualCharacters({s})"
    dart: "Solution().maxLengthBetweenEqualCharacters({s})"
    swift: "Solution().maxLengthBetweenEqualCharacters({s})"
    typescript: "maxLengthBetweenEqualCharacters({s})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxLengthBetweenEqualCharacters(s, {result})"
    checker: |
      class Checker:
          def maxLengthBetweenEqualCharacters(self, s, result):
              first = {}
              best = -1
              for i, ch in enumerate(s):
                  if ch in first:
                      best = max(best, i - first[ch] - 1)
                  else:
                      first[ch] = i
              return result == best

