entry:
  id: 1781
  title: "sum-of-beauty-of-all-substrings"
  params:
    s:
      type: string
  call:
    cpp: "Solution().beautySum({s})"
    rust: "Solution::beauty_sum({s})"
    python3: "Solution().beautySum({s})"
    python2: "Solution().beautySum({s})"
    ruby: "beauty_sum({s})"
    java: "new Solution().beautySum({s})"
    csharp: "new Solution().BeautySum({s})"
    kotlin: "Solution().beautySum({s})"
    go: "beautySum({s})"
    dart: "Solution().beautySum({s})"
    swift: "Solution().beautySum({s})"
    typescript: "beautySum({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().beautySum(s, {result})"
    checker: |
      class Checker:
          def beautySum(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              total = 0
              for i in range(len(s)):
                  freq = [0] * 26
                  for j in range(i, len(s)):
                      freq[ord(s[j]) - 97] += 1
                      present = [x for x in freq if x]
                      total += max(present) - min(present)
              return result == total

seed: 1781

