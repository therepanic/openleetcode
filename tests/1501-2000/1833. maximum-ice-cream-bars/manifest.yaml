entry:
  id: 1833
  title: maximum-ice-cream-bars
  params:
    costs:
      type: array
      items:
        type: int
    coins:
      type: int
  call:
    cpp: "Solution().maxIceCream({costs}, {coins})"
    rust: "Solution::max_ice_cream({costs}, {coins})"
    python3: "Solution().maxIceCream({costs}, {coins})"
    python2: "Solution().maxIceCream({costs}, {coins})"
    ruby: "max_ice_cream({costs}, {coins})"
    java: "new Solution().maxIceCream({costs}, {coins})"
    csharp: "new Solution().MaxIceCream({costs}, {coins})"
    kotlin: "Solution().maxIceCream({costs}, {coins})"
    go: "maxIceCream({costs}, {coins})"
    dart: "Solution().maxIceCream({costs}, {coins})"
    swift: "Solution().maxIceCream({costs}, {coins})"
    typescript: "maxIceCream({costs}, {coins})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxIceCream(costs, coins, {result})"
    checker: |
      class Checker:
          def maxIceCream(self, costs, coins, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              remaining = coins
              count = 0
              for cost in sorted(costs):
                  if cost > remaining:
                      break
                  remaining -= cost
                  count += 1
              return result == count

seed: 1833

