entry:
  id: 1796
  title: "second-largest-digit-in-a-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().secondHighest({s})"
    rust: "Solution::second_highest({s})"
    python3: "Solution().secondHighest({s})"
    python2: "Solution().secondHighest({s})"
    ruby: "second_highest({s})"
    java: "new Solution().secondHighest({s})"
    csharp: "new Solution().SecondHighest({s})"
    kotlin: "Solution().secondHighest({s})"
    go: "secondHighest({s})"
    dart: "Solution().secondHighest({s})"
    swift: "Solution().secondHighest({s})"
    typescript: "secondHighest({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().secondHighest(s, {result})"
    checker: |
      class Checker:
          def secondHighest(self, s, result):
              digits = {int(ch) for ch in s if ch.isdigit()}
              expected = -1 if len(digits) < 2 else sorted(digits)[-2]
              return result == expected

seed: 1796

