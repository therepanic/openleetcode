entry:
  id: 1775
  title: "equal-sum-arrays-with-minimum-number-of-operations"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minOperations({nums1}, {nums2})"
    rust: "Solution::min_operations({nums1}, {nums2})"
    python3: "Solution().minOperations({nums1}, {nums2})"
    python2: "Solution().minOperations({nums1}, {nums2})"
    ruby: "min_operations({nums1}, {nums2})"
    java: "new Solution().minOperations({nums1}, {nums2})"
    csharp: "new Solution().MinOperations({nums1}, {nums2})"
    kotlin: "Solution().minOperations({nums1}, {nums2})"
    go: "minOperations({nums1}, {nums2})"
    dart: "Solution().minOperations({nums1}, {nums2})"
    swift: "Solution().minOperations({nums1}, {nums2})"
    typescript: "minOperations({nums1}, {nums2})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(nums1, nums2, {result})"
    checker: |
      class Checker:
          def check(self, nums1, nums2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              diff = abs(sum(nums1) - sum(nums2))
              if diff == 0:
                  return result == 0
              gains = []
              if sum(nums1) < sum(nums2):
                  gains.extend(6 - x for x in nums1)
                  gains.extend(x - 1 for x in nums2)
              else:
                  gains.extend(x - 1 for x in nums1)
                  gains.extend(6 - x for x in nums2)
              gains.sort(reverse=True)
              used = 0
              for gain in gains:
                  if gain > 0:
                      diff -= gain
                      used += 1
                      if diff <= 0:
                          return result == used
              return result == -1

seed: 1775001

