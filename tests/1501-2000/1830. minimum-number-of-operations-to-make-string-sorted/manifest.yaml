entry:
  id: 1830
  title: "minimum-number-of-operations-to-make-string-sorted"
  params:
    s:
      type: string
  call:
    cpp: "Solution().makeStringSorted({s})"
    rust: "Solution::make_string_sorted({s})"
    python3: "Solution().makeStringSorted({s})"
    python2: "Solution().makeStringSorted({s})"
    ruby: "make_string_sorted({s})"
    java: "new Solution().makeStringSorted({s})"
    csharp: "new Solution().MakeStringSorted({s})"
    kotlin: "Solution().makeStringSorted({s})"
    go: "makeStringSorted({s})"
    dart: "Solution().makeStringSorted({s})"
    swift: "Solution().makeStringSorted({s})"
    typescript: "makeStringSorted({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(s, {result})"
    checker: |
      class Checker:
          MOD = 1000000007

          def check(self, s, result):
              n = len(s)
              fac = [1] * (n + 1)
              for i in range(1, n + 1):
                  fac[i] = fac[i - 1] * i % self.MOD
              inv = [1] * (n + 1)
              inv[n] = pow(fac[n], self.MOD - 2, self.MOD)
              for i in range(n, 0, -1):
                  inv[i - 1] = inv[i] * i % self.MOD
              freq = [0] * 26
              for ch in s:
                  freq[ord(ch) - 97] += 1
              expected = 0
              for i, ch in enumerate(s):
                  smaller = sum(freq[:ord(ch) - 97])
                  term = fac[n - i - 1] * smaller % self.MOD
                  for count in freq:
                      term = term * inv[count] % self.MOD
                  expected = (expected + term) % self.MOD
                  freq[ord(ch) - 97] -= 1
              return isinstance(result, int) and result == expected

seed: 1830

