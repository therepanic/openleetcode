entry:
  id: 1694
  title: reformat-phone-number
  params:
    number:
      type: string
  call:
    cpp: "Solution().reformatNumber({number})"
    rust: "Solution::reformat_number({number})"
    python3: "Solution().reformatNumber({number})"
    python2: "Solution().reformatNumber({number})"
    ruby: "reformat_number({number})"
    java: "new Solution().reformatNumber({number})"
    csharp: "new Solution().ReformatNumber({number})"
    kotlin: "Solution().reformatNumber({number})"
    go: "reformatNumber({number})"
    dart: "Solution().reformatNumber({number})"
    swift: "Solution().reformatNumber({number})"
    typescript: "reformatNumber({number})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(number, {result})"
    checker: |
      class Checker:
          def check(self, number, result):
              digits = ''.join(ch for ch in number if ch.isdigit())
              blocks = []
              while len(digits) > 4:
                  blocks.append(digits[:3])
                  digits = digits[3:]
              if len(digits) == 4:
                  blocks.extend([digits[:2], digits[2:]])
              elif digits:
                  blocks.append(digits)
              return result == '-'.join(blocks)

seed: 1694

