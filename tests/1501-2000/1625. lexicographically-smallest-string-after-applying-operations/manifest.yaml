entry:
  id: 1625
  title: "lexicographically-smallest-string-after-applying-operations"
  params:
    s:
      type: string
    a:
      type: int
    b:
      type: int
  call:
    cpp: "Solution().findLexSmallestString({s}, {a}, {b})"
    rust: "Solution::find_lex_smallest_string({s}, {a}, {b})"
    python3: "Solution().findLexSmallestString({s}, {a}, {b})"
    python2: "Solution().findLexSmallestString({s}, {a}, {b})"
    ruby: "find_lex_smallest_string({s}, {a}, {b})"
    java: "new Solution().findLexSmallestString({s}, {a}, {b})"
    csharp: "new Solution().FindLexSmallestString({s}, {a}, {b})"
    kotlin: "Solution().findLexSmallestString({s}, {a}, {b})"
    go: "findLexSmallestString({s}, {a}, {b})"
    dart: "Solution().findLexSmallestString({s}, {a}, {b})"
    swift: "Solution().findLexSmallestString({s}, {a}, {b})"
    typescript: "findLexSmallestString({s}, {a}, {b})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findLexSmallestString(s, a, b, {result})"
    checker: |
      from collections import deque

      class Checker:
          def findLexSmallestString(self, s, a, b, result):
              if not isinstance(result, str) or len(result) != len(s):
                  return False
              if any(ch < '0' or ch > '9' for ch in result):
                  return False
              n = len(s)
              seen = {s}
              queue = deque([s])
              while queue:
                  cur = queue.popleft()
                  chars = list(cur)
                  for i in range(1, n, 2):
                      chars[i] = str((ord(chars[i]) - 48 + a) % 10)
                  nxt = ''.join(chars)
                  if nxt not in seen:
                      seen.add(nxt)
                      queue.append(nxt)
                  nxt = cur[n - b:] + cur[:n - b]
                  if nxt not in seen:
                      seen.add(nxt)
                      queue.append(nxt)
              return result == min(seen)

seed: 1625

