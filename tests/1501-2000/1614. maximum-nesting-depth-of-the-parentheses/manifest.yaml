entry:
  id: 1614
  title: "maximum-nesting-depth-of-the-parentheses"
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxDepth({s})"
    rust: "Solution::max_depth({s})"
    python3: "Solution().maxDepth({s})"
    python2: "Solution().maxDepth({s})"
    ruby: "max_depth({s})"
    java: "new Solution().maxDepth({s})"
    csharp: "new Solution().MaxDepth({s})"
    kotlin: "Solution().maxDepth({s})"
    go: "maxDepth({s})"
    dart: "Solution().maxDepth({s})"
    swift: "Solution().maxDepth({s})"
    typescript: "maxDepth({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxDepth(s, {result})"
    checker: |
      class Checker:
          def maxDepth(self, s, result):
              depth = 0
              expected = 0
              for ch in s:
                  if ch == '(':
                      depth += 1
                      expected = max(expected, depth)
                  elif ch == ')':
                      depth -= 1
              return result == expected

seed: 1614

