entry:
  id: 1611
  title: "minimum-one-bit-operations-to-make-integers-zero"
  params:
    n:
      type: int
  call:
    cpp: "Solution().minimumOneBitOperations({n})"
    rust: "Solution::minimum_one_bit_operations({n})"
    python3: "Solution().minimumOneBitOperations({n})"
    python2: "Solution().minimumOneBitOperations({n})"
    ruby: "minimum_one_bit_operations({n})"
    java: "new Solution().minimumOneBitOperations({n})"
    csharp: "new Solution().MinimumOneBitOperations({n})"
    kotlin: "Solution().minimumOneBitOperations({n})"
    go: "minimumOneBitOperations({n})"
    dart: "Solution().minimumOneBitOperations({n})"
    swift: "Solution().minimumOneBitOperations({n})"
    typescript: "minimumOneBitOperations({n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumOneBitOperations(n, {result})"
    checker: |
      class Checker:
          def minimumOneBitOperations(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              add = True
              highest = n.bit_length() - 1
              for i in range(highest, -1, -1):
                  if n & (1 << i):
                      value = (1 << (i + 1)) - 1
                      expected = expected + value if add else expected - value
                      add = not add
              return result == expected

