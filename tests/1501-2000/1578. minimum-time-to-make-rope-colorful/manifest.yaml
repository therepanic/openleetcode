entry:
  id: 1578
  title: "minimum-time-to-make-rope-colorful"
  params:
    colors:
      type: string
    neededTime:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minCost({colors}, {neededTime})"
    rust: "Solution::min_cost({colors}, {neededTime})"
    python3: "Solution().minCost({colors}, {neededTime})"
    python2: "Solution().minCost({colors}, {neededTime})"
    ruby: "min_cost({colors}, {neededTime})"
    java: "new Solution().minCost({colors}, {neededTime})"
    csharp: "new Solution().MinCost({colors}, {neededTime})"
    kotlin: "Solution().minCost({colors}, {neededTime})"
    go: "minCost({colors}, {neededTime})"
    dart: "Solution().minCost({colors}, {neededTime})"
    swift: "Solution().minCost({colors}, {neededTime})"
    typescript: "minCost({colors}, {neededTime})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minCost(colors, neededTime, {result})"
    checker: |
      class Checker:
          def minCost(self, colors, neededTime, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              keep = 0
              removed = 0
              for i, value in enumerate(neededTime):
                  if i == 0 or colors[i] != colors[i - 1]:
                      keep = value
                  else:
                      removed += min(keep, value)
                      keep = max(keep, value)
              return result == removed

seed: 1578001

