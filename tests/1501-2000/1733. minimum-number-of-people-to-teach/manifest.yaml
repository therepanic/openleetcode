judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimumTeachings(n, languages, friendships, {result})"
    checker: |
      class Checker:
          def minimumTeachings(self, n, languages, friendships, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              known = [set(row) for row in languages]
              involved = set()
              for a, b in friendships:
                  a -= 1
                  b -= 1
                  if known[a].isdisjoint(known[b]):
                      involved.add(a)
                      involved.add(b)
              expected = len(involved)
              if involved:
                  expected = min(sum(lang not in known[user] for user in involved)
                                 for lang in range(1, n + 1))
              else:
                  expected = 0
              return result == expected

seed: 17331733

