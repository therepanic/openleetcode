    python2: "Solution().minimumTeachings({n}, {languages}, {friendships})"
    ruby: "minimum_teachings({n}, {languages}, {friendships})"
    java: "new Solution().minimumTeachings({n}, {languages}, {friendships})"
    csharp: "new Solution().MinimumTeachings({n}, {languages}, {friendships})"
    kotlin: "Solution().minimumTeachings({n}, {languages}, {friendships})"
    go: "minimumTeachings({n}, {languages}, {friendships})"
    dart: "Solution().minimumTeachings({n}, {languages}, {friendships})"
