entry:
  id: 1893
  title: "check-if-all-the-integers-in-a-range-are-covered"
  params:
    ranges:
      type: array
      items:
        type: array
        items:
          type: int
    left:
      type: int
    right:
      type: int
  call:
    cpp: "Solution().isCovered({ranges}, {left}, {right})"
    rust: "Solution::is_covered({ranges}, {left}, {right})"
    python3: "Solution().isCovered({ranges}, {left}, {right})"
    python2: "Solution().isCovered({ranges}, {left}, {right})"
    ruby: "is_covered({ranges}, {left}, {right})"
    java: "new Solution().isCovered({ranges}, {left}, {right})"
    csharp: "new Solution().IsCovered({ranges}, {left}, {right})"
    kotlin: "Solution().isCovered({ranges}, {left}, {right})"
    go: "isCovered({ranges}, {left}, {right})"
    dart: "Solution().isCovered({ranges}, {left}, {right})"
    swift: "Solution().isCovered({ranges}, {left}, {right})"
    typescript: "isCovered({ranges}, {left}, {right})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isCovered(ranges, left, right, {result})"
    checker: |
      class Checker:
          def isCovered(self, ranges, left, right, result):
              if not isinstance(result, bool):
                  return False
              covered = [False] * 51
              for interval in ranges:
                  start, end = interval
                  for value in range(start, end + 1):
                      covered[value] = True
              expected = all(covered[value] for value in range(left, right + 1))
              return result is expected

seed: 1893

tests:
  - name: example-contiguous
    in:
      ranges:
        - [1, 2]
        - [3, 4]
        - [5, 6]
      left: 2
      right: 5
    out: true
    judge:
      type: "exact"
  - name: example-uncovered
    in:
      ranges:
        - [1, 10]
        - [10, 20]
      left: 21
      right: 21
    out: false
    judge:
      type: "exact"
  - name: single-point-covered
