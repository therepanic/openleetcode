entry:
  id: 1707
  title: "maximum-xor-with-an-element-from-array"
  params:
    nums:
      type: array
      items:
        type: int
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maximizeXor({nums}, {queries})"
    rust: "Solution::maximize_xor({nums}, {queries})"
    python3: "Solution().maximizeXor({nums}, {queries})"
    python2: "Solution().maximizeXor({nums}, {queries})"
    ruby: "maximize_xor({nums}, {queries})"
    java: "new Solution().maximizeXor({nums}, {queries})"
    csharp: "new Solution().MaximizeXor({nums}, {queries})"
    kotlin: "Solution().maximizeXor({nums}, {queries})"
    go: "maximizeXor({nums}, {queries})"
    dart: "Solution().maximizeXor({nums}, {queries})"
    swift: "Solution().maximizeXor({nums}, {queries})"
    typescript: "maximizeXor({nums}, {queries})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximizeXor(nums, queries, {result})"
    checker: |
      class Checker:
          def maximizeXor(self, nums, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              ordered = sorted(nums)
              trie = [[-1, -1]]
              def insert(value):
                  node = 0
                  for bit_index in range(30, -1, -1):
                      bit = (value >> bit_index) & 1
                      if trie[node][bit] == -1:
                          trie[node][bit] = len(trie)
                          trie.append([-1, -1])
                      node = trie[node][bit]
              def best(value):
                  if trie[0] == [-1, -1]:
                      return -1
                  node = 0
                  answer = 0
                  for bit_index in range(30, -1, -1):
                      bit = (value >> bit_index) & 1
                      other = bit ^ 1
                      if trie[node][other] != -1:
                          answer |= 1 << bit_index
                          node = trie[node][other]
                      else:
                          node = trie[node][bit]
                  return answer
              expected = []
              index = 0
              for x, limit in sorted(enumerate(queries), key=lambda item: item[1][1]):
                  while index < len(ordered) and ordered[index] <= limit[1]:
                      insert(ordered[index])
                      index += 1
                  expected.append((x, best(limit[0])))
              expected.sort()
              return result == [value for _, value in expected]

seed: 1707

