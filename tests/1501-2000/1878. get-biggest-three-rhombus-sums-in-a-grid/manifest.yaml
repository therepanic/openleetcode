entry:
  id: 1878
  title: "get-biggest-three-rhombus-sums-in-a-grid"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().getBiggestThree({grid})"
    rust: "Solution::get_biggest_three({grid})"
    python3: "Solution().getBiggestThree({grid})"
    python2: "Solution().getBiggestThree({grid})"
    ruby: "get_biggest_three({grid})"
    java: "new Solution().getBiggestThree({grid})"
    csharp: "new Solution().GetBiggestThree({grid})"
    kotlin: "Solution().getBiggestThree({grid})"
    go: "getBiggestThree({grid})"
    dart: "Solution().getBiggestThree({grid})"
    swift: "Solution().getBiggestThree({grid})"
    typescript: "getBiggestThree({grid})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(grid, {result})"
    checker: |
      class Checker:
          def check(self, grid, result):
              m, n = len(grid), len(grid[0])
              sums = set()
              for i in range(m):
                  for j in range(n):
                      sums.add(grid[i][j])
                      d = 1
                      while i - d >= 0 and i + d < m and j - d >= 0 and j + d < n:
                          cells = {(i - d, j), (i, j + d), (i + d, j), (i, j - d)}
                          for k in range(1, d):
                              cells.add((i - d + k, j - k))
                              cells.add((i - d + k, j + k))
                              cells.add((i + d - k, j - k))
                              cells.add((i + d - k, j + k))
                          sums.add(sum(grid[r][c] for r, c in cells))
                          d += 1
              expected = sorted(sums, reverse=True)[:3]
              return result == expected

seed: 1878

