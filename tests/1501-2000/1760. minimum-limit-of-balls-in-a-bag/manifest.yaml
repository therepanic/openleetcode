entry:
  id: 1760
  title: "minimum-limit-of-balls-in-a-bag"
  params:
    nums:
      type: array
      items:
        type: int
    maxOperations:
      type: int
  call:
    cpp: "Solution().minimumSize({nums}, {maxOperations})"
    rust: "Solution::minimum_size({nums}, {maxOperations})"
    python3: "Solution().minimumSize({nums}, {maxOperations})"
    python2: "Solution().minimumSize({nums}, {maxOperations})"
    ruby: "minimum_size({nums}, {maxOperations})"
    java: "new Solution().minimumSize({nums}, {maxOperations})"
    csharp: "new Solution().MinimumSize({nums}, {maxOperations})"
    kotlin: "Solution().minimumSize({nums}, {maxOperations})"
    go: "minimumSize({nums}, {maxOperations})"
    dart: "Solution().minimumSize({nums}, {maxOperations})"
    swift: "Solution().minimumSize({nums}, {maxOperations})"
    typescript: "minimumSize({nums}, {maxOperations})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumSize(nums, maxOperations, {result})"
    checker: |
      class Checker:
          def minimumSize(self, nums, maxOperations, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not nums or any(not isinstance(x, int) or x < 1 for x in nums):
                  return False
              if not isinstance(maxOperations, int) or maxOperations < 0:
                  return False
              lo, hi = 1, max(nums)
              while lo < hi:
                  mid = (lo + hi) // 2
                  needed = sum((x - 1) // mid for x in nums)
                  if needed <= maxOperations:
                      hi = mid
                  else:
                      lo = mid + 1
              return result == lo

seed: 1760

