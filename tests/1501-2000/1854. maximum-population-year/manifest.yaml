  title: "maximum-population-year"
  params:
    logs:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maximumPopulation({logs})"
    rust: "Solution::maximum_population({logs})"
    python3: "Solution().maximumPopulation({logs})"
    python2: "Solution().maximumPopulation({logs})"
    ruby: "maximum_population({logs})"
    java: "new Solution().maximumPopulation({logs})"
    csharp: "new Solution().MaximumPopulation({logs})"
    kotlin: "Solution().maximumPopulation({logs})"
    go: "maximumPopulation({logs})"
    dart: "Solution().maximumPopulation({logs})"
    swift: "Solution().maximumPopulation({logs})"
    typescript: "maximumPopulation({logs})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maximumPopulation(logs, {result})"
    checker: |
      class Checker:
          def maximumPopulation(self, logs, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best_year = None
              best_count = -1
              for year in range(1950, 2050):
                  count = sum(birth <= year < death for birth, death in logs)
                  if count > best_count:
                      best_count = count
                      best_year = year
              return result == best_year

seed: 1854

