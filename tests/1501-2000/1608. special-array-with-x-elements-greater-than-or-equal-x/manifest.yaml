entry:
  id: 1608
  title: "special-array-with-x-elements-greater-than-or-equal-x"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().specialArray({nums})"
    rust: "Solution::special_array({nums})"
    python3: "Solution().specialArray({nums})"
    python2: "Solution().specialArray({nums})"
    ruby: "special_array({nums})"
    java: "new Solution().specialArray({nums})"
    csharp: "new Solution().SpecialArray({nums})"
    kotlin: "Solution().specialArray({nums})"
    go: "specialArray({nums})"
    dart: "Solution().specialArray({nums})"
    swift: "Solution().specialArray({nums})"
    typescript: "specialArray({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().specialArray(nums, {result})"
    checker: |
      class Checker:
          def specialArray(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              valid = [x for x in range(len(nums) + 1) if sum(v >= x for v in nums) == x]
              expected = valid[0] if valid else -1
              return result == expected

seed: 1608

