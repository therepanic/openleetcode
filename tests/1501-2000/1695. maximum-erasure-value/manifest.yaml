entry:
  id: 1695
  title: "maximum-erasure-value"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maximumUniqueSubarray({nums})"
    rust: "Solution::maximum_unique_subarray({nums})"
    python3: "Solution().maximumUniqueSubarray({nums})"
    python2: "Solution().maximumUniqueSubarray({nums})"
    ruby: "maximum_unique_subarray({nums})"
    java: "new Solution().maximumUniqueSubarray({nums})"
    csharp: "new Solution().MaximumUniqueSubarray({nums})"
    kotlin: "Solution().maximumUniqueSubarray({nums})"
    go: "maximumUniqueSubarray({nums})"
    dart: "Solution().maximumUniqueSubarray({nums})"
    swift: "Solution().maximumUniqueSubarray({nums})"
    typescript: "maximumUniqueSubarray({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumUniqueSubarray(nums, {result})"
    checker: |
      class Checker:
          def maximumUniqueSubarray(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              seen = set()
              left = 0
              current = 0
              expected = 0
              for right, value in enumerate(nums):
                  while value in seen:
                      seen.remove(nums[left])
                      current -= nums[left]
                      left += 1
                  seen.add(value)
                  current += value
                  expected = max(expected, current)
              return result == expected

seed: 1695

