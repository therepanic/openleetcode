entry:
  id: 1787
  title: make-the-xor-of-all-segments-equal-to-zero
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minChanges({nums}, {k})"
    rust: "Solution::min_changes({nums}, {k})"
    python3: "Solution().minChanges({nums}, {k})"
    python2: "Solution().minChanges({nums}, {k})"
    ruby: "min_changes({nums}, {k})"
    java: "new Solution().minChanges({nums}, {k})"
    csharp: "new Solution().MinChanges({nums}, {k})"
    kotlin: "Solution().minChanges({nums}, {k})"
    go: "minChanges({nums}, {k})"
    dart: "Solution().minChanges({nums}, {k})"
    swift: "Solution().minChanges({nums}, {k})"
    typescript: "minChanges({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minChanges(nums, k, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def minChanges(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              width = 1 << 10
              dp = [-10**9] * width
              dp[0] = 0
              for group in range(k):
                  counts = Counter(nums[group::k])
                  best = max(dp)
                  ndp = [best] * width
                  for state, score in enumerate(dp):
                      if score < 0:
                          continue
                      for value, count in counts.items():
                          nxt = state ^ value
                          if score + count > ndp[nxt]:
                              ndp[nxt] = score + count
                  dp = ndp
              expected = len(nums) - dp[0]
              return result == expected

