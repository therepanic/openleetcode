entry:
  id: 1838
  title: "frequency-of-the-most-frequent-element"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().maxFrequency({nums}, {k})"
    rust: "Solution::max_frequency({nums}, {k})"
    python3: "Solution().maxFrequency({nums}, {k})"
    python2: "Solution().maxFrequency({nums}, {k})"
    ruby: "max_frequency({nums}, {k})"
    java: "new Solution().maxFrequency({nums}, {k})"
    csharp: "new Solution().MaxFrequency({nums}, {k})"
    kotlin: "Solution().maxFrequency({nums}, {k})"
    go: "maxFrequency({nums}, {k})"
    dart: "Solution().maxFrequency({nums}, {k})"
    swift: "Solution().maxFrequency({nums}, {k})"
    typescript: "maxFrequency({nums}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().maxFrequency(nums, k, {result})"
    checker: |
      class Checker:
          def maxFrequency(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not nums or result < 1 or result > len(nums):
                  return False
              values = sorted(nums)

              def feasible(width):
                  window_sum = sum(values[:width])
                  for right in range(width, len(values) + 1):
                      if values[right - 1] * width - window_sum <= k:
                          return True
                      if right < len(values):
                          window_sum += values[right] - values[right - width]
                  return False

              if not feasible(result) or (result < len(values) and feasible(result + 1)):
                  return False
              return True
seed: 1838
