entry:
  id: 1862
  title: "sum-of-floored-pairs"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().sumOfFlooredPairs({nums})"
    rust: "Solution::sum_of_floored_pairs({nums})"
    python3: "Solution().sumOfFlooredPairs({nums})"
    python2: "Solution().sumOfFlooredPairs({nums})"
    ruby: "sum_of_floored_pairs({nums})"
    java: "new Solution().sumOfFlooredPairs({nums})"
    csharp: "new Solution().SumOfFlooredPairs({nums})"
    kotlin: "Solution().sumOfFlooredPairs({nums})"
    go: "sumOfFlooredPairs({nums})"
    dart: "Solution().sumOfFlooredPairs({nums})"
    swift: "Solution().sumOfFlooredPairs({nums})"
    typescript: "sumOfFlooredPairs({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums, {result})"
    checker: |
      class Checker:
          def check(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(nums, list) or not nums or any(type(x) is not int or x < 1 or x > 100000 for x in nums):
                  return False
              mod = 1000000007
              freq = [0] * (100001)
              for x in nums:
                  freq[x] += 1
              total = 0
              prefix = [0] * 100001
              for i in range(1, 100001):
                  prefix[i] = prefix[i - 1] + freq[i]
              m = max(nums)
              for d in range(1, m + 1):
                  if not freq[d]:
                      continue
                  q = 1
                  while q * d <= m:
                      hi = min((q + 1) * d - 1, m)
                      total = (total + freq[d] * q * (prefix[hi] - prefix[q * d - 1])) % mod
                      q += 1
              return result == total

seed: 1862

