entry:
  id: 1929
  title: "concatenation-of-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getConcatenation({nums})"
    rust: "Solution::get_concatenation({nums})"
    python3: "Solution().getConcatenation({nums})"
    python2: "Solution().getConcatenation({nums})"
    ruby: "get_concatenation({nums})"
    java: "new Solution().getConcatenation({nums})"
    csharp: "new Solution().GetConcatenation({nums})"
    kotlin: "Solution().getConcatenation({nums})"
    go: "getConcatenation({nums})"
    dart: "Solution().getConcatenation({nums})"
    swift: "Solution().getConcatenation({nums})"
    typescript: "getConcatenation({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().getConcatenation(nums, {result})"
    checker: |
      class Checker:
          def getConcatenation(self, nums, result):
              if not isinstance(nums, list) or not isinstance(result, list):
                  return False
              if len(nums) < 1 or len(nums) > 1000:
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or x < 1 or x > 1000 for x in nums):
                  return False
              return result == nums + nums

seed: 1929

