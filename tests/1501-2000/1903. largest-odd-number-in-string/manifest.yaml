entry:
  id: 1903
  title: largest-odd-number-in-string
  params:
    num:
      type: string
  call:
    cpp: "Solution().largestOddNumber({num})"
    rust: "Solution::largest_odd_number({num})"
    python3: "Solution().largestOddNumber({num})"
    python2: "Solution().largestOddNumber({num})"
    ruby: "largest_odd_number({num})"
    java: "new Solution().largestOddNumber({num})"
    csharp: "new Solution().LargestOddNumber({num})"
    kotlin: "Solution().largestOddNumber({num})"
    go: "largestOddNumber({num})"
    dart: "Solution().largestOddNumber({num})"
    swift: "Solution().largestOddNumber({num})"
    typescript: "largestOddNumber({num})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().largestOddNumber(num, {result})"
    checker: |
      class Checker:
          def largestOddNumber(self, num, result):
              expected = ""
              for i in range(len(num) - 1, -1, -1):
                  if (ord(num[i]) - ord("0")) % 2 == 1:
                      expected = num[:i + 1]
                      break
              return result == expected

seed: 1903

