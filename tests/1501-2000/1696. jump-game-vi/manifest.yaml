entry:
  id: 1696
  title: "jump-game-vi"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().maxResult({nums}, {k})"
    rust: "Solution::max_result({nums}, {k})"
    python3: "Solution().maxResult({nums}, {k})"
    python2: "Solution().maxResult({nums}, {k})"
    ruby: "max_result({nums}, {k})"
    java: "new Solution().maxResult({nums}, {k})"
    csharp: "new Solution().MaxResult({nums}, {k})"
    kotlin: "Solution().maxResult({nums}, {k})"
    go: "maxResult({nums}, {k})"
    dart: "Solution().maxResult({nums}, {k})"
    swift: "Solution().maxResult({nums}, {k})"
    typescript: "maxResult({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(nums, k, {result})"
    checker: |
      class Checker:
          def check(self, nums, k, result):
              if not isinstance(nums, list) or not nums or not isinstance(k, int) or k < 1:
                  return False
              from collections import deque
              dp = [nums[0]]
              window = deque([0])
              for i in range(1, len(nums)):
                  while window and window[0] < i - k:
                      window.popleft()
                  dp.append(nums[i] + dp[window[0]])
                  while window and dp[window[-1]] <= dp[i]:
                      window.pop()
                  window.append(i)
              return isinstance(result, int) and result == dp[-1]

