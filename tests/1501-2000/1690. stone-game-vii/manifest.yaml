judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().stoneGameVII(stones, {result})"
    checker: |
      class Checker:
          def stoneGameVII(self, stones, result):
              n = len(stones)
              if n < 2 or n > 1000 or any(x < 1 or x > 1000 for x in stones):
                  return False
              prefix = [0]
              for x in stones:
                  prefix.append(prefix[-1] + x)
              dp = [0] * n
              for length in range(2, n + 1):
                  for left in range(n - length + 1):
                      right = left + length - 1
                      total = prefix[right + 1] - prefix[left]
                      dp[left] = max(total - stones[left] - dp[left + 1],
                                     total - stones[right] - dp[left])
              return result == dp[0]

