oracle:
  python3:
    call: "Checker().areConnected(n, threshold, queries, {result})"
    checker: |
      class Checker:
          def areConnected(self, n, threshold, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              parent = list(range(n + 1))
              size = [1] * (n + 1)
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              def union(a, b):
                  a, b = find(a), find(b)
                  if a == b:
                      return
                  if size[a] < size[b]:
                      a, b = b, a
                  parent[b] = a
                  size[a] += size[b]
              for z in range(threshold + 1, n + 1):
                  for multiple in range(2 * z, n + 1, z):
                      union(z, multiple)
              return all(bool(value) == (find(a) == find(b)) for value, (a, b) in zip(result, queries))
