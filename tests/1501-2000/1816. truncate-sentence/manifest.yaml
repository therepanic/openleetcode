entry:
  id: 1816
  title: "truncate-sentence"
  params:
    s:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().truncateSentence({s}, {k})"
    rust: "Solution::truncate_sentence({s}, {k})"
    python3: "Solution().truncateSentence({s}, {k})"
    python2: "Solution().truncateSentence({s}, {k})"
    ruby: "truncate_sentence({s}, {k})"
    java: "new Solution().truncateSentence({s}, {k})"
    csharp: "new Solution().TruncateSentence({s}, {k})"
    kotlin: "Solution().truncateSentence({s}, {k})"
    go: "truncateSentence({s}, {k})"
    dart: "Solution().truncateSentence({s}, {k})"
    swift: "Solution().truncateSentence({s}, {k})"
    typescript: "truncateSentence({s}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().truncateSentence(s, k, {result})"
    checker: |
      class Checker:
          def truncateSentence(self, s, k, result):
              return isinstance(result, str) and result == " ".join(s.split(" ")[:k])

seed: 1816

