entry:
  id: 1780
  title: "check-if-number-is-a-sum-of-powers-of-three"
  params:
    n:
      type: int
  call:
    cpp: "Solution().checkPowersOfThree({n})"
    rust: "Solution::check_powers_of_three({n})"
    python3: "Solution().checkPowersOfThree({n})"
    python2: "Solution().checkPowersOfThree({n})"
    ruby: "check_powers_of_three({n})"
    java: "new Solution().checkPowersOfThree({n})"
    csharp: "new Solution().CheckPowersOfThree({n})"
    kotlin: "Solution().checkPowersOfThree({n})"
    go: "checkPowersOfThree({n})"
    dart: "Solution().checkPowersOfThree({n})"
    swift: "Solution().checkPowersOfThree({n})"
    typescript: "checkPowersOfThree({n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(n, {result})"
    checker: |
      class Checker:
          def check(self, n, result):
              if not isinstance(result, bool):
                  return False
              while n:
                  if n % 3 == 2:
                      return result is False
                  n //= 3
              return result is True

