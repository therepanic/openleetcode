entry:
  id: 1824
  title: "minimum-sideway-jumps"
  params:
    obstacles:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minSideJumps({obstacles})"
    rust: "Solution::min_side_jumps({obstacles})"
    python3: "Solution().minSideJumps({obstacles})"
    python2: "Solution().minSideJumps({obstacles})"
    ruby: "min_side_jumps({obstacles})"
    java: "new Solution().minSideJumps({obstacles})"
    csharp: "new Solution().MinSideJumps({obstacles})"
    kotlin: "Solution().minSideJumps({obstacles})"
    go: "minSideJumps({obstacles})"
    dart: "Solution().minSideJumps({obstacles})"
    swift: "Solution().minSideJumps({obstacles})"
    typescript: "minSideJumps({obstacles})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minSideJumps(obstacles, {result})"
    checker: |
      class Checker:
          def minSideJumps(self, obstacles, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(obstacles, list) or len(obstacles) < 2:
                  return False
              if obstacles[0] != 0 or obstacles[-1] != 0:
                  return False
              dp = [1, 0, 1]
              inf = 10 ** 9
              for obstacle in obstacles[1:]:
                  if obstacle not in (0, 1, 2, 3):
                      return False
                  for lane in range(3):
                      if obstacle == lane + 1:
                          dp[lane] = inf
                  for lane in range(3):
                      if obstacle != lane + 1:
                          dp[lane] = min(dp[lane], min(dp[(lane + 1) % 3], dp[(lane + 2) % 3]) + 1)
              return result == min(dp)

seed: 1824

