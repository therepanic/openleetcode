entry:
  id: 1525
  title: "number-of-good-ways-to-split-a-string"
  params:
    s:
      type: string
  call:
    cpp: "Solution().numSplits({s})"
    rust: "Solution::num_splits({s})"
    python3: "Solution().numSplits({s})"
    python2: "Solution().numSplits({s})"
    ruby: "num_splits({s})"
    java: "new Solution().numSplits({s})"
    csharp: "new Solution().NumSplits({s})"
    kotlin: "Solution().numSplits({s})"
    go: "numSplits({s})"
    dart: "Solution().numSplits({s})"
    swift: "Solution().numSplits({s})"
    typescript: "numSplits({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numSplits(s, {result})"
    checker: |
      class Checker:
          def numSplits(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(s, str) or not (1 <= len(s) <= 100000):
                  return False
              if any(c < 'a' or c > 'z' for c in s):
                  return False
              from collections import Counter
              left = set()
              right = Counter(s)
              expected = 0
              for c in s[:-1]:
                  left.add(c)
                  right[c] -= 1
                  if right[c] == 0:
                      del right[c]
                  if len(left) == len(right):
                      expected += 1
              return result == expected

seed: 1525

