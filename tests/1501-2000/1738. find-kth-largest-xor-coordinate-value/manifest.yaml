entry:
  id: 1738
  title: "find-kth-largest-xor-coordinate-value"
  params:
    matrix:
      type: array
      items:
        type: array
        items:
          type: int
    k:
      type: int
  call:
    cpp: "Solution().kthLargestValue({matrix}, {k})"
    rust: "Solution::kth_largest_value({matrix}, {k})"
    python3: "Solution().kthLargestValue({matrix}, {k})"
    python2: "Solution().kthLargestValue({matrix}, {k})"
    ruby: "kth_largest_value({matrix}, {k})"
    java: "new Solution().kthLargestValue({matrix}, {k})"
    csharp: "new Solution().KthLargestValue({matrix}, {k})"
    kotlin: "Solution().kthLargestValue({matrix}, {k})"
    go: "kthLargestValue({matrix}, {k})"
    dart: "Solution().kthLargestValue({matrix}, {k})"
    swift: "Solution().kthLargestValue({matrix}, {k})"
    typescript: "kthLargestValue({matrix}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().kthLargestValue(matrix, k, {result})"
    checker: |
      class Checker:
          def kthLargestValue(self, matrix, k, result):
              if not isinstance(matrix, list) or not matrix or not isinstance(k, int):
                  return False
              if not all(isinstance(row, list) and row for row in matrix):
                  return False
              width = len(matrix[0])
              if any(len(row) != width or any(not isinstance(x, int) or x < 0 or x > 1000000 for x in row) for row in matrix):
                  return False
              if k < 1 or k > len(matrix) * width or not isinstance(result, int):
                  return False
              pref = [[0] * width for _ in matrix]
              values = []
              for i, row in enumerate(matrix):
                  for j, value in enumerate(row):
                      cur = value
                      if i:
                          cur ^= pref[i - 1][j]
                      if j:
                          cur ^= pref[i][j - 1]
                      if i and j:
                          cur ^= pref[i - 1][j - 1]
                      pref[i][j] = cur
                      values.append(cur)
              values.sort(reverse=True)
              return result == values[k - 1]

seed: 17381738

