entry:
  id: 1806
  title: "minimum-number-of-operations-to-reinitialize-a-permutation"
  params:
    n:
      type: int
  call:
    cpp: "Solution().reinitializePermutation({n})"
    rust: "Solution::reinitialize_permutation({n})"
    python3: "Solution().reinitializePermutation({n})"
    python2: "Solution().reinitializePermutation({n})"
    ruby: "reinitialize_permutation({n})"
    java: "new Solution().reinitializePermutation({n})"
    csharp: "new Solution().ReinitializePermutation({n})"
    kotlin: "Solution().reinitializePermutation({n})"
    go: "reinitializePermutation({n})"
    dart: "Solution().reinitializePermutation({n})"
    swift: "Solution().reinitializePermutation({n})"
    typescript: "reinitializePermutation({n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(n, {result})"
    checker: |
      class Checker:
          def check(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              original = list(range(n))
              perm = original[:]
              steps = 0
              while True:
                  perm = [perm[i // 2] if i % 2 == 0 else perm[n // 2 + (i - 1) // 2] for i in range(n)]
                  steps += 1
                  if perm == original:
                      return result == steps

