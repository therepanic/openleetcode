entry:
  id: 1941
  title: "check-if-all-characters-have-equal-number-of-occurrences"
  params:
    s:
      type: string
  call:
    cpp: "Solution().areOccurrencesEqual({s})"
    rust: "Solution::are_occurrences_equal({s})"
    python3: "Solution().areOccurrencesEqual({s})"
    python2: "Solution().areOccurrencesEqual({s})"
    ruby: "are_occurrences_equal({s})"
    java: "new Solution().areOccurrencesEqual({s})"
    csharp: "new Solution().AreOccurrencesEqual({s})"
    kotlin: "Solution().areOccurrencesEqual({s})"
    go: "areOccurrencesEqual({s})"
    dart: "Solution().areOccurrencesEqual({s})"
    swift: "Solution().areOccurrencesEqual({s})"
    typescript: "areOccurrencesEqual({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().areOccurrencesEqual(s, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def areOccurrencesEqual(self, s, result):
              if not isinstance(result, bool):
                  return False
              counts = Counter(s).values()
              expected = len(set(counts)) == 1
              return result == expected

seed: 1941

