    rust: "Solution::nearest_exit({maze}, {entrance})"
    python3: "Solution().nearestExit({maze}, {entrance})"
    python2: "Solution().nearestExit({maze}, {entrance})"
    ruby: "nearest_exit({maze}, {entrance})"
    java: "new Solution().nearestExit({maze}, {entrance})"
    csharp: "new Solution().NearestExit({maze}, {entrance})"
    kotlin: "Solution().nearestExit({maze}, {entrance})"
    go: "nearestExit({maze}, {entrance})"
    dart: "Solution().nearestExit({maze}, {entrance})"
    swift: "Solution().nearestExit({maze}, {entrance})"
    typescript: "nearestExit({maze}, {entrance})"

judge:
