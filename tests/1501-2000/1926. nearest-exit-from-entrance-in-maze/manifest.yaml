limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().nearestExit(maze, entrance, {result})"
    checker: |
      from collections import deque

      class Checker:
          def nearestExit(self, maze, entrance, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              rows = len(maze)
              cols = len(maze[0])
              start = (entrance[0], entrance[1])
              queue = deque([(start[0], start[1], 0)])
              seen = {start}
              while queue:
                  r, c, distance = queue.popleft()
                  for dr, dc in ((-1, 0), (1, 0), (0, -1), (0, 1)):
                      nr, nc = r + dr, c + dc
                      if nr < 0 or nr >= rows or nc < 0 or nc >= cols:
                          continue
                      if (nr, nc) in seen or maze[nr][nc] != '.':
                          continue
                      if nr == 0 or nr == rows - 1 or nc == 0 or nc == cols - 1:
                          return result == distance + 1
                      seen.add((nr, nc))
                      queue.append((nr, nc, distance + 1))
              return result == -1

