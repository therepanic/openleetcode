entry:
  id: 1755
  title: closest-subsequence-sum
  params:
    nums:
      type: array
      items:
        type: int
    goal:
      type: int
  call:
    cpp: "Solution().minAbsDifference({nums}, {goal})"
    rust: "Solution::min_abs_difference({nums}, {goal})"
    python3: "Solution().minAbsDifference({nums}, {goal})"
    python2: "Solution().minAbsDifference({nums}, {goal})"
    ruby: "min_abs_difference({nums}, {goal})"
    java: "new Solution().minAbsDifference({nums}, {goal})"
    csharp: "new Solution().MinAbsDifference({nums}, {goal})"
    kotlin: "Solution().minAbsDifference({nums}, {goal})"
    go: "minAbsDifference({nums}, {goal})"
    dart: "Solution().minAbsDifference({nums}, {goal})"
    swift: "Solution().minAbsDifference({nums}, {goal})"
    typescript: "minAbsDifference({nums}, {goal})"
judge:
  type: exact
limits:
  time_ms: 10000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().check(nums, goal, {result})"
    checker: |
      class Checker:
          def check(self, nums, goal, result):
              if not isinstance(result, int) or isinstance(result, bool) or result < 0:
                  return False
              def sums(values):
                  out = [0]
                  for value in values:
                      out += [x + value for x in out]
                  return out
              mid = len(nums) // 2
              left = sorted(sums(nums[:mid]))
              right = sorted(sums(nums[mid:]))
              best = abs(goal)
              j = len(right) - 1
              for value in left:
                  while j > 0 and right[j - 1] >= goal - value:
                      j -= 1
                  best = min(best, abs(value + right[j] - goal))
                  if j > 0:
                      best = min(best, abs(value + right[j - 1] - goal))
              return result == best
seed: 1755
