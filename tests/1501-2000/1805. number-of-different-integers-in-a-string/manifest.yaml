entry:
  id: 1805
  title: "number-of-different-integers-in-a-string"
  params:
    word:
      type: string
  call:
    cpp: "Solution().numDifferentIntegers({word})"
    rust: "Solution::num_different_integers({word})"
    python3: "Solution().numDifferentIntegers({word})"
    python2: "Solution().numDifferentIntegers({word})"
    ruby: "num_different_integers({word})"
    java: "new Solution().numDifferentIntegers({word})"
    csharp: "new Solution().NumDifferentIntegers({word})"
    kotlin: "Solution().numDifferentIntegers({word})"
    go: "numDifferentIntegers({word})"
    dart: "Solution().numDifferentIntegers({word})"
    swift: "Solution().numDifferentIntegers({word})"
    typescript: "numDifferentIntegers({word})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numDifferentIntegers(word, {result})"
    checker: |
      class Checker:
          def numDifferentIntegers(self, word, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              values = set()
              i = 0
              while i < len(word):
                  while i < len(word) and not word[i].isdigit():
                      i += 1
                  start = i
                  while i < len(word) and word[i].isdigit():
                      i += 1
                  if start < i:
                      token = word[start:i].lstrip("0") or "0"
                      values.add(token)
              return result == len(values)

seed: 1805

