entry:
  id: 1678
  title: "goal-parser-interpretation"
  params:
    command:
      type: string
  call:
    cpp: "Solution().interpret({command})"
    rust: "Solution::interpret({command})"
    python3: "Solution().interpret({command})"
    python2: "Solution().interpret({command})"
    ruby: "interpret({command})"
    java: "new Solution().interpret({command})"
    csharp: "new Solution().Interpret({command})"
    kotlin: "Solution().interpret({command})"
    go: "interpret({command})"
    dart: "Solution().interpret({command})"
    swift: "Solution().interpret({command})"
    typescript: "interpret({command})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(command, {result})"
    checker: |
      class Checker:
          def check(self, command, result):
              expected = []
              i = 0
              while i < len(command):
                  if command[i] == "G":
                      expected.append("G")
                      i += 1
                  elif command[i:i + 2] == "()":
                      expected.append("o")
                      i += 2
                  else:
                      expected.append("al")
                      i += 4
              return result == "".join(expected)

seed: 1678

tests:
  - name: example-one
    in:
      command: "G()(al)"
    out: "Goal"
  - name: example-two
    in:
      command: "G()()()()(al)"
    out: "Gooooal"
  - name: example-three
    in:
      command: "(al)G(al)()()G"
    out: "alGalooG"
