entry:
  id: 1637
  title: "widest-vertical-area-between-two-points-containing-no-points"
  params:
    points:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxWidthOfVerticalArea({points})"
    rust: "Solution::max_width_of_vertical_area({points})"
    python3: "Solution().maxWidthOfVerticalArea({points})"
    python2: "Solution().maxWidthOfVerticalArea({points})"
    ruby: "max_width_of_vertical_area({points})"
    java: "new Solution().maxWidthOfVerticalArea({points})"
    csharp: "new Solution().MaxWidthOfVerticalArea({points})"
    kotlin: "Solution().maxWidthOfVerticalArea({points})"
    go: "maxWidthOfVerticalArea({points})"
    dart: "Solution().maxWidthOfVerticalArea({points})"
    swift: "Solution().maxWidthOfVerticalArea({points})"
    typescript: "maxWidthOfVerticalArea({points})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxWidthOfVerticalArea(points, {result})"
    checker: |
      class Checker:
          def maxWidthOfVerticalArea(self, points, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              xs = sorted(p[0] for p in points)
              expected = max(xs[i + 1] - xs[i] for i in range(len(xs) - 1))
              return result == expected

seed: 1637

