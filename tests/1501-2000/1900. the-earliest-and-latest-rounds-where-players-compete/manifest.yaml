    rust: "Solution::earliest_and_latest({n}, {firstPlayer}, {secondPlayer})"
    python3: "Solution().earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    python2: "Solution().earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    ruby: "earliest_and_latest({n}, {firstPlayer}, {secondPlayer})"
    java: "new Solution().earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    csharp: "new Solution().EarliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    kotlin: "Solution().earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    go: "earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
    dart: "Solution().earliestAndLatest({n}, {firstPlayer}, {secondPlayer})"
