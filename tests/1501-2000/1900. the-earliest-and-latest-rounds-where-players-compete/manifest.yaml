judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().check(n, firstPlayer, secondPlayer, {result})"
    checker: |
      from functools import lru_cache

      class Checker:
          def check(self, n, firstPlayer, secondPlayer, result):
              if not isinstance(result, list) or len(result) != 2:
                  return False
              @lru_cache(None)
              def solve(size, a, b):
                  if a + b == size + 1:
                      return (1, 1)
                  if a > b:
                      a, b = b, a
                  if size <= 4:
                      return (2, 2)
                  m = (size + 1) // 2
                  lo, hi = 10**9, -1
                  if a - 1 > size - b:
                      a, b = size + 1 - b, size + 1 - a
                  if b * 2 <= size + 1:
                      left = a - 1
                      gap = b - a - 1
                      for i in range(left + 1):
                          for j in range(gap + 1):
                              x, y = solve(m, i + 1, i + j + 2)
                              lo = min(lo, x + 1)
                              hi = max(hi, y + 1)
                  else:
                      mirror = size + 1 - b
                      left = a - 1
                      gap = mirror - a - 1
                      right = b - mirror - 1
                      for i in range(left + 1):
                          for j in range(gap + 1):
                              offset = i + j + 1 + (right + 1) // 2 + 1
                              x, y = solve(m, i + 1, offset)
                              lo = min(lo, x + 1)
                              hi = max(hi, y + 1)
                  return lo, hi
              return result == list(solve(n, firstPlayer, secondPlayer))

