entry:
  id: 1679
  title: "max-number-of-k-sum-pairs"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().maxOperations({nums}, {k})"
    rust: "Solution::max_operations({nums}, {k})"
    python3: "Solution().maxOperations({nums}, {k})"
    python2: "Solution().maxOperations({nums}, {k})"
    ruby: "max_operations({nums}, {k})"
    java: "new Solution().maxOperations({nums}, {k})"
    csharp: "new Solution().MaxOperations({nums}, {k})"
    kotlin: "Solution().maxOperations({nums}, {k})"
    go: "maxOperations({nums}, {k})"
    dart: "Solution().maxOperations({nums}, {k})"
    swift: "Solution().maxOperations({nums}, {k})"
    typescript: "maxOperations({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxOperations(nums, k, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def maxOperations(self, nums, k, result):
              counts = Counter(nums)
              expected = 0
              for value in list(counts):
                  other = k - value
                  if other not in counts:
                      continue
                  if value == other:
                      expected += counts[value] // 2
                      counts[value] = 0
                  elif counts[value] > 0 and counts[other] > 0:
                      pairs = min(counts[value], counts[other])
                      expected += pairs
                      counts[value] -= pairs
                      counts[other] -= pairs
              return result == expected

seed: 1679

