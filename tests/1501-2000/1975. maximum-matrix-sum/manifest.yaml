entry:
  id: 1975
  title: "maximum-matrix-sum"
  params:
    matrix:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxMatrixSum({matrix})"
    rust: "Solution::max_matrix_sum({matrix})"
    python3: "Solution().maxMatrixSum({matrix})"
    python2: "Solution().maxMatrixSum({matrix})"
    ruby: "max_matrix_sum({matrix})"
    java: "new Solution().maxMatrixSum({matrix})"
    csharp: "new Solution().MaxMatrixSum({matrix})"
    kotlin: "Solution().maxMatrixSum({matrix})"
    go: "maxMatrixSum({matrix})"
    dart: "Solution().maxMatrixSum({matrix})"
    swift: "Solution().maxMatrixSum({matrix})"
    typescript: "maxMatrixSum({matrix})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxMatrixSum(matrix, {result})"
    checker: |
      class Checker:
          def maxMatrixSum(self, matrix, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(matrix, list) or not matrix:
                  return False
              n = len(matrix)
              if any(not isinstance(row, list) or len(row) != n for row in matrix):
                  return False
              values = [v for row in matrix for v in row]
              if any(not isinstance(v, int) or isinstance(v, bool) for v in values):
                  return False
              expected = sum(abs(v) for v in values)
              if sum(v < 0 for v in values) % 2:
                  expected -= 2 * min(abs(v) for v in values)
              return result == expected

seed: 1975

