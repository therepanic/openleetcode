entry:
  id: 1648
  title: "sell-diminishing-valued-colored-balls"
  params:
    inventory:
      type: array
      items:
        type: int
    orders:
      type: int
  call:
    cpp: "Solution().maxProfit({inventory}, {orders})"
    rust: "Solution::max_profit({inventory}, {orders})"
    python3: "Solution().maxProfit({inventory}, {orders})"
    python2: "Solution().maxProfit({inventory}, {orders})"
    ruby: "max_profit({inventory}, {orders})"
    java: "new Solution().maxProfit({inventory}, {orders})"
    csharp: "new Solution().MaxProfit({inventory}, {orders})"
    kotlin: "Solution().maxProfit({inventory}, {orders})"
    go: "maxProfit({inventory}, {orders})"
    dart: "Solution().maxProfit({inventory}, {orders})"
    swift: "Solution().maxProfit({inventory}, {orders})"
    typescript: "maxProfit({inventory}, {orders})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxProfit(inventory, orders, {result})"
    checker: |
      class Checker:
          def maxProfit(self, inventory, orders, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              lo, hi = 0, max(inventory)
              while lo < hi:
                  mid = (lo + hi + 1) // 2
                  count = sum(max(x - mid, 0) for x in inventory)
                  if count >= orders:
                      lo = mid
                  else:
                      hi = mid - 1
              level = lo
              sold = sum(max(x - level, 0) for x in inventory)
              value = sum((x + level + 1) * (x - level) // 2 for x in inventory if x > level)
              expected = (value - (sold - orders) * (level + 1)) % 1000000007
              return result == expected

