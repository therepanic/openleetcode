entry:
  id: 1800
  title: "maximum-ascending-subarray-sum"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxAscendingSum({nums})"
    rust: "Solution::max_ascending_sum({nums})"
    python3: "Solution().maxAscendingSum({nums})"
    python2: "Solution().maxAscendingSum({nums})"
    ruby: "max_ascending_sum({nums})"
    java: "new Solution().maxAscendingSum({nums})"
    csharp: "new Solution().MaxAscendingSum({nums})"
    kotlin: "Solution().maxAscendingSum({nums})"
    go: "maxAscendingSum({nums})"
    dart: "Solution().maxAscendingSum({nums})"
    swift: "Solution().maxAscendingSum({nums})"
    typescript: "maxAscendingSum({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxAscendingSum(nums, {result})"
    checker: |
      class Checker:
          def maxAscendingSum(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = current = nums[0]
              for i in range(1, len(nums)):
                  if nums[i] > nums[i - 1]:
                      current += nums[i]
                  else:
                      current = nums[i]
                  best = max(best, current)
              return result == best

seed: 1800

