entry:
  id: 1663
  title: "smallest-string-with-a-given-numeric-value"
  params:
    n:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().getSmallestString({n}, {k})"
    rust: "Solution::get_smallest_string({n}, {k})"
    python3: "Solution().getSmallestString({n}, {k})"
    python2: "Solution().getSmallestString({n}, {k})"
    ruby: "get_smallest_string({n}, {k})"
    java: "new Solution().getSmallestString({n}, {k})"
    csharp: "new Solution().GetSmallestString({n}, {k})"
    kotlin: "Solution().getSmallestString({n}, {k})"
    go: "getSmallestString({n}, {k})"
    dart: "Solution().getSmallestString({n}, {k})"
    swift: "Solution().getSmallestString({n}, {k})"
    typescript: "getSmallestString({n}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getSmallestString(n, k, {result})"
    checker: |
      class Checker:
          def getSmallestString(self, n, k, result):
              if not isinstance(result, str) or len(result) != n:
                  return False
              if any(ch < 'a' or ch > 'z' for ch in result):
                  return False
              extra = k - n
              expected = ['a'] * n
              i = n - 1
              while extra:
                  add = min(25, extra)
                  expected[i] = chr(ord('a') + add)
                  extra -= add
                  i -= 1
              return result == ''.join(expected)

seed: 1663

