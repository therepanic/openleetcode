entry:
  id: 1896
  title: "minimum-cost-to-change-the-final-value-of-expression"
  params:
    expression:
      type: string
  call:
    cpp: "Solution().minOperationsToFlip({expression})"
    rust: "Solution::min_operations_to_flip({expression})"
    python3: "Solution().minOperationsToFlip({expression})"
    python2: "Solution().minOperationsToFlip({expression})"
    ruby: "min_operations_to_flip({expression})"
    java: "new Solution().minOperationsToFlip({expression})"
    csharp: "new Solution().MinOperationsToFlip({expression})"
    kotlin: "Solution().minOperationsToFlip({expression})"
    go: "minOperationsToFlip({expression})"
    dart: "Solution().minOperationsToFlip({expression})"
    swift: "Solution().minOperationsToFlip({expression})"
    typescript: "minOperationsToFlip({expression})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minOperationsToFlip(expression, {result})"
    checker: |
      class Checker:
          def minOperationsToFlip(self, expression, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              pos = 0

              def parse_atom():
                  nonlocal pos
                  if expression[pos] in "01":
                      value = int(expression[pos])
                      pos += 1
                      return value, 1
                  pos += 1
                  value = parse_expr()
                  if pos >= len(expression) or expression[pos] != ")":
                      raise ValueError
                  pos += 1
                  return value

              def combine(left, right, op):
                  lv, lc = left
                  rv, rc = right
                  value = (lv & rv) if op == "&" else (lv | rv)
                  if lv == rv == (0 if op == "&" else 1):
                      cost = min(lc, rc)
                  elif lv == rv == (1 if op == "&" else 0):
                      cost = 1 + min(lc, rc)
                  else:
                      cost = 1
                  return value, cost

              def parse_expr():
                  nonlocal pos
                  current = parse_atom()
                  while pos < len(expression) and expression[pos] != ")":
                      op = expression[pos]
                      if op not in "&|":
                          raise ValueError
                      pos += 1
                      current = combine(current, parse_atom(), op)
                  return current

              try:
                  value, cost = parse_expr()
                  if pos != len(expression):
                      return False
                  return cost == result and cost >= 1
              except (IndexError, ValueError, TypeError):
                  return False

seed: 1896

