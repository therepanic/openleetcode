entry:
  id: 1828
  title: "queries-on-number-of-points-inside-a-circle"
  params:
    points:
      type: array
      items:
        type: array
        items:
          type: int
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countPoints({points}, {queries})"
    rust: "Solution::count_points({points}, {queries})"
    python3: "Solution().countPoints({points}, {queries})"
    python2: "Solution().countPoints({points}, {queries})"
    ruby: "count_points({points}, {queries})"
    java: "new Solution().countPoints({points}, {queries})"
    csharp: "new Solution().CountPoints({points}, {queries})"
    kotlin: "Solution().countPoints({points}, {queries})"
    go: "countPoints({points}, {queries})"
    dart: "Solution().countPoints({points}, {queries})"
    swift: "Solution().countPoints({points}, {queries})"
    typescript: "countPoints({points}, {queries})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countPoints(points, queries, {result})"
    checker: |
      class Checker:
          def countPoints(self, points, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              expected = []
              for qx, qy, r in queries:
                  rr = r * r
                  expected.append(sum((qx - x) * (qx - x) + (qy - y) * (qy - y) <= rr for x, y in points))
              return result == expected

seed: 1828

