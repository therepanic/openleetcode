entry:
  id: 1745
  title: "palindrome-partitioning-iv"
  params:
    s:
      type: string
  call:
    cpp: "Solution().checkPartitioning({s})"
    rust: "Solution::check_partitioning({s})"
    python3: "Solution().checkPartitioning({s})"
    python2: "Solution().checkPartitioning({s})"
    ruby: "check_partitioning({s})"
    java: "new Solution().checkPartitioning({s})"
    csharp: "new Solution().CheckPartitioning({s})"
    kotlin: "Solution().checkPartitioning({s})"
    go: "checkPartitioning({s})"
    dart: "Solution().checkPartitioning({s})"
    swift: "Solution().checkPartitioning({s})"
    typescript: "checkPartitioning({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().checkPartitioning(s, {result})"
    checker: |
      class Checker:
          def checkPartitioning(self, s, result):
              if not isinstance(result, bool):
                  return False
              n = len(s)
              pal = [[False] * n for _ in range(n)]
              for i in range(n):
                  pal[i][i] = True
              for length in range(2, n + 1):
                  for left in range(n - length + 1):
                      right = left + length - 1
                      pal[left][right] = s[left] == s[right] and (length == 2 or pal[left + 1][right - 1])
              expected = False
              for first_end in range(n - 2):
                  if not pal[0][first_end]:
                      continue
                  for second_end in range(first_end + 1, n - 1):
                      if pal[first_end + 1][second_end] and pal[second_end + 1][n - 1]:
                          expected = True
                          break
                  if expected:
                      break
              return result == expected

