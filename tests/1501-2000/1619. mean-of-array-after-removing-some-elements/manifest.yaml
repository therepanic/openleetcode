entry:
  id: 1619
  title: "mean-of-array-after-removing-some-elements"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().trimMean({arr})"
    rust: "Solution::trim_mean({arr})"
    python3: "Solution().trimMean({arr})"
    python2: "Solution().trimMean({arr})"
    ruby: "trim_mean({arr})"
    java: "new Solution().trimMean({arr})"
    csharp: "new Solution().TrimMean({arr})"
    kotlin: "Solution().trimMean({arr})"
    go: "trimMean({arr})"
    dart: "Solution().trimMean({arr})"
    swift: "Solution().trimMean({arr})"
    typescript: "trimMean({arr})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().trimMean(arr, {result})"
    checker: |
      class Checker:
          def trimMean(self, arr, result):
              if not isinstance(result, (int, float)) or isinstance(result, bool):
                  return False
              n = len(arr)
              k = n // 20
              expected = sum(sorted(arr)[k:n-k]) / float(n - 2 * k)
              return abs(float(result) - expected) <= 1e-5
seed: 1619
