entry:
  id: 1574
  title: "shortest-subarray-to-be-removed-to-make-array-sorted"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().findLengthOfShortestSubarray({arr})"
    rust: "Solution::find_length_of_shortest_subarray({arr})"
    python3: "Solution().findLengthOfShortestSubarray({arr})"
    python2: "Solution().findLengthOfShortestSubarray({arr})"
    ruby: "find_length_of_shortest_subarray({arr})"
    java: "new Solution().findLengthOfShortestSubarray({arr})"
    csharp: "new Solution().FindLengthOfShortestSubarray({arr})"
    kotlin: "Solution().findLengthOfShortestSubarray({arr})"
    go: "findLengthOfShortestSubarray({arr})"
    dart: "Solution().findLengthOfShortestSubarray({arr})"
    swift: "Solution().findLengthOfShortestSubarray({arr})"
    typescript: "findLengthOfShortestSubarray({arr})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().check(arr, {result})"
    checker: |
      class Checker:
          def check(self, arr, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(arr)
              right = n - 1
              while right > 0 and arr[right - 1] <= arr[right]:
                  right -= 1
              if right == 0:
                  return result == 0
              best = right
              left = 0
              while left == 0 or (left < n and arr[left - 1] <= arr[left]):
                  while right < n and arr[left] > arr[right]:
                      right += 1
                  best = min(best, right - left - 1)
                  left += 1
                  if left >= n:
                      break
              return result == best
seed: 1574
