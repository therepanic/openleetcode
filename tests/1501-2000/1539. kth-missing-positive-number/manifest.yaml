entry:
  id: 1539
  title: "kth-missing-positive-number"
  params:
    arr:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().findKthPositive({arr}, {k})"
    rust: "Solution::find_kth_positive({arr}, {k})"
    python3: "Solution().findKthPositive({arr}, {k})"
    python2: "Solution().findKthPositive({arr}, {k})"
    ruby: "find_kth_positive({arr}, {k})"
    java: "new Solution().findKthPositive({arr}, {k})"
    csharp: "new Solution().FindKthPositive({arr}, {k})"
    kotlin: "Solution().findKthPositive({arr}, {k})"
    go: "findKthPositive({arr}, {k})"
    dart: "Solution().findKthPositive({arr}, {k})"
    swift: "Solution().findKthPositive({arr}, {k})"
    typescript: "findKthPositive({arr}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findKthPositive(arr, k, {result})"
    checker: |
      class Checker:
          def findKthPositive(self, arr, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              present = set(arr)
              missing = 0
              value = 1
              while missing < k:
                  if value not in present:
                      missing += 1
                  value += 1
              return result == value - 1

seed: 1539001

