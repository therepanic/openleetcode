  call:
    cpp: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    rust: "Solution::distance_limited_paths_exist({n}, {edgeList}, {queries})"
    python3: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    python2: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    ruby: "distance_limited_paths_exist({n}, {edgeList}, {queries})"
    java: "new Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    csharp: "new Solution().DistanceLimitedPathsExist({n}, {edgeList}, {queries})"
    kotlin: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    go: "distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    dart: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    swift: "Solution().distanceLimitedPathsExist({n}, {edgeList}, {queries})"
    typescript: "distanceLimitedPathsExist({n}, {edgeList}, {queries})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(n, edgeList, queries, {result})"
    checker: |
      class Checker:
          def check(self, n, edgeList, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              parent = list(range(n))
              rank = [0] * n
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              def union(a, b):
                  a, b = find(a), find(b)
                  if a == b:
                      return
                  if rank[a] < rank[b]:
                      a, b = b, a
                  parent[b] = a
                  if rank[a] == rank[b]:
                      rank[a] += 1
              def valid_edge(edge):
                  return (isinstance(edge, list) and len(edge) == 3 and
                          all(isinstance(x, int) and not isinstance(x, bool) for x in edge) and
                          0 <= edge[0] < n and 0 <= edge[1] < n and edge[0] != edge[1] and
                          1 <= edge[2] <= 10**9)

              def valid_query(query):
                  return (isinstance(query, list) and len(query) == 3 and
                          all(isinstance(x, int) and not isinstance(x, bool) for x in query) and
                          0 <= query[0] < n and 0 <= query[1] < n and query[0] != query[1] and
                          1 <= query[2] <= 10**9)

              if not all(valid_edge(edge) for edge in edgeList):
                  return False
              if not all(valid_query(query) for query in queries):
                  return False

              ordered_edges = sorted(edgeList, key=lambda edge: edge[2])
              ordered_queries = sorted(enumerate(queries), key=lambda item: item[1][2])
              expected = [False] * len(queries)
              edge_index = 0
              for query_index, (p, q, limit) in ordered_queries:
                  while (edge_index < len(ordered_edges) and
                         ordered_edges[edge_index][2] < limit):
                      u, v, _ = ordered_edges[edge_index]
                      union(u, v)
                      edge_index += 1
                  expected[query_index] = find(p) == find(q)
              return all(isinstance(actual, bool) and actual == wanted
                         for actual, wanted in zip(result, expected))

