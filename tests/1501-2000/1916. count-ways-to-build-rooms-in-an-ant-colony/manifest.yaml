entry:
  id: 1916
  title: "count-ways-to-build-rooms-in-an-ant-colony"
  params:
    prevRoom:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().waysToBuildRooms({prevRoom})"
    rust: "Solution::ways_to_build_rooms({prevRoom})"
    python3: "Solution().waysToBuildRooms({prevRoom})"
    python2: "Solution().waysToBuildRooms({prevRoom})"
    ruby: "ways_to_build_rooms({prevRoom})"
    java: "new Solution().waysToBuildRooms({prevRoom})"
    csharp: "new Solution().WaysToBuildRooms({prevRoom})"
    kotlin: "Solution().waysToBuildRooms({prevRoom})"
    go: "waysToBuildRooms({prevRoom})"
    dart: "Solution().waysToBuildRooms({prevRoom})"
    swift: "Solution().waysToBuildRooms({prevRoom})"
    typescript: "waysToBuildRooms({prevRoom})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().waysToBuildRooms(prevRoom, {result})"
    checker: |
      class Checker:
          MOD = 1000000007

          def waysToBuildRooms(self, prevRoom, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(prevRoom)
              if n < 2 or n > 100000 or prevRoom[0] != -1:
                  return False
              children = [[] for _ in range(n)]
              for i in range(1, n):
                  p = prevRoom[i]
                  if not isinstance(p, int) or p < 0 or p >= n:
                      return False
                  children[p].append(i)
              fact = [1] * (n + 1)
              for i in range(1, n + 1):
                  fact[i] = fact[i - 1] * i % self.MOD
              invfact = [1] * (n + 1)
              invfact[n] = pow(fact[n], self.MOD - 2, self.MOD)
              for i in range(n, 0, -1):
                  invfact[i - 1] = invfact[i] * i % self.MOD
              size = [0] * n
              ways = [1] * n
              order = [0]
              for v in order:
                  order.extend(children[v])
              if len(order) != n:
                  return False
              for v in reversed(order):
                  total = 0
                  w = 1
                  for u in children[v]:
                      c = size[u]
                      w = w * fact[total + c] % self.MOD
                      w = w * invfact[total] % self.MOD
                      w = w * invfact[c] % self.MOD
                      w = w * ways[u] % self.MOD
                      total += c
                  size[v] = total + 1
                  ways[v] = w
              return result == ways[0]
seed: 1916
