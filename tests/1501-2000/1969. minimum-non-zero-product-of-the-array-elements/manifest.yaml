entry:
  id: 1969
  title: "minimum-non-zero-product-of-the-array-elements"
  params:
    p:
      type: int
  call:
    cpp: "Solution().minNonZeroProduct({p})"
    rust: "Solution::min_non_zero_product({p})"
    python3: "Solution().minNonZeroProduct({p})"
    python2: "Solution().minNonZeroProduct({p})"
    ruby: "min_non_zero_product({p})"
    java: "new Solution().minNonZeroProduct({p})"
    csharp: "new Solution().MinNonZeroProduct({p})"
    kotlin: "Solution().minNonZeroProduct({p})"
    go: "minNonZeroProduct({p})"
    dart: "Solution().minNonZeroProduct({p})"
    swift: "Solution().minNonZeroProduct({p})"
    typescript: "minNonZeroProduct({p})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minNonZeroProduct(p, {result})"
    checker: |
      class Checker:
          def minNonZeroProduct(self, p, result):
              if not isinstance(p, int) or not (1 <= p <= 60):
                  return False
              if not isinstance(result, int):
                  return False
              mod = 1000000007
              maximum = (1 << p) - 1
              exponent = (1 << (p - 1)) - 1
              expected = pow(maximum - 1, exponent, mod) * maximum % mod
              return result == expected

seed: 1969

