entry:
  id: 1691
  title: "maximum-height-by-stacking-cuboids"
  params:
    cuboids:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxHeight({cuboids})"
    rust: "Solution::max_height({cuboids})"
    python3: "Solution().maxHeight({cuboids})"
    python2: "Solution().maxHeight({cuboids})"
    ruby: "max_height({cuboids})"
    java: "new Solution().maxHeight({cuboids})"
    csharp: "new Solution().MaxHeight({cuboids})"
    kotlin: "Solution().maxHeight({cuboids})"
    go: "maxHeight({cuboids})"
    dart: "Solution().maxHeight({cuboids})"
    swift: "Solution().maxHeight({cuboids})"
    typescript: "maxHeight({cuboids})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxHeight(cuboids, {result})"
    checker: |
      class Checker:
          def maxHeight(self, cuboids, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              normalized = sorted(sorted(int(x) for x in c) for c in cuboids)
              dp = [0] * len(normalized)
              for i, current in enumerate(normalized):
                  dp[i] = current[2]
                  for j in range(i):
                      previous = normalized[j]
                      if all(previous[k] <= current[k] for k in range(3)):
                          dp[i] = max(dp[i], dp[j] + current[2])
              return result == max(dp)

seed: 1691

