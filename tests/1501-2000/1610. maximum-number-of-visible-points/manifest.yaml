    cpp: "Solution().visiblePoints({points}, {angle}, {location})"
    rust: "Solution::visible_points({points}, {angle}, {location})"
    python3: "Solution().visiblePoints({points}, {angle}, {location})"
    python2: "Solution().visiblePoints({points}, {angle}, {location})"
    ruby: "visible_points({points}, {angle}, {location})"
    java: "new Solution().visiblePoints({points}, {angle}, {location})"
    csharp: "new Solution().VisiblePoints({points}, {angle}, {location})"
    kotlin: "Solution().visiblePoints({points}, {angle}, {location})"
    go: "visiblePoints({points}, {angle}, {location})"
    dart: "Solution().visiblePoints({points}, {angle}, {location})"
    swift: "Solution().visiblePoints({points}, {angle}, {location})"
    typescript: "visiblePoints({points}, {angle}, {location})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().visiblePoints(points, angle, location, {result})"
    checker: |
      import math

      class Checker:
          def visiblePoints(self, points, angle, location, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              lx, ly = location
              same = 0
              values = []
              for x, y in points:
                  dx, dy = x - lx, y - ly
                  if dx == 0 and dy == 0:
                      same += 1
                  else:
                      values.append(math.degrees(math.atan2(dy, dx)))
              if not values:
                  return result == same
              values.sort()
              doubled = values + [x + 360.0 for x in values]
              best = 0
              left = 0
              eps = 1e-10
              for right in range(len(doubled)):
                  while doubled[right] - doubled[left] > angle + eps:
                      left += 1
                  if right - left + 1 > best:
                      best = right - left + 1
              return result == same + min(best, len(values))

seed: 16101610

