  title: "minimum-xor-sum-of-two-arrays"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumXORSum({nums1}, {nums2})"
    rust: "Solution::minimum_xor_sum({nums1}, {nums2})"
    python3: "Solution().minimumXORSum({nums1}, {nums2})"
    python2: "Solution().minimumXORSum({nums1}, {nums2})"
    ruby: "minimum_xor_sum({nums1}, {nums2})"
    java: "new Solution().minimumXORSum({nums1}, {nums2})"
    csharp: "new Solution().MinimumXORSum({nums1}, {nums2})"
    kotlin: "Solution().minimumXORSum({nums1}, {nums2})"
    go: "minimumXORSum({nums1}, {nums2})"
    dart: "Solution().minimumXORSum({nums1}, {nums2})"
    swift: "Solution().minimumXORSum({nums1}, {nums2})"
    typescript: "minimumXORSum({nums1}, {nums2})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums1, nums2, {result})"
    checker: |
      class Checker:
          def check(self, nums1, nums2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums1)
              if n != len(nums2) or n < 1 or n > 14:
                  return False
              if any(not isinstance(x, int) or x < 0 or x > 10000000 for x in nums1 + nums2):
                  return False
              dp = [10**30] * (1 << n)
              dp[0] = 0
              for mask in range(1 << n):
                  i = mask.bit_count()
                  if i == n:
                      continue
                  for j in range(n):
                      if not (mask >> j) & 1:
                          nxt = mask | (1 << j)
                          value = dp[mask] + (nums1[i] ^ nums2[j])
                          if value < dp[nxt]:
                              dp[nxt] = value
              return result == dp[-1]

seed: 1879

