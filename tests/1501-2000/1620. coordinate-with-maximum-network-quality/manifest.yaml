entry:
  id: 1620
  title: "coordinate-with-maximum-network-quality"
  params:
    towers:
      type: array
      items:
        type: array
        items:
          type: int
    radius:
      type: int
  call:
    cpp: "Solution().bestCoordinate({towers}, {radius})"
    rust: "Solution::best_coordinate({towers}, {radius})"
    python3: "Solution().bestCoordinate({towers}, {radius})"
    python2: "Solution().bestCoordinate({towers}, {radius})"
    ruby: "best_coordinate({towers}, {radius})"
    java: "new Solution().bestCoordinate({towers}, {radius})"
    csharp: "new Solution().BestCoordinate({towers}, {radius})"
    kotlin: "Solution().bestCoordinate({towers}, {radius})"
    go: "bestCoordinate({towers}, {radius})"
    dart: "Solution().bestCoordinate({towers}, {radius})"
    swift: "Solution().bestCoordinate({towers}, {radius})"
    typescript: "bestCoordinate({towers}, {radius})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().bestCoordinate(towers, radius, {result})"
    checker: |
      import math

      class Checker:
          def bestCoordinate(self, towers, radius, result):
              if not isinstance(result, list) or len(result) != 2:
                  return False
              if not all(isinstance(v, int) and not isinstance(v, bool) for v in result):
                  return False
              max_x = max(t[0] for t in towers)
              max_y = max(t[1] for t in towers)
              expected = [0, 0]
              best = 0
              for x in range(max_x + 1):
                  for y in range(max_y + 1):
                      quality = 0
                      for tx, ty, q in towers:
                          distance = math.sqrt((tx - x) ** 2 + (ty - y) ** 2)
                          if distance <= radius:
                              quality += int(q / (1 + distance))
                      candidate = [x, y]
                      if quality > best or (quality == best and candidate < expected):
                          best = quality
                          expected = candidate
              return result == expected

