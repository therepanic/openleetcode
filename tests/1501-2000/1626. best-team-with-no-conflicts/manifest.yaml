entry:
  id: 1626
  title: best-team-with-no-conflicts
  params:
    scores:
      type: array
      items:
        type: int
    ages:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().bestTeamScore({scores}, {ages})"
    rust: "Solution::best_team_score({scores}, {ages})"
    python3: "Solution().bestTeamScore({scores}, {ages})"
    python2: "Solution().bestTeamScore({scores}, {ages})"
    ruby: "best_team_score({scores}, {ages})"
    java: "new Solution().bestTeamScore({scores}, {ages})"
    csharp: "new Solution().BestTeamScore({scores}, {ages})"
    kotlin: "Solution().bestTeamScore({scores}, {ages})"
    go: "bestTeamScore({scores}, {ages})"
    dart: "Solution().bestTeamScore({scores}, {ages})"
    swift: "Solution().bestTeamScore({scores}, {ages})"
    typescript: "bestTeamScore({scores}, {ages})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().bestTeamScore(scores, ages, {result})"
    checker: |
      class Checker:
          def bestTeamScore(self, scores, ages, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if len(scores) != len(ages) or not scores:
                  return False
              order = sorted(zip(ages, scores))
              dp = []
              for _, score in order:
                  dp.append(score)
              for i in range(len(order)):
                  for j in range(i):
                      if order[j][1] <= order[i][1]:
                          dp[i] = max(dp[i], dp[j] + order[i][1])
              return result == max(dp)

