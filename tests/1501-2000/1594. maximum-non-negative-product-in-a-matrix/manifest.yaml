entry:
  id: 1594
  title: "maximum-non-negative-product-in-a-matrix"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxProductPath({grid})"
    rust: "Solution::max_product_path({grid})"
    python3: "Solution().maxProductPath({grid})"
    python2: "Solution().maxProductPath({grid})"
    ruby: "max_product_path({grid})"
    java: "new Solution().maxProductPath({grid})"
    csharp: "new Solution().MaxProductPath({grid})"
    kotlin: "Solution().maxProductPath({grid})"
    go: "maxProductPath({grid})"
    dart: "Solution().maxProductPath({grid})"
    swift: "Solution().maxProductPath({grid})"
    typescript: "maxProductPath({grid})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().maxProductPath(grid, {result})"
    checker: |
      class Checker:
          def maxProductPath(self, grid, result):
              r, c = len(grid), len(grid[0])
              lo = [[0] * c for _ in range(r)]
              hi = [[0] * c for _ in range(r)]
              lo[0][0] = hi[0][0] = grid[0][0]
              for j in range(1, c):
                  v = hi[0][j - 1] * grid[0][j]
                  lo[0][j] = hi[0][j] = v
              for i in range(1, r):
                  v = hi[i - 1][0] * grid[i][0]
                  lo[i][0] = hi[i][0] = v
              for i in range(1, r):
                  for j in range(1, c):
                      x = grid[i][j]
                      vals = (lo[i - 1][j] * x, hi[i - 1][j] * x,
                              lo[i][j - 1] * x, hi[i][j - 1] * x)
                      lo[i][j], hi[i][j] = min(vals), max(vals)
              expected = hi[-1][-1] % (10 ** 9 + 7) if hi[-1][-1] >= 0 else -1
              return result == expected
seed: 1594
