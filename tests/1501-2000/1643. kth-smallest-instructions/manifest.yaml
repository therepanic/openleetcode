judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().kthSmallestPath(destination, k, {result})"
    checker: |
      from math import comb

      class Checker:
          def kthSmallestPath(self, destination, k, result):
              if not isinstance(result, str):
                  return False
              rows, cols = destination
              if len(result) != rows + cols:
                  return False
              if result.count("H") != cols or result.count("V") != rows:
                  return False
              expected = []
              rank = k - 1
              while rows or cols:
                  block = comb(rows + cols - 1, cols - 1) if cols else 0
                  if rank < block:
                      expected.append("H")
                      cols -= 1
                  else:
                      expected.append("V")
                      rank -= block
                      rows -= 1
              return result == "".join(expected)

