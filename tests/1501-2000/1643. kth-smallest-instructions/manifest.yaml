      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().kthSmallestPath({destination}, {k})"
    rust: "Solution::kth_smallest_path({destination}, {k})"
    python3: "Solution().kthSmallestPath({destination}, {k})"
    python2: "Solution().kthSmallestPath({destination}, {k})"
    ruby: "kth_smallest_path({destination}, {k})"
    java: "new Solution().kthSmallestPath({destination}, {k})"
    csharp: "new Solution().KthSmallestPath({destination}, {k})"
    kotlin: "Solution().kthSmallestPath({destination}, {k})"
    go: "kthSmallestPath({destination}, {k})"
    dart: "Solution().kthSmallestPath({destination}, {k})"
    swift: "Solution().kthSmallestPath({destination}, {k})"
