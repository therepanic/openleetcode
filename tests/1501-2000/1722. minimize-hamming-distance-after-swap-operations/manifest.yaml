entry:
  id: 1722
  title: "minimize-hamming-distance-after-swap-operations"
  params:
    source:
      type: array
      items:
        type: int
    target:
      type: array
      items:
        type: int
    allowedSwaps:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    rust: "Solution::minimum_hamming_distance({source}, {target}, {allowedSwaps})"
    python3: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    python2: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    ruby: "minimum_hamming_distance({source}, {target}, {allowedSwaps})"
    java: "new Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    csharp: "new Solution().MinimumHammingDistance({source}, {target}, {allowedSwaps})"
    kotlin: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    go: "minimumHammingDistance({source}, {target}, {allowedSwaps})"
    dart: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    swift: "Solution().minimumHammingDistance({source}, {target}, {allowedSwaps})"
    typescript: "minimumHammingDistance({source}, {target}, {allowedSwaps})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minimumHammingDistance(source, target, allowedSwaps, {result})"
    checker: |
      class Checker:
          def minimumHammingDistance(self, source, target, allowedSwaps, result):
              n = len(source)
              if len(target) != n or not isinstance(result, int) or isinstance(result, bool):
                  return False
              parent = list(range(n))
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              for edge in allowedSwaps:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  a, b = edge
                  if not isinstance(a, int) or not isinstance(b, int) or a < 0 or b < 0 or a >= n or b >= n or a == b:
                      return False
                  ra, rb = find(a), find(b)
                  if ra != rb:
                      parent[ra] = rb
              from collections import Counter
              source_counts = {}
              target_counts = {}
              for i, value in enumerate(source):
                  source_counts.setdefault(find(i), Counter())[value] += 1
              for i, value in enumerate(target):
                  target_counts.setdefault(find(i), Counter())[value] += 1
              expected = 0
              for root, counts in target_counts.items():
                  available = source_counts.get(root, Counter())
                  expected += sum(max(0, count - available[value]) for value, count in counts.items())
              return result == expected
seed: 1722
