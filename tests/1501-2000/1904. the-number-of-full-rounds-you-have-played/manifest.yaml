entry:
  id: 1904
  title: the-number-of-full-rounds-you-have-played
  params:
    loginTime:
      type: string
    logoutTime:
      type: string
  call:
    cpp: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    rust: "Solution::number_of_rounds({loginTime}, {logoutTime})"
    python3: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    python2: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    ruby: "number_of_rounds({loginTime}, {logoutTime})"
    java: "new Solution().numberOfRounds({loginTime}, {logoutTime})"
    csharp: "new Solution().NumberOfRounds({loginTime}, {logoutTime})"
    kotlin: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    go: "numberOfRounds({loginTime}, {logoutTime})"
    dart: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    swift: "Solution().numberOfRounds({loginTime}, {logoutTime})"
    typescript: "numberOfRounds({loginTime}, {logoutTime})"

judge:
  type: exact

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numberOfRounds(loginTime, logoutTime, {result})"
    checker: |
      class Checker:
          def numberOfRounds(self, loginTime, logoutTime, result):
              def minutes(value):
                  hours, mins = map(int, value.split(":"))
                  return hours * 60 + mins

              start = minutes(loginTime)
              end = minutes(logoutTime)
              if end < start:
                  end += 24 * 60
              expected = max(0, end // 15 - (start + 14) // 15)
              return result == expected

seed: 1904

