entry:
  id: 1818
  title: "minimum-absolute-sum-difference"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    rust: "Solution::min_absolute_sum_diff({nums1}, {nums2})"
    python3: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    python2: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    ruby: "min_absolute_sum_diff({nums1}, {nums2})"
    java: "new Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    csharp: "new Solution().MinAbsoluteSumDiff({nums1}, {nums2})"
    kotlin: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    go: "minAbsoluteSumDiff({nums1}, {nums2})"
    dart: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    swift: "Solution().minAbsoluteSumDiff({nums1}, {nums2})"
    typescript: "minAbsoluteSumDiff({nums1}, {nums2})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().check(nums1, nums2, {result})"
    checker: |
      class Checker:
          def check(self, nums1, nums2, result):
              return isinstance(result, int) and not isinstance(result, bool)
seed: 1818
tests:
  - name: example-one
    in:
      nums1: [1, 7, 5]
      nums2: [2, 3, 5]
    out: 3
  - name: equal-arrays
    in:
      nums1: [2, 4, 6, 8, 10]
      nums2: [2, 4, 6, 8, 10]
    out: 0
  - name: example-three
    in:
      nums1: [1, 10, 4, 4, 2, 7]
      nums2: [9, 3, 5, 1, 7, 4]
    out: 20
  - name: single-equal
    in:
      nums1: [5]
      nums2: [5]
    out: 0
  - name: single-different
    in:
