entry:
  id: 1609
  title: "even-odd-tree"
  params:
    root:
      type: tree_node
  call:
    cpp: "Solution().isEvenOddTree({root})"
    rust: "Solution::is_even_odd_tree({root})"
    python3: "Solution().isEvenOddTree({root})"
    python2: "Solution().isEvenOddTree({root})"
    ruby: "is_even_odd_tree({root})"
    java: "new Solution().isEvenOddTree({root})"
    csharp: "new Solution().IsEvenOddTree({root})"
    kotlin: "Solution().isEvenOddTree({root})"
    go: "isEvenOddTree({root})"
    dart: "Solution().isEvenOddTree({root})"
    swift: "Solution().isEvenOddTree({root})"
    typescript: "isEvenOddTree({root})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isEvenOddTree(root, {result})"
    checker: |
      class Checker:
          def isEvenOddTree(self, root, result):
              if not isinstance(result, bool):
                  return False
              if root is None:
                  return result is False
              level = [root]
              parity = 0
              while level:
                  values = [node.val for node in level]
                  if parity == 0:
                      if any(value % 2 == 0 for value in values):
                          expected = False
                          return result == expected
                      if any(left >= right for left, right in zip(values, values[1:])):
                          expected = False
                          return result == expected
                  else:
                      if any(value % 2 != 0 for value in values):
                          expected = False
                          return result == expected
                      if any(left <= right for left, right in zip(values, values[1:])):
                          expected = False
                          return result == expected
                  next_level = []
                  for node in level:
                      if node.left is not None:
                          next_level.append(node.left)
                      if node.right is not None:
                          next_level.append(node.right)
                  level = next_level
                  parity ^= 1
              return result is True

seed: 1609

