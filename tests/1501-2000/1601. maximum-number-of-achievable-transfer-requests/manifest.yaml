  title: "maximum-number-of-achievable-transfer-requests"
  params:
    n:
      type: int
    requests:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maximumRequests({n}, {requests})"
    rust: "Solution::maximum_requests({n}, {requests})"
    python3: "Solution().maximumRequests({n}, {requests})"
    python2: "Solution().maximumRequests({n}, {requests})"
    ruby: "maximum_requests({n}, {requests})"
    java: "new Solution().maximumRequests({n}, {requests})"
    csharp: "new Solution().MaximumRequests({n}, {requests})"
    kotlin: "Solution().maximumRequests({n}, {requests})"
    go: "maximumRequests({n}, {requests})"
    dart: "Solution().maximumRequests({n}, {requests})"
    swift: "Solution().maximumRequests({n}, {requests})"
    typescript: "maximumRequests({n}, {requests})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maximumRequests(n, requests, {result})"
    checker: |
      class Checker:
          def maximumRequests(self, n, requests, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not (1 <= n <= 20) or not (1 <= len(requests) <= 16):
                  return False
              best = 0
              for mask in range(1 << len(requests)):
                  balance = [0] * n
                  count = 0
                  for i, pair in enumerate(requests):
                      if (mask >> i) & 1:
                          a, b = pair
                          balance[a] -= 1
                          balance[b] += 1
                          count += 1
                  if all(value == 0 for value in balance):
                      best = max(best, count)
              return result == best

seed: 1601

