entry:
  id: 1569
  title: "number-of-ways-to-reorder-array-to-get-same-bst"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().numOfWays({nums})"
    rust: "Solution::num_of_ways({nums})"
    python3: "Solution().numOfWays({nums})"
    python2: "Solution().numOfWays({nums})"
    ruby: "num_of_ways({nums})"
    java: "new Solution().numOfWays({nums})"
    csharp: "new Solution().NumOfWays({nums})"
    kotlin: "Solution().numOfWays({nums})"
    go: "numOfWays({nums})"
    dart: "Solution().numOfWays({nums})"
    swift: "Solution().numOfWays({nums})"
    typescript: "numOfWays({nums})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().numOfWays(nums, {result})"
    checker: |
      class Checker:
          def numOfWays(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              n = len(nums)
              comb = [[0] * (n + 1) for _ in range(n + 1)]
              for i in range(n + 1):
                  comb[i][0] = comb[i][i] = 1
                  for j in range(1, i):
                      comb[i][j] = (comb[i - 1][j - 1] + comb[i - 1][j]) % mod
              def ways(values):
                  if len(values) <= 2:
                      return 1
                  root = values[0]
                  left = [x for x in values[1:] if x < root]
                  right = [x for x in values[1:] if x > root]
                  return comb[len(left) + len(right)][len(left)] * ways(left) % mod * ways(right) % mod
              return result == (ways(nums) - 1) % mod

