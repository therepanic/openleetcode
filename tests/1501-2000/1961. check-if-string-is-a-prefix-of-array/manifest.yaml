entry:
  id: 1961
  title: "check-if-string-is-a-prefix-of-array"
  params:
    s:
      type: string
    words:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().isPrefixString({s}, {words})"
    rust: "Solution::is_prefix_string({s}, {words})"
    python3: "Solution().isPrefixString({s}, {words})"
    python2: "Solution().isPrefixString({s}, {words})"
    ruby: "is_prefix_string({s}, {words})"
    java: "new Solution().isPrefixString({s}, {words})"
    csharp: "new Solution().IsPrefixString({s}, {words})"
    kotlin: "Solution().isPrefixString({s}, {words})"
    go: "isPrefixString({s}, {words})"
    dart: "Solution().isPrefixString({s}, {words})"
    swift: "Solution().isPrefixString({s}, {words})"
    typescript: "isPrefixString({s}, {words})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().isPrefixString(s, words, {result})"
    checker: |
      class Checker:
          def isPrefixString(self, s, words, result):
              if not isinstance(result, bool):
                  return False
              built = ""
              expected = False
              for word in words:
                  built += word
                  if built == s:
                      expected = True
                      break
                  if len(built) >= len(s):
                      break
              return result == expected

seed: 1961

tests:
  - name: "example_full_prefix"
    in:
      s: "iloveleetcode"
      words: ["i", "love", "leetcode", "apples"]
    out: true
  - name: "example_wrong_order"
    in:
      s: "iloveleetcode"
      words: ["apples", "i", "love", "leetcode"]
    out: false
  - name: "single_word_equal"
    in:
      s: "abc"
      words: ["abc"]
    out: true
  - name: "single_word_short"
