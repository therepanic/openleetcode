entry:
  id: 1535
  title: "find-the-winner-of-an-array-game"
  params:
    arr:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().getWinner({arr}, {k})"
    rust: "Solution::get_winner({arr}, {k})"
    python3: "Solution().getWinner({arr}, {k})"
    python2: "Solution().getWinner({arr}, {k})"
    ruby: "get_winner({arr}, {k})"
    java: "new Solution().getWinner({arr}, {k})"
    csharp: "new Solution().GetWinner({arr}, {k})"
    kotlin: "Solution().getWinner({arr}, {k})"
    go: "getWinner({arr}, {k})"
    dart: "Solution().getWinner({arr}, {k})"
    swift: "Solution().getWinner({arr}, {k})"
    typescript: "getWinner({arr}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getWinner(arr, k, {result})"
    checker: |
      class Checker:
          def getWinner(self, arr, k, result):
              candidate = arr[0]
              streak = 0
              for value in arr[1:]:
                  if candidate > value:
                      streak += 1
                  else:
                      candidate = value
                      streak = 1
                  if streak >= k:
                      return result == candidate
              return result == candidate

seed: 1535

