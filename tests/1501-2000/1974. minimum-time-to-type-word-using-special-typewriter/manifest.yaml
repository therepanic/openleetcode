entry:
  id: 1974
  title: "minimum-time-to-type-word-using-special-typewriter"
  params:
    word:
      type: string
  call:
    cpp: "Solution().minTimeToType({word})"
    rust: "Solution::min_time_to_type({word})"
    python3: "Solution().minTimeToType({word})"
    python2: "Solution().minTimeToType({word})"
    ruby: "min_time_to_type({word})"
    java: "new Solution().minTimeToType({word})"
    csharp: "new Solution().MinTimeToType({word})"
    kotlin: "Solution().minTimeToType({word})"
    go: "minTimeToType({word})"
    dart: "Solution().minTimeToType({word})"
    swift: "Solution().minTimeToType({word})"
    typescript: "minTimeToType({word})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minTimeToType(word, {result})"
    checker: |
      class Checker:
          def minTimeToType(self, word, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(word, str) or not (1 <= len(word) <= 100):
                  return False
              if any(ch < 'a' or ch > 'z' for ch in word):
                  return False
              total = 0
              current = 0
              for ch in word:
                  target = ord(ch) - ord('a')
                  distance = abs(target - current)
                  total += min(distance, 26 - distance) + 1
                  current = target
              return result == total

