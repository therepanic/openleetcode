entry:
  id: 1668
  title: "maximum-repeating-substring"
  params:
    sequence:
      type: string
    word:
      type: string
  call:
    cpp: "Solution().maxRepeating({sequence}, {word})"
    rust: "Solution::max_repeating({sequence}, {word})"
    python3: "Solution().maxRepeating({sequence}, {word})"
    python2: "Solution().maxRepeating({sequence}, {word})"
    ruby: "max_repeating({sequence}, {word})"
    java: "new Solution().maxRepeating({sequence}, {word})"
    csharp: "new Solution().MaxRepeating({sequence}, {word})"
    kotlin: "Solution().maxRepeating({sequence}, {word})"
    go: "maxRepeating({sequence}, {word})"
    dart: "Solution().maxRepeating({sequence}, {word})"
    swift: "Solution().maxRepeating({sequence}, {word})"
    typescript: "maxRepeating({sequence}, {word})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().maxRepeating(sequence, word, {result})"
    checker: |
      class Checker:
          def maxRepeating(self, sequence, word, result):
              expected = 0
              repeated = word
              while repeated in sequence:
                  expected += 1
                  repeated += word
              return result == expected
seed: 1668
