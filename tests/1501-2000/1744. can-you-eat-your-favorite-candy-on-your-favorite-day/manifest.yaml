entry:
  id: 1744
  title: "can-you-eat-your-favorite-candy-on-your-favorite-day"
  params:
    candiesCount:
      type: array
      items:
        type: int
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().canEat({candiesCount}, {queries})"
    rust: "Solution::can_eat({candiesCount}, {queries})"
    python3: "Solution().canEat({candiesCount}, {queries})"
    python2: "Solution().canEat({candiesCount}, {queries})"
    ruby: "can_eat({candiesCount}, {queries})"
    java: "new Solution().canEat({candiesCount}, {queries})"
    csharp: "new Solution().CanEat({candiesCount}, {queries})"
    kotlin: "Solution().canEat({candiesCount}, {queries})"
    go: "canEat({candiesCount}, {queries})"
    dart: "Solution().canEat({candiesCount}, {queries})"
    swift: "Solution().canEat({candiesCount}, {queries})"
    typescript: "canEat({candiesCount}, {queries})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().canEat(candiesCount, queries, {result})"
    checker: |
      class Checker:
          def canEat(self, candiesCount, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              prefix = [0]
              for x in candiesCount:
                  prefix.append(prefix[-1] + x)
              expected = []
              for t, day, cap in queries:
                  d = day + 1
                  expected.append((prefix[t] + cap) // cap <= d <= prefix[t + 1])
              return result == expected

seed: 1744

