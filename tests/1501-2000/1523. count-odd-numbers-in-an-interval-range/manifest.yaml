entry:
  id: 1523
  title: "count-odd-numbers-in-an-interval-range"
  params:
    low:
      type: int
    high:
      type: int
  call:
    cpp: "Solution().countOdds({low}, {high})"
    rust: "Solution::count_odds({low}, {high})"
    python3: "Solution().countOdds({low}, {high})"
    python2: "Solution().countOdds({low}, {high})"
    ruby: "count_odds({low}, {high})"
    java: "new Solution().countOdds({low}, {high})"
    csharp: "new Solution().CountOdds({low}, {high})"
    kotlin: "Solution().countOdds({low}, {high})"
    go: "countOdds({low}, {high})"
    dart: "Solution().countOdds({low}, {high})"
    swift: "Solution().countOdds({low}, {high})"
    typescript: "countOdds({low}, {high})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countOdds(low, high, {result})"
    checker: |
      class Checker:
          def countOdds(self, low, high, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = (high + 1) // 2 - low // 2
              return result == expected

seed: 1523

