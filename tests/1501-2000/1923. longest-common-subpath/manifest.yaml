entry:
  id: 1923
  title: "Longest Common Subpath"
  params:
    n:
      type: int
    paths:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().longestCommonSubpath({n}, {paths})"
    rust: "Solution::longest_common_subpath({n}, {paths})"
    python3: "Solution().longestCommonSubpath({n}, {paths})"
    python2: "Solution().longestCommonSubpath({n}, {paths})"
    ruby: "longest_common_subpath({n}, {paths})"
    java: "new Solution().longestCommonSubpath({n}, {paths})"
    csharp: "new Solution().LongestCommonSubpath({n}, {paths})"
    kotlin: "Solution().longestCommonSubpath({n}, {paths})"
    go: "longestCommonSubpath({n}, {paths})"
    dart: "Solution().longestCommonSubpath({n}, {paths})"
    swift: "Solution().longestCommonSubpath({n}, {paths})"
    typescript: "longestCommonSubpath({n}, {paths})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(n, paths, {result})"
    checker: |
      class Checker:
          def check(self, n, paths, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not paths:
                  return result == 0
              shortest = min(paths, key=len)
              expected = 0
              for length in range(1, len(shortest) + 1):
                  found = False
                  for start in range(len(shortest) - length + 1):
                      part = shortest[start:start + length]
                      if all(any(path[i:i + length] == part for i in range(len(path) - length + 1)) for path in paths):
                          found = True
                          break
                  if found:
                      expected = length
              return result == expected

seed: 1923

