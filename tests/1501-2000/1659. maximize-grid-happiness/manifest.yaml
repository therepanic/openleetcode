judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(m, n, introvertsCount, extrovertsCount, {result})"
    checker: |
      from functools import lru_cache
      class Checker:
          def check(self, m, n, introvertsCount, extrovertsCount, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if n > m:
                  m, n = n, m
              rows = []
              for mask in range(3 ** n):
                  x = mask
                  row = []
                  for _ in range(n):
                      row.append(x % 3)
                      x //= 3
                  rows.append(tuple(row))
              def stats(row):
                  h = ii = ee = 0
                  for i, v in enumerate(row):
                      if v == 1:
                          h += 120
                          ii += 1
                          if i and row[i - 1]: h -= 30
                          if i + 1 < n and row[i + 1]: h -= 30
                      elif v == 2:
                          h += 40
                          ee += 1
                          if i and row[i - 1]: h += 20
                          if i + 1 < n and row[i + 1]: h += 20
                  return h, ii, ee
              st = {r: stats(r) for r in rows}
              def between(a, b):
                  s = 0
                  for u, v in zip(a, b):
                      if u and v:
                          s += -30 if u == 1 else 20
                          s += -30 if v == 1 else 20
                  return s
              @lru_cache(None)
              def dp(r, ic, ec, prev):
                  if r == m:
                      return 0
                  best = 0
                  for row in rows:
                      h, ii, ee = st[row]
                      if ii <= ic and ee <= ec:
                          best = max(best, h + between(prev, row) + dp(r + 1, ic - ii, ec - ee, row))
                  return best
              return result == dp(0, introvertsCount, extrovertsCount, (0,) * n)

seed: 1659

