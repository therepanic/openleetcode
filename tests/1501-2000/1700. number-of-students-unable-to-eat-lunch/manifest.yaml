entry:
  id: 1700
  title: "number-of-students-unable-to-eat-lunch"
  params:
    students:
      type: array
      items:
        type: int
    sandwiches:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countStudents({students}, {sandwiches})"
    rust: "Solution::count_students({students}, {sandwiches})"
    python3: "Solution().countStudents({students}, {sandwiches})"
    python2: "Solution().countStudents({students}, {sandwiches})"
    ruby: "count_students({students}, {sandwiches})"
    java: "new Solution().countStudents({students}, {sandwiches})"
    csharp: "new Solution().CountStudents({students}, {sandwiches})"
    kotlin: "Solution().countStudents({students}, {sandwiches})"
    go: "countStudents({students}, {sandwiches})"
    dart: "Solution().countStudents({students}, {sandwiches})"
    swift: "Solution().countStudents({students}, {sandwiches})"
    typescript: "countStudents({students}, {sandwiches})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countStudents(students, sandwiches, {result})"
    checker: |
      class Checker:
          def countStudents(self, students, sandwiches, result):
              counts = [0, 0]
              for value in students:
                  counts[value] += 1
              unable = 0
              for value in sandwiches:
                  if counts[value] == 0:
                      unable = sum(counts)
                      break
                  counts[value] -= 1
              return result == unable

seed: 1700

