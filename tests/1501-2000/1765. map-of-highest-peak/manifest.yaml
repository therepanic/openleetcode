entry:
  id: 1765
  title: "map-of-highest-peak"
  params:
    isWater:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().highestPeak({isWater})"
    rust: "Solution::highest_peak({isWater})"
    python3: "Solution().highestPeak({isWater})"
    python2: "Solution().highestPeak({isWater})"
    ruby: "highest_peak({isWater})"
    java: "new Solution().highestPeak({isWater})"
    csharp: "new Solution().HighestPeak({isWater})"
    kotlin: "Solution().highestPeak({isWater})"
    go: "highestPeak({isWater})"
    dart: "Solution().highestPeak({isWater})"
    swift: "Solution().highestPeak({isWater})"
    typescript: "highestPeak({isWater})"

judge:
  type: exact

limits:
  time_ms: 4000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(isWater, {result})"
    checker: |
      from collections import deque
      class Checker:
          def check(self, isWater, result):
              if not isinstance(isWater, list) or not isWater or not isinstance(isWater[0], list):
                  return False
              r, c = len(isWater), len(isWater[0])
              if c == 0 or any(not isinstance(row, list) or len(row) != c for row in isWater):
                  return False
              if any(x not in (0, 1) for row in isWater for x in row):
                  return False
              if not any(x == 1 for row in isWater for x in row):
                  return False
              if not isinstance(result, list) or len(result) != r:
                  return False
              if any(not isinstance(row, list) or len(row) != c for row in result):
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or x < 0 for row in result for x in row):
                  return False
              q = deque()
              dist = [[-1] * c for _ in range(r)]
              for i in range(r):
                  for j in range(c):
                      if isWater[i][j] == 1:
                          if result[i][j] != 0:
                              return False
                          dist[i][j] = 0
                          q.append((i, j))
              while q:
                  i, j = q.popleft()
                  for di, dj in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                      ni, nj = i + di, j + dj
                      if 0 <= ni < r and 0 <= nj < c and dist[ni][nj] < 0:
                          dist[ni][nj] = dist[i][j] + 1
                          q.append((ni, nj))
              for i in range(r):
                  for j in range(c):
                      if abs(result[i][j] - dist[i][j]) > 0:
                          return False
                      for di, dj in ((1, 0), (0, 1)):
                          ni, nj = i + di, j + dj
                          if ni < r and nj < c and abs(result[i][j] - result[ni][nj]) > 1:
                              return False
              return True

seed: 1765

