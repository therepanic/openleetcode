entry:
  id: 1716
  title: calculate-money-in-leetcode-bank
  params:
    n:
      type: int
  call:
    cpp: "Solution().totalMoney({n})"
    rust: "Solution::total_money({n})"
    python3: "Solution().totalMoney({n})"
    python2: "Solution().totalMoney({n})"
    ruby: "total_money({n})"
    java: "new Solution().totalMoney({n})"
    csharp: "new Solution().TotalMoney({n})"
    kotlin: "Solution().totalMoney({n})"
    go: "totalMoney({n})"
    dart: "Solution().totalMoney({n})"
    swift: "Solution().totalMoney({n})"
    typescript: "totalMoney({n})"

judge:
  type: exact

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().totalMoney(n, {result})"
    checker: |
      class Checker:
          def totalMoney(self, n, result):
              q, r = divmod(n, 7)
              expected = 28 * q + 7 * q * (q - 1) // 2
              expected += r * (q + 1) + r * (r - 1) // 2
              return result == expected

