entry:
  id: 1689
  title: "partitioning-into-minimum-number-of-deci-binary-numbers"
  params:
    n:
      type: string
  call:
    cpp: "Solution().minPartitions({n})"
    rust: "Solution::min_partitions({n})"
    python3: "Solution().minPartitions({n})"
    python2: "Solution().minPartitions({n})"
    ruby: "min_partitions({n})"
    java: "new Solution().minPartitions({n})"
    csharp: "new Solution().MinPartitions({n})"
    kotlin: "Solution().minPartitions({n})"
    go: "minPartitions({n})"
    dart: "Solution().minPartitions({n})"
    swift: "Solution().minPartitions({n})"
    typescript: "minPartitions({n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minPartitions(n, {result})"
    checker: |
      class Checker:
          def minPartitions(self, n, result):
              if not isinstance(n, str) or not n or n[0] == "0":
                  return False
              if not n.isdigit() or not isinstance(result, int) or isinstance(result, bool):
                  return False
              return result == max(int(ch) for ch in n)

seed: 1689

