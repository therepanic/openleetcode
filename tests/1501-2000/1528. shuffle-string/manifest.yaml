entry:
  id: 1528
  title: "shuffle-string"
  params:
    s:
      type: string
    indices:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().restoreString({s}, {indices})"
    rust: "Solution::restore_string({s}, {indices})"
    python3: "Solution().restoreString({s}, {indices})"
    python2: "Solution().restoreString({s}, {indices})"
    ruby: "restore_string({s}, {indices})"
    java: "new Solution().restoreString({s}, {indices})"
    csharp: "new Solution().RestoreString({s}, {indices})"
    kotlin: "Solution().restoreString({s}, {indices})"
    go: "restoreString({s}, {indices})"
    dart: "Solution().restoreString({s}, {indices})"
    swift: "Solution().restoreString({s}, {indices})"
    typescript: "restoreString({s}, {indices})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().restoreString(s, indices, {result})"
    checker: |
      class Checker:
          def restoreString(self, s, indices, result):
              if not isinstance(result, str):
                  return False
              if len(s) != len(indices) or sorted(indices) != list(range(len(s))):
                  return False
              expected = [''] * len(s)
              for ch, pos in zip(s, indices):
                  expected[pos] = ch
              return result == ''.join(expected)

seed: 1528

