    cpp: "Solution().findingUsersActiveMinutes({logs}, {k})"
    rust: "Solution::finding_users_active_minutes({logs}, {k})"
    python3: "Solution().findingUsersActiveMinutes({logs}, {k})"
    python2: "Solution().findingUsersActiveMinutes({logs}, {k})"
    ruby: "finding_users_active_minutes({logs}, {k})"
    java: "new Solution().findingUsersActiveMinutes({logs}, {k})"
    csharp: "new Solution().FindingUsersActiveMinutes({logs}, {k})"
    kotlin: "Solution().findingUsersActiveMinutes({logs}, {k})"
