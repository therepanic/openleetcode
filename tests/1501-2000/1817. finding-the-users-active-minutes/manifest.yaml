judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findingUsersActiveMinutes(logs, k, {result})"
    checker: |
      class Checker:
          def findingUsersActiveMinutes(self, logs, k, result):
              if not isinstance(result, list) or len(result) != k:
                  return False
              counts = {}
              for pair in logs:
                  if not isinstance(pair, list) or len(pair) != 2:
                      return False
                  user, minute = pair
                  counts.setdefault(user, set()).add(minute)
              expected = [0] * k
              for minutes in counts.values():
                  if len(minutes) > k:
                      return False
                  expected[len(minutes) - 1] += 1
              return result == expected

seed: 1817

