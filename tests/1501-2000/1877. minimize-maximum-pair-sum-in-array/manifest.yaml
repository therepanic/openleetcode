entry:
  id: 1877
  title: "minimize-maximum-pair-sum-in-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minPairSum({nums})"
    rust: "Solution::min_pair_sum({nums})"
    python3: "Solution().minPairSum({nums})"
    python2: "Solution().minPairSum({nums})"
    ruby: "min_pair_sum({nums})"
    java: "new Solution().minPairSum({nums})"
    csharp: "new Solution().MinPairSum({nums})"
    kotlin: "Solution().minPairSum({nums})"
    go: "minPairSum({nums})"
    dart: "Solution().minPairSum({nums})"
    swift: "Solution().minPairSum({nums})"
    typescript: "minPairSum({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minPairSum(nums, {result})"
    checker: |
      class Checker:
          def minPairSum(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(nums, list) or len(nums) < 2 or len(nums) % 2:
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) or x < 1 or x > 100000 for x in nums):
                  return False
              values = sorted(nums)
              return result == max(values[i] + values[-1 - i] for i in range(len(values) // 2))

