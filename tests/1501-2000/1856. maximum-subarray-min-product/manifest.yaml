  id: 1856
  title: "maximum-subarray-min-product"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxSumMinProduct({nums})"
    rust: "Solution::max_sum_min_product({nums})"
    python3: "Solution().maxSumMinProduct({nums})"
    python2: "Solution().maxSumMinProduct({nums})"
    ruby: "max_sum_min_product({nums})"
    java: "new Solution().maxSumMinProduct({nums})"
    csharp: "new Solution().MaxSumMinProduct({nums})"
    kotlin: "Solution().maxSumMinProduct({nums})"
    go: "maxSumMinProduct({nums})"
    dart: "Solution().maxSumMinProduct({nums})"
    swift: "Solution().maxSumMinProduct({nums})"
    typescript: "maxSumMinProduct({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxSumMinProduct(nums, {result})"
    checker: |
      class Checker:
          def maxSumMinProduct(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              prefix = [0]
              for value in nums:
                  prefix.append(prefix[-1] + value)
              stack = []
              best = 0
              for i in range(n + 1):
                  current = nums[i] if i < n else 0
                  while stack and (i == n or nums[stack[-1]] > current):
                      j = stack.pop()
                      left = stack[-1] + 1 if stack else 0
                      total = prefix[i] - prefix[left]
                      best = max(best, nums[j] * total)
                  stack.append(i)
              return result == best % 1000000007

