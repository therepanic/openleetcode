entry:
  id: 1802
  title: "maximum-value-at-a-given-index-in-a-bounded-array"
  params:
    n:
      type: int
    index:
      type: int
    maxSum:
      type: int
  call:
    cpp: "Solution().maxValue({n}, {index}, {maxSum})"
    rust: "Solution::max_value({n}, {index}, {maxSum})"
    python3: "Solution().maxValue({n}, {index}, {maxSum})"
    python2: "Solution().maxValue({n}, {index}, {maxSum})"
    ruby: "max_value({n}, {index}, {maxSum})"
    java: "new Solution().maxValue({n}, {index}, {maxSum})"
    csharp: "new Solution().MaxValue({n}, {index}, {maxSum})"
    kotlin: "Solution().maxValue({n}, {index}, {maxSum})"
    go: "maxValue({n}, {index}, {maxSum})"
    dart: "Solution().maxValue({n}, {index}, {maxSum})"
    swift: "Solution().maxValue({n}, {index}, {maxSum})"
    typescript: "maxValue({n}, {index}, {maxSum})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxValue(n, index, maxSum, {result})"
    checker: |
      class Checker:
          def maxValue(self, n, index, maxSum, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              def cost(peak):
                  left_count = index
                  right_count = n - index - 1
                  left = peak * (peak - 1) // 2 + max(0, left_count - (peak - 1))
                  right = peak * (peak - 1) // 2 + max(0, right_count - (peak - 1))
                  if peak > left_count:
                      left = (peak - left_count + peak - 1) * left_count // 2
                  if peak > right_count:
                      right = (peak - right_count + peak - 1) * right_count // 2
                  return left + peak + right
              if result < 1 or result > maxSum or cost(result) > maxSum:
                  return False
              low, high = 1, maxSum
              expected = 1
              while low <= high:
                  mid = (low + high) // 2
                  if cost(mid) <= maxSum:
                      expected = mid
                      low = mid + 1
                  else:
                      high = mid - 1
              return result == expected

