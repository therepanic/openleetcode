judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().closestRoom(rooms, queries, {result})"
    checker: |
      class Checker:
          def closestRoom(self, rooms, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              for answer, query in zip(result, queries):
                  preferred, minimum = query
                  valid = [room_id for room_id, size in rooms if size >= minimum]
                  expected = min(valid, key=lambda room_id: (abs(room_id - preferred), room_id)) if valid else -1
                  if answer != expected:
                      return False
              return True
