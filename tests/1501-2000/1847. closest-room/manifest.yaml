    rust: "Solution::closest_room({rooms}, {queries})"
    python3: "Solution().closestRoom({rooms}, {queries})"
    python2: "Solution().closestRoom({rooms}, {queries})"
    ruby: "closest_room({rooms}, {queries})"
    java: "new Solution().closestRoom({rooms}, {queries})"
    csharp: "new Solution().ClosestRoom({rooms}, {queries})"
    kotlin: "Solution().closestRoom({rooms}, {queries})"
    go: "closestRoom({rooms}, {queries})"
    dart: "Solution().closestRoom({rooms}, {queries})"
