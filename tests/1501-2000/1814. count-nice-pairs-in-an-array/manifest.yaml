entry:
  id: 1814
  title: "count-nice-pairs-in-an-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countNicePairs({nums})"
    rust: "Solution::count_nice_pairs({nums})"
    python3: "Solution().countNicePairs({nums})"
    python2: "Solution().countNicePairs({nums})"
    ruby: "count_nice_pairs({nums})"
    java: "new Solution().countNicePairs({nums})"
    csharp: "new Solution().CountNicePairs({nums})"
    kotlin: "Solution().countNicePairs({nums})"
    go: "countNicePairs({nums})"
    dart: "Solution().countNicePairs({nums})"
    swift: "Solution().countNicePairs({nums})"
    typescript: "countNicePairs({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().countNicePairs(nums, {result})"
    checker: |
      class Checker:
          MOD = 1000000007

          def countNicePairs(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = {}
              expected = 0
              for value in nums:
                  reversed_value = int(str(value)[::-1])
                  key = value - reversed_value
                  expected = (expected + counts.get(key, 0)) % self.MOD
                  counts[key] = counts.get(key, 0) + 1
              return result == expected

seed: 1814

