entry:
  id: 1544
  title: "make-the-string-great"
  params:
    s:
      type: string
  call:
    cpp: "Solution().makeGood({s})"
    rust: "Solution::make_good({s})"
    python3: "Solution().makeGood({s})"
    python2: "Solution().makeGood({s})"
    ruby: "make_good({s})"
    java: "new Solution().makeGood({s})"
    csharp: "new Solution().MakeGood({s})"
    kotlin: "Solution().makeGood({s})"
    go: "makeGood({s})"
    dart: "Solution().makeGood({s})"
    swift: "Solution().makeGood({s})"
    typescript: "makeGood({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().makeGood(s, {result})"
    checker: |
      class Checker:
          def makeGood(self, s, result):
              if not isinstance(result, str):
                  return False
              stack = []
              for ch in s:
                  if stack and ch.lower() == stack[-1].lower() and ch != stack[-1]:
                      stack.pop()
                  else:
                      stack.append(ch)
              return result == "".join(stack)

