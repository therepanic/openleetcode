entry:
  id: 1577
  title: "number-of-ways-where-square-of-number-is-equal-to-product-of-two-numbers"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().numTriplets({nums1}, {nums2})"
    rust: "Solution::num_triplets({nums1}, {nums2})"
    python3: "Solution().numTriplets({nums1}, {nums2})"
    python2: "Solution().numTriplets({nums1}, {nums2})"
    ruby: "num_triplets({nums1}, {nums2})"
    java: "new Solution().numTriplets({nums1}, {nums2})"
    csharp: "new Solution().NumTriplets({nums1}, {nums2})"
    kotlin: "Solution().numTriplets({nums1}, {nums2})"
    go: "numTriplets({nums1}, {nums2})"
    dart: "Solution().numTriplets({nums1}, {nums2})"
    swift: "Solution().numTriplets({nums1}, {nums2})"
    typescript: "numTriplets({nums1}, {nums2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numTriplets(nums1, nums2, {result})"
    checker: |
      class Checker:
          def numTriplets(self, nums1, nums2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False

              def count(a, b):
                  pairs = {}
                  for i in range(len(b)):
                      for j in range(i + 1, len(b)):
                          product = b[i] * b[j]
                          pairs[product] = pairs.get(product, 0) + 1
                  return sum(pairs.get(value * value, 0) for value in a)

              expected = count(nums1, nums2) + count(nums2, nums1)
              return result == expected

seed: 1577001

