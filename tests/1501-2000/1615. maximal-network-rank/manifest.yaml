  call:
    cpp: "Solution().maximalNetworkRank({n}, {roads})"
    rust: "Solution::maximal_network_rank({n}, {roads})"
    python3: "Solution().maximalNetworkRank({n}, {roads})"
    python2: "Solution().maximalNetworkRank({n}, {roads})"
    ruby: "maximal_network_rank({n}, {roads})"
    java: "new Solution().maximalNetworkRank({n}, {roads})"
    csharp: "new Solution().MaximalNetworkRank({n}, {roads})"
    kotlin: "Solution().maximalNetworkRank({n}, {roads})"
    go: "maximalNetworkRank({n}, {roads})"
    dart: "Solution().maximalNetworkRank({n}, {roads})"
    swift: "Solution().maximalNetworkRank({n}, {roads})"
    typescript: "maximalNetworkRank({n}, {roads})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximalNetworkRank(n, roads, {result})"
    checker: |
      class Checker:
          def maximalNetworkRank(self, n, roads, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              degree = [0] * n
              edges = set()
              for a, b in roads:
                  degree[a] += 1
                  degree[b] += 1
                  edges.add((min(a, b), max(a, b)))
              expected = max(degree[i] + degree[j] - ((min(i, j), max(i, j)) in edges)
                             for i in range(n) for j in range(i + 1, n))
              return result == expected

seed: 1615

