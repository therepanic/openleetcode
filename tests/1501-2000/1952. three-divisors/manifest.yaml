entry:
  id: 1952
  title: "three-divisors"
  params:
    n:
      type: int
  call:
    cpp: "Solution().isThree({n})"
    rust: "Solution::is_three({n})"
    python3: "Solution().isThree({n})"
    python2: "Solution().isThree({n})"
    ruby: "is_three({n})"
    java: "new Solution().isThree({n})"
    csharp: "new Solution().IsThree({n})"
    kotlin: "Solution().isThree({n})"
    go: "isThree({n})"
    dart: "Solution().isThree({n})"
    swift: "Solution().isThree({n})"
    typescript: "isThree({n})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isThree(n, {result})"
    checker: |
      import math

      class Checker:
          def isThree(self, n, result):
              if not isinstance(result, bool):
                  return False
              root = math.isqrt(n)
              if root * root != n or root < 2:
                  return result is False
              for divisor in range(2, math.isqrt(root) + 1):
                  if root % divisor == 0:
                      return result is False
              return result is True

