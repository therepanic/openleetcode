entry:
  id: 1773
  title: "count-items-matching-a-rule"
  params:
    items:
      type: array
      items:
        type: array
        items:
          type: string
    ruleKey:
      type: string
    ruleValue:
      type: string
  call:
    cpp: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    rust: "Solution::count_matches({items}, {ruleKey}, {ruleValue})"
    python3: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    python2: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    ruby: "count_matches({items}, {ruleKey}, {ruleValue})"
    java: "new Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    csharp: "new Solution().CountMatches({items}, {ruleKey}, {ruleValue})"
    kotlin: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    go: "countMatches({items}, {ruleKey}, {ruleValue})"
    dart: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    swift: "Solution().countMatches({items}, {ruleKey}, {ruleValue})"
    typescript: "countMatches({items}, {ruleKey}, {ruleValue})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().countMatches(items, ruleKey, ruleValue, {result})"
    checker: |
      class Checker:
          def countMatches(self, items, ruleKey, ruleValue, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              index = {"type": 0, "color": 1, "name": 2}[ruleKey]
              expected = sum(1 for item in items if item[index] == ruleValue)
              return result == expected
seed: 1773
