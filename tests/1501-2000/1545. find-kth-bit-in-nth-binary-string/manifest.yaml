entry:
  id: 1545
  title: "find-kth-bit-in-nth-binary-string"
  params:
    n:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().findKthBit({n}, {k})"
    rust: "Solution::find_kth_bit({n}, {k})"
    python3: "Solution().findKthBit({n}, {k})"
    python2: "Solution().findKthBit({n}, {k})"
    ruby: "find_kth_bit({n}, {k})"
    java: "new Solution().findKthBit({n}, {k})"
    csharp: "new Solution().FindKthBit({n}, {k})"
    kotlin: "Solution().findKthBit({n}, {k})"
    go: "findKthBit({n}, {k})"
    dart: "Solution().findKthBit({n}, {k})"
    swift: "Solution().findKthBit({n}, {k})"
    typescript: "findKthBit({n}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findKthBit(n, k, {result})"
    checker: |
      class Checker:
          def findKthBit(self, n, k, result):
              def solve(level, pos):
                  if level == 1:
                      return "0"
                  middle = 1 << (level - 1)
                  if pos == middle:
                      return "1"
                  if pos < middle:
                      return solve(level - 1, pos)
                  value = solve(level - 1, (1 << level) - pos)
                  return "1" if value == "0" else "0"
              return result == solve(n, k)

seed: 1545

