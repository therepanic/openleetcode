entry:
  id: 1980
  title: "find-unique-binary-string"
  params:
    nums:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().findDifferentBinaryString({nums})"
    rust: "Solution::find_different_binary_string({nums})"
    python3: "Solution().findDifferentBinaryString({nums})"
    python2: "Solution().findDifferentBinaryString({nums})"
    ruby: "find_different_binary_string({nums})"
    java: "new Solution().findDifferentBinaryString({nums})"
    csharp: "new Solution().FindDifferentBinaryString({nums})"
    kotlin: "Solution().findDifferentBinaryString({nums})"
    go: "findDifferentBinaryString({nums})"
    dart: "Solution().findDifferentBinaryString({nums})"
    swift: "Solution().findDifferentBinaryString({nums})"
    typescript: "findDifferentBinaryString({nums})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findDifferentBinaryString(nums, {result})"
    checker: |
      class Checker:
          def findDifferentBinaryString(self, nums, result):
              if not isinstance(result, str):
                  return False
              n = len(nums)
              if len(result) != n or any(c not in "01" for c in result):
                  return False
              return result not in set(nums)

seed: 1980

