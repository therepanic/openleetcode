entry:
  id: 1665
  title: "minimum-initial-energy-to-finish-tasks"
  params:
    tasks:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minimumEffort({tasks})"
    rust: "Solution::minimum_effort({tasks})"
    python3: "Solution().minimumEffort({tasks})"
    python2: "Solution().minimumEffort({tasks})"
    ruby: "minimum_effort({tasks})"
    java: "new Solution().minimumEffort({tasks})"
    csharp: "new Solution().MinimumEffort({tasks})"
    kotlin: "Solution().minimumEffort({tasks})"
    go: "minimumEffort({tasks})"
    dart: "Solution().minimumEffort({tasks})"
    swift: "Solution().minimumEffort({tasks})"
    typescript: "minimumEffort({tasks})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minimumEffort(tasks, {result})"
    checker: |
      class Checker:
          def minimumEffort(self, tasks, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              ordered = sorted(tasks, key=lambda x: x[1] - x[0], reverse=True)
              spent = 0
              need = 0
              for actual, minimum in ordered:
                  need = max(need, spent + minimum)
                  spent += actual
              return result == need
seed: 1665
