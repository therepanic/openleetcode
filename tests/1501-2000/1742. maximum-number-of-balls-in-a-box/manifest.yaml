entry:
  id: 1742
  title: "maximum-number-of-balls-in-a-box"
  params:
    lowLimit:
      type: int
    highLimit:
      type: int
  call:
    cpp: "Solution().countBalls({lowLimit}, {highLimit})"
    rust: "Solution::count_balls({lowLimit}, {highLimit})"
    python3: "Solution().countBalls({lowLimit}, {highLimit})"
    python2: "Solution().countBalls({lowLimit}, {highLimit})"
    ruby: "count_balls({lowLimit}, {highLimit})"
    java: "new Solution().countBalls({lowLimit}, {highLimit})"
    csharp: "new Solution().CountBalls({lowLimit}, {highLimit})"
    kotlin: "Solution().countBalls({lowLimit}, {highLimit})"
    go: "countBalls({lowLimit}, {highLimit})"
    dart: "Solution().countBalls({lowLimit}, {highLimit})"
    swift: "Solution().countBalls({lowLimit}, {highLimit})"
    typescript: "countBalls({lowLimit}, {highLimit})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countBalls(lowLimit, highLimit, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def countBalls(self, lowLimit, highLimit, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              counts = Counter()
              for number in range(lowLimit, highLimit + 1):
                  counts[sum(int(d) for d in str(number))] += 1
              return result == max(counts.values())

seed: 1742

