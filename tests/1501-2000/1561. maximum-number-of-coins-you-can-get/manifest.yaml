entry:
  id: 1561
  title: "maximum-number-of-coins-you-can-get"
  params:
    piles:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxCoins({piles})"
    rust: "Solution::max_coins({piles})"
    python3: "Solution().maxCoins({piles})"
    python2: "Solution().maxCoins({piles})"
    ruby: "max_coins({piles})"
    java: "new Solution().maxCoins({piles})"
    csharp: "new Solution().MaxCoins({piles})"
    kotlin: "Solution().maxCoins({piles})"
    go: "maxCoins({piles})"
    dart: "Solution().maxCoins({piles})"
    swift: "Solution().maxCoins({piles})"
    typescript: "maxCoins({piles})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxCoins(piles, {result})"
    checker: |
      class Checker:
          def maxCoins(self, piles, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              a = sorted(piles)
              expected = sum(a[len(a) - 2 - 2 * i] for i in range(len(a) // 3))
              return result == expected

seed: 1561

