    csharp: "new Solution().ValidPath({n}, {edges}, {source}, {destination})"
    kotlin: "Solution().validPath({n}, {edges}, {source}, {destination})"
    go: "validPath({n}, {edges}, {source}, {destination})"
    dart: "Solution().validPath({n}, {edges}, {source}, {destination})"
    swift: "Solution().validPath({n}, {edges}, {source}, {destination})"
    typescript: "validPath({n}, {edges}, {source}, {destination})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().validPath(n, edges, source, destination, {result})"
    checker: |
      from collections import deque

      class Checker:
          def validPath(self, n, edges, source, destination, result):
              if not isinstance(result, bool):
                  return False
              graph = [[] for _ in range(n)]
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  if not (0 <= u < n and 0 <= v < n and u != v):
                      return False
                  graph[u].append(v)
                  graph[v].append(u)
              seen = {source}
              queue = deque([source])
              while queue:
                  node = queue.popleft()
                  if node == destination:
                      return result is True
                  for neighbor in graph[node]:
                      if neighbor not in seen:
                          seen.add(neighbor)
                          queue.append(neighbor)
              return result is False

seed: 1971

