entry:
  id: 1930
  title: "unique-length-3-palindromic-subsequences"
  params:
    s:
      type: string
  call:
    cpp: "Solution().countPalindromicSubsequence({s})"
    rust: "Solution::count_palindromic_subsequence({s})"
    python3: "Solution().countPalindromicSubsequence({s})"
    python2: "Solution().countPalindromicSubsequence({s})"
    ruby: "count_palindromic_subsequence({s})"
    java: "new Solution().countPalindromicSubsequence({s})"
    csharp: "new Solution().CountPalindromicSubsequence({s})"
    kotlin: "Solution().countPalindromicSubsequence({s})"
    go: "countPalindromicSubsequence({s})"
    dart: "Solution().countPalindromicSubsequence({s})"
    swift: "Solution().countPalindromicSubsequence({s})"
    typescript: "countPalindromicSubsequence({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countPalindromicSubsequence(s, {result})"
    checker: |
      class Checker:
          def countPalindromicSubsequence(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              first = {}
              last = {}
              for i, ch in enumerate(s):
                  first.setdefault(ch, i)
                  last[ch] = i
              expected = 0
              for ch, left in first.items():
                  right = last[ch]
                  if right - left > 1:
                      expected += len(set(s[left + 1:right]))
              return result == expected

seed: 1930

