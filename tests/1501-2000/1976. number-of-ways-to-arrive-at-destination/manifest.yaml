entry:
  id: 1976
  title: "number-of-ways-to-arrive-at-destination"
  params:
    n:
      type: int
    roads:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countPaths({n}, {roads})"
    rust: "Solution::count_paths({n}, {roads})"
    python3: "Solution().countPaths({n}, {roads})"
    python2: "Solution().countPaths({n}, {roads})"
    ruby: "count_paths({n}, {roads})"
    java: "new Solution().countPaths({n}, {roads})"
    csharp: "new Solution().CountPaths({n}, {roads})"
    kotlin: "Solution().countPaths({n}, {roads})"
    go: "countPaths({n}, {roads})"
    dart: "Solution().countPaths({n}, {roads})"
    swift: "Solution().countPaths({n}, {roads})"
    typescript: "countPaths({n}, {roads})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countPaths(n, roads, {result})"
    checker: |
      import heapq

      class Checker:
          def countPaths(self, n, roads, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              graph = [[] for _ in range(n)]
              for edge in roads:
                  if not isinstance(edge, list) or len(edge) != 3:
                      return False
                  u, v, w = edge
                  graph[u].append((v, w))
                  graph[v].append((u, w))
              mod = 1000000007
              inf = 10**30
              dist = [inf] * n
              ways = [0] * n
              dist[0] = 0
              ways[0] = 1
              heap = [(0, 0)]
              while heap:
                  d, u = heapq.heappop(heap)
                  if d != dist[u]:
                      continue
                  for v, w in graph[u]:
                      nd = d + w
                      if nd < dist[v]:
                          dist[v] = nd
                          ways[v] = ways[u]
                          heapq.heappush(heap, (nd, v))
                      elif nd == dist[v]:
                          ways[v] = (ways[v] + ways[u]) % mod
              return result == ways[n - 1]

