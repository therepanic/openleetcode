entry:
  id: 1793
  title: maximum-score-of-a-good-subarray
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().maximumScore({nums}, {k})"
    rust: "Solution::maximum_score({nums}, {k})"
    python3: "Solution().maximumScore({nums}, {k})"
    python2: "Solution().maximumScore({nums}, {k})"
    ruby: "maximum_score({nums}, {k})"
    java: "new Solution().maximumScore({nums}, {k})"
    csharp: "new Solution().MaximumScore({nums}, {k})"
    kotlin: "Solution().maximumScore({nums}, {k})"
    go: "maximumScore({nums}, {k})"
    dart: "Solution().maximumScore({nums}, {k})"
    swift: "Solution().maximumScore({nums}, {k})"
    typescript: "maximumScore({nums}, {k})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumScore(nums, k, {result})"
    checker: |
      class Checker:
          def maximumScore(self, nums, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              for left in range(len(nums)):
                  current = None
                  for right in range(left, len(nums)):
                      current = nums[right] if current is None else min(current, nums[right])
                      if left <= k <= right:
                          expected = max(expected, current * (right - left + 1))
              return result == expected

seed: 1793

