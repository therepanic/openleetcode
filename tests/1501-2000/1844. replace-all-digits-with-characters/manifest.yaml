entry:
  id: 1844
  title: "replace-all-digits-with-characters"
  params:
    s:
      type: string
  call:
    cpp: "Solution().replaceDigits({s})"
    rust: "Solution::replace_digits({s})"
    python3: "Solution().replaceDigits({s})"
    python2: "Solution().replaceDigits({s})"
    ruby: "replace_digits({s})"
    java: "new Solution().replaceDigits({s})"
    csharp: "new Solution().ReplaceDigits({s})"
    kotlin: "Solution().replaceDigits({s})"
    go: "replaceDigits({s})"
    dart: "Solution().replaceDigits({s})"
    swift: "Solution().replaceDigits({s})"
    typescript: "replaceDigits({s})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().replaceDigits(s, {result})"
    checker: |
      class Checker:
          def replaceDigits(self, s, result):
              if not isinstance(result, str) or len(result) != len(s):
                  return False
              expected = list(s)
              for i in range(1, len(expected), 2):
                  expected[i] = chr(ord(expected[i - 1]) + int(expected[i]))
              return result == ''.join(expected)
seed: 1844
