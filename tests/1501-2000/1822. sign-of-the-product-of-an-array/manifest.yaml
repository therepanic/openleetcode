entry:
  id: 1822
  title: "sign-of-the-product-of-an-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().arraySign({nums})"
    rust: "Solution::array_sign({nums})"
    python3: "Solution().arraySign({nums})"
    python2: "Solution().arraySign({nums})"
    ruby: "array_sign({nums})"
    java: "new Solution().arraySign({nums})"
    csharp: "new Solution().ArraySign({nums})"
    kotlin: "Solution().arraySign({nums})"
    go: "arraySign({nums})"
    dart: "Solution().arraySign({nums})"
    swift: "Solution().arraySign({nums})"
    typescript: "arraySign({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().arraySign(nums, {result})"
    checker: |
      class Checker:
          def arraySign(self, nums, result):
              expected = 0 if 0 in nums else (-1 if sum(x < 0 for x in nums) % 2 else 1)
              return result == expected

seed: 1822

