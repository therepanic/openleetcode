entry:
  id: 1550
  title: "three-consecutive-odds"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().threeConsecutiveOdds({arr})"
    rust: "Solution::three_consecutive_odds({arr})"
    python3: "Solution().threeConsecutiveOdds({arr})"
    python2: "Solution().threeConsecutiveOdds({arr})"
    ruby: "three_consecutive_odds({arr})"
    java: "new Solution().threeConsecutiveOdds({arr})"
    csharp: "new Solution().ThreeConsecutiveOdds({arr})"
    kotlin: "Solution().threeConsecutiveOdds({arr})"
    go: "threeConsecutiveOdds({arr})"
    dart: "Solution().threeConsecutiveOdds({arr})"
    swift: "Solution().threeConsecutiveOdds({arr})"
    typescript: "threeConsecutiveOdds({arr})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().threeConsecutiveOdds(arr, {result})"
    checker: |
      class Checker:
          def threeConsecutiveOdds(self, arr, result):
              expected = any(arr[i] % 2 == 1 and arr[i + 1] % 2 == 1 and arr[i + 2] % 2 == 1
                             for i in range(len(arr) - 2))
              return result is expected

seed: 1550

