entry:
  id: 1734
  title: "decode-xored-permutation"
  params:
    encoded:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().decode({encoded})"
    rust: "Solution::decode({encoded})"
    python3: "Solution().decode({encoded})"
    python2: "Solution().decode({encoded})"
    ruby: "decode({encoded})"
    java: "new Solution().decode({encoded})"
    csharp: "new Solution().Decode({encoded})"
    kotlin: "Solution().decode({encoded})"
    go: "decode({encoded})"
    dart: "Solution().decode({encoded})"
    swift: "Solution().decode({encoded})"
    typescript: "decode({encoded})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().decode(encoded, {result})"
    checker: |
      class Checker:
          def decode(self, encoded, result):
              n = len(encoded) + 1
              if not isinstance(result, list) or len(result) != n:
                  return False
              if sorted(result) != list(range(1, n + 1)):
                  return False
              return all(result[i] ^ result[i + 1] == encoded[i] for i in range(n - 1))

seed: 1734

