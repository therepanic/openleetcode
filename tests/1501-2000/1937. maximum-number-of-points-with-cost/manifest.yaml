entry:
  id: 1937
  title: "maximum-number-of-points-with-cost"
  params:
    points:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxPoints({points})"
    rust: "Solution::max_points({points})"
    python3: "Solution().maxPoints({points})"
    python2: "Solution().maxPoints({points})"
    ruby: "max_points({points})"
    java: "new Solution().maxPoints({points})"
    csharp: "new Solution().MaxPoints({points})"
    kotlin: "Solution().maxPoints({points})"
    go: "maxPoints({points})"
    dart: "Solution().maxPoints({points})"
    swift: "Solution().maxPoints({points})"
    typescript: "maxPoints({points})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxPoints(points, {result})"
    checker: |
      class Checker:
          def maxPoints(self, points, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not points or not points[0]:
                  return False
              dp = list(points[0])
              for row in points[1:]:
                  left = [0] * len(dp)
                  right = [0] * len(dp)
                  left[0] = dp[0]
                  for c in range(1, len(dp)):
                      left[c] = max(left[c - 1], dp[c] + c)
                  right[-1] = dp[-1] - len(dp) + 1
                  for c in range(len(dp) - 2, -1, -1):
                      right[c] = max(right[c + 1], dp[c] - c)
                  dp = [row[c] + max(left[c] - c, right[c] + c) for c in range(len(dp))]
              return result == max(dp)

seed: 1937

