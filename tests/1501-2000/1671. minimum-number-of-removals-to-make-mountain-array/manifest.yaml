entry:
  id: 1671
  title: "minimum-number-of-removals-to-make-mountain-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumMountainRemovals({nums})"
    rust: "Solution::minimum_mountain_removals({nums})"
    python3: "Solution().minimumMountainRemovals({nums})"
    python2: "Solution().minimumMountainRemovals({nums})"
    ruby: "minimum_mountain_removals({nums})"
    java: "new Solution().minimumMountainRemovals({nums})"
    csharp: "new Solution().MinimumMountainRemovals({nums})"
    kotlin: "Solution().minimumMountainRemovals({nums})"
    go: "minimumMountainRemovals({nums})"
    dart: "Solution().minimumMountainRemovals({nums})"
    swift: "Solution().minimumMountainRemovals({nums})"
    typescript: "minimumMountainRemovals({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumMountainRemovals(nums, {result})"
    checker: |
      class Checker:
          def minimumMountainRemovals(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(nums)
              inc = [1] * n
              dec = [1] * n
              for i in range(n):
                  for j in range(i):
                      if nums[j] < nums[i]:
                          inc[i] = max(inc[i], inc[j] + 1)
              for i in range(n - 1, -1, -1):
                  for j in range(n - 1, i, -1):
                      if nums[j] < nums[i]:
                          dec[i] = max(dec[i], dec[j] + 1)
              best = 0
              for i in range(1, n - 1):
                  if inc[i] > 1 and dec[i] > 1:
                      best = max(best, inc[i] + dec[i] - 1)
              return result == n - best

seed: 1671

