  - name: exact-target-first
    in:
      triplets:
        - [3, 3, 3]
        - [1000, 1, 1]
        - [1, 1000, 1]
      target: [3, 3, 3]
    out: true
  - name: zero-not-allowed-boundary
    in:
      triplets:
        - [1, 1, 2]
        - [1, 2, 1]
        - [2, 1, 1]
      target: [2, 2, 2]
    out: true
  - name: close-but-not-enough
    in:
      triplets:
