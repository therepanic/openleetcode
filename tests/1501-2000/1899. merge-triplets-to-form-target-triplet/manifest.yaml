entry:
  id: 1899
  title: "merge-triplets-to-form-target-triplet"
  params:
    triplets:
      type: array
      items:
        type: array
        items:
          type: int
    target:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().mergeTriplets({triplets}, {target})"
    rust: "Solution::merge_triplets({triplets}, {target})"
    python3: "Solution().mergeTriplets({triplets}, {target})"
    python2: "Solution().mergeTriplets({triplets}, {target})"
    ruby: "merge_triplets({triplets}, {target})"
    java: "new Solution().mergeTriplets({triplets}, {target})"
    csharp: "new Solution().MergeTriplets({triplets}, {target})"
    kotlin: "Solution().mergeTriplets({triplets}, {target})"
    go: "mergeTriplets({triplets}, {target})"
    dart: "Solution().mergeTriplets({triplets}, {target})"
    swift: "Solution().mergeTriplets({triplets}, {target})"
    typescript: "mergeTriplets({triplets}, {target})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().mergeTriplets(triplets, target, {result})"
    checker: |
      class Checker:
          def mergeTriplets(self, triplets, target, result):
              if not isinstance(result, bool):
                  return False
              can = [False, False, False]
              for triplet in triplets:
                  if all(triplet[i] <= target[i] for i in range(3)):
                      for i in range(3):
                          if triplet[i] == target[i]:
                              can[i] = True
              expected = all(can)
              return result is expected
seed: 1899
tests:
  - name: example-one
    in:
      triplets:
        - [2, 5, 3]
        - [1, 8, 4]
        - [1, 7, 5]
      target: [2, 7, 5]
    out: true
  - name: example-two
    in:
      triplets:
        - [3, 4, 5]
        - [4, 5, 6]
      target: [3, 2, 5]
    out: false
  - name: example-three
    in:
      triplets:
        - [2, 5, 3]
        - [2, 3, 4]
        - [1, 2, 5]
        - [5, 2, 3]
      target: [5, 5, 5]
    out: true
  - name: exact-single
    in:
      triplets:
        - [4, 7, 9]
      target: [4, 7, 9]
    out: true
  - name: single-mismatch
    in:
      triplets:
        - [4, 7, 8]
      target: [4, 7, 9]
    out: false
  - name: each-component-separate
    in:
      triplets:
        - [5, 1, 1]
        - [1, 6, 1]
        - [1, 1, 7]
      target: [5, 6, 7]
    out: true
  - name: one-triplet-too-large
    in:
      triplets:
        - [5, 2, 3]
        - [2, 8, 3]
        - [2, 2, 9]
      target: [5, 7, 9]
    out: false
  - name: all-components-one-valid
    in:
      triplets:
        - [6, 6, 6]
        - [5, 6, 5]
        - [6, 5, 6]
      target: [6, 6, 6]
    out: true
  - name: no-target-component
    in:
      triplets:
        - [1, 2, 3]
        - [2, 3, 4]
        - [3, 4, 5]
      target: [9, 9, 9]
    out: false
  - name: duplicate-valid
    in:
      triplets:
        - [2, 4, 6]
        - [2, 4, 6]
        - [1, 3, 5]
      target: [2, 4, 6]
    out: true
  - name: duplicate-invalid
    in:
      triplets:
        - [2, 4, 5]
        - [2, 4, 5]
        - [1, 3, 4]
      target: [2, 4, 6]
    out: false
  - name: target-ones
    in:
      triplets:
        - [1, 1, 1]
        - [1, 1, 2]
        - [1, 2, 1]
        - [2, 1, 1]
      target: [1, 1, 1]
    out: true
  - name: target-thousands
    in:
      triplets:
        - [1000, 1, 1]
        - [1, 1000, 1]
        - [1, 1, 1000]
      target: [1000, 1000, 1000]
    out: true
  - name: thousand-overflow
    in:
      triplets:
        - [1000, 1000, 999]
        - [999, 1000, 1000]
        - [1000, 999, 1000]
      target: [999, 999, 999]
    out: false
  - name: two-valid-one-blocked
    in:
      triplets:
        - [4, 5, 1]
        - [4, 1, 6]
        - [1, 5, 6]
      target: [4, 5, 6]
    out: true
  - name: blocked-by-first
    in:
      triplets:
        - [5, 1, 1]
        - [4, 6, 6]
      target: [4, 6, 6]
    out: true
  - name: blocked-first-unavailable
    in:
      triplets:
        - [5, 1, 1]
        - [4, 6, 6]
      target: [4, 6, 5]
    out: false
  - name: order-independent
    in:
      triplets:
        - [1, 1, 8]
        - [7, 1, 1]
        - [1, 6, 1]
      target: [7, 6, 8]
    out: true
  - name: irrelevant-large
    in:
      triplets:
        - [2, 2, 2]
        - [9, 9, 9]
        - [2, 5, 2]
      target: [2, 5, 2]
    out: true
  - name: irrelevant-large-no-exact
    in:
      triplets:
        - [2, 2, 2]
        - [9, 9, 9]
        - [2, 5, 1]
      target: [2, 5, 2]
    out: true
  - name: four-components-repeated
    in:
      triplets:
        - [3, 1, 1]
        - [1, 4, 1]
        - [1, 1, 5]
        - [3, 4, 5]
      target: [3, 4, 5]
    out: true
  - name: all-below
    in:
      triplets:
        - [1, 2, 3]
        - [2, 3, 4]
        - [3, 4, 5]
      target: [4, 5, 6]
    out: false
  - name: exact-after-filtering
    in:
      triplets:
        - [5, 5, 1]
        - [1, 5, 5]
        - [5, 1, 5]
        - [5, 5, 5]
      target: [5, 5, 5]
    out: true
  - name: target-middle-values
    in:
