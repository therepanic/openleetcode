  - name: impossible-missing-coordinate
    in:
      triplets:
        - [8, 7, 6]
        - [7, 6, 8]
        - [6, 8, 7]
      target: [8, 8, 8]
    out: true
  - name: many-irrelevant
    in:
      triplets:
        - [1, 1, 1]
        - [2, 2, 2]
        - [3, 3, 3]
        - [4, 4, 4]
        - [5, 5, 5]
        - [6, 6, 6]
        - [7, 7, 7]
      target: [5, 5, 5]
    out: true
  - name: many-irrelevant-false
    in:
      triplets:
        - [1, 1, 1]
        - [2, 2, 2]
        - [3, 3, 3]
        - [4, 4, 4]
        - [6, 6, 6]
        - [7, 7, 7]
      target: [5, 5, 5]
    out: false
  - name: component-from-two
    in:
      triplets:
        - [9, 2, 2]
        - [9, 9, 2]
        - [2, 9, 9]
      target: [9, 9, 9]
    out: true
  - name: component-from-three
    in:
      triplets:
        - [9, 1, 1]
        - [1, 9, 1]
        - [1, 1, 9]
        - [8, 8, 8]
      target: [9, 9, 9]
