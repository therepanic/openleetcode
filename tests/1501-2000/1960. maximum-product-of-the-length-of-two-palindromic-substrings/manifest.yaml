entry:
  id: 1960
  title: "maximum-product-of-the-length-of-two-palindromic-substrings"
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxProduct({s})"
    rust: "Solution::max_product({s})"
    python3: "Solution().maxProduct({s})"
    python2: "Solution().maxProduct({s})"
    ruby: "max_product({s})"
    java: "new Solution().maxProduct({s})"
    csharp: "new Solution().MaxProduct({s})"
    kotlin: "Solution().maxProduct({s})"
    go: "maxProduct({s})"
    dart: "Solution().maxProduct({s})"
    swift: "Solution().maxProduct({s})"
    typescript: "maxProduct({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxProduct(s, {result})"
    checker: |
      class Checker:
          def maxProduct(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(s)
              if n < 2 or n > 100000 or any(c < 'a' or c > 'z' for c in s):
                  return False
              d = [0] * n
              left_center = 0
              right_center = -1
              for i in range(n):
                  radius = 1 if i > right_center else min(d[left_center + right_center - i], right_center - i + 1)
                  while i - radius >= 0 and i + radius < n and s[i - radius] == s[i + radius]:
                      radius += 1
                  d[i] = radius
                  if i + radius - 1 > right_center:
                      left_center = i - radius + 1
                      right_center = i + radius - 1
              ending = [0] * n
              starting = [0] * n
              for i, radius in enumerate(d):
                  length = 2 * radius - 1
                  ending[i + radius - 1] = max(ending[i + radius - 1], length)
                  starting[i - radius + 1] = max(starting[i - radius + 1], length)
              for i in range(n - 2, -1, -1):
                  ending[i] = max(ending[i], ending[i + 1] - 2)
              for i in range(1, n):
                  ending[i] = max(ending[i], ending[i - 1])
                  starting[i] = max(starting[i], starting[i - 1] - 2)
              for i in range(n - 2, -1, -1):
                  starting[i] = max(starting[i], starting[i + 1])
              expected = max(ending[i] * starting[i + 1] for i in range(n - 1))
              return result == expected

