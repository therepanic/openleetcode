judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums, {result})"
    checker: |
      from math import gcd
      class Checker:
          def check(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              seen = set(nums)
              maximum = max(nums)
              expected = 0
              for value in range(1, maximum + 1):
                  current = 0
                  for multiple in range(value, maximum + 1, value):
                      if multiple in seen:
                          current = gcd(current, multiple)
                  if current == value:
                      expected += 1
              return result == expected

