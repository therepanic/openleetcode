  title: "largest-magic-square"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().largestMagicSquare({grid})"
    rust: "Solution::largest_magic_square({grid})"
    python3: "Solution().largestMagicSquare({grid})"
    python2: "Solution().largestMagicSquare({grid})"
    ruby: "largest_magic_square({grid})"
    java: "new Solution().largestMagicSquare({grid})"
    csharp: "new Solution().LargestMagicSquare({grid})"
    kotlin: "Solution().largestMagicSquare({grid})"
    go: "largestMagicSquare({grid})"
    dart: "Solution().largestMagicSquare({grid})"
    swift: "Solution().largestMagicSquare({grid})"
    typescript: "largestMagicSquare({grid})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().largestMagicSquare(grid, {result})"
    checker: |
      class Checker:
          def largestMagicSquare(self, grid, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              m = len(grid)
              n = len(grid[0]) if m else 0
              best = 1
              for k in range(2, min(m, n) + 1):
                  for i in range(m - k + 1):
                      for j in range(n - k + 1):
                          rows = [sum(grid[x][j:j + k]) for x in range(i, i + k)]
                          s = rows[0]
                          if any(v != s for v in rows):
                              continue
                          if any(sum(grid[x][y] for x in range(i, i + k)) != s for y in range(j, j + k)):
                              continue
                          if sum(grid[i + d][j + d] for d in range(k)) != s:
                              continue
                          if sum(grid[i + d][j + k - 1 - d] for d in range(k)) != s:
                              continue
                          best = max(best, k)
              return result == best

