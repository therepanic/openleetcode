judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().minCost(n, cuts, {result})"
    checker: |
      class Checker:
          def minCost(self, n, cuts, result):
              points = sorted([0, n] + list(cuts))
              size = len(points)
              dp = [[0] * size for _ in range(size)]
              for gap in range(2, size):
                  for left in range(size - gap):
                      right = left + gap
                      dp[left][right] = min(
                          dp[left][mid] + dp[mid][right]
                          for mid in range(left + 1, right)
                      ) + points[right] - points[left]
              return result == dp[0][size - 1]
