    python3: "Solution().minCost({n}, {cuts})"
    python2: "Solution().minCost({n}, {cuts})"
    ruby: "min_cost({n}, {cuts})"
    java: "new Solution().minCost({n}, {cuts})"
    csharp: "new Solution().MinCost({n}, {cuts})"
    kotlin: "Solution().minCost({n}, {cuts})"
    go: "minCost({n}, {cuts})"
