entry:
  id: 1526
  title: "minimum-number-of-increments-on-subarrays-to-form-a-target-array"
  params:
    target:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minNumberOperations({target})"
    rust: "Solution::min_number_operations({target})"
    python3: "Solution().minNumberOperations({target})"
    python2: "Solution().minNumberOperations({target})"
    ruby: "min_number_operations({target})"
    java: "new Solution().minNumberOperations({target})"
    csharp: "new Solution().MinNumberOperations({target})"
    kotlin: "Solution().minNumberOperations({target})"
    go: "minNumberOperations({target})"
    dart: "Solution().minNumberOperations({target})"
    swift: "Solution().minNumberOperations({target})"
    typescript: "minNumberOperations({target})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minNumberOperations(target, {result})"
    checker: |
      class Checker:
          def minNumberOperations(self, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = target[0]
              for i in range(1, len(target)):
                  if target[i] > target[i - 1]:
                      expected += target[i] - target[i - 1]
              return result == expected

seed: 1526

