entry:
  id: 1962
  title: "remove-stones-to-minimize-the-total"
  params:
    piles:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minStoneSum({piles}, {k})"
    rust: "Solution::min_stone_sum({piles}, {k})"
    python3: "Solution().minStoneSum({piles}, {k})"
    python2: "Solution().minStoneSum({piles}, {k})"
    ruby: "min_stone_sum({piles}, {k})"
    java: "new Solution().minStoneSum({piles}, {k})"
    csharp: "new Solution().MinStoneSum({piles}, {k})"
    kotlin: "Solution().minStoneSum({piles}, {k})"
    go: "minStoneSum({piles}, {k})"
    dart: "Solution().minStoneSum({piles}, {k})"
    swift: "Solution().minStoneSum({piles}, {k})"
    typescript: "minStoneSum({piles}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().minStoneSum(piles, k, {result})"
    checker: |
      import heapq

      class Checker:
          def minStoneSum(self, piles, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              heap = [-int(x) for x in piles]
              heapq.heapify(heap)
              for _ in range(k):
                  x = -heapq.heappop(heap)
                  heapq.heappush(heap, -(x - x // 2))
              return result == -sum(heap)

seed: 1962

