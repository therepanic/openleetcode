entry:
  id: 1998
  title: "gcd-sort-of-an-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().gcdSort({nums})"
    rust: "Solution::gcd_sort({nums})"
    python3: "Solution().gcdSort({nums})"
    python2: "Solution().gcdSort({nums})"
    ruby: "gcd_sort({nums})"
    java: "new Solution().gcdSort({nums})"
    csharp: "new Solution().GcdSort({nums})"
    kotlin: "Solution().gcdSort({nums})"
    go: "gcdSort({nums})"
    dart: "Solution().gcdSort({nums})"
    swift: "Solution().gcdSort({nums})"
    typescript: "gcdSort({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().gcdSort(nums, {result})"
    checker: |
      from math import gcd

      class Checker:
          def gcdSort(self, nums, result):
              if not isinstance(result, bool):
                  return False
              n = len(nums)
              parent = list(range(n))

              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x

              def union(a, b):
                  a, b = find(a), find(b)
                  if a != b:
                      parent[b] = a

              first = {}
              for i, value in enumerate(nums):
                  x = value
                  factor = 2
                  while factor * factor <= x:
                      if x % factor == 0:
                          if factor in first:
                              union(i, first[factor])
                          else:
                              first[factor] = i
                          while x % factor == 0:
                              x //= factor
                      factor += 1
                  if x > 1:
                      if x in first:
                          union(i, first[x])
                      else:
                          first[x] = i
              expected = True
              sorted_values = sorted(nums)
              positions = {}
              for i, value in enumerate(nums):
                  positions.setdefault(value, []).append(i)
              used = {}
              for destination, value in enumerate(sorted_values):
                  k = used.get(value, 0)
                  original = positions[value][k]
                  used[value] = k + 1
                  if find(destination) != find(original):
                      expected = False
                      break
              return result == expected

