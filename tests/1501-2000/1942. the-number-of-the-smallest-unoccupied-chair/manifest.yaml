          type: int
    targetFriend:
      type: int
  call:
    cpp: "Solution().smallestChair({times}, {targetFriend})"
    rust: "Solution::smallest_chair({times}, {targetFriend})"
    python3: "Solution().smallestChair({times}, {targetFriend})"
    python2: "Solution().smallestChair({times}, {targetFriend})"
    ruby: "smallest_chair({times}, {targetFriend})"
    java: "new Solution().smallestChair({times}, {targetFriend})"
    csharp: "new Solution().SmallestChair({times}, {targetFriend})"
    kotlin: "Solution().smallestChair({times}, {targetFriend})"
    go: "smallestChair({times}, {targetFriend})"
    dart: "Solution().smallestChair({times}, {targetFriend})"
    swift: "Solution().smallestChair({times}, {targetFriend})"
