judge:
  type: exact
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().smallestChair(times, targetFriend, {result})"
    checker: |
      import heapq

      class Checker:
          def smallestChair(self, times, targetFriend, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              ordered = sorted((a, b, i) for i, (a, b) in enumerate(times))
              free = []
              busy = []
              next_chair = 0
              answer = None
              for arrival, leaving, friend in ordered:
                  while busy and busy[0][0] <= arrival:
                      _, chair = heapq.heappop(busy)
                      heapq.heappush(free, chair)
                  if free:
                      chair = heapq.heappop(free)
                  else:
                      chair = next_chair
                      next_chair += 1
                  heapq.heappush(busy, (leaving, chair))
                  if friend == targetFriend:
                      answer = chair
                      break
              return result == answer
seed: 1942
