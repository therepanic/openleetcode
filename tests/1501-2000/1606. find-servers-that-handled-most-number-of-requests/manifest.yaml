entry:
  id: 1606
  title: "find-servers-that-handled-most-number-of-requests"
  params:
    k:
      type: int
    arrival:
      type: array
      items:
        type: int
    load:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().busiestServers({k}, {arrival}, {load})"
    rust: "Solution::busiest_servers({k}, {arrival}, {load})"
    python3: "Solution().busiestServers({k}, {arrival}, {load})"
    python2: "Solution().busiestServers({k}, {arrival}, {load})"
    ruby: "busiest_servers({k}, {arrival}, {load})"
    java: "new Solution().busiestServers({k}, {arrival}, {load})"
    csharp: "new Solution().BusiestServers({k}, {arrival}, {load})"
    kotlin: "Solution().busiestServers({k}, {arrival}, {load})"
    go: "busiestServers({k}, {arrival}, {load})"
    dart: "Solution().busiestServers({k}, {arrival}, {load})"
    swift: "Solution().busiestServers({k}, {arrival}, {load})"
    typescript: "busiestServers({k}, {arrival}, {load})"

judge:
  type: ignore_order

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().busiestServers(k, arrival, load, {result})"
    checker: |
      import heapq

      class Checker:
          def busiestServers(self, k, arrival, load, result):
              if not isinstance(result, list):
                  return False
              available = list(range(k))
              heapq.heapify(available)
              busy = []
              counts = [0] * k
              for i, start in enumerate(arrival):
                  while busy and busy[0][0] <= start:
                      finish, server = heapq.heappop(busy)
                      heapq.heappush(available, i + (server - i) % k)
                  if available:
                      encoded = heapq.heappop(available)
                      server = encoded % k
                      counts[server] += 1
                      heapq.heappush(busy, (start + load[i], server))
              best = max(counts)
              expected = {i for i, count in enumerate(counts) if count == best}
              try:
                  actual = [int(x) for x in result]
              except (TypeError, ValueError):
                  return False
              return len(actual) == len(set(actual)) and set(actual) == expected

