judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().stoneGameV(stoneValue, {result})"
    checker: |
      class Checker:
          def stoneGameV(self, stoneValue, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(stoneValue)
              pref = [0]
              for value in stoneValue:
                  pref.append(pref[-1] + value)
              dp = [[0] * (n + 1) for _ in range(n + 1)]
              for length in range(2, n + 1):
                  for left in range(n - length + 1):
                      right = left + length
                      best = 0
                      for mid in range(left + 1, right):
                          a = pref[mid] - pref[left]
                          b = pref[right] - pref[mid]
                          if a <= b:
                              best = max(best, a + dp[left][mid])
                          if b <= a:
                              best = max(best, b + dp[mid][right])
                      dp[left][right] = best
              return result == dp[0][n]

