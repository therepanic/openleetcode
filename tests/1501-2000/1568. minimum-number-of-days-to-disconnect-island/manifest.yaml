  title: "minimum-number-of-days-to-disconnect-island"
  params:
    grid:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().minDays({grid})"
    rust: "Solution::min_days({grid})"
    python3: "Solution().minDays({grid})"
    python2: "Solution().minDays({grid})"
    ruby: "min_days({grid})"
    java: "new Solution().minDays({grid})"
    csharp: "new Solution().MinDays({grid})"
    kotlin: "Solution().minDays({grid})"
    go: "minDays({grid})"
    dart: "Solution().minDays({grid})"
    swift: "Solution().minDays({grid})"
    typescript: "minDays({grid})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minDays(grid, {result})"
    checker: |
      class Checker:
          def minDays(self, grid, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              a = [row[:] for row in grid]
              m, n = len(a), len(a[0])
              def islands():
                  seen = set()
                  count = 0
                  for r in range(m):
                      for c in range(n):
                          if a[r][c] == 1 and (r, c) not in seen:
                              count += 1
                              stack = [(r, c)]
                              seen.add((r, c))
                              while stack:
                                  x, y = stack.pop()
                                  for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                                      nx, ny = x + dx, y + dy
                                      if 0 <= nx < m and 0 <= ny < n and a[nx][ny] == 1 and (nx, ny) not in seen:
                                          seen.add((nx, ny))
                                          stack.append((nx, ny))
                  return count
              if islands() != 1:
                  expected = 0
              else:
                  expected = 2
                  for r in range(m):
                      for c in range(n):
                          if a[r][c] == 1:
                              a[r][c] = 0
                              if islands() != 1:
                                  expected = 1
                              a[r][c] = 1
                              if expected == 1:
                                  break
                      if expected == 1:
                          break
              return result == expected

seed: 1568

