entry:
  id: 1751
  title: "maximum-number-of-events-that-can-be-attended-ii"
  params:
    events:
      type: array
      items:
        type: array
        items:
          type: int
    k:
      type: int
  call:
    cpp: "Solution().maxValue({events}, {k})"
    rust: "Solution::max_value({events}, {k})"
    python3: "Solution().maxValue({events}, {k})"
    python2: "Solution().maxValue({events}, {k})"
    ruby: "max_value({events}, {k})"
    java: "new Solution().maxValue({events}, {k})"
    csharp: "new Solution().MaxValue({events}, {k})"
    kotlin: "Solution().maxValue({events}, {k})"
    go: "maxValue({events}, {k})"
    dart: "Solution().maxValue({events}, {k})"
    swift: "Solution().maxValue({events}, {k})"
    typescript: "maxValue({events}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxValue(events, k, {result})"
    checker: |
      from bisect import bisect_left

      class Checker:
          def maxValue(self, events, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(events, list) or not isinstance(k, int) or isinstance(k, bool):
                  return False
              if not 1 <= k <= len(events):
                  return False
              es = []
              for event in events:
                  if not isinstance(event, list) or len(event) != 3:
                      return False
                  start, end, value = event
                  if any(not isinstance(x, int) or isinstance(x, bool) for x in event):
                      return False
                  if not (1 <= start <= end <= 1000000000 and 1 <= value <= 1000000):
                      return False
                  es.append((start, end, value))
              es.sort(key=lambda event: event[1])
              n = len(es)
              ends = [event[1] for event in es]
              previous = [bisect_left(ends, start, 0, i) for i, (start, _, _) in enumerate(es)]
              best_without_current = [0] * (n + 1)
              for used in range(1, k + 1):
                  best_with_limit = [0] * (n + 1)
                  for i, (_, _, value) in enumerate(es, 1):
                      best_with_limit[i] = max(
                          best_with_limit[i - 1],
                          best_without_current[previous[i - 1]] + value,
                      )
                  best_without_current = best_with_limit
              return result == best_without_current[n]

