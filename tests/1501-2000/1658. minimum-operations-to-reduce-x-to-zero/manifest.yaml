entry:
  id: 1658
  title: "minimum-operations-to-reduce-x-to-zero"
  params:
    nums:
      type: array
      items:
        type: int
    x:
      type: int
  call:
    cpp: "Solution().minOperations({nums}, {x})"
    rust: "Solution::min_operations({nums}, {x})"
    python3: "Solution().minOperations({nums}, {x})"
    python2: "Solution().minOperations({nums}, {x})"
    ruby: "min_operations({nums}, {x})"
    java: "new Solution().minOperations({nums}, {x})"
    csharp: "new Solution().MinOperations({nums}, {x})"
    kotlin: "Solution().minOperations({nums}, {x})"
    go: "minOperations({nums}, {x})"
    dart: "Solution().minOperations({nums}, {x})"
    swift: "Solution().minOperations({nums}, {x})"
    typescript: "minOperations({nums}, {x})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minOperations(nums, x, {result})"
    checker: |
      class Checker:
          def minOperations(self, nums, x, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              target = sum(nums) - x
              best = -1
              left = 0
              total = 0
              for right, value in enumerate(nums):
                  total += value
                  while left <= right and total > target:
                      total -= nums[left]
                      left += 1
                  if total == target:
                      best = max(best, right - left + 1)
              expected = len(nums) - best if best >= 0 else -1
              return result == expected
seed: 1658
