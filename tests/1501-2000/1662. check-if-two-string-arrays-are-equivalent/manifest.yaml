entry:
  id: 1662
  title: "check-if-two-string-arrays-are-equivalent"
  params:
    word1:
      type: array
      items:
        type: string
    word2:
      type: array
      items:
        type: string
  call:
    cpp: "Solution().arrayStringsAreEqual({word1}, {word2})"
    rust: "Solution::array_strings_are_equal({word1}, {word2})"
    python3: "Solution().arrayStringsAreEqual({word1}, {word2})"
    python2: "Solution().arrayStringsAreEqual({word1}, {word2})"
    ruby: "array_strings_are_equal({word1}, {word2})"
    java: "new Solution().arrayStringsAreEqual({word1}, {word2})"
    csharp: "new Solution().ArrayStringsAreEqual({word1}, {word2})"
    kotlin: "Solution().arrayStringsAreEqual({word1}, {word2})"
    go: "arrayStringsAreEqual({word1}, {word2})"
    dart: "Solution().arrayStringsAreEqual({word1}, {word2})"
    swift: "Solution().arrayStringsAreEqual({word1}, {word2})"
    typescript: "arrayStringsAreEqual({word1}, {word2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(word1, word2, {result})"
    checker: |
      class Checker:
          def check(self, word1, word2, result):
              return isinstance(result, bool) and result == (''.join(word1) == ''.join(word2))

seed: 1662

tests:
  - name: example-split
    in:
      word1: ["ab", "c"]
      word2: ["a", "bc"]
    out: true
  - name: example-mismatch
    in:
      word1: ["a", "cb"]
      word2: ["ab", "c"]
    out: false
  - name: example-single-joined
    in:
      word1: ["abc", "d", "defg"]
      word2: ["abcddefg"]
    out: true
  - name: one-character-equal
    in:
      word1: ["a"]
      word2: ["a"]
    out: true
  - name: one-character-different
    in:
      word1: ["a"]
      word2: ["b"]
    out: false
  - name: two-character-split
    in:
      word1: ["a", "b"]
      word2: ["ab"]
    out: true
  - name: reversed-order
