entry:
  id: 1529
  title: "minimum-suffix-flips"
  params:
    target:
      type: string
  call:
    cpp: "Solution().minFlips({target})"
    rust: "Solution::min_flips({target})"
    python3: "Solution().minFlips({target})"
    python2: "Solution().minFlips({target})"
    ruby: "min_flips({target})"
    java: "new Solution().minFlips({target})"
    csharp: "new Solution().MinFlips({target})"
    kotlin: "Solution().minFlips({target})"
    go: "minFlips({target})"
    dart: "Solution().minFlips({target})"
    swift: "Solution().minFlips({target})"
    typescript: "minFlips({target})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minFlips(target, {result})"
    checker: |
      class Checker:
          def minFlips(self, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              previous = '0'
              for bit in target:
                  if bit != previous:
                      expected += 1
                      previous = bit
              return result == expected

seed: 1529

