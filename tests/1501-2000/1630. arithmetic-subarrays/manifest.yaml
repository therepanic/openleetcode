entry:
  id: 1630
  title: arithmetic-subarrays
  params:
    nums:
      type: array
      items:
        type: int
    l:
      type: array
      items:
        type: int
    r:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    rust: "Solution::check_arithmetic_subarrays({nums}, {l}, {r})"
    python3: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    python2: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    ruby: "check_arithmetic_subarrays({nums}, {l}, {r})"
    java: "new Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    csharp: "new Solution().CheckArithmeticSubarrays({nums}, {l}, {r})"
    kotlin: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    go: "checkArithmeticSubarrays({nums}, {l}, {r})"
    dart: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    swift: "Solution().checkArithmeticSubarrays({nums}, {l}, {r})"
    typescript: "checkArithmeticSubarrays({nums}, {l}, {r})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().checkArithmeticSubarrays(nums, l, r, {result})"
    checker: |
      class Checker:
          def checkArithmeticSubarrays(self, nums, l, r, result):
              if not isinstance(result, list) or len(result) != len(l) or len(l) != len(r):
                  return False
              expected = []
              for left, right in zip(l, r):
                  values = sorted(nums[left:right + 1])
                  if len(values) < 2:
                      expected.append(True)
                  else:
                      step = values[1] - values[0]
                      expected.append(all(values[i] - values[i - 1] == step for i in range(2, len(values))))
              return result == expected

seed: 1630

tests:
