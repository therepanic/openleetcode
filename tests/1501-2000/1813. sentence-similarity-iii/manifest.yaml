entry:
  id: 1813
  title: sentence-similarity-iii
  params:
    sentence1:
      type: string
    sentence2:
      type: string
  call:
    cpp: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    rust: "Solution::are_sentences_similar({sentence1}, {sentence2})"
    python3: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    python2: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    ruby: "are_sentences_similar({sentence1}, {sentence2})"
    java: "new Solution().areSentencesSimilar({sentence1}, {sentence2})"
    csharp: "new Solution().AreSentencesSimilar({sentence1}, {sentence2})"
    kotlin: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    go: "areSentencesSimilar({sentence1}, {sentence2})"
    dart: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    swift: "Solution().areSentencesSimilar({sentence1}, {sentence2})"
    typescript: "areSentencesSimilar({sentence1}, {sentence2})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(sentence1, sentence2, {result})"
    checker: |
      class Checker:
          def check(self, sentence1, sentence2, result):
              a = sentence1.split(" ")
              b = sentence2.split(" ")
              i = 0
              while i < len(a) and i < len(b) and a[i] == b[i]:
                  i += 1
              j = 0
              while j < len(a) - i and j < len(b) - i and a[-1 - j] == b[-1 - j]:
                  j += 1
              expected = i + j >= min(len(a), len(b))
              return isinstance(result, bool) and result == expected

seed: 1813

