entry:
  id: 1881
  title: "maximum-value-after-insertion"
  params:
    n:
      type: string
    x:
      type: int
  call:
    cpp: "Solution().maxValue({n}, {x})"
    rust: "Solution::max_value({n}, {x})"
    python3: "Solution().maxValue({n}, {x})"
    python2: "Solution().maxValue({n}, {x})"
    ruby: "max_value({n}, {x})"
    java: "new Solution().maxValue({n}, {x})"
    csharp: "new Solution().MaxValue({n}, {x})"
    kotlin: "Solution().maxValue({n}, {x})"
    go: "maxValue({n}, {x})"
    dart: "Solution().maxValue({n}, {x})"
    swift: "Solution().maxValue({n}, {x})"
    typescript: "maxValue({n}, {x})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().maxValue(n, x, {result})"
    checker: |
      class Checker:
          def maxValue(self, n, x, result):
              if not isinstance(n, str) or not isinstance(x, int):
                  return False
              if not isinstance(result, str):
                  return False
              if len(result) >= 2 and result[0] == '"' and result[-1] == '"':
                  result = result[1:-1]
              digit = str(x)
              if n.startswith('-'):
                  index = len(n)
                  for i in range(1, len(n)):
                      if digit < n[i]:
                          index = i
                          break
                  expected = n[:index] + digit + n[index:]
              else:
                  index = len(n)
                  for i in range(len(n)):
                      if digit > n[i]:
                          index = i
                          break
                  expected = n[:index] + digit + n[index:]
              return result == expected

seed: 1881

