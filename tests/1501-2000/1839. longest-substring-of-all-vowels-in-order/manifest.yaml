entry:
  id: 1839
  title: "longest-substring-of-all-vowels-in-order"
  params:
    word:
      type: string
  call:
    cpp: "Solution().longestBeautifulSubstring({word})"
    rust: "Solution::longest_beautiful_substring({word})"
    python3: "Solution().longestBeautifulSubstring({word})"
    python2: "Solution().longestBeautifulSubstring({word})"
    ruby: "longest_beautiful_substring({word})"
    java: "new Solution().longestBeautifulSubstring({word})"
    csharp: "new Solution().LongestBeautifulSubstring({word})"
    kotlin: "Solution().longestBeautifulSubstring({word})"
    go: "longestBeautifulSubstring({word})"
    dart: "Solution().longestBeautifulSubstring({word})"
    swift: "Solution().longestBeautifulSubstring({word})"
    typescript: "longestBeautifulSubstring({word})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(word, {result})"
    checker: |
      class Checker:
          def check(self, word, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              n = len(word)
              start = 0
              while start < n:
                  if word[start] != "a":
                      start += 1
                      continue
                  end = start
                  seen = 1
                  while end + 1 < n and word[end + 1] >= word[end]:
                      if word[end + 1] != word[end]:
                          seen += 1
                      end += 1
                  if seen == 5:
                      best = max(best, end - start + 1)
                  start = end + 1
              return result == best

seed: 1839

