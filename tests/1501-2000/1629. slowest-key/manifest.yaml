entry:
  id: 1629
  title: "slowest-key"
  params:
    releaseTimes:
      type: array
      items:
        type: int
    keysPressed:
      type: string
  call:
    cpp: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    rust: "Solution::slowest_key({releaseTimes}, {keysPressed})"
    python3: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    python2: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    ruby: "slowest_key({releaseTimes}, {keysPressed})"
    java: "new Solution().slowestKey({releaseTimes}, {keysPressed})"
    csharp: "new Solution().SlowestKey({releaseTimes}, {keysPressed})"
    kotlin: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    go: "string(slowestKey({releaseTimes}, {keysPressed}))"
    dart: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    swift: "Solution().slowestKey({releaseTimes}, {keysPressed})"
    typescript: "slowestKey({releaseTimes}, {keysPressed})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().slowestKey(releaseTimes, keysPressed, {result})"
    checker: |
      class Checker:
          def slowestKey(self, releaseTimes, keysPressed, result):
              if not isinstance(result, str) or len(result) != 1:
                  return False
              best_duration = releaseTimes[0]
              best_key = keysPressed[0]
              for i in range(1, len(releaseTimes)):
                  duration = releaseTimes[i] - releaseTimes[i - 1]
                  if duration > best_duration or (duration == best_duration and keysPressed[i] > best_key):
                      best_duration = duration
                      best_key = keysPressed[i]
              return result == best_key

seed: 1629

