entry:
  id: 1791
  title: "find-center-of-star-graph"
  params:
    edges:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findCenter({edges})"
    rust: "Solution::find_center({edges})"
    python3: "Solution().findCenter({edges})"
    python2: "Solution().findCenter({edges})"
    ruby: "find_center({edges})"
    java: "new Solution().findCenter({edges})"
    csharp: "new Solution().FindCenter({edges})"
    kotlin: "Solution().findCenter({edges})"
    go: "findCenter({edges})"
    dart: "Solution().findCenter({edges})"
    swift: "Solution().findCenter({edges})"
    typescript: "findCenter({edges})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().findCenter(edges, {result})"
    checker: |
      class Checker:
          def findCenter(self, edges, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              degree = {}
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  degree[u] = degree.get(u, 0) + 1
                  degree[v] = degree.get(v, 0) + 1
              if result not in degree or degree[result] != len(edges):
                  return False
              return sum(1 for node, count in degree.items() if count == len(edges)) == 1

seed: 1791

