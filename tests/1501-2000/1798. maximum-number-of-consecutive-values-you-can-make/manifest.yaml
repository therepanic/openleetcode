entry:
  id: 1798
  title: "maximum-number-of-consecutive-values-you-can-make"
  params:
    coins:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getMaximumConsecutive({coins})"
    rust: "Solution::get_maximum_consecutive({coins})"
    python3: "Solution().getMaximumConsecutive({coins})"
    python2: "Solution().getMaximumConsecutive({coins})"
    ruby: "get_maximum_consecutive({coins})"
    java: "new Solution().getMaximumConsecutive({coins})"
    csharp: "new Solution().GetMaximumConsecutive({coins})"
    kotlin: "Solution().getMaximumConsecutive({coins})"
    go: "getMaximumConsecutive({coins})"
    dart: "Solution().getMaximumConsecutive({coins})"
    swift: "Solution().getMaximumConsecutive({coins})"
    typescript: "getMaximumConsecutive({coins})"
judge:
  type: "exact"
limits:
  time_ms: 5000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().getMaximumConsecutive(coins, {result})"
    checker: |
      class Checker:
          def getMaximumConsecutive(self, coins, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              reach = 0
              for coin in sorted(coins):
                  if coin > reach + 1:
                      break
                  reach += coin
              return result == reach + 1
seed: 1798
