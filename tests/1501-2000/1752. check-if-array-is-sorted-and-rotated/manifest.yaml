entry:
  id: 1752
  title: "check-if-array-is-sorted-and-rotated"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().check({nums})"
    rust: "Solution::check({nums})"
    python3: "Solution().check({nums})"
    python2: "Solution().check({nums})"
    ruby: "check({nums})"
    java: "new Solution().check({nums})"
    csharp: "new Solution().Check({nums})"
    kotlin: "Solution().check({nums})"
    go: "check({nums})"
    dart: "Solution().check({nums})"
    swift: "Solution().check({nums})"
    typescript: "check({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(nums, {result})"
    checker: |
      class Checker:
          def check(self, nums, result):
              if not isinstance(result, bool):
                  return False
              drops = sum(nums[i] > nums[(i + 1) % len(nums)] for i in range(len(nums)))
              return result == (drops <= 1)

seed: 1752

tests:
  - name: example-1
    in:
      nums: [3, 4, 5, 1, 2]
    out: true
  - name: example-2
    in:
      nums: [2, 1, 3, 4]
    out: false
