entry:
  id: 1703
  title: "minimum-adjacent-swaps-for-k-consecutive-ones"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minMoves({nums}, {k})"
    rust: "Solution::min_moves({nums}, {k})"
    python3: "Solution().minMoves({nums}, {k})"
    python2: "Solution().minMoves({nums}, {k})"
    ruby: "min_moves({nums}, {k})"
    java: "new Solution().minMoves({nums}, {k})"
    csharp: "new Solution().MinMoves({nums}, {k})"
    kotlin: "Solution().minMoves({nums}, {k})"
    go: "minMoves({nums}, {k})"
    dart: "Solution().minMoves({nums}, {k})"
    swift: "Solution().minMoves({nums}, {k})"
    typescript: "minMoves({nums}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minMoves(nums, k, {result})"
    checker: |
      class Checker:
          def minMoves(self, nums, k, result):
              pos = [i for i, x in enumerate(nums) if x == 1]
              if not 1 <= k <= len(pos):
                  return False
              best = None
              for left in range(len(pos) - k + 1):
                  block = pos[left:left + k]
                  mid = k // 2
                  center = block[mid]
                  cost = sum(abs(block[j] - center - j + mid) for j in range(k))
                  best = cost if best is None else min(best, cost)
              return isinstance(result, int) and not isinstance(result, bool) and result == best
