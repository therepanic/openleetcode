entry:
  id: 1557
  title: minimum-number-of-vertices-to-reach-all-nodes
  params:
    n:
      type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findSmallestSetOfVertices({n}, {edges})"
    rust: "Solution::find_smallest_set_of_vertices({n}, {edges})"
    python3: "Solution().findSmallestSetOfVertices({n}, {edges})"
    python2: "Solution().findSmallestSetOfVertices({n}, {edges})"
    ruby: "find_smallest_set_of_vertices({n}, {edges})"
    java: "new Solution().findSmallestSetOfVertices({n}, java.util.Arrays.stream({edges}).map(a -> java.util.Arrays.stream(a).boxed().collect(java.util.stream.Collectors.toList())).collect(java.util.stream.Collectors.toList()))"
    csharp: "new Solution().FindSmallestSetOfVertices({n}, {edges})"
    kotlin: "Solution().findSmallestSetOfVertices({n}, {edges}.map { it.toList() })"
    go: "findSmallestSetOfVertices({n}, {edges})"
    dart: "Solution().findSmallestSetOfVertices({n}, {edges})"
    swift: "Solution().findSmallestSetOfVertices({n}, {edges})"
    typescript: "findSmallestSetOfVertices({n}, {edges})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(n, edges, {result})"
    checker: |
      class Checker:
          def check(self, n, edges, result):
              if not isinstance(result, list):
                  return False
              expected = set(range(n))
              incoming = set()
              outgoing = [[] for _ in range(n)]
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  if not isinstance(u, int) or not isinstance(v, int) or not (0 <= u < n and 0 <= v < n):
                      return False
                  incoming.add(v)
                  outgoing[u].append(v)
              expected -= incoming
              if any(not isinstance(node, int) or isinstance(node, bool) or not (0 <= node < n) for node in result):
                  return False
              if len(result) != len(set(result)) or set(result) != expected:
                  return False
              reached = set(result)
              stack = list(result)
              while stack:
                  u = stack.pop()
                  for v in outgoing[u]:
                      if v not in reached:
                          reached.add(v)
                          stack.append(v)
              return reached == set(range(n))

