entry:
  id: 1945
  title: "sum-of-digits-of-string-after-convert"
  params:
    s:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().getLucky({s}, {k})"
    rust: "Solution::get_lucky({s}, {k})"
    python3: "Solution().getLucky({s}, {k})"
    python2: "Solution().getLucky({s}, {k})"
    ruby: "get_lucky({s}, {k})"
    java: "new Solution().getLucky({s}, {k})"
    csharp: "new Solution().GetLucky({s}, {k})"
    kotlin: "Solution().getLucky({s}, {k})"
    go: "getLucky({s}, {k})"
    dart: "Solution().getLucky({s}, {k})"
    swift: "Solution().getLucky({s}, {k})"
    typescript: "getLucky({s}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().getLucky(s, k, {result})"
    checker: |
      class Checker:
          def getLucky(self, s, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              value = ''.join(str(ord(ch) - ord('a') + 1) for ch in s)
              for _ in range(k):
                  value = str(sum(ord(ch) - ord('0') for ch in value))
              return result == int(value)

seed: 1945

