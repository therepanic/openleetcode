    cpp: "Solution().minimizeTheDifference({mat}, {target})"
    rust: "Solution::minimize_the_difference({mat}, {target})"
    python3: "Solution().minimizeTheDifference({mat}, {target})"
    python2: "Solution().minimizeTheDifference({mat}, {target})"
    ruby: "minimize_the_difference({mat}, {target})"
    java: "new Solution().minimizeTheDifference({mat}, {target})"
    csharp: "new Solution().MinimizeTheDifference({mat}, {target})"
    kotlin: "Solution().minimizeTheDifference({mat}, {target})"
    go: "minimizeTheDifference({mat}, {target})"
    dart: "Solution().minimizeTheDifference({mat}, {target})"
    swift: "Solution().minimizeTheDifference({mat}, {target})"
    typescript: "minimizeTheDifference({mat}, {target})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimizeTheDifference(mat, target, {result})"
    checker: |
      class Checker:
          def minimizeTheDifference(self, mat, target, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              sums = {0}
              for row in mat:
                  nxt = set()
                  for total in sums:
                      for value in row:
                          nxt.add(total + value)
                  sums = nxt
              return result == min(abs(total - target) for total in sums)

