entry:
  id: 1685
  title: "sum-of-absolute-differences-in-a-sorted-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().getSumAbsoluteDifferences({nums})"
    rust: "Solution::get_sum_absolute_differences({nums})"
    python3: "Solution().getSumAbsoluteDifferences({nums})"
    python2: "Solution().getSumAbsoluteDifferences({nums})"
    ruby: "get_sum_absolute_differences({nums})"
    java: "new Solution().getSumAbsoluteDifferences({nums})"
    csharp: "new Solution().GetSumAbsoluteDifferences({nums})"
    kotlin: "Solution().getSumAbsoluteDifferences({nums})"
    go: "getSumAbsoluteDifferences({nums})"
    dart: "Solution().getSumAbsoluteDifferences({nums})"
    swift: "Solution().getSumAbsoluteDifferences({nums})"
    typescript: "getSumAbsoluteDifferences({nums})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().getSumAbsoluteDifferences(nums, {result})"
    checker: |
      class Checker:
          def getSumAbsoluteDifferences(self, nums, result):
              if not isinstance(nums, list) or not isinstance(result, list):
                  return False
              if len(nums) != len(result) or len(nums) < 2:
                  return False
              if any(not isinstance(x, int) or isinstance(x, bool) for x in nums):
                  return False
              if any(nums[i] > nums[i + 1] for i in range(len(nums) - 1)):
                  return False
              prefix = 0
              total = sum(nums)
              expected = []
              n = len(nums)
              for i, value in enumerate(nums):
                  left = value * i - prefix
                  right = (total - prefix - value) - value * (n - i - 1)
                  expected.append(left + right)
                  prefix += value
              return result == expected

seed: 1685001

