entry:
  id: 1556
  title: "thousand-separator"
  params:
    n:
      type: int
  call:
    cpp: "Solution().thousandSeparator({n})"
    rust: "Solution::thousand_separator({n})"
    python3: "Solution().thousandSeparator({n})"
    python2: "Solution().thousandSeparator({n})"
    ruby: "thousand_separator({n})"
    java: "new Solution().thousandSeparator({n})"
    csharp: "new Solution().ThousandSeparator({n})"
    kotlin: "Solution().thousandSeparator({n})"
    go: "thousandSeparator({n})"
    dart: "Solution().thousandSeparator({n})"
    swift: "Solution().thousandSeparator({n})"
    typescript: "thousandSeparator({n})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().thousandSeparator(n, {result})"
    checker: |
      class Checker:
          def thousandSeparator(self, n, result):
              if not isinstance(result, str):
                  return False
              return result == format(n, ',').replace(',', '.')

seed: 1556001

