    maxWeight:
      type: int
  call:
    cpp: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    rust: "Solution::box_delivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    python3: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    python2: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    ruby: "box_delivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    java: "new Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    csharp: "new Solution().BoxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    kotlin: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    go: "boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    dart: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    swift: "Solution().boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"
    typescript: "boxDelivering({boxes}, {portsCount}, {maxBoxes}, {maxWeight})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().boxDelivering(boxes, portsCount, maxBoxes, maxWeight, {result})"
    checker: |
      from collections import deque

      class Checker:
          def boxDelivering(self, boxes, portsCount, maxBoxes, maxWeight, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(boxes)
              prefix_weight = [0] * (n + 1)
              ports_changes = [0] * (n + 2)
              for i, (port, weight) in enumerate(boxes, 1):
                  prefix_weight[i] = prefix_weight[i - 1] + weight
                  if i > 1 and port != boxes[i - 2][0]:
                      ports_changes[i] = ports_changes[i - 1] + 1
                  else:
                      ports_changes[i] = ports_changes[i - 1]
              ports_changes[n + 1] = ports_changes[n]

              dp = [0] * (n + 1)
              candidates = deque([0])
              left = 0
              for right in range(1, n + 1):
                  while (right - left > maxBoxes or
                         prefix_weight[right] - prefix_weight[left] > maxWeight):
                      if candidates and candidates[0] == left:
                          candidates.popleft()
                      left += 1
                  best = candidates[0]
                  dp[right] = (2 + ports_changes[right] +
                               dp[best] - ports_changes[best + 1])
                  value = dp[right] - ports_changes[right + 1]
                  while candidates:
                      tail = candidates[-1]
                      if dp[tail] - ports_changes[tail + 1] < value:
                          break
                      candidates.pop()
                  candidates.append(right)
              return result == dp[n]

seed: 1687

