entry:
  id: 1566
  title: "detect-pattern-of-length-m-repeated-k-or-more-times"
  params:
    arr:
      type: array
      items:
        type: int
    m:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().containsPattern({arr}, {m}, {k})"
    rust: "Solution::contains_pattern({arr}, {m}, {k})"
    python3: "Solution().containsPattern({arr}, {m}, {k})"
    python2: "Solution().containsPattern({arr}, {m}, {k})"
    ruby: "contains_pattern({arr}, {m}, {k})"
    java: "new Solution().containsPattern({arr}, {m}, {k})"
    csharp: "new Solution().ContainsPattern({arr}, {m}, {k})"
    kotlin: "Solution().containsPattern({arr}, {m}, {k})"
    go: "containsPattern({arr}, {m}, {k})"
    dart: "Solution().containsPattern({arr}, {m}, {k})"
    swift: "Solution().containsPattern({arr}, {m}, {k})"
    typescript: "containsPattern({arr}, {m}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().containsPattern(arr, m, k, {result})"
    checker: |
      class Checker:
          def containsPattern(self, arr, m, k, result):
              expected = False
              for start in range(len(arr) - m * k + 1):
                  ok = True
                  for offset in range(m * (k - 1)):
                      if arr[start + offset] != arr[start + offset + m]:
                          ok = False
                          break
                  if ok:
                      expected = True
                      break
              return result is expected

seed: 1566

