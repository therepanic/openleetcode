entry:
  id: 1754
  title: "largest-merge-of-two-strings"
  params:
    word1:
      type: string
    word2:
      type: string
  call:
    cpp: "Solution().largestMerge({word1}, {word2})"
    rust: "Solution::largest_merge({word1}, {word2})"
    python3: "Solution().largestMerge({word1}, {word2})"
    python2: "Solution().largestMerge({word1}, {word2})"
    ruby: "largest_merge({word1}, {word2})"
    java: "new Solution().largestMerge({word1}, {word2})"
    csharp: "new Solution().LargestMerge({word1}, {word2})"
    kotlin: "Solution().largestMerge({word1}, {word2})"
    go: "largestMerge({word1}, {word2})"
    dart: "Solution().largestMerge({word1}, {word2})"
    swift: "Solution().largestMerge({word1}, {word2})"
    typescript: "largestMerge({word1}, {word2})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().largestMerge(word1, word2, {result})"
    checker: |
      class Checker:
          def largestMerge(self, word1, word2, result):
              i = 0
              j = 0
              expected = []
              while i < len(word1) and j < len(word2):
                  if word1[i:] >= word2[j:]:
                      expected.append(word1[i])
                      i += 1
                  else:
                      expected.append(word2[j])
                      j += 1
              expected.extend(word1[i:])
              expected.extend(word2[j:])
              return result == ''.join(expected)

seed: 1754

