entry:
  id: 1861
  title: "rotating-the-box"
  params:
    boxGrid:
      type: array
      items:
        type: array
        items:
          type: char
  call:
    cpp: "Solution().rotateTheBox({boxGrid})"
    rust: "Solution::rotate_the_box({boxGrid})"
    python3: "Solution().rotateTheBox({boxGrid})"
    python2: "Solution().rotateTheBox({boxGrid})"
    ruby: "rotate_the_box({boxGrid})"
    java: "new Solution().rotateTheBox({boxGrid})"
    csharp: "new Solution().RotateTheBox({boxGrid})"
    kotlin: "Solution().rotateTheBox({boxGrid})"
    go: "rotateTheBox({boxGrid})"
    dart: "Solution().rotateTheBox({boxGrid})"
    swift: "Solution().rotateTheBox({boxGrid})"
    typescript: "rotateTheBox({boxGrid})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().rotateTheBox(boxGrid, {result})"
    checker: |
      class Checker:
          def rotateTheBox(self, boxGrid, result):
              if not isinstance(boxGrid, list) or not boxGrid or not isinstance(result, list):
                  return False
              m = len(boxGrid)
              n = len(boxGrid[0])
              if n == 0 or len(result) != n or any(not isinstance(row, list) or len(row) != m for row in result):
                  return False
              expected = [['.' for _ in range(m)] for _ in range(n)]
              for i, row in enumerate(boxGrid):
                  if not isinstance(row, list) or len(row) != n:
                      return False
                  bottom = n - 1
                  for j in range(n - 1, -1, -1):
                      if row[j] == '#':
                          expected[bottom][m - 1 - i] = '#'
                          bottom -= 1
                      elif row[j] == '*':
                          expected[j][m - 1 - i] = '*'
                          bottom = j - 1
                      elif row[j] != '.':
                          return False
              return result == expected

seed: 1861

