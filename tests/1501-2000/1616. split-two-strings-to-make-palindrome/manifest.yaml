entry:
  id: 1616
  title: "split-two-strings-to-make-palindrome"
  params:
    a:
      type: string
    b:
      type: string
  call:
    cpp: "Solution().checkPalindromeFormation({a}, {b})"
    rust: "Solution::check_palindrome_formation({a}, {b})"
    python3: "Solution().checkPalindromeFormation({a}, {b})"
    python2: "Solution().checkPalindromeFormation({a}, {b})"
    ruby: "check_palindrome_formation({a}, {b})"
    java: "new Solution().checkPalindromeFormation({a}, {b})"
    csharp: "new Solution().CheckPalindromeFormation({a}, {b})"
    kotlin: "Solution().checkPalindromeFormation({a}, {b})"
    go: "checkPalindromeFormation({a}, {b})"
    dart: "Solution().checkPalindromeFormation({a}, {b})"
    swift: "Solution().checkPalindromeFormation({a}, {b})"
    typescript: "checkPalindromeFormation({a}, {b})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().checkPalindromeFormation(a, b, {result})"
    checker: |
      class Checker:
          def checkPalindromeFormation(self, a, b, result):
              if not isinstance(result, bool) or len(a) != len(b):
                  return False
              def palindrome(s, i, j):
                  while i < j:
                      if s[i] != s[j]:
                          return False
                      i += 1
                      j -= 1
                  return True
              def check(left, right):
                  i, j = 0, len(left) - 1
                  while i < j and left[i] == right[j]:
                      i += 1
                      j -= 1
                  return palindrome(left, i, j) or palindrome(right, i, j)
              expected = check(a, b) or check(b, a)
              return result == expected
seed: 1616
