  memory_mb: 256

oracle:
  python3:
    call: "Checker().unhappyFriends(n, preferences, pairs, {result})"
    checker: |
      class Checker:
          def unhappyFriends(self, n, preferences, pairs, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              partner = [-1] * n
              for pair in pairs:
                  if len(pair) != 2:
                      return False
                  a, b = pair
                  if not (0 <= a < n and 0 <= b < n and a != b):
                      return False
                  if partner[a] != -1 or partner[b] != -1:
                      return False
                  partner[a], partner[b] = b, a
              rank = [[0] * n for _ in range(n)]
              for i, row in enumerate(preferences):
                  if len(row) != n - 1 or len(set(row)) != n - 1 or i in row:
                      return False
                  for pos, friend in enumerate(row):
                      if not 0 <= friend < n:
                          return False
                      rank[i][friend] = pos
              expected = 0
              for x in range(n):
                  y = partner[x]
                  unhappy = False
                  for u in preferences[x]:
                      if u == y:
                          break
                      v = partner[u]
                      if rank[u][x] < rank[u][v]:
                          unhappy = True
                          break
                  expected += unhappy
              return result == expected

seed: 1583

