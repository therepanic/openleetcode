entry:
  id: 1753
  title: "maximum-score-from-removing-stones"
  params:
    a:
      type: int
    b:
      type: int
    c:
      type: int
  call:
    cpp: "Solution().maximumScore({a}, {b}, {c})"
    rust: "Solution::maximum_score({a}, {b}, {c})"
    python3: "Solution().maximumScore({a}, {b}, {c})"
    python2: "Solution().maximumScore({a}, {b}, {c})"
    ruby: "maximum_score({a}, {b}, {c})"
    java: "new Solution().maximumScore({a}, {b}, {c})"
    csharp: "new Solution().MaximumScore({a}, {b}, {c})"
    kotlin: "Solution().maximumScore({a}, {b}, {c})"
    go: "maximumScore({a}, {b}, {c})"
    dart: "Solution().maximumScore({a}, {b}, {c})"
    swift: "Solution().maximumScore({a}, {b}, {c})"
    typescript: "maximumScore({a}, {b}, {c})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumScore(a, b, c, {result})"
    checker: |
      class Checker:
          def maximumScore(self, a, b, c, result):
              expected = min(a + b + c - max(a, b, c), (a + b + c) // 2)
              return result == expected

seed: 1753

