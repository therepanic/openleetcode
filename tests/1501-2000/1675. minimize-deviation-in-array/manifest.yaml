entry:
  id: 1675
  title: "minimize-deviation-in-array"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minimumDeviation({nums})"
    rust: "Solution::minimum_deviation({nums})"
    python3: "Solution().minimumDeviation({nums})"
    python2: "Solution().minimumDeviation({nums})"
    ruby: "minimum_deviation({nums})"
    java: "new Solution().minimumDeviation({nums})"
    csharp: "new Solution().MinimumDeviation({nums})"
    kotlin: "Solution().minimumDeviation({nums})"
    go: "minimumDeviation({nums})"
    dart: "Solution().minimumDeviation({nums})"
    swift: "Solution().minimumDeviation({nums})"
    typescript: "minimumDeviation({nums})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minimumDeviation(nums, {result})"
    checker: |
      import heapq

      class Checker:
          def minimumDeviation(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              heap = []
              low = 10**30
              for value in nums:
                  value = value if value % 2 == 0 else value * 2
                  heapq.heappush(heap, -value)
                  low = min(low, value)
              best = 10**30
              while heap and (-heap[0]) % 2 == 0:
                  high = -heapq.heappop(heap)
                  best = min(best, high - low)
                  lowered = high // 2
                  heapq.heappush(heap, -lowered)
                  low = min(low, lowered)
              best = min(best, -heap[0] - low)
              return result == best

seed: 1675

