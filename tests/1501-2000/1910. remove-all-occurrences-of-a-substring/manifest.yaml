entry:
  id: 1910
  title: remove-all-occurrences-of-a-substring
  params:
    s:
      type: string
    part:
      type: string
  call:
    cpp: "Solution().removeOccurrences({s}, {part})"
    rust: "Solution::remove_occurrences({s}, {part})"
    python3: "Solution().removeOccurrences({s}, {part})"
    python2: "Solution().removeOccurrences({s}, {part})"
    ruby: "remove_occurrences({s}, {part})"
    java: "new Solution().removeOccurrences({s}, {part})"
    csharp: "new Solution().RemoveOccurrences({s}, {part})"
    kotlin: "Solution().removeOccurrences({s}, {part})"
    go: "removeOccurrences({s}, {part})"
    dart: "Solution().removeOccurrences({s}, {part})"
    swift: "Solution().removeOccurrences({s}, {part})"
    typescript: "removeOccurrences({s}, {part})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().removeOccurrences(s, part, {result})"
    checker: |
      class Checker:
          def removeOccurrences(self, s, part, result):
              stack = []
              m = len(part)
              for ch in s:
                  stack.append(ch)
                  if len(stack) >= m and ''.join(stack[-m:]) == part:
                      del stack[-m:]
              return result == ''.join(stack)
seed: 1910
