oracle:
  python3:
    call: "Checker().canBeIncreasing(nums, {result})"
    checker: |
      class Checker:
          def canBeIncreasing(self, nums, result):
              if not isinstance(result, bool):
                  return False
              for skip in range(len(nums)):
                  previous = None
                  valid = True
                  for index, value in enumerate(nums):
                      if index == skip:
                          continue
                      if previous is not None and previous >= value:
                          valid = False
                          break
                      previous = value
                  if valid:
                      return result is True
              return result is False

