entry:
  id: 1732
  title: "find-the-highest-altitude"
  params:
    gain:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().largestAltitude({gain})"
    rust: "Solution::largest_altitude({gain})"
    python3: "Solution().largestAltitude({gain})"
    python2: "Solution().largestAltitude({gain})"
    ruby: "largest_altitude({gain})"
    java: "new Solution().largestAltitude({gain})"
    csharp: "new Solution().LargestAltitude({gain})"
    kotlin: "Solution().largestAltitude({gain})"
    go: "largestAltitude({gain})"
    dart: "Solution().largestAltitude({gain})"
    swift: "Solution().largestAltitude({gain})"
    typescript: "largestAltitude({gain})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().largestAltitude(gain, {result})"
    checker: |
      class Checker:
          def largestAltitude(self, gain, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              altitude = 0
              highest = 0
              for delta in gain:
                  altitude += delta
                  highest = max(highest, altitude)
              return result == highest

seed: 1732

