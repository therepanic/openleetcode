entry:
  id: 1859
  title: "sorting-the-sentence"
  params:
    s:
      type: string
  call:
    cpp: "Solution().sortSentence({s})"
    rust: "Solution::sort_sentence({s})"
    python3: "Solution().sortSentence({s})"
    python2: "Solution().sortSentence({s})"
    ruby: "sort_sentence({s})"
    java: "new Solution().sortSentence({s})"
    csharp: "new Solution().SortSentence({s})"
    kotlin: "Solution().sortSentence({s})"
    go: "sortSentence({s})"
    dart: "Solution().sortSentence({s})"
    swift: "Solution().sortSentence({s})"
    typescript: "sortSentence({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(s, {result})"
    checker: |
      class Checker:
          def check(self, s, result):
              words = {}
              for token in s.split():
                  words[int(token[-1])] = token[:-1]
              expected = " ".join(words[i] for i in range(1, len(words) + 1))
              return result == expected

seed: 1859

tests:
  - name: example-one
    in:
      s: "is2 sentence4 This1 a3"
    out: "This is a sentence"
  - name: example-two
    in:
      s: "Myself2 Me1 I4 and3"
    out: "Me Myself and I"
