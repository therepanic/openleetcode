        alphabet: "qr"
      knowledge: []
    judge:
      type: "exact"
  - name: generated-plain-5
    in:
      s:
        gen: "str"
        len: 25000
        alphabet: "uvw"
      knowledge: []
    judge:
      type: "exact"
