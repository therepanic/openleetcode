entry:
  id: 1560
  title: "most-visited-sector-in-a-circular-track"
  params:
    n:
      type: int
    rounds:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().mostVisited({n}, {rounds})"
    rust: "Solution::most_visited({n}, {rounds})"
    python3: "Solution().mostVisited({n}, {rounds})"
    python2: "Solution().mostVisited({n}, {rounds})"
    ruby: "most_visited({n}, {rounds})"
    java: "new Solution().mostVisited({n}, {rounds})"
    csharp: "new Solution().MostVisited({n}, {rounds})"
    kotlin: "Solution().mostVisited({n}, {rounds})"
    go: "mostVisited({n}, {rounds})"
    dart: "Solution().mostVisited({n}, {rounds})"
    swift: "Solution().mostVisited({n}, {rounds})"
    typescript: "mostVisited({n}, {rounds})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().mostVisited(n, rounds, {result})"
    checker: |
      class Checker:
          def mostVisited(self, n, rounds, result):
              start = rounds[0]
              end = rounds[-1]
              expected = list(range(start, end + 1)) if start <= end else list(range(1, end + 1)) + list(range(start, n + 1))
              return result == expected

seed: 1560

