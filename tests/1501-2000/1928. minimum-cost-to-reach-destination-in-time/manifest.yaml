entry:
  id: 1928
  title: "minimum-cost-to-reach-destination-in-time"
  params:
    maxTime:
      type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
    passingFees:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    rust: "Solution::min_cost({maxTime}, {edges}, {passingFees})"
    python3: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    python2: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    ruby: "min_cost({maxTime}, {edges}, {passingFees})"
    java: "new Solution().minCost({maxTime}, {edges}, {passingFees})"
    csharp: "new Solution().MinCost({maxTime}, {edges}, {passingFees})"
    kotlin: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    go: "minCost({maxTime}, {edges}, {passingFees})"
    dart: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    swift: "Solution().minCost({maxTime}, {edges}, {passingFees})"
    typescript: "minCost({maxTime}, {edges}, {passingFees})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minCost(maxTime, edges, passingFees, {result})"
    checker: |
      import heapq
      class Checker:
          def minCost(self, maxTime, edges, passingFees, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(passingFees)
              graph = [[] for _ in range(n)]
              for e in edges:
                  if not isinstance(e, list) or len(e) != 3:
                      return False
                  u, v, t = e
                  graph[u].append((v, t))
                  graph[v].append((u, t))
              dist = [[10**18] * (maxTime + 1) for _ in range(n)]
              dist[0][0] = passingFees[0]
              q = [(passingFees[0], 0, 0)]
              while q:
                  cost, tm, u = heapq.heappop(q)
                  if cost != dist[u][tm]:
                      continue
                  for v, dt in graph[u]:
                      nt = tm + dt
                      if nt <= maxTime and cost + passingFees[v] < dist[v][nt]:
                          dist[v][nt] = cost + passingFees[v]
                          heapq.heappush(q, (dist[v][nt], nt, v))
              expected = min(dist[n - 1])
              expected = -1 if expected == 10**18 else expected
              return result == expected

seed: 1928

tests:
