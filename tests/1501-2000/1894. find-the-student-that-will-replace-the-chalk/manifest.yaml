entry:
  id: 1894
  title: "find-the-student-that-will-replace-the-chalk"
  params:
    chalk:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().chalkReplacer({chalk}, {k})"
    rust: "Solution::chalk_replacer({chalk}, {k})"
    python3: "Solution().chalkReplacer({chalk}, {k})"
    python2: "Solution().chalkReplacer({chalk}, {k})"
    ruby: "chalk_replacer({chalk}, {k})"
    java: "new Solution().chalkReplacer({chalk}, {k})"
    csharp: "new Solution().ChalkReplacer({chalk}, {k})"
    kotlin: "Solution().chalkReplacer({chalk}, {k})"
    go: "chalkReplacer({chalk}, {k})"
    dart: "Solution().chalkReplacer({chalk}, {k})"
    swift: "Solution().chalkReplacer({chalk}, {k})"
    typescript: "chalkReplacer({chalk}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().chalkReplacer(chalk, k, {result})"
    checker: |
      class Checker:
          def chalkReplacer(self, chalk, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not chalk or result < 0 or result >= len(chalk):
                  return False
              remainder = k % sum(chalk)
              for index, amount in enumerate(chalk):
                  if remainder < amount:
                      return result == index
                  remainder -= amount
              return False

seed: 1894

