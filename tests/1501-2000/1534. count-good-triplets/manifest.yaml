judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countGoodTriplets(arr, a, b, c, {result})"
    checker: |
      class Checker:
          def countGoodTriplets(self, arr, a, b, c, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = 0
              for i in range(len(arr)):
                  for j in range(i + 1, len(arr)):
                      for k in range(j + 1, len(arr)):
                          if (abs(arr[i] - arr[j]) <= a and
                              abs(arr[j] - arr[k]) <= b and
                              abs(arr[i] - arr[k]) <= c):
                              expected += 1
              return result == expected

seed: 1534

