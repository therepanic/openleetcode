    python3: "Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
    python2: "Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
    ruby: "count_good_triplets({arr}, {a}, {b}, {c})"
    java: "new Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
    csharp: "new Solution().CountGoodTriplets({arr}, {a}, {b}, {c})"
    kotlin: "Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
    go: "countGoodTriplets({arr}, {a}, {b}, {c})"
    dart: "Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
    swift: "Solution().countGoodTriplets({arr}, {a}, {b}, {c})"
