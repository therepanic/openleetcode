judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().createSortedArray(instructions, {result})"
    checker: |
      class Checker:
          def createSortedArray(self, instructions, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              n = len(instructions)
              bit = [0] * (100002)
              def add(i):
                  while i < len(bit):
                      bit[i] += 1
                      i += i & -i
              def prefix(i):
                  total = 0
                  while i:
                      total += bit[i]
                      i -= i & -i
                  return total
              expected = 0
              for i, value in enumerate(instructions):
                  less = prefix(value)
                  not_greater = prefix(value + 1)
                  greater = i - not_greater
                  expected = (expected + min(less, greater)) % mod
                  add(value + 1)
              return result == expected

