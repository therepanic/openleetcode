entry:
  id: 1943
  title: "describe-the-painting"
  params:
    segments:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().splitPainting({segments})"
    rust: "Solution::split_painting({segments})"
    python3: "Solution().splitPainting({segments})"
    python2: "Solution().splitPainting({segments})"
    ruby: "split_painting({segments})"
    java: "new Solution().splitPainting({segments})"
    csharp: "new Solution().SplitPainting({segments})"
    kotlin: "Solution().splitPainting({segments})"
    go: "splitPainting({segments})"
    dart: "Solution().splitPainting({segments})"
    swift: "Solution().splitPainting({segments})"
    typescript: "splitPainting({segments})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().splitPainting(segments, {result})"
    checker: |
      class Checker:
          def splitPainting(self, segments, result):
              if not isinstance(result, list):
                  return False
              events = {}
              for seg in segments:
                  if not isinstance(seg, list) or len(seg) != 3:
                      return False
                  left, right, color = seg
                  events[left] = events.get(left, 0) + color
                  events[right] = events.get(right, 0) - color
              points = sorted(events)
              expected = []
              total = 0
              for i in range(len(points) - 1):
                  total += events[points[i]]
                  if total:
                      expected.append([points[i], points[i + 1], total])
              def normalize(value):
                  if not isinstance(value, list):
                      return None
                  rows = []
                  for row in value:
                      if not isinstance(row, list) or len(row) != 3:
                          return None
                      if not all(isinstance(x, int) and not isinstance(x, bool) for x in row):
                          return None
                      if row[0] >= row[1] or row[2] <= 0:
                          return None
                      rows.append(list(row))
                  rows.sort()
                  return rows
              return normalize(result) == expected

