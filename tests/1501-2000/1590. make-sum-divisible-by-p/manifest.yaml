entry:
  id: 1590
  title: "make-sum-divisible-by-p"
  params:
    nums:
      type: array
      items:
        type: int
    p:
      type: int
  call:
    cpp: "Solution().minSubarray({nums}, {p})"
    rust: "Solution::min_subarray({nums}, {p})"
    python3: "Solution().minSubarray({nums}, {p})"
    python2: "Solution().minSubarray({nums}, {p})"
    ruby: "min_subarray({nums}, {p})"
    java: "new Solution().minSubarray({nums}, {p})"
    csharp: "new Solution().MinSubarray({nums}, {p})"
    kotlin: "Solution().minSubarray({nums}, {p})"
    go: "minSubarray({nums}, {p})"
    dart: "Solution().minSubarray({nums}, {p})"
    swift: "Solution().minSubarray({nums}, {p})"
    typescript: "minSubarray({nums}, {p})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minSubarray(nums, p, {result})"
    checker: |
      class Checker:
          def minSubarray(self, nums, p, result):
              total = sum(nums)
              target = total % p
              if target == 0:
                  expected = 0
              else:
                  last = {0: -1}
                  prefix = 0
                  best = len(nums)
                  for i, value in enumerate(nums):
                      prefix = (prefix + value) % p
                      need = (prefix - target) % p
                      if need in last:
                          best = min(best, i - last[need])
                      last[prefix] = i
                  expected = -1 if best == len(nums) else best
              return result == expected
seed: 1590
