judge:
  type: exact
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().furthestBuilding(heights, bricks, ladders, {result})"
    checker: |
      import heapq
      class Checker:
          def furthestBuilding(self, heights, bricks, ladders, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              heap = []
              remaining = bricks
              answer = len(heights) - 1
              for i in range(1, len(heights)):
                  climb = heights[i] - heights[i - 1]
                  if climb <= 0:
                      continue
                  heapq.heappush(heap, climb)
                  if len(heap) > ladders:
                      remaining -= heapq.heappop(heap)
                      if remaining < 0:
                          answer = i - 1
                          break
              return result == answer
seed: 1642
