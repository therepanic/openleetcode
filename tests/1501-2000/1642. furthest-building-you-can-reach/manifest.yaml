    python3: "Solution().furthestBuilding({heights}, {bricks}, {ladders})"
    python2: "Solution().furthestBuilding({heights}, {bricks}, {ladders})"
    ruby: "furthest_building({heights}, {bricks}, {ladders})"
    java: "new Solution().furthestBuilding({heights}, {bricks}, {ladders})"
    csharp: "new Solution().FurthestBuilding({heights}, {bricks}, {ladders})"
    kotlin: "Solution().furthestBuilding({heights}, {bricks}, {ladders})"
    go: "furthestBuilding({heights}, {bricks}, {ladders})"
    dart: "Solution().furthestBuilding({heights}, {bricks}, {ladders})"
