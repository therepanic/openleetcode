entry:
  id: 1750
  title: "minimum-length-of-string-after-deleting-similar-ends"
  params:
    s:
      type: string
  call:
    cpp: "Solution().minimumLength({s})"
    rust: "Solution::minimum_length({s})"
    python3: "Solution().minimumLength({s})"
    python2: "Solution().minimumLength({s})"
    ruby: "minimum_length({s})"
    java: "new Solution().minimumLength({s})"
    csharp: "new Solution().MinimumLength({s})"
    kotlin: "Solution().minimumLength({s})"
    go: "minimumLength({s})"
    dart: "Solution().minimumLength({s})"
    swift: "Solution().minimumLength({s})"
    typescript: "minimumLength({s})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumLength(s, {result})"
    checker: |
      class Checker:
          def minimumLength(self, s, result):
              i, j = 0, len(s) - 1
              while i < j and s[i] == s[j]:
                  ch = s[i]
                  while i <= j and s[i] == ch:
                      i += 1
                  while i < j and s[j] == ch:
                      j -= 1
              expected = max(0, j - i + 1)
              return result == expected

