    go: "concatenatedBinary({n})"
    dart: "Solution().concatenatedBinary({n})"
    swift: "Solution().concatenatedBinary({n})"
    typescript: "concatenatedBinary({n})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().concatenatedBinary(n, {result})"
    checker: |
      class Checker:
          def concatenatedBinary(self, n, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              value = 0
              width = 0
              for number in range(1, n + 1):
                  if number & (number - 1) == 0:
                      width += 1
                  value = ((value << width) | number) % mod
              return result == value

