    rust: "Solution::min_trio_degree({n}, {edges})"
    python3: "Solution().minTrioDegree({n}, {edges})"
    python2: "Solution().minTrioDegree({n}, {edges})"
    ruby: "min_trio_degree({n}, {edges})"
    java: "new Solution().minTrioDegree({n}, {edges})"
    csharp: "new Solution().MinTrioDegree({n}, {edges})"
    kotlin: "Solution().minTrioDegree({n}, {edges})"
    go: "minTrioDegree({n}, {edges})"
    dart: "Solution().minTrioDegree({n}, {edges})"
    swift: "Solution().minTrioDegree({n}, {edges})"
