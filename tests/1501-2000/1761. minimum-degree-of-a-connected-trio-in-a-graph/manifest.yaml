judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minTrioDegree(n, edges, {result})"
    checker: |
      class Checker:
          def minTrioDegree(self, n, edges, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              adj = [[False] * (n + 1) for _ in range(n + 1)]
              deg = [0] * (n + 1)
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  if not (1 <= u <= n and 1 <= v <= n and u != v):
                      return False
                  if not adj[u][v]:
                      adj[u][v] = adj[v][u] = True
                      deg[u] += 1
                      deg[v] += 1
              best = None
              for a in range(1, n + 1):
                  for b in range(a + 1, n + 1):
                      if not adj[a][b]:
                          continue
                      for c in range(b + 1, n + 1):
                          if adj[a][c] and adj[b][c]:
                              value = deg[a] + deg[b] + deg[c] - 6
                              best = value if best is None else min(best, value)
              return result == (-1 if best is None else best)

