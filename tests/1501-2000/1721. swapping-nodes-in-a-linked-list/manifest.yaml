  title: "swapping-nodes-in-a-linked-list"
  params:
    head:
      type: list_node
    k:
      type: int
  call:
    cpp: "listNodeToArray(Solution().swapNodes({head}, {k}))"
    rust: "ListNode::list_node_to_array(Solution::swap_nodes({head}, {k}))"
    python3: "list_node_to_array(Solution().swapNodes({head}, {k}))"
    python2: "list_node_to_array(Solution().swapNodes({head}, {k}))"
    ruby: "list_node_to_array(swap_nodes({head}, {k}))"
    java: "ListNode.listNodeToArray(new Solution().swapNodes({head}, {k}))"
    csharp: "ListNode.ListNodeToArray(new Solution().SwapNodes({head}, {k}))"
    kotlin: "listNodeToArray(Solution().swapNodes({head}, {k}))"
    go: "listNodeToArray(swapNodes({head}, {k}))"
    dart: "list_node_to_array(Solution().swapNodes({head}, {k}))"
    swift: "list_node_to_array(Solution().swapNodes({head}, {k}))"
    typescript: "listNodeToArray(swapNodes({head}, {k}))"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 300
oracle:
  python3:
    call: "Checker().swapNodes(head, k, {result})"
    checker: |
      class Checker:
          def swapNodes(self, head, k, result):
              if not isinstance(result, list) or len(result) != len(head):
                  return False
              expected = list(head)
              i = k - 1
              j = len(expected) - k
              expected[i], expected[j] = expected[j], expected[i]
              return result == expected
