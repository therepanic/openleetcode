entry:
  id: 1786
  title: "number-of-restricted-paths-from-first-to-last-node"
  params:
    n:
      type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().countRestrictedPaths({n}, {edges})"
    rust: "Solution::count_restricted_paths({n}, {edges})"
    python3: "Solution().countRestrictedPaths({n}, {edges})"
    python2: "Solution().countRestrictedPaths({n}, {edges})"
    ruby: "count_restricted_paths({n}, {edges})"
    java: "new Solution().countRestrictedPaths({n}, {edges})"
    csharp: "new Solution().CountRestrictedPaths({n}, {edges})"
    kotlin: "Solution().countRestrictedPaths({n}, {edges})"
    go: "countRestrictedPaths({n}, {edges})"
    dart: "Solution().countRestrictedPaths({n}, {edges})"
    swift: "Solution().countRestrictedPaths({n}, {edges})"
    typescript: "countRestrictedPaths({n}, {edges})"

judge:
  type: "exact"

limits:
  time_ms: 10000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(n, edges, {result})"
    checker: |
      import heapq
      class Checker:
          def check(self, n, edges, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if n < 1 or len(edges) < n - 1:
                  return False
              graph = [[] for _ in range(n + 1)]
              seen = set()
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 3:
                      return False
                  u, v, w = edge
                  if not (1 <= u <= n and 1 <= v <= n and u != v and 1 <= w <= 100000):
                      return False
                  key = (min(u, v), max(u, v))
                  if key in seen:
                      return False
                  seen.add(key)
                  graph[u].append((v, w))
                  graph[v].append((u, w))
              dist = [10**30] * (n + 1)
              dist[n] = 0
              heap = [(0, n)]
              while heap:
                  d, u = heapq.heappop(heap)
                  if d != dist[u]:
                      continue
                  for v, w in graph[u]:
                      nd = d + w
                      if nd < dist[v]:
                          dist[v] = nd
                          heapq.heappush(heap, (nd, v))
              if any(dist[i] >= 10**30 for i in range(1, n + 1)):
                  return False
              dp = [0] * (n + 1)
              dp[n] = 1
              for u in sorted(range(1, n + 1), key=lambda x: dist[x]):
                  for v, _ in graph[u]:
                      if dist[u] > dist[v]:
                          dp[u] = (dp[u] + dp[v]) % 1000000007
              return result == dp[1]

