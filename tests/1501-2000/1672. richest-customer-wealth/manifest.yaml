  title: richest-customer-wealth
  params:
    accounts:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maximumWealth({accounts})"
    rust: "Solution::maximum_wealth({accounts})"
    python3: "Solution().maximumWealth({accounts})"
    python2: "Solution().maximumWealth({accounts})"
    ruby: "maximum_wealth({accounts})"
    java: "new Solution().maximumWealth({accounts})"
    csharp: "new Solution().MaximumWealth({accounts})"
    kotlin: "Solution().maximumWealth({accounts})"
    go: "maximumWealth({accounts})"
    dart: "Solution().maximumWealth({accounts})"
    swift: "Solution().maximumWealth({accounts})"
    typescript: "maximumWealth({accounts})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumWealth(accounts, {result})"
    checker: |
      class Checker:
          def maximumWealth(self, accounts, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(accounts, list) or not accounts:
                  return False
              if any(not isinstance(row, list) or not row for row in accounts):
                  return False
              if any(any(not isinstance(value, int) or isinstance(value, bool) or value < 1 or value > 100 for value in row) for row in accounts):
                  return False
              width = len(accounts[0])
              if any(len(row) != width for row in accounts):
                  return False
              return result == max(sum(row) for row in accounts)

