entry:
  id: 1537
  title: "get-the-maximum-score"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxSum({nums1}, {nums2})"
    rust: "Solution::max_sum({nums1}, {nums2})"
    python3: "Solution().maxSum({nums1}, {nums2})"
    python2: "Solution().maxSum({nums1}, {nums2})"
    ruby: "max_sum({nums1}, {nums2})"
    java: "new Solution().maxSum({nums1}, {nums2})"
    csharp: "new Solution().MaxSum({nums1}, {nums2})"
    kotlin: "Solution().maxSum({nums1}, {nums2})"
    go: "maxSum({nums1}, {nums2})"
    dart: "Solution().maxSum({nums1}, {nums2})"
    swift: "Solution().maxSum({nums1}, {nums2})"
    typescript: "maxSum({nums1}, {nums2})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxSum(nums1, nums2, {result})"
    checker: |
      class Checker:
          def maxSum(self, nums1, nums2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              i = j = 0
              left = right = answer = 0
              while i < len(nums1) and j < len(nums2):
                  if nums1[i] == nums2[j]:
                      answer += max(left, right) + nums1[i]
                      left = right = 0
                      i += 1
                      j += 1
                  elif nums1[i] < nums2[j]:
                      left += nums1[i]
                      i += 1
                  else:
                      right += nums2[j]
                      j += 1
              left += sum(nums1[i:])
              right += sum(nums2[j:])
              expected = (answer + max(left, right)) % 1000000007
              return result == expected

seed: 1537

