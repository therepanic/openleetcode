entry:
  id: 1985
  title: "find-the-kth-largest-integer-in-the-array"
  params:
    nums:
      type: array
      items:
        type: string
    k:
      type: int
  call:
    cpp: "Solution().kthLargestNumber({nums}, {k})"
    rust: "Solution::kth_largest_number({nums}, {k})"
    python3: "Solution().kthLargestNumber({nums}, {k})"
    python2: "Solution().kthLargestNumber({nums}, {k})"
    ruby: "kth_largest_number({nums}, {k})"
    java: "new Solution().kthLargestNumber({nums}, {k})"
    csharp: "new Solution().KthLargestNumber({nums}, {k})"
    kotlin: "Solution().kthLargestNumber({nums}, {k})"
    go: "kthLargestNumber({nums}, {k})"
    dart: "Solution().kthLargestNumber({nums}, {k})"
    swift: "Solution().kthLargestNumber({nums}, {k})"
    typescript: "kthLargestNumber({nums}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().kthLargestNumber(nums, k, {result})"
    checker: |
      class Checker:
          def kthLargestNumber(self, nums, k, result):
              if not isinstance(result, str):
                  return False
              ordered = sorted(nums, key=lambda value: int(value), reverse=True)
              return result == ordered[k - 1]
seed: 1985
