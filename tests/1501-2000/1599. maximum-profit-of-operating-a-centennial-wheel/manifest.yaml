entry:
  id: 1599
  title: "maximum-profit-of-operating-a-centennial-wheel"
  params:
    customers:
      type: array
      items:
        type: int
    boardingCost:
      type: int
    runningCost:
      type: int
  call:
    cpp: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    rust: "Solution::min_operations_max_profit({customers}, {boardingCost}, {runningCost})"
    python3: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    python2: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    ruby: "min_operations_max_profit({customers}, {boardingCost}, {runningCost})"
    java: "new Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    csharp: "new Solution().MinOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    kotlin: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    go: "minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    dart: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    swift: "Solution().minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"
    typescript: "minOperationsMaxProfit({customers}, {boardingCost}, {runningCost})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().minOperationsMaxProfit(customers, boardingCost, runningCost, {result})"
    checker: |
      class Checker:
          def minOperationsMaxProfit(self, customers, boardingCost, runningCost, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              waiting = 0
              profit = 0
              best_profit = 0
              expected = -1
              index = 0
              rotations = 0
              while index < len(customers) or waiting > 0:
                  if index < len(customers):
                      waiting += customers[index]
                  boarded = min(4, waiting)
                  waiting -= boarded
                  rotations += 1
                  profit += boarded * boardingCost - runningCost
                  if profit > best_profit:
                      best_profit = profit
                      expected = rotations
                  index += 1
              return result == expected

seed: 1599

