  call:
    cpp: "Solution().minDifference({nums}, {queries})"
    rust: "Solution::min_difference({nums}, {queries})"
    python3: "Solution().minDifference({nums}, {queries})"
    python2: "Solution().minDifference({nums}, {queries})"
    ruby: "min_difference({nums}, {queries})"
    java: "new Solution().minDifference({nums}, {queries})"
    csharp: "new Solution().MinDifference({nums}, {queries})"
    kotlin: "Solution().minDifference({nums}, {queries})"
    go: "minDifference({nums}, {queries})"
    dart: "Solution().minDifference({nums}, {queries})"
    swift: "Solution().minDifference({nums}, {queries})"
    typescript: "minDifference({nums}, {queries})"

judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums, queries, {result})"
    checker: |
      class Checker:
          def check(self, nums, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              expected = []
              for left, right in queries:
                  values = [False] * 101
                  for value in nums[left:right + 1]:
                      values[value] = True
                  present = [value for value in range(1, 101) if values[value]]
                  best = -1 if len(present) < 2 else min(b - a for a, b in zip(present, present[1:]))
                  expected.append(best)
              return result == expected

seed: 1906

