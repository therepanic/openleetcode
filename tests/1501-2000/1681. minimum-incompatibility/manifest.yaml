limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(nums, k, {result})"
    checker: |
      from functools import lru_cache
      class Checker:
          def check(self, nums, k, result):
              n = len(nums)
              size = n // k
              valid = {}
              for mask in range(1 << n):
                  if mask.bit_count() != size:
                      continue
                  values = [nums[i] for i in range(n) if (mask >> i) & 1]
                  if len(set(values)) == size:
                      valid[mask] = max(values) - min(values)
              inf = 10 ** 9
              @lru_cache(None)
              def solve(rem):
                  if rem == 0:
                      return 0
                  first = (rem & -rem).bit_length() - 1
                  best = inf
                  for mask, cost in valid.items():
                      if (mask & rem) == mask and ((mask >> first) & 1):
                          best = min(best, cost + solve(rem ^ mask))
                  return best
              expected = solve((1 << n) - 1)
              expected = -1 if expected == inf else expected
              return isinstance(result, int) and result == expected

