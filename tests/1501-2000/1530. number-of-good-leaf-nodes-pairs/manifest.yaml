entry:
  id: 1530
  title: "number-of-good-leaf-nodes-pairs"
  params:
    root:
      type: tree_node
    distance:
      type: int
  call:
    cpp: "Solution().countPairs({root}, {distance})"
    rust: "Solution::count_pairs({root}, {distance})"
    python3: "Solution().countPairs({root}, {distance})"
    python2: "Solution().countPairs({root}, {distance})"
    ruby: "count_pairs({root}, {distance})"
    java: "new Solution().countPairs({root}, {distance})"
    csharp: "new Solution().CountPairs({root}, {distance})"
    kotlin: "Solution().countPairs({root}, {distance})"
    go: "countPairs({root}, {distance})"
    dart: "Solution().countPairs({root}, {distance})"
    swift: "Solution().countPairs({root}, {distance})"
    typescript: "countPairs({root}, {distance})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().countPairs(root, distance, {result})"
    checker: |
      class Checker:
          def countPairs(self, root, distance, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False

              def dfs(node):
                  if node is None:
                      return [], 0
                  left_distances, left_pairs = dfs(node.left)
                  right_distances, right_pairs = dfs(node.right)
                  if node.left is None and node.right is None:
                      return [0], left_pairs + right_pairs
                  pairs = left_pairs + right_pairs
                  for left in left_distances:
                      for right in right_distances:
                          if left + right <= distance:
                              pairs += 1
                  distances = [d + 1 for d in left_distances + right_distances]
                  return [d for d in distances if d < distance], pairs

              _, expected = dfs(root)
              return result == expected

