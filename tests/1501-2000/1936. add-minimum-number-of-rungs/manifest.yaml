entry:
  id: 1936
  title: "add-minimum-number-of-rungs"
  params:
    rungs:
      type: array
      items:
        type: int
    dist:
      type: int
  call:
    cpp: "Solution().addRungs({rungs}, {dist})"
    rust: "Solution::add_rungs({rungs}, {dist})"
    python3: "Solution().addRungs({rungs}, {dist})"
    python2: "Solution().addRungs({rungs}, {dist})"
    ruby: "add_rungs({rungs}, {dist})"
    java: "new Solution().addRungs({rungs}, {dist})"
    csharp: "new Solution().AddRungs({rungs}, {dist})"
    kotlin: "Solution().addRungs({rungs}, {dist})"
    go: "addRungs({rungs}, {dist})"
    dart: "Solution().addRungs({rungs}, {dist})"
    swift: "Solution().addRungs({rungs}, {dist})"
    typescript: "addRungs({rungs}, {dist})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().addRungs(rungs, dist, {result})"
    checker: |
      class Checker:
          def addRungs(self, rungs, dist, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              current = 0
              expected = 0
              for rung in rungs:
                  if rung - current > dist:
                      expected += (rung - current - 1) // dist
                  current = rung
              return result == expected

seed: 1936

