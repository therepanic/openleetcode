entry:
  id: 1585
  title: check-if-string-is-transformable-with-substring-sort-operations
  params:
    s:
      type: string
    t:
      type: string
  call:
    cpp: "Solution().isTransformable({s}, {t})"
    rust: "Solution::is_transformable({s}, {t})"
    python3: "Solution().isTransformable({s}, {t})"
    python2: "Solution().isTransformable({s}, {t})"
    ruby: "is_transformable({s}, {t})"
    java: "new Solution().isTransformable({s}, {t})"
    csharp: "new Solution().IsTransformable({s}, {t})"
    kotlin: "Solution().isTransformable({s}, {t})"
    go: "isTransformable({s}, {t})"
    dart: "Solution().isTransformable({s}, {t})"
    swift: "Solution().isTransformable({s}, {t})"
    typescript: "isTransformable({s}, {t})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isTransformable(s, t, {result})"
    checker: |
      from collections import deque

      class Checker:
          def isTransformable(self, s, t, result):
              if not isinstance(result, bool):
                  return False
              if len(s) != len(t) or sorted(s) != sorted(t):
                  expected = False
              else:
                  positions = [deque() for _ in range(10)]
                  for index, char in enumerate(s):
                      positions[ord(char) - 48].append(index)
                  expected = True
                  for char in t:
                      digit = ord(char) - 48
                      if not positions[digit]:
                          expected = False
                          break
                      index = positions[digit].popleft()
                      for smaller in range(digit):
                          if positions[smaller] and positions[smaller][0] < index:
                              expected = False
                              break
                      if not expected:
                          break
              return result is expected

seed: 1585

