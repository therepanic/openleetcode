entry:
  id: 1704
  title: determine-if-string-halves-are-alike
  params:
    s:
      type: string
  call:
    cpp: "Solution().halvesAreAlike({s})"
    rust: "Solution::halves_are_alike({s})"
    python3: "Solution().halvesAreAlike({s})"
    python2: "Solution().halvesAreAlike({s})"
    ruby: "halves_are_alike({s})"
    java: "new Solution().halvesAreAlike({s})"
    csharp: "new Solution().HalvesAreAlike({s})"
    kotlin: "Solution().halvesAreAlike({s})"
    go: "halvesAreAlike({s})"
    dart: "Solution().halvesAreAlike({s})"
    swift: "Solution().halvesAreAlike({s})"
    typescript: "halvesAreAlike({s})"

judge:
  type: exact

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().halvesAreAlike(s, {result})"
    checker: |
      class Checker:
          def halvesAreAlike(self, s, result):
              vowels = set("aeiouAEIOU")
              mid = len(s) // 2
              expected = sum(c in vowels for c in s[:mid]) == sum(c in vowels for c in s[mid:])
              return isinstance(result, bool) and result == expected

seed: 1704

