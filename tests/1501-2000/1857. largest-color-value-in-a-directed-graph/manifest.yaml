entry:
  id: 1857
  title: "largest-color-value-in-a-directed-graph"
  params:
    colors:
      type: string
    edges:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().largestPathValue({colors}, {edges})"
    rust: "Solution::largest_path_value({colors}, {edges})"
    python3: "Solution().largestPathValue({colors}, {edges})"
    python2: "Solution().largestPathValue({colors}, {edges})"
    ruby: "largest_path_value({colors}, {edges})"
    java: "new Solution().largestPathValue({colors}, {edges})"
    csharp: "new Solution().LargestPathValue({colors}, {edges})"
    kotlin: "Solution().largestPathValue({colors}, {edges})"
    go: "largestPathValue({colors}, {edges})"
    dart: "Solution().largestPathValue({colors}, {edges})"
    swift: "Solution().largestPathValue({colors}, {edges})"
    typescript: "largestPathValue({colors}, {edges})"

judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().largestPathValue(colors, edges, {result})"
    checker: |
      from collections import deque

      class Checker:
          def largestPathValue(self, colors, edges, result):
              n = len(colors)
              graph = [[] for _ in range(n)]
              indegree = [0] * n
              for edge in edges:
                  u, v = edge
                  graph[u].append(v)
                  indegree[v] += 1
              queue = deque(i for i in range(n) if indegree[i] == 0)
              counts = [[0] * 26 for _ in range(n)]
              processed = 0
              best = 0
              while queue:
                  u = queue.popleft()
                  processed += 1
                  color = ord(colors[u]) - 97
                  counts[u][color] += 1
                  best = max(best, max(counts[u]))
                  for v in graph[u]:
                      for c in range(26):
                          if counts[u][c] > counts[v][c]:
                              counts[v][c] = counts[u][c]
                      indegree[v] -= 1
                      if indegree[v] == 0:
                          queue.append(v)
              expected = -1 if processed != n else best
              return result == expected

seed: 1857

