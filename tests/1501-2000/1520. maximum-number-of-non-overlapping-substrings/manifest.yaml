  id: 1520
  title: "maximum-number-of-non-overlapping-substrings"
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxNumOfSubstrings({s})"
    rust: "Solution::max_num_of_substrings({s})"
    python3: "Solution().maxNumOfSubstrings({s})"
    python2: "Solution().maxNumOfSubstrings({s})"
    ruby: "max_num_of_substrings({s})"
    java: "new Solution().maxNumOfSubstrings({s})"
    csharp: "new Solution().MaxNumOfSubstrings({s})"
    kotlin: "Solution().maxNumOfSubstrings({s})"
    go: "maxNumOfSubstrings({s})"
    dart: "Solution().maxNumOfSubstrings({s})"
    swift: "Solution().maxNumOfSubstrings({s})"
    typescript: "maxNumOfSubstrings({s})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxNumOfSubstrings(s, {result})"
    checker: |
      class Checker:
          def maxNumOfSubstrings(self, s, result):
              if not isinstance(result, list) or any(not isinstance(x, str) or not x for x in result):
                  return False
              first = {}
              last = {}
              for i, ch in enumerate(s):
                  first.setdefault(ch, i)
                  last[ch] = i
              intervals = []
              for ch in first:
                  left, right = first[ch], last[ch]
                  ok = True
                  while True:
                      old_left, old_right = left, right
                      for i in range(left, right + 1):
                          if first[s[i]] < left:
                              ok = False
                              break
                          right = max(right, last[s[i]])
                      if not ok:
                          break
                      if left == old_left and right == old_right:
                          break
                  if ok:
                      intervals.append((left, right, s[left:right + 1]))
              intervals.sort(key=lambda x: (x[1], x[0]))
              expected = []
              end = -1
              for left, right, value in intervals:
                  if left > end:
                      expected.append(value)
                      end = right
              return sorted(result) == sorted(expected)

