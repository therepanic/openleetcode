entry:
  id: 1967
  title: "number-of-strings-that-appear-as-substrings-in-word"
  params:
    patterns:
      type: array
      items:
        type: string
    word:
      type: string
  call:
    cpp: "Solution().numOfStrings({patterns}, {word})"
    rust: "Solution::num_of_strings({patterns}, {word})"
    python3: "Solution().numOfStrings({patterns}, {word})"
    python2: "Solution().numOfStrings({patterns}, {word})"
    ruby: "num_of_strings({patterns}, {word})"
    java: "new Solution().numOfStrings({patterns}, {word})"
    csharp: "new Solution().NumOfStrings({patterns}, {word})"
    kotlin: "Solution().numOfStrings({patterns}, {word})"
    go: "numOfStrings({patterns}, {word})"
    dart: "Solution().numOfStrings({patterns}, {word})"
    swift: "Solution().numOfStrings({patterns}, {word})"
    typescript: "numOfStrings({patterns}, {word})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().numOfStrings(patterns, word, {result})"
    checker: |
      class Checker:
          def numOfStrings(self, patterns, word, result):
              if isinstance(result, bool) or not isinstance(result, int):
                  return False
              return result == sum(1 for pattern in patterns if pattern in word)

seed: 1967

