entry:
  id: 1524
  title: "number-of-sub-arrays-with-odd-sum"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().numOfSubarrays({arr})"
    rust: "Solution::num_of_subarrays({arr})"
    python3: "Solution().numOfSubarrays({arr})"
    python2: "Solution().numOfSubarrays({arr})"
    ruby: "num_of_subarrays({arr})"
    java: "new Solution().numOfSubarrays({arr})"
    csharp: "new Solution().NumOfSubarrays({arr})"
    kotlin: "Solution().numOfSubarrays({arr})"
    go: "numOfSubarrays({arr})"
    dart: "Solution().numOfSubarrays({arr})"
    swift: "Solution().numOfSubarrays({arr})"
    typescript: "numOfSubarrays({arr})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().numOfSubarrays(arr, {result})"
    checker: |
      class Checker:
          def numOfSubarrays(self, arr, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              odd_prefixes = 0
              parity = 0
              for value in arr:
                  parity ^= value & 1
                  if parity:
                      odd_prefixes += 1
              expected = odd_prefixes * (len(arr) - odd_prefixes + 1) % 1000000007
              return result == expected

seed: 1524

