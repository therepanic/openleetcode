entry:
  id: 1938
  title: maximum-genetic-difference-query
  params:
    parents:
      type: array
      items:
        type: int
    queries:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().maxGeneticDifference({parents}, {queries})"
    rust: "Solution::max_genetic_difference({parents}, {queries})"
    python3: "Solution().maxGeneticDifference({parents}, {queries})"
    python2: "Solution().maxGeneticDifference({parents}, {queries})"
    ruby: "max_genetic_difference({parents}, {queries})"
    java: "new Solution().maxGeneticDifference({parents}, {queries})"
    csharp: "new Solution().MaxGeneticDifference({parents}, {queries})"
    kotlin: "Solution().maxGeneticDifference({parents}, {queries})"
    go: "maxGeneticDifference({parents}, {queries})"
    dart: "Solution().maxGeneticDifference({parents}, {queries})"
    swift: "Solution().maxGeneticDifference({parents}, {queries})"
    typescript: "maxGeneticDifference({parents}, {queries})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(parents, queries, {result})"
    checker: |
      class Checker:
          def check(self, parents, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              for i, q in enumerate(queries):
                  if not isinstance(q, list) or len(q) != 2:
                      return False
                  node, value = q
                  if not isinstance(node, int) or not isinstance(value, int):
                      return False
                  best = -1
                  seen = set()
                  while node != -1 and node not in seen:
                      seen.add(node)
                      best = max(best, value ^ node)
                      if node < 0 or node >= len(parents):
                          return False
                      node = parents[node]
                  if node != -1 or result[i] != best:
                      return False
              return True

seed: 1938

