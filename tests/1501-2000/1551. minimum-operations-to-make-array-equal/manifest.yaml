judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minOperations(n, {result})"
    checker: |
      class Checker:
          def minOperations(self, n, result):
              return isinstance(result, int) and not isinstance(result, bool) and result == (n * n) // 4

