entry:
  id: 1785
  title: "minimum-elements-to-add-to-form-a-given-sum"
  params:
    nums:
      type: array
      items:
        type: int
    limit:
      type: int
    goal:
      type: int
  call:
    cpp: "Solution().minElements({nums}, {limit}, {goal})"
    rust: "Solution::min_elements({nums}, {limit}, {goal})"
    python3: "Solution().minElements({nums}, {limit}, {goal})"
    python2: "Solution().minElements({nums}, {limit}, {goal})"
    ruby: "min_elements({nums}, {limit}, {goal})"
    java: "new Solution().minElements({nums}, {limit}, {goal})"
    csharp: "new Solution().MinElements({nums}, {limit}, {goal})"
    kotlin: "Solution().minElements({nums}, {limit}, {goal})"
    go: "minElements({nums}, {limit}, {goal})"
    dart: "Solution().minElements({nums}, {limit}, {goal})"
    swift: "Solution().minElements({nums}, {limit}, {goal})"
    typescript: "minElements({nums}, {limit}, {goal})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(nums, limit, goal, {result})"
    checker: |
      class Checker:
          def check(self, nums, limit, goal, result):
              expected = (abs(goal - sum(nums)) + limit - 1) // limit
              return result == expected

seed: 1785

tests:
  - name: "example-negative-goal"
