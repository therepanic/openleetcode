entry:
  id: 1540
  title: "can-convert-string-in-k-moves"
  params:
    s:
      type: string
    t:
      type: string
    k:
      type: int
  call:
    cpp: "Solution().canConvertString({s}, {t}, {k})"
    rust: "Solution::can_convert_string({s}, {t}, {k})"
    python3: "Solution().canConvertString({s}, {t}, {k})"
    python2: "Solution().canConvertString({s}, {t}, {k})"
    ruby: "can_convert_string({s}, {t}, {k})"
    java: "new Solution().canConvertString({s}, {t}, {k})"
    csharp: "new Solution().CanConvertString({s}, {t}, {k})"
    kotlin: "Solution().canConvertString({s}, {t}, {k})"
    go: "canConvertString({s}, {t}, {k})"
    dart: "Solution().canConvertString({s}, {t}, {k})"
    swift: "Solution().canConvertString({s}, {t}, {k})"
    typescript: "canConvertString({s}, {t}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().canConvertString(s, t, k, {result})"
    checker: |
      class Checker:
          def canConvertString(self, s, t, k, result):
              if not isinstance(result, bool):
                  return False
              if len(s) != len(t):
                  return result is False
              used = {}
              for a, b in zip(s, t):
                  diff = (ord(b) - ord(a)) % 26
                  if diff == 0:
                      continue
                  used[diff] = used.get(diff, 0) + 1
                  if diff + 26 * (used[diff] - 1) > k:
                      return result is False
              return result is True

seed: 1540

