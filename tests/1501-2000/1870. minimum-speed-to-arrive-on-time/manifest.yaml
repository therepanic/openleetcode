entry:
  id: 1870
  title: "minimum-speed-to-arrive-on-time"
  params:
    dist:
      type: array
      items:
        type: int
    hour:
      type: double
  call:
    cpp: "Solution().minSpeedOnTime({dist}, {hour})"
    rust: "Solution::min_speed_on_time({dist}, {hour})"
    python3: "Solution().minSpeedOnTime({dist}, {hour})"
    python2: "Solution().minSpeedOnTime({dist}, {hour})"
    ruby: "min_speed_on_time({dist}, {hour})"
    java: "new Solution().minSpeedOnTime({dist}, {hour})"
    csharp: "new Solution().MinSpeedOnTime({dist}, {hour})"
    kotlin: "Solution().minSpeedOnTime({dist}, {hour})"
    go: "minSpeedOnTime({dist}, {hour})"
    dart: "Solution().minSpeedOnTime({dist}, {hour})"
    swift: "Solution().minSpeedOnTime({dist}, {hour})"
    typescript: "minSpeedOnTime({dist}, {hour})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().minSpeedOnTime(dist, hour, {result})"
    checker: |
      class Checker:
          def minSpeedOnTime(self, dist, hour, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              h100 = int(round(float(hour) * 100.0))
              def ok(speed):
                  whole = sum((d + speed - 1) // speed for d in dist[:-1])
                  return whole * 100 * speed + dist[-1] * 100 <= h100 * speed
              expected = -1
              if dist:
                  lo, hi = 1, 10000000
                  while lo <= hi:
                      mid = (lo + hi) // 2
                      if ok(mid):
                          expected = mid
                          hi = mid - 1
                      else:
                          lo = mid + 1
              return result == expected
seed: 1870
