entry:
  id: 1595
  title: "minimum-cost-to-connect-two-groups-of-points"
  params:
    cost:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().connectTwoGroups({cost})"
    rust: "Solution::connect_two_groups({cost})"
    python3: "Solution().connectTwoGroups({cost})"
    python2: "Solution().connectTwoGroups({cost})"
    ruby: "connect_two_groups({cost})"
    java: "new Solution().connectTwoGroups({cost})"
    csharp: "new Solution().ConnectTwoGroups({cost})"
    kotlin: "Solution().connectTwoGroups({cost})"
    go: "connectTwoGroups({cost})"
    dart: "Solution().connectTwoGroups({cost})"
    swift: "Solution().connectTwoGroups({cost})"
    typescript: "connectTwoGroups({cost})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().connectTwoGroups(cost, {result})"
    checker: |
      class Checker:
          def connectTwoGroups(self, cost, result):
              if not isinstance(cost, list) or not cost or not isinstance(cost[0], list):
                  return False
              m, n = len(cost), len(cost[0])
              if not (1 <= n <= m <= 12):
                  return False
              if any(not isinstance(row, list) or len(row) != n for row in cost):
                  return False
              if any(any(not isinstance(x, int) or x < 0 or x > 100 for x in row) for row in cost):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best_col = [min(cost[i][j] for i in range(m)) for j in range(n)]
              inf = 10**18
              dp = [inf] * (1 << n)
              dp[0] = 0
              for row in cost:
                  nxt = [inf] * (1 << n)
                  for mask, value in enumerate(dp):
                      if value == inf:
                          continue
                      for j, price in enumerate(row):
                          new_mask = mask | (1 << j)
                          candidate = value + price
                          if candidate < nxt[new_mask]:
                              nxt[new_mask] = candidate
                  dp = nxt
              expected = min(dp[mask] + sum(best_col[j] for j in range(n) if not (mask & (1 << j))) for mask in range(1 << n))
              return result == expected

