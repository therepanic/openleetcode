    swift: "Solution().firstDayBeenInAllRooms({nextVisit})"
    typescript: "firstDayBeenInAllRooms({nextVisit})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().firstDayBeenInAllRooms(nextVisit, {result})"
    checker: |
      class Checker:
          def firstDayBeenInAllRooms(self, nextVisit, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              dp = [0] * len(nextVisit)
              for i in range(1, len(nextVisit)):
                  dp[i] = (2 * dp[i - 1] - dp[nextVisit[i - 1]] + 2) % mod
              return result == dp[-1]

seed: 1997

