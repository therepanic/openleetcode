  title: "first-day-where-you-have-been-in-all-the-rooms"
  params:
    nextVisit:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().firstDayBeenInAllRooms({nextVisit})"
    rust: "Solution::first_day_been_in_all_rooms({nextVisit})"
    python3: "Solution().firstDayBeenInAllRooms({nextVisit})"
    python2: "Solution().firstDayBeenInAllRooms({nextVisit})"
