entry:
  id: 1749
  title: "maximum-absolute-sum-of-any-subarray"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxAbsoluteSum({nums})"
    rust: "Solution::max_absolute_sum({nums})"
    python3: "Solution().maxAbsoluteSum({nums})"
    python2: "Solution().maxAbsoluteSum({nums})"
    ruby: "max_absolute_sum({nums})"
    java: "new Solution().maxAbsoluteSum({nums})"
    csharp: "new Solution().MaxAbsoluteSum({nums})"
    kotlin: "Solution().maxAbsoluteSum({nums})"
    go: "maxAbsoluteSum({nums})"
    dart: "Solution().maxAbsoluteSum({nums})"
    swift: "Solution().maxAbsoluteSum({nums})"
    typescript: "maxAbsoluteSum({nums})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(nums, {result})"
    checker: |
      class Checker:
          def check(self, nums, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              prefix = 0
              low = 0
              high = 0
              expected = 0
              for value in nums:
                  prefix += value
                  expected = max(expected, prefix - low, high - prefix)
                  low = min(low, prefix)
                  high = max(high, prefix)
              return result == expected

seed: 1749

