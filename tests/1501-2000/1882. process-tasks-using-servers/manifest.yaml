entry:
  id: 1882
  title: "process-tasks-using-servers"
  params:
    servers:
      type: array
      items:
        type: int
    tasks:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().assignTasks({servers}, {tasks})"
    rust: "Solution::assign_tasks({servers}, {tasks})"
    python3: "Solution().assignTasks({servers}, {tasks})"
    python2: "Solution().assignTasks({servers}, {tasks})"
    ruby: "assign_tasks({servers}, {tasks})"
    java: "new Solution().assignTasks({servers}, {tasks})"
    csharp: "new Solution().AssignTasks({servers}, {tasks})"
    kotlin: "Solution().assignTasks({servers}, {tasks})"
    go: "assignTasks({servers}, {tasks})"
    dart: "Solution().assignTasks({servers}, {tasks})"
    swift: "Solution().assignTasks({servers}, {tasks})"
    typescript: "assignTasks({servers}, {tasks})"
judge:
  type: "exact"
limits:
  time_ms: 3000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().assignTasks(servers, tasks, {result})"
    checker: |
      import heapq
      class Checker:
          def assignTasks(self, servers, tasks, result):
              if not isinstance(result, list) or len(result) != len(tasks):
                  return False
              available = [(w, i) for i, w in enumerate(servers)]
              heapq.heapify(available)
              busy = []
              expected = []
              time = 0
              for j, duration in enumerate(tasks):
                  time = max(time, j)
                  while busy and busy[0][0] <= time:
                      finish, weight, index = heapq.heappop(busy)
                      heapq.heappush(available, (weight, index))
                  if not available:
                      time = busy[0][0]
                      while busy and busy[0][0] <= time:
                          finish, weight, index = heapq.heappop(busy)
                          heapq.heappush(available, (weight, index))
                  weight, index = heapq.heappop(available)
                  heapq.heappush(busy, (time + duration, weight, index))
                  expected.append(index)
              return result == expected
seed: 1882
