    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().numberOfGoodSubsets({nums})"
    rust: "Solution::number_of_good_subsets({nums})"
    python3: "Solution().numberOfGoodSubsets({nums})"
    python2: "Solution().numberOfGoodSubsets({nums})"
    ruby: "number_of_good_subsets({nums})"
    java: "new Solution().numberOfGoodSubsets({nums})"
    csharp: "new Solution().NumberOfGoodSubsets({nums})"
    kotlin: "Solution().numberOfGoodSubsets({nums})"
    go: "numberOfGoodSubsets({nums})"
    dart: "Solution().numberOfGoodSubsets({nums})"
    swift: "Solution().numberOfGoodSubsets({nums})"
