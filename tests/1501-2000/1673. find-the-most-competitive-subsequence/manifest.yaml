entry:
  id: 1673
  title: "find-the-most-competitive-subsequence"
  params:
    nums:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().mostCompetitive({nums}, {k})"
    rust: "Solution::most_competitive({nums}, {k})"
    python3: "Solution().mostCompetitive({nums}, {k})"
    python2: "Solution().mostCompetitive({nums}, {k})"
    ruby: "most_competitive({nums}, {k})"
    java: "new Solution().mostCompetitive({nums}, {k})"
    csharp: "new Solution().MostCompetitive({nums}, {k})"
    kotlin: "Solution().mostCompetitive({nums}, {k})"
    go: "mostCompetitive({nums}, {k})"
    dart: "Solution().mostCompetitive({nums}, {k})"
    swift: "Solution().mostCompetitive({nums}, {k})"
    typescript: "mostCompetitive({nums}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().mostCompetitive(nums, k, {result})"
    checker: |
      class Checker:
          def mostCompetitive(self, nums, k, result):
              if not isinstance(result, list) or len(result) != k:
                  return False
              stack = []
              n = len(nums)
              for i, value in enumerate(nums):
                  while stack and stack[-1] > value and n - i - 1 >= k - len(stack):
                      stack.pop()
                  stack.append(value)
              return result == stack[:k]

seed: 1673

