entry:
  id: 1605
  title: "find-valid-matrix-given-row-and-column-sums"
  params:
    rowSum:
      type: array
      items:
        type: int
    colSum:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().restoreMatrix({rowSum}, {colSum})"
    rust: "Solution::restore_matrix({rowSum}, {colSum})"
    python3: "Solution().restoreMatrix({rowSum}, {colSum})"
    python2: "Solution().restoreMatrix({rowSum}, {colSum})"
    ruby: "restore_matrix({rowSum}, {colSum})"
    java: "new Solution().restoreMatrix({rowSum}, {colSum})"
    csharp: "new Solution().RestoreMatrix({rowSum}, {colSum})"
    kotlin: "Solution().restoreMatrix({rowSum}, {colSum})"
    go: "restoreMatrix({rowSum}, {colSum})"
    dart: "Solution().restoreMatrix({rowSum}, {colSum})"
    swift: "Solution().restoreMatrix({rowSum}, {colSum})"
    typescript: "restoreMatrix({rowSum}, {colSum})"

judge:
  type: exact

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().restoreMatrix(rowSum, colSum, {result})"
    checker: |
      class Checker:
          def restoreMatrix(self, rowSum, colSum, result):
              if not isinstance(result, list) or len(result) != len(rowSum):
                  return False
              n = len(colSum)
              col_totals = [0] * n
              for i, row in enumerate(result):
                  if not isinstance(row, list) or len(row) != n:
                      return False
                  total = 0
                  for j, value in enumerate(row):
                      if not isinstance(value, int) or isinstance(value, bool) or value < 0:
                          return False
                      total += value
                      col_totals[j] += value
                  if total != rowSum[i]:
                      return False
              return col_totals == colSum

seed: 1605

