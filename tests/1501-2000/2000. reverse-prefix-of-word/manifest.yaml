entry:
  id: 2000
  title: "reverse-prefix-of-word"
  params:
    word:
      type: string
    ch:
      type: char
  call:
    cpp: "Solution().reversePrefix({word}, {ch})"
    rust: "Solution::reverse_prefix({word}, {ch})"
    python3: "Solution().reversePrefix({word}, {ch})"
    python2: "Solution().reversePrefix({word}, {ch})"
    ruby: "reverse_prefix({word}, {ch})"
    java: "new Solution().reversePrefix({word}, {ch})"
    csharp: "new Solution().ReversePrefix({word}, {ch})"
    kotlin: "Solution().reversePrefix({word}, {ch})"
    go: "reversePrefix({word}, {ch})"
    dart: "Solution().reversePrefix({word}, {ch})"
    swift: "Solution().reversePrefix({word}, {ch})"
    typescript: "reversePrefix({word}, {ch})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().reversePrefix(word, ch, {result})"
    checker: |
      class Checker:
          def reversePrefix(self, word, ch, result):
              if not isinstance(word, str) or not isinstance(ch, str) or len(ch) != 1:
                  return False
              if not isinstance(result, str):
                  return False
              pos = word.find(ch)
              expected = word if pos < 0 else word[:pos + 1][::-1] + word[pos + 1:]
              return result == expected

seed: 2000

