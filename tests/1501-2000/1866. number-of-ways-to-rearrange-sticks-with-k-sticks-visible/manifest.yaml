entry:
  id: 1866
  title: "number-of-ways-to-rearrange-sticks-with-k-sticks-visible"
  params:
    n:
      type: int
    k:
      type: int
  call:
    cpp: "Solution().rearrangeSticks({n}, {k})"
    rust: "Solution::rearrange_sticks({n}, {k})"
    python3: "Solution().rearrangeSticks({n}, {k})"
    python2: "Solution().rearrangeSticks({n}, {k})"
    ruby: "rearrange_sticks({n}, {k})"
    java: "new Solution().rearrangeSticks({n}, {k})"
    csharp: "new Solution().RearrangeSticks({n}, {k})"
    kotlin: "Solution().rearrangeSticks({n}, {k})"
    go: "rearrangeSticks({n}, {k})"
    dart: "Solution().rearrangeSticks({n}, {k})"
    swift: "Solution().rearrangeSticks({n}, {k})"
    typescript: "rearrangeSticks({n}, {k})"
judge:
  type: "exact"
limits:
  time_ms: 5000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().rearrangeSticks(n, k, {result})"
    checker: |
      class Checker:
          def rearrangeSticks(self, n, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              dp = [0] * (k + 1)
              dp[0] = 1
              for length in range(1, n + 1):
                  nxt = [0] * (k + 1)
                  for visible in range(1, min(length, k) + 1):
                      nxt[visible] = (dp[visible - 1] + (length - 1) * dp[visible]) % mod
                  dp = nxt
              return result == dp[k]
seed: 1866
