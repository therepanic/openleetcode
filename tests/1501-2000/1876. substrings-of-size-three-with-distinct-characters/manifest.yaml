entry:
  id: 1876
  title: "substrings-of-size-three-with-distinct-characters"
  params:
    s:
      type: string
  call:
    cpp: "Solution().countGoodSubstrings({s})"
    rust: "Solution::count_good_substrings({s})"
    python3: "Solution().countGoodSubstrings({s})"
    python2: "Solution().countGoodSubstrings({s})"
    ruby: "count_good_substrings({s})"
    java: "new Solution().countGoodSubstrings({s})"
    csharp: "new Solution().CountGoodSubstrings({s})"
    kotlin: "Solution().countGoodSubstrings({s})"
    go: "countGoodSubstrings({s})"
    dart: "Solution().countGoodSubstrings({s})"
    swift: "Solution().countGoodSubstrings({s})"
    typescript: "countGoodSubstrings({s})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().countGoodSubstrings(s, {result})"
    checker: |
      class Checker:
          def countGoodSubstrings(self, s, result):
              if not isinstance(s, str) or not isinstance(result, int) or isinstance(result, bool):
                  return False
              expected = sum(len(set(s[i:i + 3])) == 3 for i in range(max(0, len(s) - 2)))
              return result == expected

seed: 1876

