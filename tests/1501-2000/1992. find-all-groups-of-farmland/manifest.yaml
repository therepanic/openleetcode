entry:
  id: 1992
  title: "find-all-groups-of-farmland"
  params:
    land:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findFarmland({land})"
    rust: "Solution::find_farmland({land})"
    python3: "Solution().findFarmland({land})"
    python2: "Solution().findFarmland({land})"
    ruby: "find_farmland({land})"
    java: "new Solution().findFarmland({land})"
    csharp: "new Solution().FindFarmland({land})"
    kotlin: "Solution().findFarmland({land})"
    go: "findFarmland({land})"
    dart: "Solution().findFarmland({land})"
    swift: "Solution().findFarmland({land})"
    typescript: "findFarmland({land})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().findFarmland(land, {result})"
    checker: |
      class Checker:
          def findFarmland(self, land, result):
              if not isinstance(result, list):
                  return False
              rows = len(land)
              cols = len(land[0])
              seen = [[False] * cols for _ in range(rows)]
              expected = []
              for r in range(rows):
                  for c in range(cols):
                      if land[r][c] == 1 and not seen[r][c]:
                          stack = [(r, c)]
                          seen[r][c] = True
                          cells = []
                          while stack:
                              x, y = stack.pop()
                              cells.append((x, y))
                              for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                                  nx, ny = x + dx, y + dy
                                  if 0 <= nx < rows and 0 <= ny < cols and land[nx][ny] == 1 and not seen[nx][ny]:
                                      seen[nx][ny] = True
                                      stack.append((nx, ny))
                          top = min(x for x, y in cells)
                          left = min(y for x, y in cells)
                          bottom = max(x for x, y in cells)
                          right = max(y for x, y in cells)
                          expected.append((top, left, bottom, right))
              actual = []
              for item in result:
                  if not isinstance(item, list) or len(item) != 4 or not all(isinstance(x, int) and not isinstance(x, bool) for x in item):
                      return False
                  r1, c1, r2, c2 = item
                  if not (0 <= r1 <= r2 < rows and 0 <= c1 <= c2 < cols):
                      return False
                  for r in range(r1, r2 + 1):
                      for c in range(c1, c2 + 1):
                          if land[r][c] != 1:
                              return False
                  actual.append(tuple(item))
              return sorted(actual) == sorted(expected)

seed: 1992

