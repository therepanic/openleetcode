entry:
  id: 1764
  title: "form-array-by-concatenating-subarrays-of-another-array"
  params:
    groups:
      type: array
      items:
        type: array
        items:
          type: int
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().canChoose({groups}, {nums})"
    rust: "Solution::can_choose({groups}, {nums})"
    python3: "Solution().canChoose({groups}, {nums})"
    python2: "Solution().canChoose({groups}, {nums})"
    ruby: "can_choose({groups}, {nums})"
    java: "new Solution().canChoose({groups}, {nums})"
    csharp: "new Solution().CanChoose({groups}, {nums})"
    kotlin: "Solution().canChoose({groups}, {nums})"
    go: "canChoose({groups}, {nums})"
    dart: "Solution().canChoose({groups}, {nums})"
    swift: "Solution().canChoose({groups}, {nums})"
    typescript: "canChoose({groups}, {nums})"

judge:
  type: exact

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().canChoose(groups, nums, {result})"
    checker: |
      class Checker:
          def canChoose(self, groups, nums, result):
              i = 0
              expected = True
              for group in groups:
                  found = False
                  while i + len(group) <= len(nums):
                      if nums[i:i + len(group)] == group:
                          i += len(group)
                          found = True
                          break
                      i += 1
                  if not found:
                      expected = False
                      break
              return isinstance(result, bool) and result == expected

seed: 1764

tests:
