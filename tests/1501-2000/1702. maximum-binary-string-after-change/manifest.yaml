entry:
  id: 1702
  title: "maximum-binary-string-after-change"
  params:
    binary:
      type: string
  call:
    cpp: "Solution().maximumBinaryString({binary})"
    rust: "Solution::maximum_binary_string({binary})"
    python3: "Solution().maximumBinaryString({binary})"
    python2: "Solution().maximumBinaryString({binary})"
    ruby: "maximum_binary_string({binary})"
    java: "new Solution().maximumBinaryString({binary})"
    csharp: "new Solution().MaximumBinaryString({binary})"
    kotlin: "Solution().maximumBinaryString({binary})"
    go: "maximumBinaryString({binary})"
    dart: "Solution().maximumBinaryString({binary})"
    swift: "Solution().maximumBinaryString({binary})"
    typescript: "maximumBinaryString({binary})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maximumBinaryString(binary, {result})"
    checker: |
      class Checker:
          def maximumBinaryString(self, binary, result):
              if not isinstance(binary, str) or not isinstance(result, str):
                  return False
              if any(c not in '01' for c in binary) or len(result) != len(binary):
                  return False
              zeros = binary.count('0')
              if zeros < 2:
                  expected = binary
              else:
                  p = binary.find('0') + zeros - 1
                  expected = '1' * p + '0' + '1' * (len(binary) - p - 1)
              return result == expected

seed: 1702

