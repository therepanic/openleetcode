entry:
  id: 1768
  title: "merge-strings-alternately"
  params:
    word1:
      type: string
    word2:
      type: string
  call:
    cpp: "Solution().mergeAlternately({word1}, {word2})"
    rust: "Solution::merge_alternately({word1}, {word2})"
    python3: "Solution().mergeAlternately({word1}, {word2})"
    python2: "Solution().mergeAlternately({word1}, {word2})"
    ruby: "merge_alternately({word1}, {word2})"
    java: "new Solution().mergeAlternately({word1}, {word2})"
    csharp: "new Solution().MergeAlternately({word1}, {word2})"
    kotlin: "Solution().mergeAlternately({word1}, {word2})"
    go: "mergeAlternately({word1}, {word2})"
    dart: "Solution().mergeAlternately({word1}, {word2})"
    swift: "Solution().mergeAlternately({word1}, {word2})"
    typescript: "mergeAlternately({word1}, {word2})"
judge:
  type: "exact"
limits:
  time_ms: 1000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().mergeAlternately(word1, word2, {result})"
    checker: |
      class Checker:
        def mergeAlternately(self, word1, word2, result):
          expected = []
          for i in range(max(len(word1), len(word2))):
            if i < len(word1):
              expected.append(word1[i])
            if i < len(word2):
              expected.append(word2[i])
          return result == "".join(expected)
seed: 1768
