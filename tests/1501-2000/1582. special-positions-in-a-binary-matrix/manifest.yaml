entry:
  id: 1582
  title: "special-positions-in-a-binary-matrix"
  params:
    mat:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().numSpecial({mat})"
    rust: "Solution::num_special({mat})"
    python3: "Solution().numSpecial({mat})"
    python2: "Solution().numSpecial({mat})"
    ruby: "num_special({mat})"
    java: "new Solution().numSpecial({mat})"
    csharp: "new Solution().NumSpecial({mat})"
    kotlin: "Solution().numSpecial({mat})"
    go: "numSpecial({mat})"
    dart: "Solution().numSpecial({mat})"
    swift: "Solution().numSpecial({mat})"
    typescript: "numSpecial({mat})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().numSpecial(mat, {result})"
    checker: |
      class Checker:
          def numSpecial(self, mat, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              rows = [sum(row) for row in mat]
              cols = [sum(mat[i][j] for i in range(len(mat))) for j in range(len(mat[0]))]
              expected = sum(
                  mat[i][j] == 1 and rows[i] == 1 and cols[j] == 1
                  for i in range(len(mat))
                  for j in range(len(mat[0]))
              )
              return result == expected
seed: 1582
