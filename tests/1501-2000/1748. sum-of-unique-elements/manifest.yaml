entry:
  id: 1748
  title: "sum-of-unique-elements"
  params:
    nums:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().sumOfUnique({nums})"
    rust: "Solution::sum_of_unique({nums})"
    python3: "Solution().sumOfUnique({nums})"
    python2: "Solution().sumOfUnique({nums})"
    ruby: "sum_of_unique({nums})"
    java: "new Solution().sumOfUnique({nums})"
    csharp: "new Solution().SumOfUnique({nums})"
    kotlin: "Solution().sumOfUnique({nums})"
    go: "sumOfUnique({nums})"
    dart: "Solution().sumOfUnique({nums})"
    swift: "Solution().sumOfUnique({nums})"
    typescript: "sumOfUnique({nums})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().sumOfUnique(nums, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def sumOfUnique(self, nums, result):
              counts = Counter(nums)
              expected = sum(value for value in nums if counts[value] == 1)
              return result == expected
seed: 1748
