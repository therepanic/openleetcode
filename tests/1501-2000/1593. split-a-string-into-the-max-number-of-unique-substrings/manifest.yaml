entry:
  id: 1593
  title: "split-a-string-into-the-max-number-of-unique-substrings"
  params:
    s:
      type: string
  call:
    cpp: "Solution().maxUniqueSplit({s})"
    rust: "Solution::max_unique_split({s})"
    python3: "Solution().maxUniqueSplit({s})"
    python2: "Solution().maxUniqueSplit({s})"
    ruby: "max_unique_split({s})"
    java: "new Solution().maxUniqueSplit({s})"
    csharp: "new Solution().MaxUniqueSplit({s})"
    kotlin: "Solution().maxUniqueSplit({s})"
    go: "maxUniqueSplit({s})"
    dart: "Solution().maxUniqueSplit({s})"
    swift: "Solution().maxUniqueSplit({s})"
    typescript: "maxUniqueSplit({s})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().maxUniqueSplit(s, {result})"
    checker: |
      class Checker:
          def maxUniqueSplit(self, s, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              used = set()

              def dfs(pos):
                  nonlocal best
                  if pos == len(s):
                      best = max(best, len(used))
                      return
                  if len(used) + len(s) - pos <= best:
                      return
                  for end in range(pos + 1, len(s) + 1):
                      part = s[pos:end]
                      if part not in used:
                          used.add(part)
                          dfs(end)
                          used.remove(part)

              dfs(0)
              return result == best

seed: 1593

