entry:
  id: 1575
  title: "count-all-possible-routes"
  params:
    locations:
      type: array
      items:
        type: int
    startCity:
      type: int
    finish:
      type: int
    fuel:
      type: int
  call:
    cpp: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    rust: "Solution::count_routes({locations}, {startCity}, {finish}, {fuel})"
    python3: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    python2: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    ruby: "count_routes({locations}, {startCity}, {finish}, {fuel})"
    java: "new Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    csharp: "new Solution().CountRoutes({locations}, {startCity}, {finish}, {fuel})"
    kotlin: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    go: "countRoutes({locations}, {startCity}, {finish}, {fuel})"
    dart: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    swift: "Solution().countRoutes({locations}, {startCity}, {finish}, {fuel})"
    typescript: "countRoutes({locations}, {startCity}, {finish}, {fuel})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().countRoutes(locations, startCity, finish, fuel, {result})"
    checker: |
      class Checker:
          def countRoutes(self, locations, start, finish, fuel, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              mod = 1000000007
              memo = {}
              def dp(city, left):
                  key = (city, left)
                  if key in memo:
                      return memo[key]
                  total = 1 if city == finish else 0
                  for nxt, pos in enumerate(locations):
                      cost = abs(pos - locations[city])
                      if nxt != city and cost <= left:
                          total = (total + dp(nxt, left - cost)) % mod
                  memo[key] = total
                  return total
              return result == dp(start, fuel)

seed: 1575

