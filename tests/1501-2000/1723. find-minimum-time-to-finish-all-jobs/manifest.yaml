entry:
  id: 1723
  title: "find-minimum-time-to-finish-all-jobs"
  params:
    jobs:
      type: array
      items:
        type: int
    k:
      type: int
  call:
    cpp: "Solution().minimumTimeRequired({jobs}, {k})"
    rust: "Solution::minimum_time_required({jobs}, {k})"
    python3: "Solution().minimumTimeRequired({jobs}, {k})"
    python2: "Solution().minimumTimeRequired({jobs}, {k})"
    ruby: "minimum_time_required({jobs}, {k})"
    java: "new Solution().minimumTimeRequired({jobs}, {k})"
    csharp: "new Solution().MinimumTimeRequired({jobs}, {k})"
    kotlin: "Solution().minimumTimeRequired({jobs}, {k})"
    go: "minimumTimeRequired({jobs}, {k})"
    dart: "Solution().minimumTimeRequired({jobs}, {k})"
    swift: "Solution().minimumTimeRequired({jobs}, {k})"
    typescript: "minimumTimeRequired({jobs}, {k})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minimumTimeRequired(jobs, k, {result})"
    checker: |
      class Checker:
          def minimumTimeRequired(self, jobs, k, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              jobs = sorted(jobs, reverse=True)
              lo, hi = max(jobs), sum(jobs)
              def feasible(limit):
                  loads = [0] * k
                  def dfs(i):
                      if i == len(jobs):
                          return True
                      seen = set()
                      job = jobs[i]
                      for w in range(k):
                          if loads[w] in seen:
                              continue
                          seen.add(loads[w])
                          if loads[w] + job <= limit:
                              loads[w] += job
                              if dfs(i + 1):
                                  return True
                              loads[w] -= job
                          if loads[w] == 0:
                              break
                      return False
                  return dfs(0)
              while lo < hi:
                  mid = (lo + hi) // 2
                  if feasible(mid):
                      hi = mid
                  else:
                      lo = mid + 1
              return result == lo

