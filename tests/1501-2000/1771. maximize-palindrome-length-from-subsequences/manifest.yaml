entry:
  id: 1771
  title: "maximize-palindrome-length-from-subsequences"
  params:
    word1:
      type: string
    word2:
      type: string
  call:
    cpp: "Solution().longestPalindrome({word1}, {word2})"
    rust: "Solution::longest_palindrome({word1}, {word2})"
    python3: "Solution().longestPalindrome({word1}, {word2})"
    python2: "Solution().longestPalindrome({word1}, {word2})"
    ruby: "longest_palindrome({word1}, {word2})"
    java: "new Solution().longestPalindrome({word1}, {word2})"
    csharp: "new Solution().LongestPalindrome({word1}, {word2})"
    kotlin: "Solution().longestPalindrome({word1}, {word2})"
    go: "longestPalindrome({word1}, {word2})"
    dart: "Solution().longestPalindrome({word1}, {word2})"
    swift: "Solution().longestPalindrome({word1}, {word2})"
    typescript: "longestPalindrome({word1}, {word2})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().longestPalindrome(word1, word2, {result})"
    checker: |
      class Checker:
          def longestPalindrome(self, word1, word2, result):
              if not isinstance(word1, str) or not isinstance(word2, str):
                  return False
              if not (1 <= len(word1) <= 1000 and 1 <= len(word2) <= 1000):
                  return False
              if any(not ('a' <= c <= 'z') for c in word1 + word2):
                  return False
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              word = word1 + word2
              n = len(word)
              dp = [[0] * n for _ in range(n)]
              best = 0
              for i in range(n - 1, -1, -1):
                  dp[i][i] = 1
                  for j in range(i + 1, n):
                      if word[i] == word[j]:
                          dp[i][j] = dp[i + 1][j - 1] + 2 if i + 1 <= j - 1 else 2
                      else:
                          dp[i][j] = max(dp[i + 1][j], dp[i][j - 1])
                      if i < len(word1) <= j:
                          best = max(best, dp[i][j])
              return result == best

seed: 1771

