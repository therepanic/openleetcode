entry:
  id: 1832
  title: "check-if-the-sentence-is-pangram"
  params:
    sentence:
      type: string
  call:
    cpp: "Solution().checkIfPangram({sentence})"
    rust: "Solution::check_if_pangram({sentence})"
    python3: "Solution().checkIfPangram({sentence})"
    python2: "Solution().checkIfPangram({sentence})"
    ruby: "check_if_pangram({sentence})"
    java: "new Solution().checkIfPangram({sentence})"
    csharp: "new Solution().CheckIfPangram({sentence})"
    kotlin: "Solution().checkIfPangram({sentence})"
    go: "checkIfPangram({sentence})"
    dart: "Solution().checkIfPangram({sentence})"
    swift: "Solution().checkIfPangram({sentence})"
    typescript: "checkIfPangram({sentence})"
judge:
  type: "exact"
limits:
  time_ms: 200
  memory_mb: 300
seed: 1832
oracle:
  python3:
    call: "Checker().checkIfPangram(sentence, {result})"
    checker: |
      class Checker:
          def checkIfPangram(self, sentence, result):
              if not isinstance(result, bool):
                  return False
              return result == (len(sentence) >= 26 and set(sentence) == set("abcdefghijklmnopqrstuvwxyz"))
tests:
  - name: "example_full"
    in:
      sentence: "thequickbrownfoxjumpsoverthelazydog"
    out: true
  - name: "example_short"
