entry:
  id: 1851
  title: "minimum-interval-to-include-each-query"
  params:
    intervals:
      type: array
      items:
        type: array
        items:
          type: int
    queries:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minInterval({intervals}, {queries})"
    rust: "Solution::min_interval({intervals}, {queries})"
    python3: "Solution().minInterval({intervals}, {queries})"
    python2: "Solution().minInterval({intervals}, {queries})"
    ruby: "min_interval({intervals}, {queries})"
    java: "new Solution().minInterval({intervals}, {queries})"
    csharp: "new Solution().MinInterval({intervals}, {queries})"
    kotlin: "Solution().minInterval({intervals}, {queries})"
    go: "minInterval({intervals}, {queries})"
    dart: "Solution().minInterval({intervals}, {queries})"
    swift: "Solution().minInterval({intervals}, {queries})"
    typescript: "minInterval({intervals}, {queries})"
judge:
  type: exact
limits:
  time_ms: 3000
  memory_mb: 512
oracle:
  python3:
    call: "Checker().minInterval(intervals, queries, {result})"
    checker: |
      class Checker:
          def minInterval(self, intervals, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              expected = []
              for q in queries:
                  best = None
                  for pair in intervals:
                      if not isinstance(pair, list) or len(pair) != 2:
                          return False
                      left, right = pair
                      if left <= q <= right:
                          size = right - left + 1
                          best = size if best is None else min(best, size)
                  expected.append(-1 if best is None else best)
              return result == expected
seed: 1851
tests:
