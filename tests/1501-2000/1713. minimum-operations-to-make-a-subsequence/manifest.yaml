entry:
  id: 1713
  title: "minimum-operations-to-make-a-subsequence"
  params:
    target:
      type: array
      items:
        type: int
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().minOperations({target}, {arr})"
    rust: "Solution::min_operations({target}, {arr})"
    python3: "Solution().minOperations({target}, {arr})"
    python2: "Solution().minOperations({target}, {arr})"
    ruby: "min_operations({target}, {arr})"
    java: "new Solution().minOperations({target}, {arr})"
    csharp: "new Solution().MinOperations({target}, {arr})"
    kotlin: "Solution().minOperations({target}, {arr})"
    go: "minOperations({target}, {arr})"
    dart: "Solution().minOperations({target}, {arr})"
    swift: "Solution().minOperations({target}, {arr})"
    typescript: "minOperations({target}, {arr})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(target, arr, {result})"
    checker: |
      from bisect import bisect_left
      class Checker:
          def check(self, target, arr, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              pos = {value: i for i, value in enumerate(target)}
              lis = []
              for value in arr:
                  if value in pos:
                      x = pos[value]
                      i = bisect_left(lis, x)
                      if i == len(lis):
                          lis.append(x)
                      else:
                          lis[i] = x
              return result == len(target) - len(lis)

seed: 1713

