entry:
  id: 1674
  title: "minimum-moves-to-make-array-complementary"
  params:
    nums:
      type: array
      items:
        type: int
    limit:
      type: int
  call:
    cpp: "Solution().minMoves({nums}, {limit})"
    rust: "Solution::min_moves({nums}, {limit})"
    python3: "Solution().minMoves({nums}, {limit})"
    python2: "Solution().minMoves({nums}, {limit})"
    ruby: "min_moves({nums}, {limit})"
    java: "new Solution().minMoves({nums}, {limit})"
    csharp: "new Solution().MinMoves({nums}, {limit})"
    kotlin: "Solution().minMoves({nums}, {limit})"
    go: "minMoves({nums}, {limit})"
    dart: "Solution().minMoves({nums}, {limit})"
    swift: "Solution().minMoves({nums}, {limit})"
    typescript: "minMoves({nums}, {limit})"

judge:
  type: "exact"

limits:
  time_ms: 3000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().minMoves(nums, limit, {result})"
    checker: |
      class Checker:
          def minMoves(self, nums, limit, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              diff = [0] * (2 * limit + 2)
              for i in range(len(nums) // 2):
                  a = nums[i]
                  b = nums[-1 - i]
                  diff[2] += 2
                  diff[2 * limit + 1] -= 2
                  diff[min(a, b) + 1] -= 1
                  diff[max(a, b) + limit + 1] += 1
                  diff[a + b] -= 1
                  diff[a + b + 1] += 1
              cur = 0
              expected = len(nums)
              for s in range(2, 2 * limit + 1):
                  cur += diff[s]
                  expected = min(expected, cur)
              return result == expected

seed: 1674

