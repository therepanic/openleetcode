entry:
  id: 1880
  title: "check-if-word-equals-summation-of-two-words"
  params:
    firstWord:
      type: string
    secondWord:
      type: string
    targetWord:
      type: string
  call:
    cpp: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    rust: "Solution::is_sum_equal({firstWord}, {secondWord}, {targetWord})"
    python3: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    python2: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    ruby: "is_sum_equal({firstWord}, {secondWord}, {targetWord})"
    java: "new Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    csharp: "new Solution().IsSumEqual({firstWord}, {secondWord}, {targetWord})"
    kotlin: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    go: "isSumEqual({firstWord}, {secondWord}, {targetWord})"
    dart: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    swift: "Solution().isSumEqual({firstWord}, {secondWord}, {targetWord})"
    typescript: "isSumEqual({firstWord}, {secondWord}, {targetWord})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().isSumEqual(firstWord, secondWord, targetWord, {result})"
    checker: |
      class Checker:
          def _value(self, word):
              return int("".join(str(ord(ch) - ord("a")) for ch in word))

          def isSumEqual(self, firstWord, secondWord, targetWord, result):
              expected = (self._value(firstWord) + self._value(secondWord)
                          == self._value(targetWord))
              return result is expected

seed: 1880

