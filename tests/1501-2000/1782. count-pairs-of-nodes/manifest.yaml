    n:
      type: int
    edges:
      type: array
      items:
        type: array
        items:
          type: int
    queries:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().countPairs({n}, {edges}, {queries})"
    rust: "Solution::count_pairs({n}, {edges}, {queries})"
    python3: "Solution().countPairs({n}, {edges}, {queries})"
    python2: "Solution().countPairs({n}, {edges}, {queries})"
    ruby: "count_pairs({n}, {edges}, {queries})"
    java: "new Solution().countPairs({n}, {edges}, {queries})"
    csharp: "new Solution().CountPairs({n}, {edges}, {queries})"
    kotlin: "Solution().countPairs({n}, {edges}, {queries})"
    go: "countPairs({n}, {edges}, {queries})"
    dart: "Solution().countPairs({n}, {edges}, {queries})"
    swift: "Solution().countPairs({n}, {edges}, {queries})"
    typescript: "countPairs({n}, {edges}, {queries})"

judge:
  type: exact

limits:
  time_ms: 5000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().check(n, edges, queries, {result})"
    checker: |
      class Checker:
          def check(self, n, edges, queries, result):
              if not isinstance(result, list) or len(result) != len(queries):
                  return False
              degree = [0] * n
              shared = {}
              for edge in edges:
                  if not isinstance(edge, list) or len(edge) != 2:
                      return False
                  u, v = edge
                  if not (1 <= u <= n and 1 <= v <= n and u != v):
                      return False
                  u -= 1
                  v -= 1
                  degree[u] += 1
                  degree[v] += 1
                  if u > v:
                      u, v = v, u
                  shared[(u, v)] = shared.get((u, v), 0) + 1
              order = sorted(degree)
              expected = []
              for q in queries:
                  left, right = 0, n - 1
                  pairs = 0
                  while left < right:
                      if order[left] + order[right] <= q:
                          left += 1
                      else:
                          pairs += right - left
                          right -= 1
                  for (u, v), count in shared.items():
                      if degree[u] + degree[v] > q and degree[u] + degree[v] - count <= q:
                          pairs -= 1
                  expected.append(pairs)
              return result == expected

