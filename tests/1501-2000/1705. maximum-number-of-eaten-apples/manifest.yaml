entry:
  id: 1705
  title: "maximum-number-of-eaten-apples"
  params:
    apples:
      type: array
      items:
        type: int
    days:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().eatenApples({apples}, {days})"
    rust: "Solution::eaten_apples({apples}, {days})"
    python3: "Solution().eatenApples({apples}, {days})"
    python2: "Solution().eatenApples({apples}, {days})"
    ruby: "eaten_apples({apples}, {days})"
    java: "new Solution().eatenApples({apples}, {days})"
    csharp: "new Solution().EatenApples({apples}, {days})"
    kotlin: "Solution().eatenApples({apples}, {days})"
    go: "eatenApples({apples}, {days})"
    dart: "Solution().eatenApples({apples}, {days})"
    swift: "Solution().eatenApples({apples}, {days})"
    typescript: "eatenApples({apples}, {days})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 300

oracle:
  python3:
    call: "Checker().eatenApples(apples, days, {result})"
    checker: |
      import heapq

      class Checker:
          def eatenApples(self, apples, days, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              if not isinstance(apples, list) or not isinstance(days, list):
                  return False
              if len(apples) != len(days):
                  return False
              heap = []
              answer = 0
              day = 0
              while heap or day < len(apples):
                  if day < len(apples) and apples[day] > 0:
                      heapq.heappush(heap, (day + days[day], apples[day]))
                  while heap and heap[0][0] <= day:
                      heapq.heappop(heap)
                  if heap:
                      expire, count = heapq.heappop(heap)
                      answer += 1
                      if count > 1:
                          heapq.heappush(heap, (expire, count - 1))
                  day += 1
              return result == answer

seed: 1705

