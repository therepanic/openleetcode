entry:
  id: 1986
  title: "minimum-number-of-work-sessions-to-finish-the-tasks"
  params:
    tasks:
      type: array
      items:
        type: int
    sessionTime:
      type: int
  call:
    cpp: "Solution().minSessions({tasks}, {sessionTime})"
    rust: "Solution::min_sessions({tasks}, {sessionTime})"
    python3: "Solution().minSessions({tasks}, {sessionTime})"
    python2: "Solution().minSessions({tasks}, {sessionTime})"
    ruby: "min_sessions({tasks}, {sessionTime})"
    java: "new Solution().minSessions({tasks}, {sessionTime})"
    csharp: "new Solution().MinSessions({tasks}, {sessionTime})"
    kotlin: "Solution().minSessions({tasks}, {sessionTime})"
    go: "minSessions({tasks}, {sessionTime})"
    dart: "Solution().minSessions({tasks}, {sessionTime})"
    swift: "Solution().minSessions({tasks}, {sessionTime})"
    typescript: "minSessions({tasks}, {sessionTime})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(tasks, sessionTime, {result})"
    checker: |
      class Checker:
          def check(self, tasks, sessionTime, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              n = len(tasks)
              sums = [0] * (1 << n)
              for mask in range(1, 1 << n):
                  bit = mask & -mask
                  i = bit.bit_length() - 1
                  sums[mask] = sums[mask ^ bit] + tasks[i]
              dp = [n + 1] * (1 << n)
              dp[0] = 0
              for mask in range(1, 1 << n):
                  sub = mask
                  while sub:
                      if sums[sub] <= sessionTime:
                          rest = mask ^ sub
                          cand = dp[rest] + 1
                          if cand < dp[mask]:
                              dp[mask] = cand
                      sub = (sub - 1) & mask
              return result == dp[-1]

seed: 1986

