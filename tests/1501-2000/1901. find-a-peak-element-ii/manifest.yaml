entry:
  id: 1901
  title: "find-a-peak-element-ii"
  params:
    mat:
      type: array
      items:
        type: array
        items:
          type: int
  call:
    cpp: "Solution().findPeakGrid({mat})"
    rust: "Solution::find_peak_grid({mat})"
    python3: "Solution().findPeakGrid({mat})"
    python2: "Solution().findPeakGrid({mat})"
    ruby: "find_peak_grid({mat})"
    java: "new Solution().findPeakGrid({mat})"
    csharp: "new Solution().FindPeakGrid({mat})"
    kotlin: "Solution().findPeakGrid({mat})"
    go: "findPeakGrid({mat})"
    dart: "Solution().findPeakGrid({mat})"
    swift: "Solution().findPeakGrid({mat})"
    typescript: "findPeakGrid({mat})"

judge:
  type: "exact"

limits:
  time_ms: 500
  memory_mb: 300

oracle:
  python3:
    call: "Checker().findPeakGrid(mat, {result})"
    checker: |
      class Checker:
          def findPeakGrid(self, mat, result):
              if not isinstance(result, list) or len(result) != 2:
                  return False
              i, j = result
              if not isinstance(i, int) or not isinstance(j, int):
                  return False
              if not mat or not mat[0] or i < 0 or i >= len(mat) or j < 0 or j >= len(mat[0]):
                  return False
              value = mat[i][j]
              for di, dj in ((-1, 0), (1, 0), (0, -1), (0, 1)):
                  ni, nj = i + di, j + dj
                  if 0 <= ni < len(mat) and 0 <= nj < len(mat[0]) and value <= mat[ni][nj]:
                      return False
              return True

seed: 1901

