    python3: "Solution().deleteDuplicateFolder({paths})"
    python2: "Solution().deleteDuplicateFolder({paths})"
    ruby: "delete_duplicate_folder({paths})"
    java: "new Solution().deleteDuplicateFolder({paths})"
    csharp: "new Solution().DeleteDuplicateFolder({paths})"
    kotlin: "Solution().deleteDuplicateFolder({paths})"
