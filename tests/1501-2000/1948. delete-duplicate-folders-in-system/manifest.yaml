limits:
  time_ms: 3000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().deleteDuplicateFolder(paths, {result})"
    checker: |
      from collections import Counter

      class Checker:
          def deleteDuplicateFolder(self, paths, result):
              if not isinstance(result, list):
                  return False
              children = {}
              for path in paths:
                  if not isinstance(path, list) or not path:
                      return False
                  node = children
                  for name in path:
                      if not isinstance(name, str) or not name:
                          return False
                      node = node.setdefault(name, {})

              counts = Counter()
              signatures = {}

              def encode(node):
                  sig = tuple((name, encode(child)) for name, child in sorted(node.items()))
                  signatures[id(node)] = sig
                  if sig:
                      counts[sig] += 1
                  return sig

              encode(children)
              expected = []

              def walk(node, prefix):
                  for name, child in sorted(node.items()):
                      sig = signatures[id(child)]
                      if sig and counts[sig] >= 2:
                          continue
                      current = prefix + [name]
                      expected.append(current)
                      walk(child, current)

              walk(children, [])
              try:
                  actual = [list(path) for path in result]
              except Exception:
                  return False
              if any(not isinstance(path, list) or any(not isinstance(x, str) for x in path) for path in actual):
                  return False
              return sorted(actual) == sorted(expected)

seed: 1948

