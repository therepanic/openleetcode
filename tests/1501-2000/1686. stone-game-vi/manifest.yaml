        type: int
    bobValues:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    rust: "Solution::stone_game_vi({aliceValues}, {bobValues})"
    python3: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    python2: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    ruby: "stone_game_vi({aliceValues}, {bobValues})"
    java: "new Solution().stoneGameVI({aliceValues}, {bobValues})"
    csharp: "new Solution().StoneGameVI({aliceValues}, {bobValues})"
    kotlin: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    go: "stoneGameVI({aliceValues}, {bobValues})"
    dart: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    swift: "Solution().stoneGameVI({aliceValues}, {bobValues})"
    typescript: "stoneGameVI({aliceValues}, {bobValues})"
judge:
  type: "exact"
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().stoneGameVI(aliceValues, bobValues, {result})"
    checker: |
      class Checker:
          def stoneGameVI(self, aliceValues, bobValues, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              order = sorted(zip(aliceValues, bobValues), key=lambda p: p[0] + p[1], reverse=True)
              alice = sum(a for i, (a, b) in enumerate(order) if i % 2 == 0)
              bob = sum(b for i, (a, b) in enumerate(order) if i % 2 == 1)
              expected = 1 if alice > bob else (-1 if alice < bob else 0)
              return result == expected
