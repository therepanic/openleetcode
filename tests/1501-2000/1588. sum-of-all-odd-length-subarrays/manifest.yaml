entry:
  id: 1588
  title: "sum-of-all-odd-length-subarrays"
  params:
    arr:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().sumOddLengthSubarrays({arr})"
    rust: "Solution::sum_odd_length_subarrays({arr})"
    python3: "Solution().sumOddLengthSubarrays({arr})"
    python2: "Solution().sumOddLengthSubarrays({arr})"
    ruby: "sum_odd_length_subarrays({arr})"
    java: "new Solution().sumOddLengthSubarrays({arr})"
    csharp: "new Solution().SumOddLengthSubarrays({arr})"
    kotlin: "Solution().sumOddLengthSubarrays({arr})"
    go: "sumOddLengthSubarrays({arr})"
    dart: "Solution().sumOddLengthSubarrays({arr})"
    swift: "Solution().sumOddLengthSubarrays({arr})"
    typescript: "sumOddLengthSubarrays({arr})"

judge:
  type: "exact"

limits:
  time_ms: 2000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().sumOddLengthSubarrays(arr, {result})"
    checker: |
      class Checker:
          def sumOddLengthSubarrays(self, arr, result):
              expected = 0
              for left in range(len(arr)):
                  running = 0
                  for right in range(left, len(arr)):
                      running += arr[right]
                      if (right - left + 1) % 2 == 1:
                          expected += running
              return result == expected

seed: 1588

