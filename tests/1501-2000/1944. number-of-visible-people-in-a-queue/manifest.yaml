judge:
  type: exact
limits:
  time_ms: 2000
  memory_mb: 256
oracle:
  python3:
    call: "Checker().check(heights, {result})"
    checker: |
      class Checker:
        def check(self, heights, result):
          if not isinstance(result, list) or len(result) != len(heights):
            return False
          expected = [0] * len(heights)
          stack = []
          for i in range(len(heights) - 1, -1, -1):
            while stack and heights[i] > stack[-1]:
              stack.pop()
              expected[i] += 1
            if stack:
              expected[i] += 1
            stack.append(heights[i])
          return result == expected
seed: 1944
