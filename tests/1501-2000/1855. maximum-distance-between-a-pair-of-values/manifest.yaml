entry:
  id: 1855
  title: "maximum-distance-between-a-pair-of-values"
  params:
    nums1:
      type: array
      items:
        type: int
    nums2:
      type: array
      items:
        type: int
  call:
    cpp: "Solution().maxDistance({nums1}, {nums2})"
    rust: "Solution::max_distance({nums1}, {nums2})"
    python3: "Solution().maxDistance({nums1}, {nums2})"
    python2: "Solution().maxDistance({nums1}, {nums2})"
    ruby: "max_distance({nums1}, {nums2})"
    java: "new Solution().maxDistance({nums1}, {nums2})"
    csharp: "new Solution().MaxDistance({nums1}, {nums2})"
    kotlin: "Solution().maxDistance({nums1}, {nums2})"
    go: "maxDistance({nums1}, {nums2})"
    dart: "Solution().maxDistance({nums1}, {nums2})"
    swift: "Solution().maxDistance({nums1}, {nums2})"
    typescript: "maxDistance({nums1}, {nums2})"

judge:
  type: "exact"

limits:
  time_ms: 1000
  memory_mb: 512

oracle:
  python3:
    call: "Checker().maxDistance(nums1, nums2, {result})"
    checker: |
      class Checker:
          def maxDistance(self, nums1, nums2, result):
              if not isinstance(result, int) or isinstance(result, bool):
                  return False
              best = 0
              for i, x in enumerate(nums1):
                  for j in range(i, len(nums2)):
                      if x <= nums2[j]:
                          best = max(best, j - i)
              return result == best

seed: 1855

