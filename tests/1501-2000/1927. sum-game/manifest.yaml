entry:
  id: 1927
  title: "sum-game"
  params:
    num:
      type: string
  call:
    cpp: "Solution().sumGame({num})"
    rust: "Solution::sum_game({num})"
    python3: "Solution().sumGame({num})"
    python2: "Solution().sumGame({num})"
    ruby: "sum_game({num})"
    java: "new Solution().sumGame({num})"
    csharp: "new Solution().SumGame({num})"
    kotlin: "Solution().sumGame({num})"
    go: "sumGame({num})"
    dart: "Solution().sumGame({num})"
    swift: "Solution().sumGame({num})"
    typescript: "sumGame({num})"

judge:
  type: "exact"

limits:
  time_ms: 200
  memory_mb: 300

oracle:
  python3:
    call: "Checker().sumGame(num, {result})"
    checker: |
      class Checker:
          def sumGame(self, num, result):
              if not isinstance(num, str) or len(num) < 2 or len(num) % 2 != 0:
                  return False
              if any(ch != '?' and not ('0' <= ch <= '9') for ch in num):
                  return False
              if not isinstance(result, bool):
                  return False
              half = len(num) // 2
              left = sum(int(ch) for ch in num[:half] if ch != '?')
              right = sum(int(ch) for ch in num[half:] if ch != '?')
              q_left = num[:half].count('?')
              q_right = num[half:].count('?')
              return result == ((left - right) * 2 != (q_right - q_left) * 9)

seed: 1927

