entry:
  id: 1718
  title: "construct-the-lexicographically-largest-valid-sequence"
  params:
    n:
      type: int
  call:
    cpp: "Solution().constructDistancedSequence({n})"
    rust: "Solution::construct_distanced_sequence({n})"
    python3: "Solution().constructDistancedSequence({n})"
    python2: "Solution().constructDistancedSequence({n})"
    ruby: "construct_distanced_sequence({n})"
    java: "new Solution().constructDistancedSequence({n})"
    csharp: "new Solution().ConstructDistancedSequence({n})"
    kotlin: "Solution().constructDistancedSequence({n})"
    go: "constructDistancedSequence({n})"
    dart: "Solution().constructDistancedSequence({n})"
    swift: "Solution().constructDistancedSequence({n})"
    typescript: "constructDistancedSequence({n})"

judge:
  type: "exact"

limits:
  time_ms: 5000
  memory_mb: 256

oracle:
  python3:
    call: "Checker().check(n, {result})"
    checker: |
      class Checker:
          def check(self, n, result):
              if not isinstance(result, list) or len(result) != 2 * n - 1:
                  return False
              expected_counts = {1: 1}
              expected_counts.update({i: 2 for i in range(2, n + 1)})
              counts = {}
              for value in result:
                  if not isinstance(value, int) or value < 1 or value > n:
                      return False
                  counts[value] = counts.get(value, 0) + 1
              if counts != expected_counts:
                  return False
              positions = {}
              for index, value in enumerate(result):
                  positions.setdefault(value, []).append(index)
              if len(positions[1]) != 1:
                  return False
              for value in range(2, n + 1):
                  if len(positions[value]) != 2 or positions[value][1] - positions[value][0] != value:
                      return False

              best = [0] * (2 * n - 1)
              used = [False] * (n + 1)

              def search(index):
                  while index < len(best) and best[index] != 0:
                      index += 1
                  if index == len(best):
                      return True
                  for value in range(n, 0, -1):
                      if used[value]:
                          continue
                      if value == 1:
                          best[index] = 1
                          used[1] = True
                          if search(index + 1):
                              return True
                          used[1] = False
                          best[index] = 0
                      elif index + value < len(best) and best[index + value] == 0:
                          best[index] = value
                          best[index + value] = value
                          used[value] = True
                          if search(index + 1):
                              return True
                          used[value] = False
                          best[index] = 0
                          best[index + value] = 0
                  return False

              if not search(0):
                  return False
              return result == best

